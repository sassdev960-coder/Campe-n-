<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Panel · Carnicería &amp; Abarrotes</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f4f6f9;--surface:#fff;--sidebar:#0f172a;--sidebar-hover:rgba(255,255,255,.06);
    --text:#0f172a;--muted:#6b7a90;--border:#e8ecf2;
    --primary:#e11d48;--primary-soft:#ffe9ee;
    --green:#10b981;--green-soft:#e6f8f1;
    --amber:#f59e0b;--amber-soft:#fff4e0;
    --blue:#3b82f6;--blue-soft:#e8f0fe;
    --radius:14px;--radius-sm:10px;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.04);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  svg{display:block}

  .app{display:flex;min-height:100vh}
  .sidebar{width:252px;flex-shrink:0;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;
    position:fixed;top:0;left:0;height:100vh;z-index:50;transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
  .brand-logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg,#e11d48,#f43f5e);display:grid;place-items:center;color:#fff;
    font-weight:700;font-size:13px;letter-spacing:.5px}
  .brand strong{display:block;color:#fff;font-size:13.5px;font-weight:600;line-height:1.25}
  .brand span{font-size:11.5px;color:#64748b}
  .nav{flex:1;overflow-y:auto;padding:6px 10px 16px;display:flex;flex-direction:column;gap:2px}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
  .nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:#475569;padding:14px 10px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#94a3b8;
    font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:.15s;position:relative}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.7}
  .nav-item:hover{background:var(--sidebar-hover);color:#e2e8f0}
  .nav-item.active{background:rgba(225,29,72,.14);color:#fff}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--primary)}
  .nav-item .section-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:auto}
  .nav-item .section-dot.carn{background:var(--primary)}
  .nav-item .section-dot.abar{background:var(--blue)}
  .sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.07)}
  .user{display:flex;align-items:center;gap:10px}
  .user strong{display:block;color:#fff;font-size:13px;font-weight:600}
  .user span{font-size:11.5px;color:#64748b}
  .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#334155,#475569);color:#e2e8f0;display:grid;place-items:center;
    font-size:12px;font-weight:600}

  .main{flex:1;margin-left:252px;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:16px;padding:0 24px;height:68px}
  .menu-btn{display:none}
  .page-title h1{font-size:17px;font-weight:650;letter-spacing:-.2px}
  .page-title p{font-size:12.5px;color:var(--muted);margin-top:1px}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .search{display:flex;align-items:center;gap:8px;background:#f1f4f8;border:1px solid transparent;
    border-radius:10px;padding:8px 12px;width:250px;transition:.18s}
  .search:focus-within{background:#fff;border-color:#d7dee8;box-shadow:0 0 0 3px rgba(59,130,246,.08)}
  .search svg{width:16px;height:16px;color:var(--muted);stroke-width:2}
  .search input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--text)}
  .search input::placeholder{color:#9aa8bb}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
    transition:.15s;position:relative}
  .icon-btn:hover{background:#f1f4f8;color:var(--text)}
  .icon-btn svg{width:19px;height:19px;stroke-width:1.8}
  .icon-btn .count-badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;
    border-radius:9px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;
    display:grid;place-items:center;border:2px solid #fff;line-height:1}
  .icon-btn.scan-btn{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
  .icon-btn.scan-btn:hover{background:linear-gradient(135deg,#1e293b,#334155);color:#fff}
  .content{padding:24px;max-width:1500px;width:100%;margin:0 auto;flex:1}

  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .chip-row{display:flex;gap:4px;background:#eaeef4;padding:4px;border-radius:11px;
    overflow-x:auto;scrollbar-width:none}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{padding:6px 15px;border-radius:8px;font-size:13px;font-weight:550;color:var(--muted);
    transition:.16s;white-space:nowrap}
  .chip:hover{color:var(--text)}
  .chip.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .toolbar-actions{margin-left:auto;display:flex;gap:9px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
    font-size:13.5px;font-weight:550;transition:.16s;white-space:nowrap}
  .btn svg{width:16px;height:16px;stroke-width:2}
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(225,29,72,.25)}
  .btn.primary:hover{background:#be123c}
  .btn.primary:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:#f8fafc;border-color:#d7dee8}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .btn.danger{background:#fff;color:var(--primary);border:1px solid #fdd5df}
  .btn.danger:hover{background:#fff5f7}
  .btn.scan{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;box-shadow:0 2px 8px rgba(15,23,42,.25)}
  .btn.scan:hover{background:linear-gradient(135deg,#1e293b,#334155)}
  .btn.blue{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.25)}
  .btn.blue:hover{background:#2563eb}
  .btn.print{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn.print:hover{background:#f0f9ff;border-color:#bae6fd;color:#0369a1}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px}
  .card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .card-head h3{font-size:14.5px;font-weight:620;letter-spacing:-.15px}
  .card-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card-head .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .link{font-size:12.5px;font-weight:550;color:var(--primary);cursor:pointer;background:none;border:none}
  .link:hover{text-decoration:underline}

  .alert-banner{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px;
    background:linear-gradient(135deg,#fff7ed,#ffedd5);
    border:1px solid #fed7aa;border-left:4px solid #f59e0b;
    border-radius:12px;box-shadow:0 1px 3px rgba(245,158,11,.15)}
  .alert-banner.critical{background:linear-gradient(135deg,#fff1f2,#ffe4e6);
    border-color:#fecdd3;border-left-color:var(--primary);
    box-shadow:0 1px 3px rgba(225,29,72,.15)}
  .alert-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
    background:#fef3c7;color:#b45309}
  .alert-banner.critical .alert-icon{background:#fecdd3;color:var(--primary)}
  .alert-icon svg{width:20px;height:20px;stroke-width:2}
  .alert-content{flex:1;min-width:0}
  .alert-content strong{display:block;font-size:14px;font-weight:650;letter-spacing:-.15px;margin-bottom:2px}
  .alert-content p{font-size:12.5px;color:#9a3412;opacity:.85}
  .alert-banner.critical .alert-content p{color:#9f1239;opacity:.85}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-bottom:16px}
  .kpi{display:flex;flex-direction:column;gap:10px}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-label{font-size:12.5px;color:var(--muted);font-weight:550}
  .kpi-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
  .kpi-icon svg{width:17px;height:17px;stroke-width:1.9}
  .kpi-icon.red{background:var(--primary-soft);color:var(--primary)}
  .kpi-icon.green{background:var(--green-soft);color:var(--green)}
  .kpi-icon.blue{background:var(--blue-soft);color:var(--blue)}
  .kpi-icon.amber{background:var(--amber-soft);color:var(--amber)}
  .kpi-value{font-size:25px;font-weight:680;letter-spacing:-.7px}
  .kpi-foot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .kpi-foot .up{color:var(--green);font-weight:600}
  .kpi-foot .down{color:var(--primary);font-weight:600}

  .grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
  .grid-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
  .chart{display:flex;gap:12px;align-items:flex-end;height:210px}
  .bar-col{flex:1;display:flex;flex-direction:column;height:100%;gap:9px;position:relative}
  .bar-track{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .bar{width:100%;max-width:42px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;
    transition:height .5s cubic-bezier(.4,0,.2,1),filter .15s}
  .bar:hover{filter:brightness(1.08)}
  .seg{width:100%}
  .seg.abarrotes{background:#93c5fd}
  .seg.carniceria{background:var(--primary)}
  .bar-label{font-size:11.5px;color:var(--muted);font-weight:550;text-align:center}
  .tip{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
    font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;
    pointer-events:none;transition:.15s;z-index:5}
  .bar-col:hover .tip{opacity:1;top:-10px}

  .list-rows{display:flex;flex-direction:column;list-style:none}
  .list-rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
    border-bottom:1px dashed var(--border);font-size:13.5px}
  .list-rows li:last-child{border-bottom:none}
  .list-rows .lbl{color:var(--muted);display:flex;align-items:center;gap:9px}
  .list-rows .val{font-weight:620;letter-spacing:-.2px}
  .list-rows .val.pos{color:var(--green)}
  .list-rows .val.neg{color:var(--primary)}
  .list-rows li.total{border-top:1.5px solid var(--border);border-bottom:none;margin-top:4px;padding-top:14px}
  .list-rows li.total .lbl{color:var(--text);font-weight:600}
  .list-rows li.total .val{font-size:17px}

  .table-wrap{overflow-x:auto;margin:0 -18px -18px;padding:0 18px 6px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    font-weight:650;padding:0 12px 10px;white-space:nowrap}
  tbody td{padding:12px;border-top:1px solid var(--border);vertical-align:middle}
  tbody tr{transition:background .13s}
  tbody tr:hover{background:#fafbfd}
  tbody tr.row-warn{background:#fffbeb}
  tbody tr.row-warn:hover{background:#fef3c7}
  tbody tr.row-danger{background:#fff5f7}
  tbody tr.row-danger:hover{background:#ffe4e6}
  td.num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  th.num{text-align:right}

  .price-main{font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .price-unit{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);
    padding:1px 6px;border-radius:5px;background:#f1f4f8;margin-left:4px;
    vertical-align:middle;letter-spacing:.2px}
  .price-unit.kilo{background:var(--primary-soft);color:var(--primary)}
  .price-unit.abarrotes{background:var(--blue-soft);color:var(--blue)}

  .stock-cell{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
  .stock-main{font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .stock-main .unit-tag{font-size:11px;font-weight:600;color:var(--muted);margin-left:3px}
  .stock-value{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stock-value b{color:var(--text);font-weight:600}

  .prod-cell-wrap{display:flex;align-items:center;gap:12px}
  .prod-foto-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;
    background:#f1f4f8;border:1px solid var(--border)}
  .prod-foto-ph{width:44px;height:44px;border-radius:10px;flex-shrink:0;
    background:#f1f4f8;border:1px solid var(--border);
    display:grid;place-items:center;color:#c3cddb}
  .prod-foto-ph svg{width:20px;height:20px;stroke-width:1.6}

  .prod-name{display:flex;flex-direction:column;gap:3px;min-width:0}
  .prod-name strong{font-weight:620;font-size:13.5px}
  .prod-name span{font-size:11.5px;color:var(--muted)}
  .barcode-chip{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10.5px;font-weight:600;
    color:var(--muted);background:#f1f4f8;padding:1px 6px;border-radius:4px;display:inline-flex;
    align-items:center;gap:3px;letter-spacing:.3px;margin-top:2px;width:fit-content}
  .barcode-chip svg{width:10px;height:10px;stroke-width:2.4}

  .section-badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;
    border-radius:20px;font-size:11.5px;font-weight:650;letter-spacing:.1px;white-space:nowrap;
  }
  .section-badge svg{width:13px;height:13px;stroke-width:2}
  .section-badge.carn{background:var(--primary-soft);color:var(--primary)}
  .section-badge.abar{background:var(--blue-soft);color:var(--blue)}
  .section-badge.lg{padding:5px 12px 5px 8px;font-size:12.5px}
  .section-badge.lg svg{width:15px;height:15px}

  .tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:650;
    letter-spacing:.1px;white-space:nowrap}
  .tag.ok{background:var(--green-soft);color:var(--green)}
  .tag.warn{background:var(--amber-soft);color:#b45309}
  .tag.bad{background:var(--primary-soft);color:var(--primary)}
  .tag.unit{background:#eef2ff;color:#4338ca}
  .tag.weight{background:#fef3c7;color:#92400e}

  .stock-list{display:flex;flex-direction:column;gap:2px;list-style:none}
  .stock-item{padding:11px 0;border-bottom:1px dashed var(--border)}
  .stock-item:last-child{border-bottom:none}
  .stock-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
  .stock-name{font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:6px}
  .stock-name .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .stock-name .dot.carn{background:var(--primary)}
  .stock-name .dot.abar{background:var(--blue)}
  .stock-qty{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stock-qty b{color:var(--text);font-weight:650}
  .bar-mini{height:6px;border-radius:4px;background:#eef1f6;overflow:hidden}
  .bar-mini i{display:block;height:100%;border-radius:4px;transition:width .6s}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;
    text-align:center;color:var(--muted);gap:10px}
  .empty svg{width:44px;height:44px;stroke-width:1.4;color:#c3cddb}
  .empty h3{font-size:15px;color:var(--text);font-weight:600}
  .empty p{font-size:13px;max-width:360px}
  .empty .btn{margin-top:8px}
  .empty .btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .empty .empty-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
  .empty .empty-icon svg{width:30px;height:30px;stroke-width:1.8;color:#fff}
  .empty .empty-icon.carn{background:var(--primary-soft)}
  .empty .empty-icon.carn svg{color:var(--primary)}
  .empty .empty-icon.abar{background:var(--blue-soft)}
  .empty .empty-icon.abar svg{color:var(--blue)}

  .overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;
    opacity:0;transition:opacity .25s}
  .overlay.show{opacity:1;display:block}

  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:8px 6px calc(8px + var(--safe-bottom));
    justify-content:space-around;align-items:center}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;
    border-radius:10px;color:var(--muted);font-size:10.5px;font-weight:550;transition:.15s;position:relative}
  .bn-item svg{width:22px;height:22px;stroke-width:1.8}
  .bn-item.active{color:var(--primary)}
  .bn-item.active[data-view="abarrotes"]{color:var(--blue)}
  .bn-item.active::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    width:22px;height:3px;border-radius:0 0 4px 4px;background:currentColor}
  .bn-item.scan{color:var(--primary)}
  .bn-item.scan::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e11d48,#f43f5e);
    box-shadow:0 4px 12px rgba(225,29,72,.35);z-index:-1;opacity:0;transition:.2s}
  .bn-item.scan:hover::after{opacity:1}
  .bn-item.scan svg{width:24px;height:24px}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:none;
    align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s}
  .modal-bg.show{display:flex;opacity:1}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(15,23,42,.25);transform:scale(.97);transition:transform .2s}
  .modal-bg.show .modal{transform:scale(1)}
  .modal::-webkit-scrollbar{width:8px}
  .modal::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
  .modal-head{padding:20px 22px 0;display:flex;align-items:flex-start;gap:12px}
  .modal-head h3{font-size:17px;font-weight:650;flex:1;letter-spacing:-.3px}
  .modal-close{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
  .modal-close:hover{background:#f1f4f8;color:var(--text)}
  .modal-body{padding:18px 22px}
  .modal-foot{padding:6px 22px 20px;display:flex;gap:10px;position:sticky;bottom:0;background:#fff}
  .modal-foot .btn{flex:1;justify-content:center;padding:12px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field label .unit-hint{display:inline-block;font-size:11px;font-weight:700;color:var(--primary);
    background:var(--primary-soft);padding:1px 6px;border-radius:5px;margin-left:5px;
    text-transform:lowercase;letter-spacing:.2px}

  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--border);

  .foto-upload{display:flex;align-items:center;gap:14px}
  .foto-preview{width:92px;height:92px;border-radius:12px;background:#f1f4f8;
    border:2px dashed var(--border);flex-shrink:0;display:grid;place-items:center;
    color:#c3cddb;overflow:hidden;position:relative;transition:.15s}

  .foto-preview img{width:100%;height:100%;object-fit:cover;display:block}
  .foto-preview svg{width:28px;height:28px;stroke-width:1.6}
  .foto-actions{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .foto-actions .btn{justify-content:center;font-size:12.5px;padding:9px 12px}

  .section-label-lg{
    font-size:13px;font-weight:650;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px;
  }
  .section-label-lg .req{color:var(--primary)}
  .area-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .area-card{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:16px 12px 14px;border:2px solid var(--border);border-radius:14px;
    background:#fafbfd;cursor:pointer;transition:.18s;text-align:center;overflow:hidden;
  }
  .area-card:hover{border-color:#cbd5e1;transform:translateY(-1px)}
  .area-card:active{transform:scale(.98)}
  .area-card.selected{
    background:linear-gradient(135deg,#fff,#fff5f7);
    border-color:var(--primary);box-shadow:0 4px 16px rgba(225,29,72,.15);
  }
  .area-card.selected.abar{
    background:linear-gradient(135deg,#fff,#eff6ff);
    border-color:var(--blue);box-shadow:0 4px 16px rgba(59,130,246,.15);
  }
  .area-card .ac-icon{
    width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
    transition:.2s;
  }
  .area-card .ac-icon svg{width:26px;height:26px;stroke-width:1.8}
  .area-card.carn .ac-icon{background:var(--primary-soft);color:var(--primary)}
  .area-card.abar .ac-icon{background:var(--blue-soft);color:var(--blue)}
  .area-card.selected.carn .ac-icon{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(225,29,72,.35)}
  .area-card.selected.abar .ac-icon{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.35)}
  .area-card strong{font-size:13.5px;font-weight:680;letter-spacing:-.15px;line-height:1.2}
  .area-card small{font-size:11px;color:var(--muted);font-weight:500}
  .area-card .ac-check{
    position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;
    display:none;place-items:center;color:#fff;
    animation:checkPop .25s cubic-bezier(.4,0,.2,1);
  }
  .area-card.selected.carn .ac-check{background:var(--primary);display:grid}
  .area-card.selected.abar .ac-check{background:var(--blue);display:grid}
  .area-card .ac-check svg{width:12px;height:12px;stroke-width:3}
  @keyframes checkPop{0%{transform:scale(0)}100%{transform:scale(1)}}

  .section-helper{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
    padding:8px 10px;background:#f8fafc;border-radius:8px;margin-top:4px;
  }
  .section-helper svg{width:13px;height:13px;stroke-width:2;color:var(--amber);flex-shrink:0}

  .barcode-input{display:flex;gap:8px;align-items:stretch}
  .barcode-input input{flex:1;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13.5px;letter-spacing:.5px}
  .barcode-input .bc-btn{width:48px;flex-shrink:0;border-radius:10px;
    background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;display:grid;place-items:center;
    transition:.15s;box-shadow:0 2px 8px rgba(15,23,42,.2)}
  .barcode-input .bc-btn:hover{background:linear-gradient(135deg,#1e293b,#334155);transform:translateY(-1px)}
  .barcode-input .bc-btn:active{transform:translateY(0)}
  .barcode-input .bc-btn svg{width:20px;height:20px;stroke-width:1.9}

  .input-prefix{position:relative}
  .input-prefix span{position:absolute;left:13px;top:50%;transform:translateY(-50%);
    font-size:13px;color:var(--muted);pointer-events:none;font-weight:600}
  .input-prefix input{padding-left:38px}

  .preview-box{margin-top:6px;padding:12px 14px;border-radius:11px;
    background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;
    display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
  .preview-box .pb-label{opacity:.75;font-weight:500;display:flex;flex-direction:column;gap:2px}
  .preview-box .pb-label small{font-size:11px;opacity:.7;font-weight:400}
  .preview-box .pb-value{font-size:20px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

  .v-items{list-style:none;margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .v-items:empty{display:none}

    border-bottom:1px solid var(--border);background:#fafbfd}
  .v-items li:last-child{border-bottom:none}
  .v-items .vi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v-items .vi-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
  .v-items .vi-price{font-weight:650;font-variant-numeric:tabular-nums}
  .v-items .vi-x{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
  .v-items .vi-x:hover{background:#fee2e2;color:var(--primary)}
  .v-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:12px;
    background:#0f172a;color:#fff;border-radius:11px;font-size:14px}
  .v-total b{font-size:17px;font-weight:700}
  .mini-tag{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.2px}
  .mini-tag.carn{background:var(--primary-soft);color:var(--primary)}
  .mini-tag.abar{background:var(--blue-soft);color:var(--blue)}

  .cant-row{display:flex;gap:8px;align-items:stretch;margin-top:8px}
  .cant-input-wrap{position:relative;display:flex;align-items:center;background:#fafbfd;
    border:1px solid var(--border);border-radius:10px;transition:.15s;flex:1;min-width:0}
  .cant-input-wrap:focus-within{border-color:var(--primary);background:#fff;
    box-shadow:0 0 0 3px rgba(225,29,72,.08)}
  .cant-input-wrap input{border:none;background:transparent;padding:11px 13px;font-size:15px;
    width:100%;outline:none;font-family:inherit;font-weight:600;font-variant-numeric:tabular-nums;
    color:var(--text)}
  .cant-input-wrap .cant-suffix{padding:0 14px 0 0;font-size:12.5px;font-weight:700;
    color:var(--muted);flex-shrink:0;letter-spacing:.3px;text-transform:lowercase}
  .cant-row .btn-add{display:inline-flex;align-items:center;gap:6px;padding:0 20px;
    border-radius:10px;background:var(--primary);color:#fff;font-weight:650;font-size:13.5px;
    box-shadow:0 2px 8px rgba(225,29,72,.25);transition:.15s;flex-shrink:0;white-space:nowrap}
  .cant-row .btn-add:hover{background:#be123c}
  .cant-row .btn-add:active{transform:scale(.97)}
  .cant-row .btn-add svg{width:15px;height:15px;stroke-width:2.4}

  .quick-cants{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .quick-cants button{padding:7px 12px;border-radius:8px;background:#f1f4f8;color:var(--text);
    font-size:12px;font-weight:650;transition:.15s;border:1.5px solid transparent;
    font-variant-numeric:tabular-nums}
  .quick-cants button:hover{background:var(--primary-soft);color:var(--primary);border-color:#fecdd3}
  .quick-cants button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .quick-cants.hidden{display:none}

  .cotizacion-box{margin-top:10px;padding:11px 14px;border-radius:11px;
    background:linear-gradient(135deg,#ecfdf5,#d1fae5);
    border:1px solid #a7f3d0;border-left:4px solid var(--green);
    display:none;align-items:center;gap:10px;font-size:13px;color:#065f46;
    animation:cotPop .22s cubic-bezier(.4,0,.2,1)}
  .cotizacion-box.show{display:flex}
  .cotizacion-box .cot-icon{width:26px;height:26px;border-radius:8px;background:var(--green);
    color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 6px rgba(16,185,129,.35)}
  .cotizacion-box .cot-icon svg{width:14px;height:14px;stroke-width:3}
  .cotizacion-box .cot-formula{flex:1;min-width:0;font-size:12.5px;line-height:1.35;opacity:.9}
  .cotizacion-box .cot-formula b{font-weight:700}
  .cotizacion-box .cot-total{font-size:19px;font-weight:750;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;flex-shrink:0}
  @keyframes cotPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  .stock-warn-inline{display:flex;align-items:center;gap:6px;padding:8px 11px;margin-top:8px;
    background:#fffbeb;border:1px solid #fde68a;border-left:3px solid var(--amber);
    border-radius:8px;font-size:12px;color:#92400e}
  .stock-warn-inline svg{width:14px;height:14px;stroke-width:2;flex-shrink:0}

  .cart-header{display:flex;align-items:center;gap:8px;margin-top:14px;margin-bottom:4px;
    font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .cart-header .cart-badge{background:var(--primary);color:#fff;font-size:10.5px;
    padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:.3px}

  .toast-wrap{position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:#0f172a;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:550;
    box-shadow:0 10px 30px rgba(15,23,42,.3);opacity:0;transform:translateY(10px);transition:.25s;
    max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.success{background:#065f46}
  .toast.error{background:#9f1239}
  .toast.warn{background:#92400e}

  .scanner-bg{position:fixed;inset:0;background:#000;z-index:200;display:none;
    flex-direction:column;opacity:0;transition:opacity .25s}
  .scanner-bg.show{display:flex;opacity:1}
  .scanner-head{display:flex;align-items:center;gap:12px;padding:16px 18px;
    padding-top:calc(16px + env(safe-area-inset-top,0px));color:#fff;position:relative;z-index:2}
  .scanner-head h3{font-size:16px;font-weight:650;flex:1;letter-spacing:-.2px}
  .scanner-head .sh-close{width:38px;height:38px;border-radius:10px;
    background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
    backdrop-filter:blur(8px)}
  .scanner-head .sh-close:hover{background:rgba(255,255,255,.2)}
  .scanner-head .sh-close svg{width:18px;height:18px;stroke-width:2}
  .scanner-head .sh-torch{width:38px;height:38px;border-radius:10px;
    background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
    backdrop-filter:blur(8px);transition:.15s}
  .scanner-head .sh-torch:hover{background:rgba(255,255,255,.2)}
  .scanner-head .sh-torch.on{background:var(--amber);color:#fff}
  .scanner-head .sh-torch svg{width:18px;height:18px;stroke-width:2}
  .scanner-view{flex:1;position:relative;overflow:hidden;background:#000}
  .scanner-view video{width:100%;height:100%;object-fit:cover;display:block}
  .scanner-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;padding:20px}
  .scanner-frame{position:relative;width:min(85vw,380px);aspect-ratio:1.4/1;border-radius:16px}
  .scanner-frame .corner{position:absolute;width:36px;height:36px;border-color:#fff;
    border-style:solid;border-width:0;filter:drop-shadow(0 0 8px rgba(225,29,72,.8))}
  .scanner-frame .corner.tl{top:0;left:0;border-top-width:4px;border-left-width:4px;border-top-left-radius:16px}
  .scanner-frame .corner.tr{top:0;right:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:16px}
  .scanner-frame .corner.bl{bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:16px}
  .scanner-frame .corner.br{bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:16px}
  .scanner-frame .laser{position:absolute;left:8px;right:8px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#e11d48,#f43f5e,#e11d48,transparent);
    box-shadow:0 0 12px rgba(225,29,72,.9),0 0 24px rgba(225,29,72,.5);
    animation:scannerLaser 2s ease-in-out infinite}
  @keyframes scannerLaser{0%,100%{top:8px;opacity:.5}50%{top:calc(100% - 11px);opacity:1}}
  .scanner-foot{padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
    background:#0a0f1a;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
  .scanner-manual{display:flex;gap:8px}
  .scanner-manual input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none;font-family:inherit;
    transition:.15s;letter-spacing:.3px}
  .scanner-manual input::placeholder{color:rgba(255,255,255,.4)}
  .scanner-manual input:focus{border-color:var(--primary);background:rgba(255,255,255,.12);
    box-shadow:0 0 0 3px rgba(225,29,72,.2)}
  .scanner-manual .btn{background:var(--primary);color:#fff;padding:12px 18px}
  .scanner-tip{font-size:11.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.4}
  .scanner-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;color:#fff;background:#000;z-index:5}
  .scanner-loading.hidden{display:none}
  .spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--primary);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scanner-loading p{font-size:13px;color:rgba(255,255,255,.7);max-width:260px;text-align:center;padding:0 20px}

  @media (max-width:1100px){
    .grid-2{grid-template-columns:1fr}
    .grid-eq{grid-template-columns:1fr}
  }
  @media (max-width:900px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0}
    .menu-btn{display:grid}
  }
  @media (max-width:768px){
    body{background:#eef1f6}
    .topbar{padding:0 16px;height:auto;min-height:64px;gap:8px;padding-top:8px;padding-bottom:8px}
    .menu-btn{display:grid;background:var(--sidebar);color:#fff;width:36px;height:36px;border-radius:10px}
    .menu-btn svg{width:18px;height:18px}

    .search{display:none}
    .topbar-actions .avatar{display:none}
    .icon-btn{width:36px;height:36px}
    .content{padding:16px 14px calc(90px + var(--safe-bottom))}
    .toolbar{gap:10px;margin-bottom:16px}
    .chip-row{width:100%;padding:3px;border-radius:10px}
    .chip{padding:7px 14px;font-size:12.5px}
    .toolbar-actions{width:100%;margin-left:0;flex-wrap:wrap}
    .toolbar-actions .btn{flex:1;justify-content:center;padding:11px 12px;min-width:100px}
    .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .kpi{padding:14px;gap:8px;border-radius:12px}
    .kpi-icon{width:30px;height:30px;border-radius:9px}
    .kpi-icon svg{width:15px;height:15px}
    .kpi-label{font-size:11px}
    .kpi-value{font-size:19px;letter-spacing:-.5px}
    .kpi-foot{font-size:10.5px}
    .card{padding:16px;border-radius:12px}
    .card-head{margin-bottom:14px}
    .card-head h3{font-size:14px}
    .card-head p{font-size:12px}
    .grid-2,.grid-eq{grid-template-columns:1fr;gap:12px;margin-bottom:12px}
    .chart{height:170px;gap:8px}
    .bar{max-width:32px;border-radius:6px}
    .bar-label{font-size:11px}
    .legend{font-size:11px;gap:10px}
    .list-rows li{padding:12px 0;font-size:13.5px}
    .list-rows li.total .val{font-size:16px}
    .table-wrap{margin:0;padding:0;overflow:visible}
    table,thead,tbody,tr,td,th{display:block}
    thead{display:none}
    tbody tr{background:#fafbfd;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
      margin-bottom:10px}
    tbody tr.row-warn{background:#fffbeb;border-color:#fed7aa}
    tbody tr.row-danger{background:#fff5f7;border-color:#fecdd3}
    tbody tr:last-child{margin-bottom:0}
    tbody td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;
      border:none;white-space:normal;font-size:13px}
    tbody td::before{content:attr(data-label);font-size:11px;color:var(--muted);font-weight:600;
      text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
    tbody td:first-child{padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--border);
      justify-content:flex-start}
    tbody td:first-child::before{display:none}
    td.num{text-align:right}
    td[data-label="Acciones"]{justify-content:flex-end !important;padding-top:10px;margin-top:6px;
      border-top:1px dashed var(--border);gap:6px !important}
    td[data-label="Acciones"]::before{display:none}
    .stock-cell{align-items:flex-end}
    .stock-item{padding:12px 0}
    .stock-name{font-size:13px}
    .stock-qty{font-size:11.5px}
    .prod-foto-thumb,.prod-foto-ph{width:40px;height:40px;border-radius:9px}
    .bottom-nav{display:flex}
    .modal{max-width:100%}
    .modal-head,.modal-body,.modal-foot{padding-left:18px;padding-right:18px}
    .field-row{grid-template-columns:1fr}
    .alert-banner{padding:12px 14px;gap:11px}
    .alert-icon{width:34px;height:34px;border-radius:9px}
    .alert-content strong{font-size:13.5px}
    .alert-content p{font-size:11.5px}
    .area-card{padding:14px 10px 12px}
    .area-card .ac-icon{width:46px;height:46px;border-radius:12px}
    .area-card .ac-icon svg{width:23px;height:23px}
    .area-card strong{font-size:12.5px}
    .area-card small{font-size:10.5px}
    .cant-input-wrap input{padding:10px 12px;font-size:14px}
    .cant-row .btn-add{padding:0 14px;font-size:12.5px}
    .cant-row .btn-add span{display:none}
    .quick-cants button{padding:6px 10px;font-size:11.5px}
    .cotizacion-box{padding:10px 12px}
    .cotizacion-box .cot-total{font-size:17px}
    .cotizacion-box .cot-formula{font-size:11.5px}
  }
  @media (max-width:380px){
    .kpi-value{font-size:17px}
    .bn-item span{font-size:10px}
    .area-selector{gap:8px}
    .area-card{padding:12px 8px 10px}
    .area-card .ac-icon{width:42px;height:42px}
    .area-card strong{font-size:12px}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">CA</div>
      <div>
        <strong>Carnicería &amp; Abarrotes</strong>
        <span>Panel administrador</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user">
        <div class="avatar">AD</div>
        <div><strong>Administrador</strong><span>Acceso total</span></div>
      </div>

  <div class="overlay" id="overlay"></div>

  <main class="main">

      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menú">

const GRAMOS_POR = { kg: 1000, lb: 453.592, g: 1 };

function unidadEntrada(producto){
  const u = (producto && producto.unidad) || 'unidad';
  if(UNIDADES_GRANEL.includes(u)) return 'g';
  return u;
}

function aUnidadBase(cantidad, unidadEntradaProd, unidadBase){
  if(unidadEntradaProd === unidadBase) return cantidad;
  if(unidadEntradaProd === 'g' && GRAMOS_POR[unidadBase]){
    return cantidad / GRAMOS_POR[unidadBase];
  }
  return cantidad;
}

function tipoVentaBadge(producto){
  const u = (producto && producto.unidad) || 'unidad';
  if(UNIDADES_GRANEL.includes(u)){
    return `<span class="tag weight">⚖ Por peso</span>`;
  }
  return `<span class="tag unit">📦 Por unidad</span>`;
}

  const c = item.cantidadInput;

  return `${txt} ${u}`;
}

   STORAGE
   ========================================================= */
const KEY = 'bc_admin_v1';
function defaultState(){
  return { productos:[], ventas:[], compras:[], clientes:[], proveedores:[], caja:[] };
}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{
    const data = JSON.stringify(STATE);
    if(data.length > 4.2 * 1024 * 1024){
      toast('⚠ Almacenamiento casi lleno. Exporta un backup.','warn');
    }
    localStorage.setItem(KEY, data);
    return true;
  }catch(e){
    if(e.name === 'QuotaExceededError'){
      toast('❌ Sin espacio. Reduce fotos o exporta backup.','error');
    } else {
      toast('Error al guardar','error');
    }
    return false;
  }
}

function migrateState(){
  let changed = false;
  if(STATE.productos){
    STATE.productos.forEach(p => {
      if(p.area === 'barrotes'){ p.area = 'abarrotes'; changed = true; }
      if(p.foto === undefined){ p.foto = ''; changed = true; }
      if(!p.unidad || p.unidad === ''){
        p.unidad = (p.area === 'carniceria') ? 'kg' : 'unidad';
        changed = true;
      }
    });
  }
  if(STATE.ventas){
    STATE.ventas.forEach(v => {
      if(v.area === 'barrotes'){ v.area = 'abarrotes'; changed = true; }
    });
  }
  if(changed) saveState();
}
migrateState();

function toast(msg, tipo=''){
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.textContent = msg;
  w.appendChild(t);

}

let _modalSubmit = null;
function openModal({title, bodyHTML, submitLabel='Guardar', onSubmit, danger=false, onReady}){
  const bg = document.getElementById('modalBg');
  const m  = document.getElementById('modal');
  m.innerHTML = `
    <div class="modal-head">
      <h3>${title}</h3>
      <button class="modal-close" id="mClose">${icon('x')}</button>
    </div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot">
      <button class="btn ghost" id="mCancel">Cancelar</button>
      <button class="btn ${danger?'danger':'primary'}" id="mSubmit">${submitLabel}</button>
    </div>`;
  bg.classList.add('show');
  const close = () => { bg.classList.remove('show'); _modalSubmit=null; };
  m.querySelector('#mClose').onclick = close;
  m.querySelector('#mCancel').onclick = close;
  bg.onclick = e => { if(e.target===bg) close(); };
  _modalSubmit = () => {
    if(onSubmit() !== false){ close(); return true; }
    return false;
  };
  m.querySelector('#mSubmit').onclick = () => _modalSubmit();
  setTimeout(()=>{
    const f = m.querySelector('input:not([type=hidden]):not([readonly]),select,textarea');
    if(f) f.focus();
    if(onReady) onReady(m);
  },80);
  return m;
}

/* =========================================================
   COMPRESIÓN DE IMAGEN
   ========================================================= */
function comprimirImagen(file, maxW = 320, quality = 0.72){
  return new Promise((resolve, reject) => {
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('No es imagen')); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, maxW / img.width);
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ reject(err); }
      };
      img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Error al leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function abrirVentanaImpresion(html){
  const w = window.open('', '_blank', 'width=420,height=680,toolbar=no,menubar=no');
  if(w && w.document){
    w.document.open(); w.document.write(html); w.document.close(); w.focus();
    setTimeout(() => { try { w.print(); } catch(e){} }, 400);
    return;
  }
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  setTimeout(() => {
    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch(e){ toast('No se pudo imprimir. Permite popups.','warn'); }
    setTimeout(()=> iframe.remove(), 2000);
  }, 400);
}

window.imprimirVenta = function(ventaId){
  const v = STATE.ventas.find(x => x.id === ventaId);

    if(UNIDADES_GRANEL.includes(uBase)){

    } else {
      cantTxt = `${it.cantidad} ${uBase}`;
    }
    return { cant: cantTxt, desc: it.nombre, sub: fmt(it.precio * it.cantidad) };
  });
  const html = buildTicketHTML(
    `Recibo ${v.fecha}`, sectionOf(v.area).label, lineas,
    { fecha: `${fmtFecha(v.fecha)} ${v.hora}`, cliente: v.cliente || 'Consumidor final', pago: v.pago, valor: fmt(v.total) },

};

/* =========================================================
   CÁLCULOS
   ========================================================= */
const calc = {
  ventasHoy(){ return STATE.ventas.filter(v => v.fecha === todayISO()); },
  totalVentas(ventas){ return ventas.reduce((s,v)=>s+v.total,0); },
  ganancia(ventas){
    return ventas.reduce((s,v)=>{
      const costo = v.items.reduce((c,i)=>c + (i.costo||0)*i.cantidad,0);
      return s + (v.total - costo);
    },0);
  },
  saldoCaja(){ return STATE.caja.reduce((s,m)=> s + (m.tipo==='ingreso'?m.monto:-m.monto), 0); },
  porCobrar(){ return STATE.clientes.reduce((s,c)=> s + Math.max(0, (c.deuda||0)-(c.abonado||0)), 0); },
  stockBajo(){ return STATE.productos.filter(p => Number(p.stock) <= Number(p.stockMin||0)); },
  stockAgotado(){ return STATE.productos.filter(p => Number(p.stock) === 0); },
  productosPorArea(area){ return STATE.productos.filter(p => p.area === area); },
  valorInventario(){ return STATE.productos.reduce((s,p)=> s + (Number(p.stock)*Number(p.precioCosto||0)), 0); },
  buscarPorBarcode(code){
    if(!code) return null;
    const clean = String(code).trim();
    return STATE.productos.find(p => p.barcode && p.barcode.trim() === clean);
  },
  ventasSemana(){
    const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const out = [];
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = d.toISOString().slice(0,10);
      const ventas = STATE.ventas.filter(v=>v.fecha===iso);
      out.push({
        dia: dias[d.getDay()],
        carniceria: ventas.filter(v=>v.area==='carniceria').reduce((s,v)=>s+v.total,0),
        abarrotes:  ventas.filter(v=>v.area==='abarrotes').reduce((s,v)=>s+v.total,0),
      });
    }
    return out;
  },
};

function alertaStock(){
  const bajos = calc.stockBajo();
  if(bajos.length === 0) return '';
  const agotados = calc.stockAgotado();
  const esCritico = agotados.length > 0;
  let msg = '';
  if(agotados.length > 0 && bajos.length > agotados.length){
    msg = `${agotados.length} sin stock · ${bajos.length - agotados.length} con stock bajo`;
  } else if(agotados.length === bajos.length){
    msg = `${agotados.length} producto${agotados.length>1?'s':''} sin stock, urgente reponer`;
  } else { msg = `Revisa el inventario para reponer a tiempo`; }
  return `
    <div class="alert-banner ${esCritico?'critical':''}">
      <div class="alert-icon">${icon('alert')}</div>
      <div class="alert-content">
        <strong>⚠ ${bajos.length} producto${bajos.length>1?'s':''} con stock bajo</strong>
        <p>${msg}</p>
      </div>
      <button class="btn ${esCritico?'primary':'ghost'} sm" onclick="setView('inventario')">Ver</button>
    </div>`;
}

VIEWS.carniceria = () => vistaProductos('carniceria');
VIEWS.abarrotes  = () => vistaProductos('abarrotes');

function vistaProductos(areaKey){
  const s = SECTIONS[areaKey];
  const prods = calc.productosPorArea(areaKey);
  const valorInv = prods.reduce((sum,p)=>sum + (Number(p.stock)*Number(p.precioCosto||0)), 0);
  const stockTotal = prods.reduce((sum,p)=>sum + Number(p.stock||0), 0);
  const bajos = prods.filter(p => Number(p.stock) <= Number(p.stockMin||0)).length;
  const isCarn = areaKey === 'carniceria';

  return `
    <div class="toolbar">
      <div style="display:flex;align-items:center;gap:12px">
        ${sectionBadge(areaKey, true)}
        <span style="font-size:12.5px;color:var(--muted)">${prods.length} producto${prods.length!==1?'s':''}</span>
      </div>
      <div class="toolbar-actions">
        <button class="btn scan" onclick="quickScan('${areaKey}')">${icon('barcode')} Escanear</button>
        <button class="btn ${isCarn?'primary':'blue'}" onclick="openProductoModal('${areaKey}')">${icon('plus')} Nuevo</button>
      </div>
    </div>

    <div class="kpis">
      <div class="card kpi">
        <div class="kpi-top"><span class="kpi-label">Productos</span><span class="kpi-icon ${isCarn?'red':'blue'}">${icon(isCarn?'carne':'carrito')}</span></div>
        <div class="kpi-value">${prods.length}</div>
        <div class="kpi-foot">${stockTotal.toFixed(1)} total en stock</div>
      </div>
      <div class="card kpi">
        <div class="kpi-top"><span class="kpi-label">Valor inventario</span><span class="kpi-icon green">${icon('wallet')}</span></div>
        <div class="kpi-value">${fmtK(valorInv)}</div>
        <div class="kpi-foot">Stock × costo unitario</div>
      </div>
      <div class="card kpi">
        <div class="kpi-top"><span class="kpi-label">Stock crítico</span><span class="kpi-icon amber">${icon('alert')}</span></div>
        <div class="kpi-value">${bajos}</div>
        <div class="kpi-foot">${bajos===0?'Todo en orden':'Requieren reposición'}</div>
      </div>
    </div>

    ${alertaStock()}

    <div class="card">
      <div class="card-head">
        <div>
          <h3>Productos de ${s.label}</h3>
          <p>${isCarn ? 'Carnes, embutidos y derivados' : 'Bebidas, abarrotes y consumo diario'}</p>
        </div>
      </div>
      ${prods.length===0 ? `
        <div class="empty">
          <div class="empty-icon ${s.color}">${icon(s.icon)}</div>
          <h3>Sin productos en ${s.label}</h3>
          <p>Escanea un código o agrega un producto manualmente a esta sección.</p>
          <div class="btn-row">
            <button class="btn scan" onclick="quickScan('${areaKey}')">${icon('barcode')} Escanear</button>
            <button class="btn ${isCarn?'primary':'blue'}" onclick="openProductoModal('${areaKey}')">${icon('plus')} Agregar producto</button>
          </div>
        </div>` : `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Tipo de venta</th>
              <th class="num">Stock</th>
              <th class="num">Costo</th>
              <th class="num">Venta</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${prods.map(p=>{
              const stock = Number(p.stock);
              const min = Number(p.stockMin||0);
              const costo = Number(p.precioCosto||0);
              const venta = Number(p.precioVenta||0);
              const sinStock = stock === 0;
              const critico = stock <= min && stock > 0;
              const rowCls = sinStock ? 'row-danger' : (critico ? 'row-warn' : '');
              const estado = sinStock ? 'bad' : (critico ? 'warn' : 'ok');
              const estadoTxt = sinStock ? 'Sin stock' : (critico ? 'Bajo' : 'Normal');
              return `
                <tr class="${rowCls}">
                  <td data-label="Producto">${renderProductoCell(p)}</td>
                  <td data-label="Tipo de venta">${tipoVentaBadge(p)}</td>
                  <td data-label="Stock" class="num">
                    <span class="stock-main">${stock.toLocaleString(CFG.moneda,{maximumFractionDigits:2})}<span class="unit-tag">${esc(p.unidad)}</span></span>
                    <div class="stock-value">mín: <b>${min}</b></div>
                  </td>
                  <td data-label="Costo" class="num">${priceWithUnit(costo, p.unidad, areaKey)}</td>
                  <td data-label="Venta" class="num">${priceWithUnit(venta, p.unidad, areaKey)}</td>
                  <td data-label="Estado"><span class="tag ${estado}">${estadoTxt}</span></td>
                  <td data-label="Acciones" style="display:flex;gap:4px">
                    <button class="btn ghost sm" onclick="openEntradaModal('${p.id}')" title="Entrada de stock">${icon('arrowDown')}</button>
                    <button class="btn ghost sm" onclick="openProductoModal('${areaKey}','${p.id}')" title="Editar">${icon('edit')}</button>
                    <button class="btn ghost sm" onclick="borrarProducto('${p.id}')" title="Eliminar">${icon('trash')}</button>
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
}

function priceWithUnit(valor, unidad, area){
  const cls = area === 'carniceria' ? 'kilo' : 'abarrotes';
  return `<span class="price-main">${fmt(valor)}</span><span class="price-unit ${cls}">/ ${esc(unidad)}</span>`;
}

VIEWS.reportes = () => {

  const ventasCarn = ventas.filter(v=>v.area==='carniceria').reduce((s,v)=>s+v.total,0);

          <li><span class="lbl">Ventas totales</span><span class="val">${fmt(totalVentas)}</span></li>

/* =========================================================
   SCANNER
   ========================================================= */
let _zxingReader = null;
let _scannerCallback = null;
let _scannerStream = null;
let _torchOn = false;
let _torchTrack = null;
let _scanCooldown = false;

window.openScanner = function(callback){
  if(typeof ZXing === 'undefined'){
    toast('Cargando librería de escaneo…','warn');
    setTimeout(()=>{
      if(typeof ZXing !== 'undefined') openScanner(callback);
      else toast('No se pudo cargar el escáner. Verifica tu conexión.','error');
    }, 1000);
    return;
  }
  _scannerCallback = callback;
  _scanCooldown = false;
  document.getElementById('scannerBg').classList.add('show');
  document.body.style.overflow = 'hidden';
  document.getElementById('scannerManual').value = '';
  startCamera();
};

async function startCamera(){
  const video = document.getElementById('scannerVideo');
  const loading = document.getElementById('scannerLoading');
  const loadingText = document.getElementById('scannerLoadingText');
  loading.classList.remove('hidden');
  loadingText.textContent = 'Iniciando cámara…';

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    loadingText.textContent = 'Tu navegador no soporta cámara. Usa la entrada manual.';
    return;
  }

  try{
    if(_scannerStream){ _scannerStream.getTracks().forEach(t => t.stop()); _scannerStream = null; }
    _zxingReader = new ZXing.BrowserMultiFormatReader();
    const constraints = {
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    _scannerStream = stream;
    video.srcObject = stream;
    await video.play();
    _torchTrack = stream.getVideoTracks()[0];
    const caps = _torchTrack.getCapabilities ? _torchTrack.getCapabilities() : {};
    const torchBtn = document.getElementById('scannerTorch');
    if(!caps.torch){ torchBtn.style.opacity = '.35'; torchBtn.style.pointerEvents = 'none'; }
    else { torchBtn.style.opacity = '1'; torchBtn.style.pointerEvents = 'auto'; }
    loading.classList.add('hidden');
    _zxingReader.decodeFromVideoDevice(null, video, (result, err) => {
      if(result && !_scanCooldown) handleScan(result.getText());
    });
  } catch(e){
    console.error('Camera error:', e);
    loading.classList.add('hidden');
    let msg = 'No se pudo acceder a la cámara.';
    if(e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError'){
      msg = 'Permiso de cámara denegado. Habilítalo en el navegador.';
    } else if(e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError'){
      msg = 'No se encontró ninguna cámara disponible.';
    } else if(e.name === 'NotReadableError'){
      msg = 'La cámara está siendo usada por otra app.';
    } else if(location.protocol === 'file:' || (location.protocol === 'http:' && location.hostname !== 'localhost')){
      msg = 'La cámara requiere HTTPS. Abre esta página con https:// o localhost.';
    }
    document.getElementById('scannerLoadingText').textContent = msg;
    document.getElementById('scannerLoading').classList.remove('hidden');
    const sp = document.querySelector('.scanner-loading .spinner');
    if(sp) sp.style.display = 'none';
  }
}

function handleScan(code){
  if(_scanCooldown) return;
  _scanCooldown = true;
  if(navigator.vibrate) navigator.vibrate([60, 40, 60]);
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  }catch(e){}

  const loading = document.getElementById('scannerLoading');
  const loadingText = document.getElementById('scannerLoadingText');
  const sp = document.querySelector('.scanner-loading .spinner');
  if(sp) sp.style.display = 'none';
  loadingText.innerHTML = `✓ Código detectado<br><b style="font-family:monospace;font-size:15px;color:#10b981">${esc(code)}</b>`;
  loading.classList.remove('hidden');

  setTimeout(() => {
    closeScanner();
    if(_scannerCallback){ const cb = _scannerCallback; _scannerCallback = null; cb(code); }
  }, 500);
}

function closeScanner(){
  document.getElementById('scannerBg').classList.remove('show');
  document.body.style.overflow = '';
  _scanCooldown = false;
  if(_zxingReader){ try { _zxingReader.reset(); } catch(e){} _zxingReader = null; }
  if(_scannerStream){ try { _scannerStream.getTracks().forEach(t => t.stop()); } catch(e){} _scannerStream = null; }
  _torchTrack = null; _torchOn = false;
  document.getElementById('scannerTorch').classList.remove('on');
  const video = document.getElementById('scannerVideo');
  if(video) video.srcObject = null;
  const sp = document.querySelector('.scanner-loading .spinner');
  if(sp) sp.style.display = '';
  document.getElementById('scannerLoadingText').textContent = 'Iniciando cámara…';
  document.getElementById('scannerLoading').classList.remove('hidden');
}

document.getElementById('scannerTorch').addEventListener('click', async () => {
  if(!_torchTrack) return;
  try{
    _torchOn = !_torchOn;
    await _torchTrack.applyConstraints({ advanced: [{ torch: _torchOn }] });
    document.getElementById('scannerTorch').classList.toggle('on', _torchOn);
  }catch(e){ toast('Linterna no disponible','warn'); }
});

document.getElementById('scannerClose').addEventListener('click', closeScanner);
document.getElementById('scannerManualBtn').addEventListener('click', () => {
  const v = document.getElementById('scannerManual').value.trim();
  if(!v){ toast('Ingresa un código','error'); return; }
  handleScan(v);
});
document.getElementById('scannerManual').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ const v = e.target.value.trim(); if(v) handleScan(v); }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.getElementById('scannerBg').classList.contains('show')) closeScanner();
});

window.quickScan = function(areaDefault=''){
  openScanner((code) => {
    const existing = calc.buscarPorBarcode(code);
    if(existing){

    }
  });

    <div class="field">

    <div class="cart-header" id="vCartHeader" style="display:none">
      2️⃣ Carrito <span class="cart-badge" id="vCartCount">0</span>
    </div>
    <ul class="v-items" id="vItems"></ul>
    <div class="v-total" id="vTotal" style="display:none"><span>Total:</span><b>${fmt(0)}</b></div>
  `;

  openModal({
    title:'Nueva venta',
    bodyHTML:body,
    submitLabel:'Registrar venta',
    onSubmit: () => {
      // 🆕 AUTO-AGREGAR: si hay items en el select pero no en el carrito, agregarlo automáticamente
      if(items.length === 0){
        const p = STATE.productos.find(x => x.id === prodSel.value);
        if(p && Number(p.stock) > 0){
          const cant = parseFloat(cantInput.value) || 0;
          if(cant > 0){
            const uEntrada = unidadEntrada(p);
            const cantBase = aUnidadBase(cant, uEntrada, p.unidad);
            if(cantBase > 0 && cantBase <= Number(p.stock)){
              items.push({
                productoId: p.id, nombre: p.nombre, unidad: p.unidad, area: p.area,
                cantidad: cantBase, cantidadInput: cant, unidadInput: uEntrada,
                precio: p.precioVenta, costo: p.precioCosto
              });
              renderItems();
            }
          }
        }
      }

      if(items.length===0){
        toast('Debes presionar el botón "＋ Agregar" para añadir el producto al carrito','error');
        return false;
      }
      const m = document.getElementById('modal');
      const cliente = fieldVal(m,'cliente') || 'Consumidor final';
      const pago = fieldVal(m,'pago');

      const areas = [...new Set(items.map(i => i.area))];
      const grupos = areas.map(a => items.filter(i => i.area === a));
      const ventasCreadas = [];

      grupos.forEach(grupo => {
        const total = grupo.reduce((s,i)=> s + i.precio*i.cantidad, 0);
        const area = grupo[0].area;
        const venta = {
          id: uid(), fecha: todayISO(), hora: nowTime(),
          cliente, pago, area,
          items: grupo.map(i=>({
            productoId: i.productoId, nombre: i.nombre, unidad: i.unidad,
            cantidad: i.cantidad, precio: i.precio, costo: i.costo
          })),
          total
        };
        STATE.ventas.push(venta);
        ventasCreadas.push(venta);

        grupo.forEach(i => {
          const p = STATE.productos.find(x=>x.id===i.productoId);
          if(p) p.stock = Math.max(0, Number(p.stock) - i.cantidad);
        });

        if(pago === 'Efectivo'){
          STATE.caja.push({
            id: uid(), fecha: venta.fecha, hora: venta.hora,
            tipo:'ingreso', concepto:`Venta ${sectionOf(area).label.toLowerCase()} — ${cliente}`,
            monto: total
          });
        }
        if(pago === 'Crédito' && cliente !== 'Consumidor final'){
          let c = STATE.clientes.find(x=>x.nombre.toLowerCase()===cliente.toLowerCase());
          if(!c){ c = {id:uid(), nombre:cliente, telefono:'', deuda:0, abonado:0}; STATE.clientes.push(c); }
          c.deuda = Number(c.deuda) + total;
        }
      });

      saveState();
      const totalGlobal = items.reduce((s,i)=>s+i.precio*i.cantidad,0);
      toast(`Venta registrada — ${fmt(totalGlobal)}`,'success');
      items.forEach(i=>{
        const p = STATE.productos.find(x=>x.id===i.productoId);
        if(p && Number(p.stock) <= Number(p.stockMin)){
          setTimeout(()=>toast(`⚠ "${p.nombre}" quedó con stock bajo`,'warn'), 500);
        }
      });
      refresh();
      if(ventasCreadas.length > 0){
        setTimeout(()=>{
          if(confirm('¿Deseas imprimir el ticket de esta venta?')){
            ventasCreadas.forEach((v,i) => setTimeout(()=>imprimirVenta(v.id), i*250));
          }
        }, 400);
      }
      return true;
    }
  });

  const m = document.getElementById('modal');
  const ul = m.querySelector('#vItems');
  const totalEl = m.querySelector('#vTotal');
  const prodSel = m.querySelector('#vProd');
  const cantInput = m.querySelector('#vCant');
  const cantSuffix = m.querySelector('#vCantUnit');
  const quickCants = m.querySelector('#vQuickCants');
  const cotBox = m.querySelector('#vCotizacion');
  const cotFormula = m.querySelector('#vCotFormula');
  const cotTotal = m.querySelector('#vCotTotal');
  const vHint = m.querySelector('#vHint');
  const cartHeader = m.querySelector('#vCartHeader');
  const cartCount = m.querySelector('#vCartCount');

  function productoActual(){ return STATE.productos.find(x => x.id === prodSel.value); }

  function actualizarUIProducto(){
    const p = productoActual();
    if(!p) return;
    const uEntrada = unidadEntrada(p);
    cantSuffix.textContent = uEntrada;

    const esGranel = UNIDADES_GRANEL.includes(p.unidad);
    if(esGranel){
      quickCants.classList.remove('hidden');
      cantInput.step = 1; cantInput.min = 1;
      if(!cantInput.value || cantInput.value === '1') cantInput.value = 250;
      vHint.innerHTML = `Este producto se vende por <b>${p.unidad}</b> · ingresa los <b>gramos</b> que marca tu balanza.`;
    } else {
      quickCants.classList.add('hidden');
      cantInput.step = 0.01; cantInput.min = 0.01;
      if(!cantInput.value || cantInput.value === '250') cantInput.value = 1;
      vHint.innerHTML = `Este producto se vende por <b>${p.unidad}</b> · ingresa la cantidad y presiona <b>Agregar</b>.`;
    }
    actualizarCotizacion();
    quickCants.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  }

  function actualizarCotizacion(){
    const p = productoActual();
    if(!p){ cotBox.classList.remove('show'); return; }
    const cant = parseFloat(cantInput.value)||0;
    const uEntrada = unidadEntrada(p);
    const esGranel = UNIDADES_GRANEL.includes(p.unidad);
    if(cant <= 0){ cotBox.classList.remove('show'); return; }
    const cantBase = aUnidadBase(cant, uEntrada, p.unidad);
    const total = cantBase * p.precioVenta;
    if(esGranel){
      cotFormula.innerHTML = `${cant} g = <b>${cantBase.toFixed(3)} ${p.unidad}</b> × ${fmt(p.precioVenta)}/${p.unidad}`;
      cotTotal.textContent = fmt(total);
      cotBox.classList.add('show');
    } else {
      // Para no-granel también mostramos cotización simple
      cotFormula.innerHTML = `${cant} ${p.unidad} × ${fmt(p.precioVenta)}/${p.unidad}`;
      cotTotal.textContent = fmt(total);
      cotBox.classList.add('show');
    }
  }

  prodSel.addEventListener('change', actualizarUIProducto);
  cantInput.addEventListener('input', () => {
    quickCants.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('active', parseFloat(b.dataset.val) === parseFloat(cantInput.value));
    });
    actualizarCotizacion();
  });

  // 🆕 Enter en el campo cantidad → agrega el item automáticamente
  cantInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      agregarItem();
    }
  });

  quickCants.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      cantInput.value = b.dataset.val;
      quickCants.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      actualizarCotizacion();
    });
  });

  function renderItems(){
    ul.innerHTML = items.map((it,idx)=>`
      <li>
        <div class="vi-name">
          <div>${esc(it.nombre)}</div>
          <div class="vi-sub">
            <span class="mini-tag ${it.area==='carniceria'?'carn':'abar'}">${sectionOf(it.area).shortLabel}</span>
            ${fmtCantidadCarrito(it)} × ${fmt(it.precio)}/${esc(it.unidad)}
          </div>
        </div>
        <div class="vi-price">${fmt(it.precio*it.cantidad)}</div>
        <button type="button" class="vi-x" data-idx="${idx}">${icon('x')}</button>
      </li>`).join('');
    ul.querySelectorAll('.vi-x').forEach(b=>{
      b.onclick = () => { items.splice(parseInt(b.dataset.idx),1); renderItems(); };
    });
    const total = items.reduce((s,i)=>s+i.precio*i.cantidad,0);
    totalEl.style.display = items.length ? 'flex' : 'none';
    totalEl.querySelector('b').textContent = fmt(total);
    cartHeader.style.display = items.length ? 'flex' : 'none';
    cartCount.textContent = items.length;
  }

  // 🆕 Función reutilizable para agregar items
  function agregarItem(){
    const p = productoActual();
    if(!p){ toast('Selecciona un producto','error'); return; }
    const cantIngresada = parseFloat(cantInput.value);
    if(!cantIngresada || cantIngresada<=0){ toast('Cantidad inválida','error'); return; }
    const uEntrada = unidadEntrada(p);
    const cantBase = aUnidadBase(cantIngresada, uEntrada, p.unidad);

    const yaEnCarrito = items.filter(i=>i.productoId===p.id).reduce((s,i)=>s+i.cantidad,0);
    if(yaEnCarrito + cantBase > Number(p.stock)){
      toast(`Stock insuficiente. Disponible: ${(Number(p.stock) - yaEnCarrito).toFixed(3)} ${p.unidad}`,'error');
      return;
    }

    const existente = items.find(i=>i.productoId===p.id && i.unidadInput === uEntrada);
    if(existente){
      existente.cantidad += cantBase;
      existente.cantidadInput += cantIngresada;
    } else {
      items.push({
        productoId: p.id, nombre: p.nombre, unidad: p.unidad, area: p.area,
        cantidad: cantBase, cantidadInput: cantIngresada, unidadInput: uEntrada,
        precio: p.precioVenta, costo: p.precioCosto
      });
    }
    if(UNIDADES_GRANEL.includes(p.unidad)){
      cantInput.value = 250;
      quickCants.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    } else {
      cantInput.value = 1;
    }
    actualizarCotizacion();
    renderItems();
    toast(`✓ ${p.nombre} agregado al carrito`,'success');
  }

  m.querySelector('#vAdd').onclick = agregarItem;

  actualizarUIProducto();
  renderItems();
};

window.borrarVenta = id => {
  if(!confirm('¿Eliminar esta venta? Se devolverá el stock y se revertirá la caja/crédito.')) return;
  const v = STATE.ventas.find(x=>x.id===id);
  if(!v) return;

  v.items.forEach(i=>{
    const p = STATE.productos.find(x=>x.id===i.productoId);
    if(p) p.stock = Number(p.stock) + i.cantidad;
  });

  if(v.pago === 'Efectivo'){
    const idx = STATE.caja.findIndex(m =>
      m.fecha === v.fecha && m.hora === v.hora && m.tipo === 'ingreso' &&
      Math.abs(m.monto - v.total) < 0.01 &&
      m.concepto.startsWith('Venta ')
    );
    if(idx >= 0) STATE.caja.splice(idx, 1);
  }

  if(v.pago === 'Crédito' && v.cliente && v.cliente !== 'Consumidor final'){
    const c = STATE.clientes.find(x=>x.nombre.toLowerCase()===v.cliente.toLowerCase());
    if(c) c.deuda = Math.max(0, Number(c.deuda||0) - v.total);
  }

  STATE.ventas = STATE.ventas.filter(x=>x.id!==id);
  saveState(); refresh(); toast('Venta eliminada y revertida','success');
};

function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderChart(){
  const el = document.getElementById('chart');
  if(!el) return;
  const data = calc.ventasSemana();
  const totales = data.map(d => d.carniceria + d.abarrotes);
  const max = Math.max(...totales, 1);
  el.innerHTML = data.map((d,i) => {
    const total = totales[i];
    const altura = total>0 ? Math.max(4, Math.round((total/max)*100)) : 4;
    const pctCarn = total>0 ? (d.carniceria/total)*100 : 50;
    return `
      <div class="bar-col">
        <div class="tip">${fmtK(total)} · Carn ${fmtK(d.carniceria)} / Abar ${fmtK(d.abarrotes)}</div>
        <div class="bar-track">
          <div class="bar" style="height:${altura}%;background:${total===0?'#eef1f6':''}">
            ${total>0 ? `
              <div class="seg abarrotes" style="flex:${100-pctCarn}"></div>
              <div class="seg carniceria" style="flex:${pctCarn}"></div>
            ` : ''}
          </div>
        </div>
        <span class="bar-label">${d.dia}</span>
      </div>`;
  }).join('');
}

/* =========================================================
   SIDEBAR MÓVIL
   ========================================================= */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click', () =>
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);

document.querySelectorAll('.bn-item[data-view]').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('bnScanBtn').addEventListener('click', () => quickScan());
document.getElementById('quickScanBtn').addEventListener('click', () => quickScan());

document.addEventListener('click', e => {
  if(e.target.classList.contains('chip')){
    e.target.closest('.chip-row').querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    e.target.classList.add('active');
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(document.getElementById('scannerBg').classList.contains('show')) return;
    if(document.getElementById('modalBg').classList.contains('show')) closeModal();
  }
});

document.getElementById('notifBtn').addEventListener('click', () => {
  const bajos = calc.stockBajo();
  if(bajos.length === 0){ toast('✓ Sin alertas de stock','success'); return; }
  const agotados = calc.stockAgotado().length;
  const msg = agotados > 0
    ? `${agotados} sin stock · ${bajos.length} con stock bajo`
    : `${bajos.length} producto${bajos.length>1?'s':''} con stock bajo`;
  toast(msg,'warn');
  setTimeout(()=>setView('inventario'), 700);
});

/* =========================================================
   INIT
   ========================================================= */
renderNav();
setView('dashboard');
</script>
</body>
</html>

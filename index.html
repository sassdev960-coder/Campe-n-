<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMGest · Sistema de Gestión</title>
<style>
:root{
  --bg:#f5f4f1; --surface:#fff; --surface-soft:#fafaf7;
  --ink:#15140f; --ink-2:#3a3833; --muted:#7a766d;
  --line:#e8e6e0; --line-soft:#f1efea;
  --primary:#1c3d5a; --primary-hover:#152e45;
  --accent:#8a6d3b;
  --success:#2d6a4f; --success-soft:#eaf3ee;
  --warning:#9c6f1f; --warning-soft:#fbf3e2;
  --danger:#8b2b2b; --danger-soft:#f9ecec;
  --info:#1e5a8a; --info-soft:#eaf1f7;
  --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(20,18,12,.04), 0 1px 3px rgba(20,18,12,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}

.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--line);padding:24px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.brand{padding:0 22px 22px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--muted);line-height:1.4}
.nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-soft)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{width:15px;height:15px;stroke:var(--muted);stroke-width:1.6;fill:none;flex-shrink:0}
.nav-item.active svg{stroke:#fff}
.sidebar-footer{padding:14px 22px 0;border-top:1px solid var(--line-soft);margin:0 10px}
.user-box{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:var(--surface-soft);border:1px solid var(--line-soft)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-box select{background:transparent;border:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0;font-family:inherit;outline:none;width:100%}
.user-role{font-size:10.5px;color:var(--muted);margin-top:1px}

.main{margin-left:252px;flex:1;padding:32px 40px 60px;max-width:1300px;width:calc(100% - 252px)}
.page-head{margin-bottom:28px}
.page-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.page-desc{font-size:13.5px;color:var(--muted);margin-top:6px;max-width:680px;line-height:1.55}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.card-subtitle{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi-value.is-success{color:var(--success)}
.kpi-value.is-danger{color:var(--danger)}
.kpi-value.is-warning{color:var(--warning)}
.kpi-meta{font-size:11.5px;color:var(--muted);margin-top:4px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,61,90,.10)}
input::placeholder{color:#b5b2ab}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237a766d' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-outline:hover{border-color:#d5d2ca;background:var(--surface-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{filter:brightness(1.06)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;font-size:12.5px;border-radius:6px}
.btn-ghost:hover{background:var(--surface-soft)}
.btn-block{width:100%}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:0 10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0;text-align:right}
tbody td{padding:12px 10px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
tbody td:first-child{padding-left:0;color:var(--ink)}
tbody td:last-child{padding-right:0;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bold{font-weight:600;color:var(--ink)}

.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:500;letter-spacing:.1px;white-space:nowrap}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--line-soft);color:var(--muted)}
.badge-accent{background:#f3ecdc;color:var(--accent)}

.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:14px;border:1px solid}
.alert-info{background:var(--info-soft);border-color:#d1e0ec;color:#183a56}
.alert-warning{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.alert-danger{background:var(--danger-soft);border-color:#ecd1d1;color:#6a2020}
.alert-success{background:var(--success-soft);border-color:#c7e0cf;color:#22503c}
.alert-title{font-weight:600;margin-bottom:2px}

.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.cart-line:last-child{border-bottom:none}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:13px;font-weight:500;color:var(--ink)}
.cart-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.cart-qty{width:60px;padding:4px 6px;font-size:12.5px;text-align:center}
.cart-price{width:80px;padding:4px 6px;font-size:12.5px;text-align:right}
.cart-sub{width:80px;text-align:right;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:10px;border-top:1px solid var(--line)}
.cart-total-label{font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.cart-total-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}

.prod-list{max-height:400px;overflow-y:auto;margin:0 -8px}
.prod-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer;transition:background .1s}
.prod-item:hover{background:var(--surface-soft)}
.prod-item.stock-0{opacity:.5;cursor:not-allowed}
.prod-name{font-size:13px;font-weight:500}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prod-price{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary)}
.prod-stock{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}

/* Bolsa de recargas */
.bolsa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bolsa-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-soft)}
.bolsa-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.bolsa-card-op{font-size:13px;font-weight:600;color:var(--ink)}
.bolsa-card-com{font-size:11px;color:var(--muted);margin-top:2px}
.bolsa-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.bolsa-row:last-child{border-bottom:none}
.bolsa-row-label{font-size:11.5px;color:var(--muted);font-weight:500}
.bolsa-row-value{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.bolsa-row-value.saldo{color:var(--primary)}
.bolsa-row-value.comision{color:var(--success)}
.bolsa-row-value.retirada{color:var(--muted);font-size:13px;font-weight:500}

.caja-hero{background:linear-gradient(135deg,var(--primary),#0f2942);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.caja-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a5c4ff;margin-bottom:6px}
.caja-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.caja-hero-sub{font-size:12px;color:#a5c4ff;margin-top:6px}

.modal-overlay{position:fixed;inset:0;background:rgba(20,18,12,.45);display:grid;place-items:center;padding:20px;z-index:200;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:26px;max-width:520px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-.2px}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}

.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-soft);border:1px solid var(--line-soft);font-size:11px;color:var(--ink-2);font-weight:500}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.summary-row:last-child{border-bottom:none}
.summary-row.highlight{color:var(--ink);font-weight:600;font-size:14.5px;padding:14px 0;border-top:1px solid var(--line);border-bottom:none}
.summary-row .label{flex:1}
.summary-row .value{font-variant-numeric:tabular-nums;font-weight:500}

.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
.choice:hover{border-color:#cdc9c0;background:var(--surface-soft)}
.choice.active{border-color:var(--primary);background:#f4f7fa;box-shadow:inset 0 0 0 1px var(--primary)}
.choice-title{font-size:12.5px;font-weight:500;color:var(--ink);display:block}
.choice-desc{font-size:11px;color:var(--muted);margin-top:2px;display:block}

.bill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bill-btn{padding:8px 4px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.bill-btn:hover{background:var(--surface-soft);border-color:#cdc9c0}
.bill-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

.cambio-box{background:var(--success-soft);border:1px solid #c7e0cf;border-radius:10px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.cambio-box.insuf{background:var(--danger-soft);border-color:#ecd1d1}
.cambio-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--success)}
.cambio-box.insuf .cambio-label{color:var(--danger)}
.cambio-value{font-size:22px;font-weight:600;color:var(--success);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.cambio-box.insuf .cambio-value{color:var(--danger)}

.check-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-soft);border-radius:9px;border:1px solid var(--line-soft);cursor:pointer}
.check-row input[type=checkbox]{width:auto;margin:0;cursor:pointer}
.check-row label{font-size:13px;font-weight:500;cursor:pointer;margin:0}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 12px 32px -8px rgba(20,18,12,.4);transition:transform .3s cubic-bezier(.2,.9,.3,1.3);z-index:999;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)}
.toast.err{background:var(--danger)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:20px 16px 60px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .choice-row{grid-template-columns:1fr}
  .mobile-toggle{display:flex!important}
}
.mobile-toggle{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);margin:-20px -16px 16px;position:sticky;top:0;z-index:40}
.mobile-toggle button{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);padding:4px}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <div class="brand-logo">SG</div>
      <div class="brand-name">SIMGest</div>
    </div>
    <div class="brand-sub">Sistema de gestión comercial</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-footer">
    <div class="user-box">
      <div class="user-avatar" id="avatarIni">A</div>
      <div class="user-info">
        <select id="rolSel" onchange="cambiarRol(this.value)">
          <option value="admin">Administrador</option>
          <option value="vendedor">Vendedor</option>
          <option value="cobrador">Cobrador</option>
        </select>
        <div class="user-role" id="rolLbl">Acceso completo</div>
      </div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="mobile-toggle">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      Menú
    </button>
  </div>
  <div id="app"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   CONFIGURACIÓN BÁSICA
   ================================================================ */
const UNIDADES = ['unidad','kg','litro','gramo','ml','caja','paquete','docena','metro'];
const LS_KEY = 'simgest_v5';

/* ================================================================
   UTILIDADES
   ================================================================ */
const $ = id => document.getElementById(id);
const HOY = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const horaActual = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const money = n => 'Bs ' + (Number(n)||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const num2 = n => +(Number(n)||0).toFixed(2);
const addDias = (f,n) => { const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fFecha = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const mesDe = iso => (iso||'').slice(0,7);
const mesActual = () => HOY().slice(0,7);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unidadAbrev = u => ({unidad:'u', kg:'kg', litro:'L', gramo:'g', ml:'ml', caja:'cja', paquete:'paq', docena:'doc', metro:'m'})[u]||u;

/* ================================================================
   ESTADO GLOBAL
   ================================================================ */
let state = null;
let rol = 'admin';
let vista = 'resumen';

const esAdmin = () => rol === 'admin';

const ui = {
  ventaCarrito: [],
  ventaClienteId: '',
  ventaTipoPago: 'contado',
  ventaPlazo: 15,
  ventaPlazoCustom: '',
  ventaMontoRecibido: '',
  buscarProd: '',
  compraCarrito: [],
  compraProveedorId: '',
  compraNota: '',
  buscarProdCompra: '',
  modal: null,
  filtroInv: 'Todas',
  clienteAbierto: null,
  cierreMes: mesActual()
};

/* ================================================================
   PERSISTENCIA
   ================================================================ */
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ state = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}
function initState(){
  return {
    seq: { venta:1, compra:1, abono:1, cliente:1, producto:1, proveedor:1, categoria:1, mov:1, cierre:1 },
    proveedores: [],
    categorias: [],
    productos: [],
    clientes: [],
    ventas: [],
    abonos: [],
    compras: [],
    caja: { saldoInicial: 0, movimientos: [] },
    bolsas: {},  // { [proveedorId]: { saldo, comisionAcumulada, comisionesRetiradas } }
    cierres: []
  };
}

/* ================================================================
   HELPERS
   ================================================================ */
const catById = id => state.categorias.find(c => c.id === id);
const provById = id => state.proveedores.find(p => p.id === id);
const prodById = id => state.productos.find(p => p.id === id);

function bolsaDe(provId){
  if(!state.bolsas[provId]){
    state.bolsas[provId] = { saldo: 0, comisionAcumulada: 0, comisionesRetiradas: 0 };
  }
  return state.bolsas[provId];
}

function saldoCaja(){
  if(!state) return 0;
  return num2(state.caja.saldoInicial + state.caja.movimientos.reduce((a,m) => a + m.monto, 0));
}

function agregarMovimientoCaja(tipo, monto, descripcion, referencia){
  state.caja.movimientos.push({
    id: 'M' + (state.seq.mov++),
    fecha: HOY(),
    hora: horaActual(),
    tipo,
    monto: num2(monto),
    descripcion,
    referencia: referencia || null
  });
}
function eliminarMovimientosPorRef(ref){
  state.caja.movimientos = state.caja.movimientos.filter(m => m.referencia !== ref);
}

const saldoVenta = v => num2(v.total - (v.pagado||0));
function deudaCliente(cid){
  return num2(state.ventas
    .filter(v => v.clienteId === cid && v.tipoPago === 'credito')
    .reduce((a,v) => a + saldoVenta(v), 0));
}
function deudaVencida(cid){
  const h = HOY();
  return num2(state.ventas
    .filter(v => v.clienteId === cid && v.tipoPago === 'credito' && saldoVenta(v) > 0 && v.vencimiento && v.vencimiento < h)
    .reduce((a,v) => a + saldoVenta(v), 0));
}
function estadoCliente(cid){
  const d = deudaCliente(cid);
  if(d <= 0.001) return { txt:'Al día', cls:'badge-success' };
  if(deudaVencida(cid) > 0) return { txt:'Vencido', cls:'badge-danger' };
  const prox = state.ventas
    .filter(v => v.clienteId === cid && v.tipoPago === 'credito' && saldoVenta(v) > 0 && v.vencimiento)
    .sort((a,b) => a.vencimiento.localeCompare(b.vencimiento))[0];
  if(prox && prox.vencimiento <= addDias(HOY(),3)) return { txt:'Por vencer', cls:'badge-warning' };
  return { txt:'Vigente', cls:'badge-info' };
}

// Devuelve true si el producto es una recarga telefónica
const esProductoRecarga = p => p && p.esRecarga === true;

function toast(msg, tipo){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo||'');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast ' + (tipo||''), 2600);
}

function renderNav(){
  const visibles = TABS.filter(t => t.roles.includes(rol));
  const grupos = {};
  visibles.forEach(t => { (grupos[t.grupo] = grupos[t.grupo] || []).push(t); });
  $('nav').innerHTML = Object.entries(grupos).map(([g, items]) => `
    <div class="nav-label">${g}</div>
    ${items.map(t => `
      <button class="nav-item ${vista===t.id?'active':''}" onclick="ir('${t.id}')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[t.id]}</svg>
        ${t.label}
      </button>`).join('')}
  `).join('');
}
function ir(v){ vista = v; ui.modal = null; $('sidebar').classList.remove('open'); render(); }
function cambiarRol(r, silent){
  rol = r;
  const map = { admin:['A','Acceso completo'], vendedor:['V','Mostrador'], cobrador:['C','Cobranzas'] };
  if($('avatarIni')) $('avatarIni').textContent = map[r][0];
  if($('rolLbl')) $('rolLbl').textContent = map[r][1];
  if($('rolSel')) $('rolSel').value = r;
  const tab = TABS.find(t => t.id === vista);
  if(!tab || !tab.roles.includes(r)) vista = TABS.find(t => t.roles.includes(r)).id;
  render();
  if(!silent) toast('Sesión: ' + rolNombre(), 'ok');
}

function abrirModal(tipo, id){
  ui.modal = { tipo, id: id || null };
  renderModal();
}
function cerrarModal(){ ui.modal = null; renderModal(); }
function renderModal(){
  const root = $('modalRoot');
  if(!ui.modal){ root.innerHTML = ''; return; }
  const { tipo, id } = ui.modal;
  let contenido = '';
  if(tipo === 'nuevoProducto' || tipo === 'editarProducto') contenido = modalProducto(id);
  else if(tipo === 'nuevaCategoria' || tipo === 'editarCategoria') contenido = modalCategoria(id);
  else if(tipo === 'nuevoProveedor' || tipo === 'editarProveedor') contenido = modalProveedor(id);
  else if(tipo === 'nuevoCliente' || tipo === 'editarCliente') contenido = modalCliente(id);
  else if(tipo === 'agregarDinero') contenido = modalDinero('aporte');
  else if(tipo === 'retirarDinero') contenido = modalDinero('retiro');
  else if(tipo === 'saldoInicial') contenido = modalSaldoInicial();
  else if(tipo === 'reponerBolsa') contenido = modalReponerBolsa(id);
  else if(tipo === 'retirarComision') contenido = modalRetirarComision(id);
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) cerrarModal()"><div class="modal">${contenido}</div></div>`;
}

function guardarProducto(id){
  const nombre = $('m-prod-nombre').value.trim();
  const catId = $('m-prod-cat').value;
  const unidad = $('m-prod-unidad').value;
  const esRec = $('m-prod-esrecarga').checked;
  const provId = esRec ? $('m-prod-prov').value : $('m-prod-prov-normal').value;
  const costo = Number($('m-prod-costo').value);
  const precio = Number($('m-prod-precio').value);

  if(!nombre) return toast('El nombre es obligatorio','err');
  if(!catId) return toast('Selecciona una categoría','err');
  if(esRec && !provId) return toast('Selecciona el operador de la recarga','err');
  if(isNaN(costo) || costo < 0) return toast('Costo inválido','err');
  if(isNaN(precio) || precio < 0) return toast('Precio inválido','err');

  if(id){
    const p = prodById(id);
    const eraRecarga = p.esRecarga === true;
    p.nombre = nombre;
    p.categoriaId = catId;
    p.unidad = unidad;
    p.esRecarga = esRec;
    p.proveedorId = provId || null;
    p.costo = num2(costo);
    p.precio = num2(precio);
    // Si ahora es recarga y antes no, limpiar stock

function agregarAlCarritoVenta(productoId, cantidad){
  const p = prodById(productoId);
  if(!p) return;
  cantidad = Number(cantidad) || 1;
  if(cantidad <= 0) return toast('Cantidad inválida','err');

  // Validar según tipo
  if(esProductoRecarga(p)){
    const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
    const disponible = bolsa ? bolsa.saldo : 0;
    const enCarrito = ui.ventaCarrito.filter(i => i.productoId === productoId).reduce((a,i) => a + i.subtotal, 0);
    const necesario = num2(cantidad * p.precio);
    if(disponible < enCarrito + necesario) {
      return toast(`Saldo insuficiente en bolsa ${provById(p.proveedorId)?.nombre || ''}. Disponible: ${money(disponible)}`,'err');
    }
  }else{
    if(p.stock < cantidad) return toast(`Stock insuficiente (disponible: ${p.stock} ${unidadAbrev(p.unidad)})`,'err');
    const enCarrito = ui.ventaCarrito.filter(i => i.productoId === productoId).reduce((a,i) => a + i.cantidad, 0);
    if(p.stock < enCarrito + cantidad) return toast(`Ya tienes ${enCarrito} en el carrito. Stock disponible: ${p.stock}`,'err');
  }

  const existe = ui.ventaCarrito.find(i => i.productoId === productoId);
  if(existe){
    existe.cantidad = num2(existe.cantidad + cantidad);
    existe.subtotal = num2(existe.cantidad * existe.precioUnit);
  }else{
    ui.ventaCarrito.push({
      productoId, nombre: p.nombre, unidad: p.unidad,
      esRecarga: p.esRecarga === true,
      proveedorId: p.proveedorId || null,
      cantidad: num2(cantidad),
      precioUnit: p.precio,
      costoUnit: p.costo,
      subtotal: num2(cantidad * p.precio)
    });
  }
  render();
}

function actualizarLineaCarrito(ix, campo, valor){
  const it = ui.ventaCarrito[ix];
  if(!it) return;
  if(campo === 'cantidad'){
    const v = num2(valor);
    if(v <= 0) return toast('Cantidad inválida','err');
    const p = prodById(it.productoId);
    if(p && !esProductoRecarga(p) && v > p.stock) return toast(`Stock insuficiente (disponible: ${p.stock})`,'err');
    if(p && esProductoRecarga(p)){
      const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      const totalLinea = num2(v * it.precioUnit);
      if(bolsa && totalLinea > bolsa.saldo) return toast(`Saldo insuficiente en bolsa (${money(bolsa.saldo)})`,'err');
    }
    it.cantidad = v;
  }else if(campo === 'precioUnit'){
    it.precioUnit = num2(valor);
  }
  it.subtotal = num2(it.cantidad * it.precioUnit);
  render();
}

function quitarDelCarrito(ix){ ui.ventaCarrito.splice(ix,1); render(); }
function totalCarritoVenta(){ return num2(ui.ventaCarrito.reduce((a,i) => a + i.subtotal, 0)); }

function confirmarVenta(){
  if(ui.ventaCarrito.length === 0) return toast('El carrito está vacío','err');
  for(const it of ui.ventaCarrito){
    const p = prodById(it.productoId);
    if(!p) return toast(`Producto eliminado: ${it.nombre}`,'err');
    if(!esProductoRecarga(p) && p.stock < it.cantidad) return toast(`Stock insuficiente de ${p.nombre}`,'err');
    if(esProductoRecarga(p)){
      const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      if(bolsa && it.subtotal > bolsa.saldo + 0.001) return toast(`Saldo insuficiente en bolsa de ${provById(p.proveedorId)?.nombre}`,'err');
    }
  }

  const cliente = ui.ventaClienteId ? state.clientes.find(c => c.id === ui.ventaClienteId) : null;
  if(ui.ventaTipoPago === 'credito' && !cliente) return toast('Selecciona un cliente para dar crédito','err');

  let plazo = null, vencimiento = null;
  if(ui.ventaTipoPago === 'credito'){
    plazo = ui.ventaPlazo === 'custom' ? Number(ui.ventaPlazoCustom) : Number(ui.ventaPlazo);
    if(!(plazo > 0)) return toast('Define un plazo válido','err');
    vencimiento = addDias(HOY(), plazo);
    const nuevaDeuda = deudaCliente(cliente.id) + totalCarritoVenta();
    if(cliente.limite > 0 && nuevaDeuda > cliente.limite)
      return toast(`Supera el límite de crédito (${money(cliente.limite)})`,'err');
  }

  const total = totalCarritoVenta();
  let montoRecibido = null, cambio = null;
  if(ui.ventaTipoPago === 'contado'){
    montoRecibido = Number(ui.ventaMontoRecibido);
    if(!(montoRecibido >= total)) return toast('El monto recibido debe cubrir el total','err');
    cambio = num2(montoRecibido - total);
  }

  const venta = {
    id: 'V' + (state.seq.venta++),
    fecha: HOY(), hora: horaActual(),
    clienteId: cliente ? cliente.id : null,
    clienteNombre: cliente ? cliente.nombre : 'Consumidor final',
    tipoPago: ui.ventaTipoPago,
    plazo, vencimiento,
    items: ui.ventaCarrito.map(i => ({ ...i })),
    total,
    pagado: ui.ventaTipoPago === 'contado' ? total : 0,
    montoRecibido, cambio,
    usuario: rolNombre()
  };
  state.ventas.push(venta);

  // Procesar cada item: stock, bolsa y comisión
  venta.items.forEach(it => {
    const p = prodById(it.productoId);
    if(!p) return;
    if(esProductoRecarga(p)){
      const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      if(bolsa){
        bolsa.saldo = num2(bolsa.saldo - it.subtotal);
        const comision = num2(it.subtotal * (provById(p.proveedorId)?.comisionRecarga || 0) / 100);
        bolsa.comisionAcumulada = num2(bolsa.comisionAcumulada + comision);
      }
    }else{
      p.stock = num2(p.stock - it.cantidad);
    }
  });

  if(venta.tipoPago === 'contado'){
    agregarMovimientoCaja('venta', total, 'Venta ' + venta.id + ' · ' + venta.clienteNombre, venta.id);
  }

  ui.ventaCarrito = [];
  ui.ventaClienteId = '';
  ui.ventaMontoRecibido = '';
  ui.ventaTipoPago = 'contado';
  ui.ventaPlazo = 15;
  ui.ventaPlazoCustom = '';

  toast('Venta registrada · ' + money(total),'ok');
  render();
}

function eliminarVenta(id){
  const v = state.ventas.find(x => x.id === id);
  if(!v) return;
  const abonosAsoc = state.abonos.filter(a => a.ventaId === id);
  let msg = '¿Eliminar esta venta?\n\nSe devolverá el stock (y el saldo de bolsa de las recargas).';
  if(v.tipoPago === 'contado') msg += '\nSe quitará el movimiento de caja asociado.';
  if(abonosAsoc.length) msg += `\n\nATENCIÓN: esta venta tiene ${abonosAsoc.length} abono(s). Se eliminarán también.`;
  if(!confirm(msg)) return;

  // Revertir items
  v.items.forEach(it => {
    const p = prodById(it.productoId);
    if(!p) return;
    if(esProductoRecarga(p)){
      const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      if(bolsa){
        bolsa.saldo = num2(bolsa.saldo + it.subtotal);
        const comision = num2(it.subtotal * (provById(p.proveedorId)?.comisionRecarga || 0) / 100);
        bolsa.comisionAcumulada = num2(bolsa.comisionAcumulada - comision);
      }
    }else{
      p.stock = num2(p.stock + it.cantidad);
    }
  });

  state.abonos = state.abonos.filter(a => {
    if(a.ventaId === id){ eliminarMovimientosPorRef(a.id); return false; }
    return true;
  });
  eliminarMovimientosPorRef(id);
  state.ventas = state.ventas.filter(x => x.id !== id);
  toast('Venta eliminada','ok');
  render();
}

  }else{
    ui.compraCarrito.push({
      productoId, nombre: p.nombre, unidad: p.unidad,
      cantidad, costoUnit,
      subtotal: num2(cantidad * costoUnit)
    });
  }
  render();
}
function actualizarLineaCompra(ix, campo, valor){
  const it = ui.compraCarrito[ix];
  if(!it) return;
  if(campo === 'cantidad') it.cantidad = num2(valor);
  if(campo === 'costoUnit') it.costoUnit = num2(valor);

  it.subtotal = num2(it.cantidad * it.costoUnit);

}
function quitarDelCarritoCompra(ix){ ui.compraCarrito.splice(ix,1); render(); }
function totalCarritoCompra(){ return num2(ui.compraCarrito.reduce((a,i) => a + i.subtotal, 0)); }

function confirmarCompra(){
  if(ui.compraCarrito.length === 0) return toast('Agrega productos a la compra','err');

function eliminarCompra(id){
  const c = state.compras.find(x => x.id === id);
  if(!c) return;
  if(!confirm('¿Eliminar esta compra?\n\nSe quitará el stock ingresado y se devolverá el dinero a la caja.')) return;
  c.items.forEach(it => {
    const p = prodById(it.productoId);
    if(p){
      p.stock = num2(p.stock - it.cantidad);
      if(p.stock < 0) p.stock = 0;
    }
  });
  eliminarMovimientosPorRef(id);
  agregarMovimientoCaja('aporte', c.total, 'Reverso compra ' + c.id, null);
  state.compras = state.compras.filter(x => x.id !== id);
  toast('Compra eliminada y dinero devuelto a caja','ok');
  render();
}

   ================================================================ */
function registrarAbono(clienteId, monto){
  monto = Number(monto);
  if(!(monto > 0)) return toast('Ingresa un monto válido','err');
  const pend = state.ventas
    .filter(v => v.clienteId === clienteId && v.tipoPago === 'credito' && saldoVenta(v) > 0.001)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  const totalPend = num2(pend.reduce((a,v) => a + saldoVenta(v), 0));
  if(monto > totalPend) monto = totalPend;

  const abonoId = 'A' + (state.seq.abono++);
  let restante = monto;
  pend.forEach(v => {
    if(restante <= 0.001) return;
    const s = saldoVenta(v);
    const apl = Math.min(s, restante);
    v.pagado = num2((v.pagado||0) + apl);
    restante = num2(restante - apl);
  });
  state.abonos.push({
    id: abonoId, clienteId, ventaId: null,
    fecha: HOY(), monto: num2(monto), usuario: rolNombre()
  });
  agregarMovimientoCaja('abono', monto, 'Abono cliente · ' + (state.clientes.find(c=>c.id===clienteId)?.nombre || ''), abonoId);
  toast('Abono registrado · ' + money(monto),'ok');
  render();
}

/* ================================================================
   VISTA: CAJA (con panel de bolsa de recargas)

function viewCaja(){
  const mov = state.caja.movimientos.slice().reverse();
  const ingresosHoy = num2(state.caja.movimientos.filter(m => m.fecha === HOY() && m.monto > 0).reduce((a,m) => a+m.monto, 0));
  const egresosHoy = num2(state.caja.movimientos.filter(m => m.fecha === HOY() && m.monto < 0).reduce((a,m) => a+m.monto, 0));

  // Proveedores con bolsa activa (comisión > 0 o que tengan saldo/comisión)
  const provsBolsa = state.proveedores.filter(p => 
    (p.comisionRecarga||0) > 0 ||
    (state.bolsas[p.id] && (state.bolsas[p.id].saldo !== 0 || state.bolsas[p.id].comisionAcumulada > 0.001))
  );

  const totalSaldoBolsa = num2(provsBolsa.reduce((a,p) => a + (state.bolsas[p.id]?.saldo || 0), 0));
  const totalComision = num2(provsBolsa.reduce((a,p) => a + (state.bolsas[p.id]?.comisionAcumulada || 0), 0));

  return `

    <div class="page-eyebrow">Tesorería</div>
    <h1 class="page-title">Caja</h1>
    <p class="page-desc">Control del efectivo del negocio y de las bolsas de recargas. Las ventas al contado y los abonos suman; las compras y los retiros restan.</p>
  </div>

  <div class="caja-hero">
    <div>
      <div class="caja-hero-label">Saldo disponible en caja</div>
      <div class="caja-hero-value">${money(saldoCaja())}</div>

      <button class="btn btn-outline" style="background:transparent;border-color:rgba(255,255,255,.3);color:#fff" onclick="abrirModal('saldoInicial')">Saldo inicial</button>
    </div>
  </div>

  <!-- BOLSA DE RECARGAS -->
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Bolsa de recargas</div>
        <div class="card-subtitle">Saldo disponible y comisiones ganadas por operador. El saldo baja con cada venta y la comisión sube.</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="abrirModal('reponerBolsa')">Reponer saldo</button>
        <button class="btn btn-outline" onclick="abrirModal('retirarComision')">Retirar comisión</button>
      </div>
    </div>

    ${provsBolsa.length === 0 ? `
      <div class="empty">
        Aún no tienes operadores configurados para recargas.<br>
        Crea un proveedor en <b>Configuración → Proveedores</b> y asígnale un % de comisión.
      </div>
    `:`
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
        <div class="kpi">
          <div class="kpi-label">Saldo total en bolsas</div>
          <div class="kpi-value">${money(totalSaldoBolsa)}</div>
          <div class="kpi-meta">Dinero cargado para vender recargas</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Comisión acumulada</div>
          <div class="kpi-value is-success">${money(totalComision)}</div>
          <div class="kpi-meta">Ganancia pendiente de retirar</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Comisiones retiradas</div>
          <div class="kpi-value">${money(totalComisionesRetiradas)}</div>
          <div class="kpi-meta">Histórico</div>
        </div>
      </div>

      <div class="bolsa-grid">
        ${provsBolsa.map(p => {
          const b = state.bolsas[p.id] || { saldo:0, comisionAcumulada:0, comisionesRetiradas:0 };
          return `
            <div class="bolsa-card">
              <div class="bolsa-card-head">
                <div>
                  <div class="bolsa-card-op">${esc(p.nombre)}</div>
                  <div class="bolsa-card-com">Comisión: ${p.comisionRecarga || 0}%</div>
                </div>
                <span class="badge badge-accent">${p.comisionRecarga||0}%</span>
              </div>
              <div class="bolsa-row">
                <span class="bolsa-row-label">Saldo disponible</span>
                <span class="bolsa-row-value saldo">${money(b.saldo)}</span>
              </div>
              <div class="bolsa-row">
                <span class="bolsa-row-label">Comisión acumulada</span>
                <span class="bolsa-row-value comision">${money(b.comisionAcumulada)}</span>

                <button class="btn btn-outline btn-sm" onclick="abrirModal('reponerBolsa','${p.id}')">Reponer saldo</button>

    <div class="kpi">

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Movimientos de caja</div>
      <div class="card-subtitle">Historial completo de entradas y salidas de efectivo</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th class="num">Monto</th>${esAdmin()?'<th></th>':''}</tr></thead>
      <tbody>
      ${mov.slice(0,100).map(m => {
        const tipoLbl = {
          aporte:'Aporte', retiro:'Retiro', venta:'Venta', abono:'Abono', compra:'Compra',
          recarga_reposicion:'Reponer bolsa', comision:'Comisión'
        }[m.tipo] || m.tipo;
        const cls = m.monto > 0 ? 'badge-success' : 'badge-danger';
        const puedeEliminar = esAdmin() && (m.tipo === 'aporte' || m.tipo === 'retiro') && !m.referencia;

          <td class="num bold" style="color:${m.monto > 0 ? 'var(--success)' : 'var(--danger)'}">${m.monto > 0 ? '+' : ''}${money(m.monto)}</td>
          ${esAdmin()?`<td class="num">${puedeEliminar ? `<button class="btn-ghost" style="padding:2px 8px;font-size:12px" onclick="eliminarMovimiento('${m.id}')">Eliminar</button>` : ''}</td>`:''}
        </tr>`;
      }).join('') || '<tr><td colspan="5" class="empty">Aún no hay movimientos. Comienza agregando dinero o registrando una venta.</td></tr>'}

    </table></div>
  </div>`;
}

function eliminarMovimiento(id){
  const m = state.caja.movimientos.find(x => x.id === id);
  if(!m || m.referencia) return;
  if(!confirm('¿Eliminar este movimiento de caja?')) return;
  state.caja.movimientos = state.caja.movimientos.filter(x => x.id !== id);
  toast('Movimiento eliminado','ok');
  render();
}

/* ================================================================
   VISTA: PUNTO DE VENTA

  const montoRecibido = Number(ui.ventaMontoRecibido) || 0;

  const prods = state.productos.filter(p => !q || p.nombre.toLowerCase().includes(q)).sort((a,b) => a.nombre.localeCompare(b.nombre));

  const dispDe = p => {
    if(esProductoRecarga(p)){
      const b = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      return { texto: b ? 'Bolsa: ' + money(b.saldo) : 'Sin operador', ok: b && b.saldo > 0 };

              <div class="prod-meta">${esRec ? (provById(p.proveedorId)?.nombre || 'Sin operador') : (unidadAbrev(p.unidad) + ' · ' + (catById(p.categoriaId)?.nombre || 'Sin categoría'))}</div>

      ${ui.ventaCarrito.length === 0 ? `

          ${ui.ventaCarrito.map((i, ix) => `

              <div class="cambio-box ${cambioValido?'':'insuf'}">

                <span class="cambio-value">${money(cambioValido ? cambio : (total - montoRecibido))}</span>
              </div>
            `:''}

          <button class="btn btn-success btn-block" style="margin-top:16px" onclick="confirmarVenta()"
            ${(ui.ventaTipoPago==='contado' && !cambioValido) || (ui.ventaTipoPago==='credito' && !cliente) ? 'disabled' : ''}>

  <div class="card">

      <div><div class="card-title">Historial de ventas</div>
      <div class="card-subtitle">${state.ventas.length} venta(s) registrada(s)</div></div>

    <div class="table-wrap"><table>

        <th>Ref.</th><th>Fecha</th><th>Cliente</th><th>Detalle</th><th>Pago</th><th class="num">Total</th><th class="num">Estado</th>${esAdmin()?'<th></th>':''}
      </tr></thead>
      <tbody>
      ${state.ventas.slice().reverse().slice(0,30).map(v => `
        <tr>
          <td><span class="badge badge-neutral">${v.id}</span></td>

      </tbody>
    </table></div>
  </div>`;

/* ================================================================
   VISTA: INVENTARIO
   ================================================================ */
function viewInventario(){
  const filtro = ui.filtroInv;
  const prods = state.productos
    .filter(p => filtro === 'Todas' || p.categoriaId === filtro)
    .sort((a,b) => a.nombre.localeCompare(b.nombre));

  const valorTotal = num2(state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock * p.costo, 0));
  const bajos = state.productos.filter(p => !esProductoRecarga(p) && p.stock <= 5).length;
  const totalSaldoBolsa = num2(Object.values(state.bolsas).reduce((a,b) => a + (b.saldo||0), 0));

  return `

    <div class="page-eyebrow">Existencias</div>
    <h1 class="page-title">Inventario</h1>

      <div class="kpi-value">${state.productos.length}</div>
      <div class="kpi-meta">${state.categorias.length} categoría(s)</div>

    <div class="kpi">
      <div class="kpi-label">Valor del inventario</div>
      <div class="kpi-value">${money(valorTotal)}</div>
      <div class="kpi-meta">Productos físicos, a costo</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Saldo en bolsas</div>
      <div class="kpi-value is-success">${money(totalSaldoBolsa)}</div>
      <div class="kpi-meta">Recargas disponibles</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Bajo stock</div>
      <div class="kpi-value ${bajos>0?'is-warning':''}">${bajos}</div>
      <div class="kpi-meta">${bajos>0?'Reponer pronto':'Todo en orden'}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Productos</div>
      <div class="card-subtitle">${prods.length} producto(s)</div></div>
      <div class="btn-row">
        <button class="btn btn-sm ${filtro==='Todas'?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='Todas'; render()">Todas</button>
        ${state.categorias.map(c => `<button class="btn btn-sm ${filtro===c.id?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='${c.id}'; render()">${esc(c.nombre)}</button>`).join('')}
      </div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Producto</th><th>Categoría</th><th>Proveedor</th>
        <th class="num">Disponible</th>
        ${esAdmin()?'<th class="num">Costo</th>':''}
        <th class="num">Precio venta</th>
        <th class="num">Estado</th>
      </tr></thead>
      <tbody>
      ${prods.map(p => {
        const cat = catById(p.categoriaId);
        const prov = provById(p.proveedorId);
        const esRec = esProductoRecarga(p);
        let stockTxt, estado;
        if(esRec){
          const b = p.proveedorId ? state.bolsas[p.proveedorId] : null;
          const s = b ? b.saldo : 0;
          stockTxt = money(s) + ' <span style="font-size:11px;color:var(--muted);font-weight:400">bolsa</span>';
          estado = s <= 0 ? '<span class="badge badge-danger">Sin saldo</span>'
                 : s <= 50 ? '<span class="badge badge-warning">Saldo bajo</span>'
                 : '<span class="badge badge-success">OK</span>';
        }else{
          stockTxt = `${p.stock} <span style="font-size:11px;color:var(--muted);font-weight:400">${unidadAbrev(p.unidad)}</span>`;
          estado = p.stock <= 0 ? '<span class="badge badge-danger">Agotado</span>'
                 : p.stock <= 5 ? '<span class="badge badge-warning">Bajo</span>'
                 : '<span class="badge badge-success">OK</span>';
        }
        return `<tr>
          <td class="bold">${esc(p.nombre)} ${esRec?'<span class="badge badge-accent" style="margin-left:4px">Recarga</span>':''}</td>
          <td>${cat ? esc(cat.nombre) : '—'}</td>
          <td>${prov ? esc(prov.nombre) : '—'}</td>
          <td class="num bold" style="font-size:14px">${stockTxt}</td>
          ${esAdmin()?`<td class="num">${money(p.costo)}</td>`:''}
          <td class="num" style="color:var(--primary);font-weight:600">${money(p.precio)}</td>
          <td class="num">${estado}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="7" class="empty">No hay productos. Créalos en Configuración → Productos.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

function toggleCliente(id){ ui.clienteAbierto = ui.clienteAbierto === id ? null : id; render(); }
function abonar(cid, montoForzado){
  let monto = montoForzado;
  if(monto === undefined){
    const el = $('abono-'+cid);
    monto = el ? el.value : 0;
  }
  registrarAbono(cid, monto);
}

      </tbody>

function eliminarProducto(id){
  const p = prodById(id);
  if(!p) return;
  const enVentas = state.ventas.some(v => v.items.some(i => i.productoId === id));
  const enCompras = state.compras.some(c => c.items.some(i => i.productoId === id));
  let msg = `¿Eliminar "${p.nombre}"?`;
  if(enVentas || enCompras) msg += '\n\nEste producto aparece en ventas o compras. Se conservará el historial.';
  if(!confirm(msg)) return;
  state.productos = state.productos.filter(x => x.id !== id);
  toast('Producto eliminado','ok');
  render();
}

      <button class="btn btn-primary" onclick="abrirModal('nuevaCategoria')">Nueva categoría</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nombre</th><th class="num">Productos</th><th></th></tr></thead>
      <tbody>
      ${state.categorias.map(c => {
        const count = state.productos.filter(p => p.categoriaId === c.id).length;
        return `<tr>
          <td class="bold">${esc(c.nombre)}</td>
          <td class="num">${count}</td>
          <td class="num">
            <button class="btn-ghost" style="padding:2px 8px;font-size:12px" onclick="abrirModal('editarCategoria','${c.id}')">Editar</button>
            <button class="btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--danger)" onclick="eliminarCategoria('${c.id}')">Eliminar</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="3" class="empty">Aún no hay categorías.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

function eliminarCategoria(id){
  const enUso = state.productos.some(p => p.categoriaId === id);
  if(enUso) return toast('No se puede eliminar: hay productos en esta categoría','err');
  if(!confirm('¿Eliminar esta categoría?')) return;
  state.categorias = state.categorias.filter(c => c.id !== id);
  toast('Categoría eliminada','ok');
  render();
}

/* ================================================================
   VISTA: PROVEEDORES (ADMIN)
   ================================================================ */
function viewProveedores(){
  return `
  <div class="page-head">
    <div class="page-eyebrow">Configuración</div>
    <h1 class="page-title">Proveedores</h1>
    <p class="page-desc">Operadores telefónicos (Entel, Tigo, Viva) o distribuidoras de productos. Cada operador con recargas tiene su comisión.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Tus proveedores · ${state.proveedores.length}</div>
      <div class="card-subtitle">Los proveedores con % de comisión generan una bolsa de recargas</div></div>
      <button class="btn btn-primary" onclick="abrirModal('nuevoProveedor')">Nuevo proveedor</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Nombre</th><th>Notas</th><th class="num">Comisión recargas</th>
        <th class="num">Saldo bolsa</th><th class="num">Productos</th><th></th>
      </tr></thead>
      <tbody>
      ${state.proveedores.map(p => {
        const countProd = state.productos.filter(x => x.proveedorId === p.id).length;
        const b = state.bolsas[p.id];
        return `<tr>
          <td class="bold">${esc(p.nombre)}</td>
          <td style="color:var(--muted);font-size:12.5px">${esc(p.nota||'—')}</td>
          <td class="num">${(p.comisionRecarga||0)}%</td>
          <td class="num">${b ? money(b.saldo) : '—'}</td>
          <td class="num">${countProd}</td>
          <td class="num">
            <button class="btn-ghost" style="padding:2px 8px;font-size:12px" onclick="abrirModal('editarProveedor','${p.id}')">Editar</button>
            <button class="btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--danger)" onclick="eliminarProveedor('${p.id}')">Eliminar</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="empty">Aún no hay proveedores.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

function eliminarProveedor(id){
  const enUso = state.productos.some(p => p.proveedorId === id) || state.compras.some(c => c.proveedorId === id);
  if(enUso) return toast('No se puede eliminar: está asociado a productos o compras','err');
  if(!confirm('¿Eliminar este proveedor?')) return;
  state.proveedores = state.proveedores.filter(p => p.id !== id);
  delete state.bolsas[id];
  toast('Proveedor eliminado','ok');
  render();
}

/* ================================================================
   VISTA: CIERRE MENSUAL
   ================================================================ */
function viewCierre(){
  const mes = ui.cierreMes;
  const ventasMes = state.ventas.filter(v => mesDe(v.fecha) === mes);
  const comprasMes = state.compras.filter(c => mesDe(c.fecha) === mes);
  const abonosMes = state.abonos.filter(a => mesDe(a.fecha) === mes);
  const movMes = state.caja.movimientos.filter(m => mesDe(m.fecha) === mes);

  const totVentas = num2(ventasMes.reduce((a,v) => a + v.total, 0));
  const totCompras = num2(comprasMes.reduce((a,c) => a + c.total, 0));
  const totContado = num2(ventasMes.filter(v => v.tipoPago === 'contado').reduce((a,v) => a + v.total, 0));
  const totCredito = num2(ventasMes.filter(v => v.tipoPago === 'credito').reduce((a,v) => a + v.total, 0));
  const totAbonos = num2(abonosMes.reduce((a,x) => a + x.monto, 0));
  const ingresosMes = num2(movMes.filter(m => m.monto > 0).reduce((a,m) => a + m.monto, 0));
  const egresosMes = num2(movMes.filter(m => m.monto < 0).reduce((a,m) => a + m.monto, 0));
  const comisionesMes = num2(movMes.filter(m => m.tipo === 'comision').reduce((a,m) => a + m.monto, 0));

  return `
  <div class="page-head">
    <div class="page-eyebrow">Arqueo</div>
    <h1 class="page-title">Cierre mensual</h1>
    <p class="page-desc">Revisa el resumen del mes y ejecuta el cierre. Los saldos finales pasan a ser los iniciales del próximo período.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Período</div>
        <div class="card-subtitle">Elige el mes y ejecuta el cierre cuando estés listo</div>
      </div>
      <div class="btn-row">
        <input type="month" value="${mes}" onchange="ui.cierreMes=this.value; render()" style="width:auto">
        <button class="btn btn-primary" onclick="ejecutarCierre()">Ejecutar cierre</button>
      </div>
    </div>
    <div class="alert alert-info" style="margin-bottom:0">
      <div>Al ejecutar el cierre, se guarda un registro histórico del mes. Los saldos finales siguen siendo el punto de partida del próximo período.</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">Ventas del mes</div>
      <div class="kpi-value">${money(totVentas)}</div>
      <div class="kpi-meta">${ventasMes.length} transacción(es)</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Compras del mes</div>
      <div class="kpi-value is-warning">${money(totCompras)}</div>
      <div class="kpi-meta">${comprasMes.length} entrada(s)</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Comisiones retiradas</div>
      <div class="kpi-value is-success">${money(comisionesMes)}</div>
      <div class="kpi-meta">Ingresos por recargas</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Saldo final en caja</div>
      <div class="kpi-value">${money(saldoCaja())}</div>
      <div class="kpi-meta">Al día de hoy</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Resumen de caja del mes</div>
        <div class="card-subtitle">Movimiento de efectivo</div></div>
      </div>
      <div class="summary-row"><span class="label">Ventas al contado</span><span class="value">${money(totContado)}</span></div>
      <div class="summary-row"><span class="label">Abonos cobrados</span><span class="value">${money(totAbonos)}</span></div>
      <div class="summary-row" style="background:var(--success-soft);margin:0 -14px;padding:12px 14px;border-radius:8px;border:none">
        <span class="label" style="font-weight:600;color:var(--success)">Ingresos totales</span>
        <span class="value" style="font-weight:700;color:var(--success);font-size:15px">${money(ingresosMes)}</span>
      </div>
      <div class="summary-row"><span class="label">Compras</span><span class="value" style="color:var(--danger);font-weight:600">− ${money(totCompras)}</span></div>
      <div class="summary-row"><span class="label">Reposición de bolsas</span><span class="value" style="color:var(--danger);font-weight:600">− ${money(num2(movMes.filter(m => m.tipo === 'recarga_reposicion').reduce((a,m) => a + Math.abs(m.monto), 0)))}</span></div>
      <div class="summary-row"><span class="label">Retiros y otros egresos</span><span class="value" style="color:var(--danger);font-weight:600">${money(num2(egresosMes + totCompras))}</span></div>
      <div class="summary-row highlight"><span class="label">Flujo neto del mes</span><span class="value">${money(num2(ingresosMes + egresosMes))}</span></div>
      <div class="summary-row"><span class="label">Ventas a crédito (no ingresó efectivo)</span><span class="value" style="color:var(--warning)">${money(totCredito)}</span></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Estado del negocio</div>
        <div class="card-subtitle">Foto actual</div></div>
      </div>
      <div class="summary-row"><span class="label">Productos distintos</span><span class="value">${state.productos.length}</span></div>
      <div class="summary-row"><span class="label">Valor del inventario (costo)</span><span class="value">${money(num2(state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock * p.costo, 0)))}</span></div>
      <div class="summary-row"><span class="label">Saldo en bolsas de recargas</span><span class="value">${money(num2(Object.values(state.bolsas).reduce((a,b) => a + (b.saldo||0), 0)))}</span></div>
      <div class="summary-row"><span class="label">Comisiones pendientes de retirar</span><span class="value" style="color:var(--success);font-weight:600">${money(num2(Object.values(state.bolsas).reduce((a,b) => a + (b.comisionAcumulada||0), 0)))}</span></div>
      <div class="summary-row"><span class="label">Cartera por cobrar</span><span class="value">${money(num2(state.clientes.reduce((a,c) => a + deudaCliente(c.id), 0)))}</span></div>
      <div class="summary-row highlight"><span class="label">Efectivo en caja</span><span class="value">${money(saldoCaja())}</span></div>
    </div>
  </div>

  ${state.cierres.length ? `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Cierres anteriores</div>
      <div class="card-subtitle">Registro histórico</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Período</th><th>Fecha</th><th class="num">Ventas</th><th class="num">Caja final</th><th class="num">Stock unid.</th><th>Usuario</th></tr></thead>
      <tbody>
      ${state.cierres.slice().reverse().map(c => `
        <tr><td class="bold">${c.mes}</td><td>${fFecha(c.fecha)}</td>
        <td class="num">${money(c.ventas)}</td>
        <td class="num">${money(c.cajaFinal)}</td>
        <td class="num">${c.stockTotal}</td>
        <td><span class="badge badge-neutral">${esc(c.usuario)}</span></td></tr>`).join('')}
      </tbody>
    </table></div>
  </div>`:''}
  `;
}

function ejecutarCierre(){
  const mes = ui.cierreMes;
  if(!confirm(`¿Confirmar cierre del período ${mes}?`)) return;
  const ventasMes = state.ventas.filter(v => mesDe(v.fecha) === mes);
  state.cierres.push({
    mes, fecha: HOY(),
    ventas: num2(ventasMes.reduce((a,v) => a + v.total, 0)),
    cajaFinal: saldoCaja(),
    stockTotal: state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock, 0),
    usuario: rolNombre()
  });
  toast(`Cierre ${mes} guardado`,'ok');
  render();
}

/* ================================================================
   CONFIGURACIÓN BASE (OPCIONAL)
   ================================================================ */
function cargarBase(){
  if(!confirm('Se cargará una configuración base con categorías, proveedores y productos típicos.\n\n¿Continuar?')) return;

  const cats = ['Telefonía','Dulces','Útiles escolares','Bebidas','Otros'].map(n => {
    const c = { id:'CA'+(state.seq.categoria++), nombre:n };
    state.categorias.push(c);
    return c;
  });
  const catPorNombre = n => cats.find(c => c.nombre === n).id;

  const provs = [
    { nombre:'Entel', comision:5 },
    { nombre:'Tigo',  comision:6 },
    { nombre:'Viva',  comision:7 }
  ].map(x => {
    const p = { id:'PV'+(state.seq.proveedor++), nombre:x.nombre, nota:'', comisionRecarga:x.comision };
    state.proveedores.push(p);
    bolsaDe(p.id); // crear bolsa vacía
    return p;
  });
  const provPorNombre = n => provs.find(p => p.nombre === n).id;

  // Recargas por operador (tipo recarga, sin stock físico)
  ['Entel','Tigo','Viva'].forEach(op => {
    [10,15,30,50,100].forEach(d => {
      state.productos.push({
        id:'PR'+(state.seq.producto++),
        nombre:`Recarga ${op} Bs ${d}`,
        categoriaId: catPorNombre('Telefonía'),
        proveedorId: provPorNombre(op),
        unidad:'unidad',
        esRecarga: true,
        costo: num2(d * (1 - ({ Entel:0.05, Tigo:0.06, Viva:0.07 }[op]))),
        precio: d,
        stock: 0, stockInicial: 0
      });
    });
  });

  // Chips
  ['Entel','Tigo','Viva'].forEach(op => {
    state.productos.push({
      id:'PR'+(state.seq.producto++),
      nombre:`Chip ${op}`,
      categoriaId: catPorNombre('Telefonía'),
      proveedorId: provPorNombre(op),
      unidad:'unidad', esRecarga:false,
      costo: op==='Viva'?4:5, precio: op==='Viva'?12:15,
      stock:0, stockInicial:0
    });
  });

  // Productos generales
  const generales = [
    { nombre:'Chicle', cat:'Dulces', unidad:'unidad', costo:0.5, precio:1 },
    { nombre:'Caramelo', cat:'Dulces', unidad:'unidad', costo:0.3, precio:0.5 },
    { nombre:'Cuaderno', cat:'Útiles escolares', unidad:'unidad', costo:5, precio:8 },
    { nombre:'Lápiz', cat:'Útiles escolares', unidad:'unidad', costo:0.8, precio:2 },
    { nombre:'Coca Cola 500ml', cat:'Bebidas', unidad:'unidad', costo:4, precio:6 }
  ];
  generales.forEach(g => {
    state.productos.push({
      id:'PR'+(state.seq.producto++),
      nombre: g.nombre,
      categoriaId: catPorNombre(g.cat),
      proveedorId: null,
      unidad: g.unidad, esRecarga:false,
      costo: num2(g.costo), precio: num2(g.precio),
      stock:0, stockInicial:0
    });
  });

  save(); render();
  toast('Configuración base cargada','ok');
}

/* ================================================================
   INICIALIZACIÓN
   ================================================================ */
(function init(){
  try{
    if(!load()){ state = initState(); save(); }
    if(!state.cierres) state.cierres = [];
    if(!state.caja) state.caja = { saldoInicial:0, movimientos:[] };
    if(!state.bolsas) state.bolsas = {};
    if(!state.seq.mov) state.seq.mov = 1;
    // Asegurar bolsas para proveedores con comisión > 0
    state.proveedores.forEach(p => { if((p.comisionRecarga||0) > 0) bolsaDe(p.id); });
    cambiarRol('admin', true);
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = `
      <div class="card" style="max-width:640px;margin:40px auto">
        <div class="card-title" style="color:var(--danger);font-size:16px">Error al iniciar</div>
        <p style="margin-top:10px;color:var(--muted);line-height:1.55">${esc(e.message||String(e))}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.clear(); location.reload();">Restablecer y recargar</button>
      </div>
    `;
  }
})();
</script>
</body>
</html>

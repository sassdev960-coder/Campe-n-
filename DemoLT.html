<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Athenea · Librería & Accesorios</title>
<style>
/* ============ RESET & TOKENS ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f5f8;
  --surface:#ffffff;
  --line:#e7e9ef;
  --line-strong:#d5d9e2;
  --text:#111827;
  --muted:#6b7280;
  --brand:#4f46e5;
  --brand-soft:#eef2ff;
  --ok:#10b981;   --ok-soft:#e7f8f2;
  --warn:#f59e0b; --warn-soft:#fef5e4;
  --danger:#ef4444; --danger-soft:#fdeeee;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -18px rgba(16,24,40,.28);
  --ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100%}
body{
  margin:0;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none;display:block}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh;min-height:100dvh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;padding:14px 16px calc(112px + env(safe-area-inset-bottom));max-width:1280px;width:100%;margin:0 auto}
.sidebar{display:none}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;
  background:rgba(244,245,248,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(231,233,239,.9);
}
.topbar-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.topbar-actions{display:flex;align-items:center;gap:8px}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#22d3ee);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em;
}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--muted);background:var(--surface);border:1px solid var(--line);
  transition:all .25s var(--ease);
}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.95)}

/* ============ SIDEBAR (desktop) ============ */
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.brand-logo{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;font-weight:800;font-size:16px;
  box-shadow:0 8px 20px -10px rgba(99,102,241,.9);
}
.brand strong{display:block;font-size:15px;color:#fff;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:#8b93a7;letter-spacing:.03em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 13px;border-radius:12px;
  color:#98a1b6;font-size:14px;font-weight:500;
  transition:all .25s var(--ease);
}
.nav-item:hover{background:rgba(255,255,255,.055);color:#fff}
.nav-item.active{background:rgba(99,102,241,.18);color:#c7d2fe}
.nav-item.active .ic{color:#a5b4fc}
.sidebar-foot{margin-top:auto;padding-top:16px}
.mini-card{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
}
.mini-card span{font-size:12px;color:#8b93a7}
.mini-card strong{font-size:12px;color:#6ee7b7;font-weight:700;letter-spacing:.02em}

/* ============ TABBAR (mobile) ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:12px;
  color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em;
  transition:all .25s var(--ease);
}
.tab-item .ic{width:21px;height:21px}
.tab-item.active{color:var(--brand);background:var(--brand-soft)}
.tab-item:active{transform:scale(.94)}

/* ============ HEADINGS ============ */
.view-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin-bottom:16px;flex-wrap:wrap;
}
.view-head h1{font-size:21px;font-weight:750;letter-spacing:-.025em}
.view-head .sub{font-size:12.5px;color:var(--muted);margin-top:3px;text-transform:capitalize}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:12px;
  font-size:14px;font-weight:650;letter-spacing:-.005em;
  background:var(--brand);color:#fff;
  box-shadow:0 8px 20px -12px rgba(79,70,229,.9);
  transition:all .25s var(--ease);
  white-space:nowrap;
}
.btn .ic{width:17px;height:17px}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 12px 24px -12px rgba(79,70,229,.85)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:#fafbfd;border-color:var(--line-strong);filter:none}
.btn.soft{background:var(--brand-soft);color:var(--brand);box-shadow:none}
.btn.soft:hover{background:#e3e9ff;filter:none}
.btn.block{width:100%}
.btn.lg{padding:14px 18px;font-size:15px;border-radius:14px}
.link{font-size:12.5px;font-weight:650;color:var(--brand);transition:opacity .2s}
.link:hover{opacity:.7}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 12px}
.card-head h2{font-size:14px;font-weight:700;letter-spacing:-.01em}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;
  transition:all .3s var(--ease);
}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 32px -22px rgba(16,24,40,.5)}
.ic-wrap{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.ic-wrap .ic{width:18px;height:18px}
.ic-wrap.brand{background:var(--brand-soft);color:var(--brand)}
.ic-wrap.ok{background:var(--ok-soft);color:#0f9d76}
.ic-wrap.warn{background:var(--warn-soft);color:#c47b08}
.ic-wrap.danger{background:var(--danger-soft);color:#dc3b3b}
.kpi-label{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.kpi-value{font-size:19px;font-weight:750;letter-spacing:-.025em;margin-top:1px}
.kpi-hint{font-size:11px;color:var(--muted);opacity:.85}

/* ============ LISTS ============ */
.list{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-top:1px solid var(--line);
  transition:background .2s var(--ease);
}
.row:hover{background:#fafbfd}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.row-value{font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.empty{
  padding:34px 16px;text-align:center;color:var(--muted);
  font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.empty .ic{width:26px;height:26px;opacity:.35}

/* ============ BADGES / TAGS ============ */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:30px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.01em;
}
.badge.ok{background:var(--ok-soft);color:#0f9d76}
.badge.warn{background:var(--warn-soft);color:#c47b08}
.badge.danger{background:var(--danger-soft);color:#dc3b3b}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 7px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);font-size:11.5px;font-weight:700;
}
.tag{
  display:inline-block;padding:2px 8px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
}
.tag.libreria{background:#eef2ff;color:#4f46e5}
.tag.accesorios{background:#e6f8f3;color:#0d9488}

/* ============ SEARCH & CHIPS ============ */
.search{position:relative;margin-bottom:10px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{
  width:100%;padding:12px 14px 12px 41px;
  border-radius:13px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;outline:none;
  transition:all .25s var(--ease);
}
.search input::placeholder{color:#9ca3af}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:8px 15px;border-radius:999px;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:650;color:var(--muted);
  transition:all .25s var(--ease);
}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.active{background:var(--text);border-color:var(--text);color:#fff}
.chip:active{transform:scale(.96)}

/* ============ POS ============ */
.pos{display:block}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.prod{
  display:flex;flex-direction:column;gap:6px;text-align:left;
  padding:12px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);
  transition:all .22s var(--ease);
}
.prod:hover{border-color:#c9cdd8;transform:translateY(-2px);box-shadow:0 14px 26px -20px rgba(16,24,40,.6)}
.prod:active{transform:scale(.975)}
.prod:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.p-name{font-size:13px;font-weight:650;line-height:1.3;min-height:34px;letter-spacing:-.005em}
.p-meta{font-size:11px;color:var(--muted)}
.p-foot{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.p-price{font-size:14px;font-weight:750;letter-spacing:-.02em}
.p-add{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);transition:all .22s var(--ease);
}
.p-add .ic{width:15px;height:15px}
.prod:hover .p-add{background:var(--brand);color:#fff}

/* ============ CART ============ */
.cart{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden;
}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.cart-items{flex:1;overflow-y:auto;padding:6px 0;max-height:none;-webkit-overflow-scrolling:touch}
.cart-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cart-empty .ic{width:28px;height:28px;opacity:.3}
.cart-empty span{font-size:11.5px;opacity:.8}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 16px;transition:background .2s var(--ease)}
.cart-item:hover{background:#fafbfd}
.ci-main{flex:1;min-width:0}
.ci-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:11px;color:var(--muted)}
.ci-total{font-size:13px;font-weight:700;min-width:64px;text-align:right;letter-spacing:-.01em}
.qty{display:flex;align-items:center;gap:2px;background:#f4f5f8;border-radius:10px;padding:2px}
.qty button{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:var(--muted);transition:all .2s var(--ease);
}
.qty button:hover{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.qty button:active{transform:scale(.9)}
.qty .ic{width:14px;height:14px}
.qty span{min-width:22px;text-align:center;font-size:12.5px;font-weight:700}
.cart-foot{border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fcfcfd}
.sum-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sum-row strong{color:var(--text);font-weight:650}
.sum-row.total{font-size:16px;color:var(--text);font-weight:750;margin:10px 0 12px;letter-spacing:-.02em}
.disc-field{
  width:66px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:650;text-align:right;outline:none;
  transition:all .2s var(--ease);
}
.disc-field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* Barra flotante móvil */
.cart-bar{
  position:fixed;left:12px;right:12px;
  bottom:calc(76px + env(safe-area-inset-bottom));z-index:75;
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:16px;
  background:#111827;color:#fff;
  box-shadow:0 18px 34px -18px rgba(0,0,0,.65);
  transition:all .3s var(--ease);
}
.cart-bar:active{transform:scale(.985)}
.cart-bar.hide{opacity:0;pointer-events:none;transform:translateY(14px)}
.cb-count{
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:var(--brand);font-size:12px;font-weight:750;
}
.cb-label{flex:1;text-align:left;font-size:13px;font-weight:600;opacity:.9}
.cb-total{font-size:14.5px;font-weight:750;letter-spacing:-.02em}

/* ============ INVENTARIO ============ */
.inv-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;border-top:1px solid var(--line);
  cursor:pointer;transition:background .2s var(--ease);
}
.inv-row:first-child{border-top:0}
.inv-row:hover{background:#fafbfd}
.inv-main{flex:1;min-width:0}
.inv-name{font-size:13.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-meta{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.inv-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.inv-right strong{font-size:13.5px;font-weight:700;letter-spacing:-.015em}

/* ============ CAJA ============ */
.mov{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.mov-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.mov-icon .ic{width:16px;height:16px}
.mov-icon.in{background:var(--ok-soft);color:#0f9d76}
.mov-icon.out{background:var(--danger-soft);color:#dc3b3b}
.mov-amount{font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mov-amount.in{color:#0f9d76}
.mov-amount.out{color:#dc3b3b}

/* ============ REPORTES ============ */
.bar-row{margin-bottom:16px}
.bar-row:last-child{margin-bottom:0}
.bar-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:7px}
.bar-head span{color:var(--muted);font-weight:600}
.bar-head strong{font-weight:750;letter-spacing:-.015em}
.bar-track{height:9px;border-radius:999px;background:#f0f1f5;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;width:0;transition:width .8s var(--ease)}
.bar-fill.lib{background:linear-gradient(90deg,#6366f1,#818cf8)}
.bar-fill.acc{background:linear-gradient(90deg,#14b8a6,#2dd4bf)}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,17,23,.5);backdrop-filter:blur(3px);animation:fade .22s var(--ease)}
.modal-card{
  position:relative;width:100%;max-width:430px;
  background:var(--surface);border-radius:20px;padding:20px;
  box-shadow:0 30px 70px -25px rgba(0,0,0,.5);
  animation:pop .28s var(--ease);
  max-height:88vh;overflow-y:auto;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{font-size:16px;font-weight:750;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.field input,.field select{
  width:100%;padding:11px 12px;border-radius:11px;
  border:1px solid var(--line);background:#fbfbfd;
  font-size:14px;outline:none;transition:all .22s var(--ease);
}
.field input:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}

/* ============ TOAST ============ */
#toast-root{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(140px + env(safe-area-inset-bottom));z-index:300;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  width:max-content;max-width:92vw;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:9px;
  background:#111827;color:#fff;
  padding:11px 16px;border-radius:12px;
  font-size:13px;font-weight:600;
  box-shadow:0 16px 34px -16px rgba(0,0,0,.65);
  animation:toastIn .3s var(--ease);
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.toast .ic{width:16px;height:16px;color:#6ee7b7}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

/* ============ SHEET BACKDROP ============ */
.sheet-backdrop{
  position:fixed;inset:0;z-index:79;
  background:rgba(15,17,23,.45);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
.sheet-backdrop.show{opacity:1;pointer-events:auto}

/* ============ MÓVIL: CARRITO COMO SHEET ============ */
@media (max-width:999px){
  .cart{
    position:fixed;left:0;right:0;bottom:0;z-index:80;
    border-radius:22px 22px 0 0;
    max-height:84vh;max-height:84dvh;
    transform:translateY(100%);
    transition:transform .35s var(--ease);
    pointer-events:none;
    border-bottom:0;
    box-shadow:0 -20px 50px -25px rgba(0,0,0,.45);
  }
  .cart.open{transform:translateY(0);pointer-events:auto;animation:sheetUp .38s var(--ease)}
  .cart-items{max-height:46vh;max-height:46dvh}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
}
@media (min-width:1000px){
  .cart-bar{display:none!important}
  .sheet-backdrop{display:none}
}

/* ============ DESKTOP ============ */
@media (min-width:1000px){
  .sidebar{
    display:flex;flex-direction:column;
    width:256px;flex:none;
    padding:22px 16px;
    position:sticky;top:0;height:100vh;height:100dvh;
    background:#0f1117;
    border-right:1px solid #1b1f2a;
  }
  .tabbar{display:none}
  .topbar{padding:14px 32px;background:rgba(244,245,248,.85)}
  .topbar-title{font-size:17px}
  .view{padding:22px 32px 40px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .grid-2{grid-template-columns:1.15fr .85fr;gap:18px}
  .pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .cart{position:sticky;top:86px;max-height:calc(100vh - 116px);max-height:calc(100dvh - 116px)}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .view-head h1{font-size:24px}
}
@media (min-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">A</div>
      <div>
        <strong>Athenea</strong>
        <span>Librería &amp; Accesorios</span>
      </div>
    </div>
    <nav class="nav" id="nav-desktop"></nav>
    <div class="sidebar-foot">
      <div class="mini-card">
        <span>Estado de caja</span>
        <strong id="cash-mini">ABIERTA</strong>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">Resumen</div>
      <div class="topbar-actions">
        <button class="icon-btn" data-action="go" data-view="pos" aria-label="Nueva venta" id="quick-sale"></button>
        <div class="avatar">MG</div>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <!-- TABBAR -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================
   ICONOS (SVG inline · sin emojis)
   ========================================================= */
const ICONS = {
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  cart:'<circle cx="9.5" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.2l2.3 11.1a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L20.5 7H6"/>',
  box:'<path d="M21 8.5v7a2 2 0 0 1-1.1 1.8l-6.8 3.4a2 2 0 0 1-1.8 0l-6.8-3.4A2 2 0 0 1 3.4 15.5v-7a2 2 0 0 1 1.1-1.8l6.8-3.4a2 2 0 0 1 1.8 0l6.8 3.4A2 2 0 0 1 21 8.5Z"/><path d="m3.8 7.5 8.2 4 8.2-4"/><path d="M12 21v-9.5"/>',
  wallet:'<rect x="2.5" y="6" width="19" height="13.5" rx="3"/><path d="M2.5 10.5h19"/><circle cx="17" cy="15" r="1.2"/>',
  chart:'<path d="M3 20h18"/><rect x="5" y="11" width="3.6" height="6" rx="1.2"/><rect x="10.2" y="6" width="3.6" height="11" rx="1.2"/><rect x="15.4" y="9" width="3.6" height="8" rx="1.2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  close:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  trend:'<path d="M3 17l6-6 4 4 7.5-7.5"/><path d="M14.5 7.5H21v6.5"/>',
  coins:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10"/><path d="M14.6 9.3a2.8 2.8 0 0 0-5.2 1c0 2.3 5.2 1.1 5.2 3.4a2.8 2.8 0 0 1-5.2 1"/>',
  chevron:'<path d="m9.5 6 6 6-6 6"/>',
  arrowUp:'<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>',
  arrowDown:'<path d="M12 5v14"/><path d="m6 13 6 6 6-6"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11.5v5"/><path d="M12 8.2h.01"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.6h2"/>',
  tag:'<path d="M12.6 3H20v7.4L10 20.4 3.6 14Z"/><circle cx="16.4" cy="6.6" r="1.3"/>',
  filter:'<path d="M3 5.5h18"/><path d="M6.5 12h11"/><path d="M10 18.5h4"/>'
};
function icon(name, cls){
  return '<svg class="ic ' + (cls||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name]||'') + '</svg>';
}

/* =========================================================
   UTILIDADES
   ========================================================= */
const money = n => '$' + (Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = () => new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
const hora = ts => new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const areaName = a => a === 'libreria' ? 'Librería' : 'Accesorios';

/* =========================================================
   ESTADO
   ========================================================= */
let _id = 1;
const nid = () => _id++;

const state = {
  view:'dashboard',
  area:'todas',
  q:'',
  cart:[],
  discount:0,
  cartOpen:false,
  modal:null,
  cashInitial:500,
  products:[],
  sales:[],
  movements:[]
};

/* ---- Semilla de productos ---- */
function seedProducts(){
  const raw = [
    ['Cuaderno profesional 100 hojas','libreria','Cuadernos',18,32,45],
    ['Bolígrafo tinta negra','libreria','Escritura',3.5,9,120],
    ['Lápiz grafito HB','libreria','Escritura',2,5,180],
    ['Colores x12','libreria','Escolar',28,52,30],
    ['Resma papel carta 500 hojas','libreria','Papelería',95,139,14],
    ['Regla 30 cm','libreria','Escolar',6,14,7],
    ['Mochila escolar reforzada','libreria','Mochilas',180,299,4],
    ['Marcadores permanentes x4','libreria','Escritura',22,42,26],
    ['Funda silicona iPhone 13','accesorios','Fundas',35,89,22],
    ['Cargador 20W USB-C','accesorios','Cargadores',60,129,16],
    ['Audífonos Bluetooth','accesorios','Audio',210,399,9],
    ['Cable Lightning 1 m','accesorios','Cables',25,59,38],
    ['Protector vidrio templado','accesorios','Protectores',8,29,64],
    ['Power bank 10 000 mAh','accesorios','Energía',180,349,5],
    ['Soporte para auto magnético','accesorios','Soportes',40,99,11]
  ];
  state.products = raw.map(r => ({id:nid(), name:r[0], area:r[1], cat:r[2], cost:r[3], price:r[4], stock:r[5]}));
}
const productById = id => state.products.find(p => p.id === id);

/* ---- Semilla de ventas ---- */
function mkSale(lines, minutesAgo){
  const items = lines.map(([pid,qty]) => {
    const p = productById(pid);
    return {id:p.id, name:p.name, area:p.area, qty, price:p.price, cost:p.cost};
  });
  const subtotal = items.reduce((s,i) => s + i.price * i.qty, 0);
  const profit = items.reduce((s,i) => s + (i.price - i.cost) * i.qty, 0);
  const sale = {
    id:nid(),
    folio:'V-' + String(state.sales.length + 1).padStart(4,'0'),
    items, subtotal, discount:0, total:subtotal, profit,
    date: Date.now() - minutesAgo * 60000
  };
  state.sales.push(sale);
  items.forEach(i => { const p = productById(i.id); p.stock -= i.qty; });
  return sale;
}

function seedSales(){
  mkSale([[1,2],[2,5]], 190);
  mkSale([[9,1],[13,2]], 140);
  mkSale([[4,1],[3,3],[6,1]], 75);
  mkSale([[10,1],[12,1],[11,1]], 32);
  state.movements = [
    {id:nid(), type:'ingreso', concept:'Fondo de caja inicial', amount:500, date:Date.now() - 240*60000},
    {id:nid(), type:'egreso',  concept:'Compra de bolsas y empaque', amount:120, date:Date.now() - 150*60000}
  ];
  state.sales.forEach(s => {
    state.movements.push({id:nid(), type:'venta', concept:'Venta ' + s.folio, amount:s.total, date:s.date});
  });
}

/* =========================================================
   CÁLCULOS
   ========================================================= */
function cartTotals(){
  const subtotal = state.cart.reduce((s,c) => {
    const p = productById(c.id);
    return s + (p ? p.price * c.qty : 0);
  }, 0);
  const discount = subtotal * (state.discount || 0) / 100;
  return {subtotal, discount, total: subtotal - discount};
}
function cashBalance(){
  const ing = state.movements.filter(m => m.type !== 'egreso').reduce((s,m) => s + m.amount, 0);
  const egr = state.movements.filter(m => m.type === 'egreso').reduce((s,m) => s + m.amount, 0);
  return {ing, egr, saldo: state.cashInitial + ing - egr};
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
const NAV = [
  {id:'dashboard', label:'Resumen',    icon:'grid'},
  {id:'pos',       label:'Ventas',     icon:'cart'},
  {id:'inventory', label:'Inventario', icon:'box'},
  {id:'cash',      label:'Caja',       icon:'wallet'},
  {id:'reports',   label:'Reportes',   icon:'chart'}
];

function renderNav(){
  const titles = {dashboard:'Resumen', pos:'Punto de venta', inventory:'Inventario', cash:'Caja', reports:'Reportes'};
  document.getElementById('topbar-title').textContent = titles[state.view];

  document.getElementById('nav-desktop').innerHTML = NAV.map(n =>
    '<button class="nav-item ' + (state.view===n.id?'active':'') + '" data-action="go" data-view="' + n.id + '">' +
      icon(n.icon) + '<span>' + n.label + '</span>' +
    '</button>'
  ).join('');

  document.getElementById('tabbar').innerHTML = NAV.map(n =>
    '<button class="tab-item ' + (state.view===n.id?'active':'') + '" data-action="go" data-view="' + n.id + '">' +
      icon(n.icon) + '<span>' + n.label + '</span>' +
    '</button>'
  ).join('');

  const mini = document.getElementById('cash-mini');
  if(mini) mini.textContent = 'ABIERTA';
}

function go(view){
  state.view = view;
  state.q = '';
  state.cartOpen = false;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   COMPONENTES
   ========================================================= */
function kpi(label, value, ic, tone, hint){
  return '<div class="kpi">' +
    '<span class="ic-wrap ' + tone + '">' + icon(ic) + '</span>' +
    '<div>' +
      '<div class="kpi-label">' + label + '</div>' +
      '<div class="kpi-value">' + value + '</div>' +
    '</div>' +
    '<div class="kpi-hint">' + hint + '</div>' +
  '</div>';
}
function empty(msg, ic){
  return '<div class="empty">' + icon(ic||'box') + '<span>' + msg + '</span></div>';
}
function chip(id, label){
  return '<button class="chip ' + (state.area===id?'active':'') + '" data-action="area" data-area="' + id + '">' + label + '</button>';
}

/* =========================================================
   VISTA: DASHBOARD
   ========================================================= */
function viewDashboard(){
  const total  = state.sales.reduce((s,x) => s + x.total, 0);
  const profit = state.sales.reduce((s,x) => s + x.profit, 0);
  const units  = state.sales.reduce((s,x) => s + x.items.reduce((a,i) => a + i.qty, 0), 0);
  const valorInv = state.products.reduce((s,p) => s + p.cost * p.stock, 0);
  const low = state.products.filter(p => p.stock <= 8).sort((a,b) => a.stock - b.stock);
  const margen = total > 0 ? Math.round(profit / total * 100) : 0;

  const ultimas = state.sales.slice().sort((a,b) => b.date - a.date).slice(0,5).map(s =>
    '<div class="row">' +
      '<span class="ic-wrap brand" style="width:32px;height:32px;border-radius:10px">' + icon('cart') + '</span>' +
      '<div class="row-main">' +
        '<div class="row-title">' + s.folio + ' · ' + s.items.reduce((a,i)=>a+i.qty,0) + ' art.</div>' +
        '<div class="row-sub">' + hora(s.date) + ' · ' + (s.items[0] ? esc(s.items[0].name) : '') + (s.items.length>1 ? ' +' + (s.items.length-1) : '') + '</div>' +
      '</div>' +
      '<div class="row-value">' + money(s.total) + '</div>' +
    '</div>'
  ).join('');

  const lowHtml = low.length ? low.slice(0,5).map(p => {
    const tone = p.stock <= 0 ? 'danger' : 'warn';
    return '<div class="row" data-action="edit-product" data-id="' + p.id + '">' +
      '<div class="row-main">' +
        '<div class="row-title">' + esc(p.name) + '</div>' +
        '<div class="row-sub">' + areaName(p.area) + ' · ' + esc(p.cat) + '</div>' +
      '</div>' +
      '<span class="badge ' + tone + '">' + p.stock + ' u.</span>' +
    '</div>';
  }).join('') : empty('Todo el inventario está en orden','check');

  return '' +
  '<div class="view-head">' +
    '<div><h1>Resumen del día</h1><p class="sub">' + fecha() + '</p></div>' +
    '<button class="btn" data-action="go" data-view="pos">' + icon('plus') + 'Nueva venta</button>' +
  '</div>' +

  '<div class="kpis">' +
    kpi('Ventas de hoy', money(total), 'trend', 'brand', state.sales.length + ' tickets') +
    kpi('Utilidad bruta', money(profit), 'coins', 'ok', margen + '% de margen') +
    kpi('Artículos vendidos', units, 'box', 'warn', 'en el día') +
    kpi('Valor inventario', money(valorInv), 'chart', 'danger', state.products.length + ' productos') +
  '</div>' +

  '<div class="grid-2">' +
    '<section class="card">' +
      '<div class="card-head"><h2>Últimas ventas</h2>' +
        '<button class="link" data-action="go" data-view="reports">Ver reportes</button></div>' +
      '<div class="list">' + (ultimas || empty('Aún no hay ventas registradas','cart')) + '</div>' +
    '</section>' +
    '<section class="card">' +
      '<div class="card-head"><h2>Stock bajo</h2><span class="pill">' + low.length + '</span></div>' +
      '<div class="list">' + lowHtml + '</div>' +
    '</section>' +
  '</div>';
}

/* =========================================================
   VISTA: POS
   ========================================================= */
function productsHTML(){
  const q = state.q.toLowerCase().trim();
  let items = state.products.filter(p => state.area === 'todas' || p.area === state.area);
  if(q) items = items.filter(p => (p.name + ' ' + p.cat).toLowerCase().includes(q));

  if(!items.length) return empty('Sin resultados para tu búsqueda','search');

  return items.map(p =>
    '<button class="prod" data-action="add" data-id="' + p.id + '"' + (p.stock <= 0 ? ' disabled' : '') + '>' +
      '<span class="tag ' + p.area + '">' + areaName(p.area) + '</span>' +
      '<span class="p-name">' + esc(p.name) + '</span>' +
      '<span class="p-meta">' + esc(p.cat) + ' · ' + p.stock + ' disp.</span>' +
      '<span class="p-foot">' +
        '<span class="p-price">' + money(p.price) + '</span>' +
        '<span class="p-add">' + icon('plus') + '</span>' +
      '</span>' +
    '</button>'
  ).join('');
}

function cartItemsHTML(){
  if(!state.cart.length){
    return '<div class="cart-empty">' + icon('cart') + '<p>Carrito vacío</p><span>Agrega productos para comenzar</span></div>';
  }
  return state.cart.map(c => {
    const p = productById(c.id);
    if(!p) return '';
    return '<div class="cart-item">' +
      '<div class="ci-main">' +
        '<div class="ci-name">' + esc(p.name) + '</div>' +
        '<div class="ci-price">' + money(p.price) + ' c/u</div>' +
      '</div>' +
      '<div class="qty">' +
        '<button data-action="qty" data-id="' + p.id + '" data-delta="-1" aria-label="Quitar">' + icon('minus') + '</button>' +
        '<span>' + c.qty + '</span>' +
        '<button data-action="qty" data-id="' + p.id + '" data-delta="1" aria-label="Agregar">' + icon('plus') + '</button>' +
      '</div>' +
      '<div class="ci-total">' + money(p.price * c.qty) + '</div>' +
    '</div>';
  }).join('');
}

function cartFootHTML(){
  const t = cartTotals();
  return '' +
  '<div class="sum-row"><span>Subtotal</span><strong id="cart-sub">' + money(t.subtotal) + '</strong></div>' +
  '<div class="sum-row"><span>Descuento</span>' +
    '<span style="display:flex;align-items:center;gap:6px">' +
      '<input class="disc-field" id="discount-input" type="number" min="0" max="100" value="' + (state.discount||0) + '" aria-label="Descuento">' +
      '<strong style="font-size:12.5px">%</strong>' +
    '</span>' +
  '</div>' +
  '<div class="sum-row total"><span>Total</span><span id="cart-total">' + money(t.total) + '</span></div>' +
  '<button class="btn block lg" data-action="checkout">' + icon('check') + 'Cobrar</button>';
}

function viewPOS(){
  const t = cartTotals();
  const n = state.cart.reduce((s,c) => s + c.qty, 0);

  return '' +
  '<div class="view-head">' +
    '<div><h1>Punto de venta</h1><p class="sub">Toca un producto para agregarlo</p></div>' +
  '</div>' +

  '<div class="pos">' +
    '<div class="pos-left">' +
      '<div class="search">' + icon('search') +
        '<input id="pos-search" placeholder="Buscar producto, categoría..." value="' + esc(state.q) + '" autocomplete="off">' +
      '</div>' +
      '<div class="chips" id="pos-chips">' + chip('todas','Todas') + chip('libreria','Librería') + chip('accesorios','Accesorios') + '</div>' +
      '<div class="prod-grid" id="prod-grid">' + productsHTML() + '</div>' +
    '</div>' +

    '<aside class="cart ' + (state.cartOpen ? 'open' : '') + '" id="cart-panel">' +
      '<div class="cart-head">' +
        '<div class="cart-title">Carrito <span class="pill" id="cart-count">' + n + '</span></div>' +
        '<button class="icon-btn" data-action="close-cart" aria-label="Cerrar" style="width:32px;height:32px">' + icon('close') + '</button>' +
      '</div>' +
      '<div class="cart-items" id="cart-items">' + cartItemsHTML() + '</div>' +
      '<div class="cart-foot" id="cart-foot">' + cartFootHTML() + '</div>' +
    '</aside>' +
  '</div>' +

  '<button class="cart-bar ' + (n ? '' : 'hide') + '" id="cart-bar" data-action="open-cart">' +
    '<span class="cb-count">' + n + '</span>' +
    '<span class="cb-label">' + (n === 1 ? '1 artículo' : n + ' artículos') + '</span>' +
    '<span class="cb-total">' + money(t.total) + '</span>' +
  '</button>';
}

/* =========================================================
   VISTA: INVENTARIO
   ========================================================= */
function viewInventory(){
  const q = state.q.toLowerCase().trim();
  let items = state.products.filter(p => state.area === 'todas' || p.area === state.area);
  if(q) items = items.filter(p => (p.name + ' ' + p.cat).toLowerCase().includes(q));

  const rows = items.map(p => {
    const tone = p.stock <= 0 ? 'danger' : p.stock <= 8 ? 'warn' : 'ok';
    return '<div class="inv-row" data-action="edit-product" data-id="' + p.id + '" role="button" tabindex="0">' +
      '<div class="inv-main">' +
        '<div class="inv-name">' + esc(p.name) + '</div>' +
        '<div class="inv-meta"><span class="tag ' + p.area + '">' + areaName(p.area) + '</span>' + esc(p.cat) + '</div>' +
      '</div>' +
      '<div class="inv-right">' +
        '<strong>' + money(p.price) + '</strong>' +
        '<span class="badge ' + tone + '">' + p.stock + ' u.</span>' +
      '</div>' +
    '</div>';
  }).join('');

  return '' +
  '<div class="view-head">' +
    '<div><h1>Inventario</h1><p class="sub">' + state.products.length + ' productos registrados</p></div>' +
    '<button class="btn" data-action="new-product">' + icon('plus') + 'Nuevo</button>' +
  '</div>' +

  '<div class="search">' + icon('search') +
    '<input id="inv-search" placeholder="Buscar en el inventario..." value="' + esc(state.q) + '" autocomplete="off">' +
  '</div>' +
  '<div class="chips">' + chip('todas','Todas') + chip('libreria','Librería') + chip('accesorios','Accesorios') + '</div>' +

  '<div class="card">' + (rows || empty('Sin productos que coincidan','search')) + '</div>';
}

/* =========================================================
   VISTA: CAJA
   ========================================================= */
function viewCash(){
  const {ing, egr, saldo} = cashBalance();
  const movs = state.movements.slice().sort((a,b) => b.date - a.date).map(m => {
    const out = m.type === 'egreso';
    return '<div class="mov">' +
      '<span class="mov-icon ' + (out ? 'out' : 'in') + '">' + icon(out ? 'arrowDown' : 'arrowUp') + '</span>' +
      '<div class="row-main">' +
        '<div class="row-title">' + esc(m.concept) + '</div>' +
        '<div class="row-sub">' + hora(m.date) + ' · ' + (out ? 'Egreso' : 'Ingreso') + '</div>' +
      '</div>' +
      '<div class="mov-amount ' + (out ? 'out' : 'in') + '">' + (out ? '−' : '+') + money(m.amount) + '</div>' +
    '</div>';
  }).join('');

  return '' +
  '<div class="view-head">' +
    '<div><h1>Caja</h1><p class="sub">Movimientos y arqueo del día</p></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn ghost" data-action="new-movement" data-kind="egreso">' + icon('arrowDown') + 'Egreso</button>' +
      '<button class="btn" data-action="new-movement" data-kind="ingreso">' + icon('arrowUp') + 'Ingreso</button>' +
    '</div>' +
  '</div>' +

  '<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    kpi('Saldo inicial', money(state.cashInitial), 'wallet', 'brand', 'Fondo de apertura') +
    kpi('Ingresos', money(ing), 'arrowUp', 'ok', 'Ventas + entradas') +
    kpi('Egresos', money(egr), 'arrowDown', 'danger', 'Salidas de efectivo') +
    kpi('Saldo en caja', money(saldo), 'coins', 'warn', 'Disponible ahora') +
  '</div>' +

  '<section class="card" style="margin-top:4px">' +
    '<div class="card-head"><h2>Movimientos recientes</h2><span class="pill">' + state.movements.length + '</span></div>' +
    '<div class="list">' + (movs || empty('Sin movimientos registrados','wallet')) + '</div>' +
  '</section>';
}

/* =========================================================
   VISTA: REPORTES
   ========================================================= */
function viewReports(){
  const byArea = {libreria:0, accesorios:0};
  const map = {};
  let total = 0, profit = 0;

  state.sales.forEach(s => {
    total += s.total;
    profit += s.profit;
    s.items.forEach(i => {
      byArea[i.area] += i.price * i.qty;
      if(!map[i.name]) map[i.name] = {name:i.name, qty:0, total:0};
      map[i.name].qty += i.qty;
      map[i.name].total += i.price * i.qty;
    });
  });

  const top = Object.values(map).sort((a,b) => b.total - a.total).slice(0,5);
  const max = Math.max(byArea.libreria, byArea.accesorios, 1);
  const pctLib = Math.round(byArea.libreria / max * 100);
  const pctAcc = Math.round(byArea.accesorios / max * 100);
  const margen = total > 0 ? Math.round(profit / total * 100) : 0;

  const topHtml = top.length ? top.map((p,idx) =>
    '<div class="row">' +
      '<span class="pill" style="background:#f0f1f5;color:#6b7280">' + (idx+1) + '</span>' +
      '<div class="row-main">' +
        '<div class="row-title">' + esc(p.name) + '</div>' +
        '<div class="row-sub">' + p.qty + ' unidades vendidas</div>' +
      '</div>' +
      '<div class="row-value">' + money(p.total) + '</div>' +
    '</div>'
  ).join('') : empty('Aún no hay ventas para analizar','chart');

  return '' +
  '<div class="view-head">' +
    '<div><h1>Reportes</h1><p class="sub">Rendimiento del negocio</p></div>' +
  '</div>' +

  '<div class="kpis">' +
    kpi('Ventas totales', money(total), 'trend', 'brand', state.sales.length + ' tickets') +
    kpi('Utilidad bruta', money(profit), 'coins', 'ok', margen + '% de margen') +
    kpi('Ticket promedio', money(state.sales.length ? total/state.sales.length : 0), 'cart', 'warn', 'por venta') +
    kpi('Productos activos', state.products.length, 'box', 'danger', 'en catálogo') +
  '</div>' +

  '<div class="grid-2">' +
    '<section class="card">' +
      '<div class="card-head"><h2>Ventas por área</h2></div>' +
      '<div style="padding:6px 16px 18px">' +
        '<div class="bar-row">' +
          '<div class="bar-head"><span>Librería</span><strong>' + money(byArea.libreria) + '</strong></div>' +
          '<div class="bar-track"><div class="bar-fill lib" style="width:' + pctLib + '%"></div></div>' +
        '</div>' +
        '<div class="bar-row">' +
          '<div class="bar-head"><span>Accesorios</span><strong>' + money(byArea.accesorios) + '</strong></div>' +
          '<div class="bar-track"><div class="bar-fill acc" style="width:' + pctAcc + '%"></div></div>' +
        '</div>' +
      '</div>' +
    '</section>' +

    '<section class="card">' +
      '<div class="card-head"><h2>Top productos</h2></div>' +
      '<div class="list">' + topHtml + '</div>' +
    '</section>' +
  '</div>';
}

const views = {
  dashboard: viewDashboard,
  pos: viewPOS,
  inventory: viewInventory,
  cash: viewCash,
  reports: viewReports
};

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

  document.getElementById('view').innerHTML = views[state.view]();
  renderNav();
  renderModal();

  document.getElementById('backdrop').classList.toggle('show', state.cartOpen && state.view === 'pos');

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      try{ if(selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); }catch(e){}
    }
  }
}

/* ---------- Actualización parcial del carrito ---------- */
function renderCart(){
  const items = document.getElementById('cart-items');
  if(!items) return;
  items.innerHTML = cartItemsHTML();
  document.getElementById('cart-foot').innerHTML = cartFootHTML();
  const n = state.cart.reduce((s,c) => s + c.qty, 0);
  const count = document.getElementById('cart-count');
  if(count) count.textContent = n;

  const bar = document.getElementById('cart-bar');
  if(bar){
    const t = cartTotals();
    bar.classList.toggle('hide', n === 0);
    bar.querySelector('.cb-count').textContent = n;
    bar.querySelector('.cb-label').textContent = n === 1 ? '1 artículo' : n + ' artículos';
    bar.querySelector('.cb-total').textContent = money(t.total);
  }
}

function updateTotals(){
  const t = cartTotals();
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('cart-sub', money(t.subtotal));
  set('cart-total', money(t.total));
  const bar = document.getElementById('cart-bar');
  if(bar) bar.querySelector('.cb-total').textContent = money(t.total);
}

/* =========================================================
   ACCIONES
   ========================================================= */
function addToCart(id){
  const p = productById(id);
  if(!p) return;
  const inCart = state.cart.find(c => c.id === id);
  const qty = inCart ? inCart.qty : 0;
  if(qty >= p.stock){ toast('Stock insuficiente para ' + p.name, 'info'); return; }
  if(inCart) inCart.qty++;
  else state.cart.push({id, qty:1});
  renderCart();
}

function changeQty(id, delta){
  const item = state.cart.find(c => c.id === id);
  if(!item) return;
  const p = productById(id);
  const next = item.qty + delta;
  if(next <= 0){
    state.cart = state.cart.filter(c => c.id !== id);
  } else if(next > p.stock){
    toast('Solo hay ' + p.stock + ' unidades disponibles', 'info');
    return;
  } else {
    item.qty = next;
  }
  renderCart();
}

function checkout(){
  if(!state.cart.length){ toast('El carrito está vacío', 'info'); return; }
  const t = cartTotals();
  const items = state.cart.map(c => {
    const p = productById(c.id);
    return {id:p.id, name:p.name, area:p.area, qty:c.qty, price:p.price, cost:p.cost};
  });
  const profit = items.reduce((s,i) => s + (i.price - i.cost) * i.qty, 0) - t.discount;

  const sale = {
    id:nid(),
    folio:'V-' + String(state.sales.length + 1).padStart(4,'0'),
    items,
    subtotal:t.subtotal,
    discount:t.discount,
    total:t.total,
    profit,
    date:Date.now()
  };
  state.sales.unshift(sale);
  items.forEach(i => { const p = productById(i.id); if(p) p.stock -= i.qty; });
  state.movements.unshift({id:nid(), type:'venta', concept:'Venta ' + sale.folio, amount:t.total, date:Date.now()});

  state.cart = [];
  state.discount = 0;
  state.cartOpen = false;
  render();
  toast('Venta ' + sale.folio + ' registrada · ' + money(t.total));
}

/* ---------- Modales ---------- */
function renderModal(){
  const root = document.getElementById('modal-root');
  if(!state.modal){ root.innerHTML = ''; return; }

  if(state.modal.type === 'product'){
    const p = state.modal.id ? productById(state.modal.id) : null;
    root.innerHTML =
    '<div class="modal">' +
      '<div class="modal-backdrop" data-action="close-modal"></div>' +
      '<div class="modal-card">' +
        '<div class="modal-head">' +
          '<h2>' + (p ? 'Editar producto' : 'Nuevo producto') + '</h2>' +
          '<button class="icon-btn" data-action="close-modal" style="width:32px;height:32px">' + icon('close') + '</button>' +
        '</div>' +
        '<div class="field">' +
          '<label>Nombre del producto</label>' +
          '<input id="f-name" value="' + esc(p ? p.name : '') + '" placeholder="Ej. Cuaderno profesional">' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label>Área</label>' +
            '<select id="f-area">' +
              '<option value="libreria"' + (p && p.area === 'libreria' ? ' selected' : '') + '>Librería</option>' +
              '<option value="accesorios"' + (p && p.area === 'accesorios' ? ' selected' : '') + '>Accesorios</option>' +
            '</select>' +
          '</div>' +
          '<div class="field">' +
            '<label>Categoría</label>' +
            '<input id="f-cat" value="' + esc(p ? p.cat : '') + '" placeholder="Ej. Cuadernos">' +
          '</div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label>Precio de compra</label>' +
            '<input id="f-cost" type="number" min="0" step="0.01" value="' + (p ? p.cost : '') + '" placeholder="0.00">' +
          '</div>' +
          '<div class="field">' +
            '<label>Precio de venta</label>' +
            '<input id="f-price" type="number" min="0" step="0.01" value="' + (p ? p.price : '') + '" placeholder="0.00">' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>Existencias</label>' +
          '<input id="f-stock" type="number" min="0" step="1" value="' + (p ? p.stock : '') + '" placeholder="0">' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn ghost" data-action="close-modal">Cancelar</button>' +
          '<button class="btn" data-action="save-product">' + icon('check') + 'Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  if(state.modal.type === 'movement'){
    const kind = state.modal.kind || 'ingreso';
    root.innerHTML =
    '<div class="modal">' +
      '<div class="modal-backdrop" data-action="close-modal"></div>' +
      '<div class="modal-card">' +
        '<div class="modal-head">' +
          '<h2>Registrar movimiento</h2>' +
          '<button class="icon-btn" data-action="close-modal" style="width:32px;height:32px">' + icon('close') + '</button>' +
        '</div>' +
        '<div class="field">' +
          '<label>Tipo</label>' +
          '<select id="m-type">' +
            '<option value="ingreso"' + (kind === 'ingreso' ? ' selected' : '') + '>Ingreso</option>' +
            '<option value="egreso"' + (kind === 'egreso' ? ' selected' : '') + '>Egreso</option>' +
          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label>Concepto</label>' +
          '<input id="m-concept" placeholder="Ej. Compra de bolsas">' +
        '</div>' +
        '<div class="field">' +
          '<label>Monto</label>' +
          '<input id="m-amount" type="number" min="0" step="0.01" placeholder="0.00">' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn ghost" data-action="close-modal">Cancelar</button>' +
          '<button class="btn" data-action="save-movement">' + icon('check') + 'Registrar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
}

function saveProduct(){
  const name = val('f-name').trim();
  const area = val('f-area');
  const cat = val('f-cat').trim() || 'General';
  const cost = Number(val('f-cost')) || 0;
  const price = Number(val('f-price')) || 0;
  const stock = Math.max(0, Math.round(Number(val('f-stock')) || 0));

  if(!name){ toast('Escribe un nombre para el producto', 'info'); return; }
  if(price <= 0){ toast('El precio de venta debe ser mayor a 0', 'info'); return; }

  if(state.modal.id){
    const p = productById(state.modal.id);
    Object.assign(p, {name, area, cat, cost, price, stock});
    toast('Producto actualizado');
  } else {
    state.products.push({id:nid(), name, area, cat, cost, price, stock});
    toast('Producto agregado al inventario');
  }
  state.modal = null;
  render();
}

function saveMovement(){
  const type = val('m-type');
  const concept = val('m-concept').trim() || (type === 'egreso' ? 'Egreso de caja' : 'Ingreso de caja');
  const amount = Number(val('m-amount')) || 0;
  if(amount <= 0){ toast('Ingresa un monto válido', 'info'); return; }

  state.movements.unshift({id:nid(), type, concept, amount, date:Date.now()});
  state.modal = null;
  render();
  toast('Movimiento registrado · ' + money(amount));
}

/* =========================================================
   TOAST
   ========================================================= */
function toast(msg, tone){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = icon(tone === 'info' ? 'info' : 'check') + '<span>' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    setTimeout(() => el.remove(), 320);
  }, 2400);
}

/* =========================================================
   EVENTOS
   ========================================================= */
function onAction(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  switch(a){
    case 'go': go(el.dataset.view); break;
    case 'area':
      state.area = el.dataset.area;
      if(state.view === 'pos'){
        document.querySelectorAll('#pos-chips .chip').forEach(c =>
          c.classList.toggle('active', c.dataset.area === state.area));
        document.getElementById('prod-grid').innerHTML = productsHTML();
      } else {
        render();
      }
      break;
    case 'add': addToCart(Number(el.dataset.id)); break;
    case 'qty': changeQty(Number(el.dataset.id), Number(el.dataset.delta)); break;
    case 'open-cart':
      state.cartOpen = true;
      document.getElementById('cart-panel').classList.add('open');
      document.getElementById('backdrop').classList.add('show');
      break;
    case 'close-cart':
      state.cartOpen = false;
      document.getElementById('cart-panel').classList.remove('open');
      document.getElementById('backdrop').classList.remove('show');
      break;
    case 'checkout': checkout(); break;
    case 'new-product':
      state.modal = {type:'product', id:null};
      renderModal();
      break;
    case 'edit-product':
      state.modal = {type:'product', id:Number(el.dataset.id)};
      renderModal();
      break;
    case 'save-product': saveProduct(); break;
    case 'new-movement':
      state.modal = {type:'movement', kind: el.dataset.kind};
      renderModal();
      break;
    case 'save-movement': saveMovement(); break;
    case 'close-modal':
      state.modal = null;
      renderModal();
      break;
  }
}

document.getElementById('view').addEventListener('click', onAction);
document.getElementById('modal-root').addEventListener('click', onAction);
document.getElementById('nav-desktop').addEventListener('click', onAction);
document.getElementById('tabbar').addEventListener('click', onAction);
document.getElementById('backdrop').addEventListener('click', () => {
  state.cartOpen = false;
  const panel = document.getElementById('cart-panel');
  if(panel) panel.classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
});

/* Inputs: búsqueda POS (sin re-render completo) y descuento */
document.getElementById('view').addEventListener('input', e => {
  const id = e.target.id;

  if(id === 'pos-search'){
    state.q = e.target.value;
    const grid = document.getElementById('prod-grid');
    if(grid) grid.innerHTML = productsHTML();
  }

  if(id === 'inv-search'){
    state.q = e.target.value;
    // re-render con restauración de foco
    render();
  }

  if(id === 'discount-input'){
    const v = Math.min(100, Math.max(0, Number(e.target.value) || 0));
    state.discount = v;
    updateTotals();
  }
});

/* Cerrar modales / carrito con ESC */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(state.modal){ state.modal = null; renderModal(); }
    else if(state.cartOpen){
      state.cartOpen = false;
      const p = document.getElementById('cart-panel');
      if(p) p.classList.remove('open');
      document.getElementById('backdrop').classList.remove('show');
    }
  }
});

/* =========================================================
   INICIALIZACIÓN
   ========================================================= */
seedProducts();
seedSales();

document.getElementById('quick-sale').innerHTML = icon('cart');

render();

/* Animación inicial de las barras del reporte */
const origRender = render;
render = function(){
  origRender();
  if(state.view === 'reports'){
    requestAnimationFrame(() => {
      document.querySelectorAll('.bar-fill').forEach(b => {
        const w = b.style.width;
        b.style.width = '0';
        requestAnimationFrame(() => { b.style.width = w; });
      });
    });
  }
};
</script>

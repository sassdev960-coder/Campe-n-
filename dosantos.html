<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Do Santos FC — Sistema de Gestión</title>
<style>
:root{--brand-dark:#001838;--brand-blue:#00AEEF;--brand-blue-hover:#0095cc;--bg-body:#f4f7f9;--text-main:#1e293b;--text-muted:#64748b;--border-light:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg-body);color:var(--text-main);font-size:14px;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;overflow:hidden}
aside{width:270px;background:var(--brand-dark);color:#e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;box-shadow:4px 0 15px rgba(0,0,0,.1);z-index:10}
aside .logo{padding:24px 20px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg,rgba(0,174,239,0.12) 0%,transparent 100%)}
aside .logo .crest-img{width:130px;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 16px rgba(0,174,239,.3))}
aside .logo .brand-name{font-weight:800;font-size:20px;color:#ffffff;letter-spacing:1.5px;line-height:1.1}
aside .logo .brand-sub{display:block;color:var(--brand-blue);font-size:10px;font-weight:700;margin-top:6px;letter-spacing:1px;text-transform:uppercase}
aside nav{flex:1;overflow-y:auto;padding:12px 12px 24px}
aside nav::-webkit-scrollbar{width:6px}
aside nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
aside nav .group{color:#64748b;font-size:10px;text-transform:uppercase;padding:18px 10px 8px;font-weight:700;letter-spacing:1px}
aside nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#cbd5e1;text-decoration:none;border-radius:8px;font-size:13.5px;cursor:pointer;margin-bottom:2px;font-weight:500;transition:all .2s}
aside nav a svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;opacity:.7;transition:all .2s}
aside nav a:hover{background:rgba(255,255,255,.05);color:#ffffff}
aside nav a:hover svg{opacity:1}
aside nav a.active{background:var(--brand-blue);color:#ffffff;font-weight:600;box-shadow:0 4px 12px rgba(0,174,239,.4)}
aside nav a.active svg{opacity:1;stroke-width:2.5}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
header{background:#ffffff;padding:16px 28px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:5}
header h1{font-size:20px;font-weight:700;color:var(--brand-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .actions{display:flex;gap:10px;align-items:center}
#content{flex:1;padding:28px;overflow-y:auto}
.card{background:#ffffff;border-radius:12px;padding:24px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);margin-bottom:20px;border:1px solid rgba(226,232,240,.5)}
.card h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:#ffffff;border-radius:12px;padding:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);border-left:4px solid var(--brand-blue);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:var(--brand-blue);opacity:.05;border-radius:50%;transform:translate(20px,-20px)}
.kpi .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.kpi .value{font-size:28px;font-weight:800;line-height:1;color:var(--brand-dark)}
.kpi .sub{font-size:12px;color:#94a3b8;margin-top:6px;font-weight:500}
table{width:100%;border-collapse:collapse;background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--border-light)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border-light);font-size:13.5px;vertical-align:middle}
th{background:#f8fafc;font-weight:700;color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 6px rgba(0,0,0,.1)}
.btn-primary{background:var(--brand-blue);color:#ffffff}
.btn-primary:hover{background:var(--brand-blue-hover)}
.btn-success{background:#10b981;color:#ffffff}
.btn-danger{background:#ef4444;color:#ffffff}
.btn-secondary{background:#e2e8f0;color:var(--text-main)}
.btn-outline{background:transparent;border:1px solid var(--border-light);color:var(--text-main)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.toolbar .search{padding:10px 16px;border:1px solid var(--border-light);border-radius:8px;font-size:13.5px;min-width:280px;outline:none;transition:border .2s}
.toolbar .search:focus{border-color:var(--brand-blue);box-shadow:0 0 0 3px rgba(0,174,239,.1)}
.hero-banner{background:linear-gradient(135deg,var(--brand-dark) 0%,#002b5e 100%);border-radius:16px;padding:32px;color:#ffffff;display:flex;align-items:center;gap:32px;margin-bottom:24px;box-shadow:0 10px 25px rgba(0,24,56,.2);position:relative;overflow:hidden}
.hero-banner::after{content:'';position:absolute;right:-50px;top:-50px;width:300px;height:300px;background:var(--brand-blue);border-radius:50%;opacity:.1;filter:blur(40px)}
.hero-logo{width:140px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3));z-index:1;position:relative}
.hero-text{z-index:1;position:relative}
.hero-text h2{font-size:32px;font-weight:800;letter-spacing:1px;margin-bottom:6px;color:#ffffff}
.hero-text p{font-size:14px;color:var(--brand-blue);text-transform:uppercase;letter-spacing:2px;font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,24,56,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.hidden{display:none}
.modal-content{background:#ffffff;border-radius:16px;padding:28px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.modal-content h2{font-size:20px;font-weight:700;margin-bottom:24px;color:var(--brand-dark)}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 14px;border:1px solid var(--border-light);border-radius:8px;font-size:14px;font-family:inherit;background:#f8fafc;transition:all .2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--brand-blue);background:#ffffff;box-shadow:0 0 0 3px rgba(0,174,239,.1)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}.hero-banner{flex-direction:column;text-align:center}}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-blue{background:#e0f2fe;color:#0369a1}
.badge-gray{background:#f1f5f9;color:#475569}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.empty{text-align:center;padding:40px;color:#94a3b8;font-style:italic}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mb-2{margin-bottom:16px}.mt-2{margin-top:16px}
.text-muted{color:var(--text-muted)}.w-100{width:100%}
.player-photo{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f1f5f9;border:1px solid var(--border-light);display:inline-block;vertical-align:middle}
.player-photo-lg{width:130px;height:130px;border-radius:12px;object-fit:cover;background:#f1f5f9;border:3px solid #ffffff;box-shadow:0 4px 12px rgba(0,0,0,.1);display:inline-block}
.photo-placeholder{display:inline-flex;align-items:center;justify-content:center;background:#f1f5f9;color:#94a3b8;font-size:11px;border:2px dashed #cbd5e1;font-weight:600;text-align:center}
.kardex-header{display:flex;gap:24px;margin-bottom:24px;align-items:center;background:linear-gradient(to right,#f8fafc,#ffffff);padding:20px;border-radius:12px;border:1px solid var(--border-light)}
.kardex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kardex-item{background:#ffffff;padding:14px;border-radius:8px;border:1px solid var(--border-light);box-shadow:0 1px 2px rgba(0,0,0,.02)}
.kardex-item .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.kardex-item .val{font-size:14px;font-weight:600;color:var(--brand-dark)}
.info-box{background:#f0f9ff;border-left:4px solid var(--brand-blue);padding:16px;border-radius:8px;margin-bottom:20px;font-size:13.5px;color:#0369a1;line-height:1.5}
.warning-box{background:#fffbeb;border-left:4px solid #f59e0b;padding:16px;border-radius:8px;margin-bottom:20px;font-size:13.5px;color:#92400e}
.search-hero{background:linear-gradient(135deg,var(--brand-dark),#003b7a);color:#ffffff;padding:40px;border-radius:16px;margin-bottom:28px;box-shadow:0 10px 25px rgba(0,24,56,.2)}
.search-hero h2{color:#ffffff;margin-bottom:8px;font-size:24px;font-weight:800}
.search-hero p{color:var(--brand-blue);font-size:14px;margin-bottom:24px;font-weight:500}
.search-hero input{width:100%;padding:16px 20px;border:none;border-radius:10px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.15);outline:none;font-family:inherit}
.pos-layout{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start}
.pos-products{background:#ffffff;border-radius:12px;padding:20px;border:1px solid var(--border-light)}
.pos-cart{background:#ffffff;border-radius:12px;padding:20px;border:1px solid var(--border-light);position:sticky;top:20px}
.pos-cart-items{min-height:150px;max-height:400px;overflow-y:auto;margin:16px 0;border-top:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:8px 0}
.pos-item{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-bottom:1px dashed var(--border-light);font-size:13px;gap:10px}
.pos-item:last-child{border-bottom:none}
.pos-total{font-size:24px;font-weight:800;padding-top:16px;margin-bottom:16px;color:var(--brand-dark);text-align:right}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.product-card{background:#f8fafc;border:1px solid var(--border-light);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;text-align:center}
.product-card:hover{background:#ffffff;border-color:var(--brand-blue);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,174,239,.15)}
.product-card .pname{font-weight:700;font-size:13px;margin-bottom:6px;color:var(--brand-dark)}
.product-card .pprice{color:var(--brand-blue);font-weight:800;font-size:14px}
.product-card .pstock{color:var(--text-muted);font-size:11px;margin-top:4px}
.chart-bar{background:#e2e8f0;border-radius:6px;height:10px;overflow:hidden;margin-top:6px}
.chart-bar div{background:var(--brand-blue);height:100%;border-radius:6px}
@media print{.no-print{display:none!important}body{background:white}#content{padding:0}}

/* ============ RESPONSIVE SIDEBAR ============ */
.hamburger{display:none;background:transparent;border:none;cursor:pointer;padding:6px;color:var(--brand-dark)}
.hamburger svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(6,18,41,.55);backdrop-filter:blur(2px);z-index:9}
@media(max-width:768px){
  .hamburger{display:inline-flex;align-items:center;justify-content:center}
  aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  body.sidebar-open aside{transform:translateX(0)}
  body.sidebar-open .sidebar-overlay{display:block}
  header{padding:12px 16px}
  #content{padding:16px}
  .kpis{grid-template-columns:1fr}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr}
  .hero-banner{padding:20px}
  .hero-logo{width:90px}
  .hero-text h2{font-size:22px}
}
/* ============ DASHBOARD PREMIUM ============ */
.dash{display:flex;flex-direction:column;gap:20px}
.dash-hero{position:relative;border-radius:20px;overflow:hidden;padding:36px 40px;color:#ffffff;
  background:linear-gradient(135deg,#061229 0%,#0b3a6f 55%,#001838 100%);
  box-shadow:0 20px 50px -12px rgba(6,18,41,.45);isolation:isolate}
.dash-hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(900px 300px at 80% -20%,rgba(0,212,255,.22),transparent 60%),
            radial-gradient(600px 240px at -10% 110%,rgba(245,179,1,.12),transparent 60%);
  z-index:0}
.dash-hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 10px);
  border-radius:50%;z-index:0;opacity:.6}
.dash-hero__content{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.dash-hero__logo-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.dash-logo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,212,255,.35));animation:dashLogoIn .9s cubic-bezier(.2,.8,.2,1) both}
.dash-logo-fallback{display:none;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#0b3a6f);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:64px;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(0,212,255,.35)}
.dash-hero__text h1{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:3px;line-height:.95;margin:4px 0 8px;color:#ffffff}
.dash-eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#00d4ff;padding:6px 12px;border:1px solid rgba(0,212,255,.4);border-radius:999px;background:rgba(0,212,255,.08)}
.dash-hero__text p{font-size:14px;color:rgba(226,232,240,.8);margin:0}
.dash-hero__scoreboard{display:flex;gap:10px}
.score{display:flex;flex-direction:column;align-items:center;padding:14px 18px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);min-width:96px}
.score__num{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:#ffffff;letter-spacing:1px}
.score__lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#00d4ff;margin-top:6px}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.dash-kpis .kpi{border-left:4px solid var(--brand-blue);transition:box-shadow .2s}
.dash-kpis .kpi:hover{box-shadow:0 8px 18px -8px rgba(0,24,56,.18)}
.dash-kpis .kpi .label{text-transform:none;letter-spacing:.4px}
.dash-kpis .kpi .value{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px}
.dash-kpis .kpi .label{letter-spacing:1.5px}
.dash-section{background:#ffffff;border-radius:16px;padding:24px;border:1px solid rgba(226,232,240,.6);box-shadow:0 4px 12px -4px rgba(0,24,56,.08)}
.dash-section h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--brand-dark);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.dash-section h3 .dot{width:10px;height:10px;border-radius:50%;background:var(--brand-blue);box-shadow:0 0 0 4px rgba(0,174,239,.15)}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.dash-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dash-action{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border-radius:14px;
  background:linear-gradient(180deg,#ffffff,#f4f7f9);border:1px solid var(--border-light);cursor:pointer;transition:all .2s;text-align:left}
.dash-action:hover{border-color:var(--brand-blue);transform:translateY(-2px);box-shadow:0 8px 18px -6px rgba(0,174,239,.25)}
.dash-action .ic{width:36px;height:36px;border-radius:10px;background:rgba(0,174,239,.12);color:var(--brand-blue);display:flex;align-items:center;justify-content:center}
.dash-action .ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.dash-action .t{font-weight:700;font-size:13px;color:var(--brand-dark)}
.dash-action .s{font-size:11px;color:var(--text-muted)}
.dash-alerts{display:flex;flex-direction:column;gap:10px}
.dash-alert{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border-light);background:#ffffff}
.dash-alert.warn{border-left:4px solid #f59e0b;background:#fffbeb}
.dash-alert.danger{border-left:4px solid #ef4444;background:#fef2f2}
.dash-alert.info{border-left:4px solid var(--brand-blue);background:#f0f9ff}
.dash-alert .a-icon{font-size:20px}
.dash-alert .a-text{flex:1;font-size:13px;color:var(--text-main)}
.dash-alert .a-text b{color:var(--brand-dark)}
.dash-alert .a-cta{font-size:12px;font-weight:700;color:var(--brand-blue);cursor:pointer}
.dash-empty{color:#94a3b8;font-style:italic;font-size:13px;text-align:center;padding:12px}
@keyframes dashLogoIn{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes dashFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.dash-hero{animation:dashFadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.dash-kpis .kpi,.dash-section{animation:none}
@media(max-width:900px){
  .dash-hero__content{grid-template-columns:1fr;gap:18px;text-align:center}
  .dash-hero__logo-wrap{justify-content:center}
  .dash-hero__scoreboard{justify-content:center;flex-wrap:wrap}
  .dash-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .dash-hero{padding:24px 20px}
  .dash-hero__text h1{font-size:40px}
  .dash-logo,.dash-logo-fallback{width:110px;height:110px}
  .score{min-width:80px;padding:10px 12px}
  .score__num{font-size:22px}
}
@media (prefers-reduced-motion: reduce){
  .dash-hero,.dash-kpis .kpi,.dash-section,.dash-logo{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <aside class="no-print">
    <div class="logo">
      <img src="logo.png" alt="Do Santos FC" class="crest-img" onerror="this.style.display='none'">
      <div class="brand-name">DO SANTOS FC</div>
      <small class="brand-sub">Sistema de Gestión</small>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="sidebar-overlay no-print" onclick="toggleSidebar()"></div>
  <main>
    <header class="no-print">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Menú">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="pageTitle">Panel Principal</h1>
      <div class="actions">
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('fileImport').click()">📤 Importar</button>
        <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importarJSON(this)">
        <button class="btn btn-primary btn-sm" onclick="exportarJSON()">📥 Exportar JSON</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<div id="modal" class="hidden"></div>

<script>
// ============ DB (CLAVE NUEVA PARA FORZAR DATOS LIMPIOS) ============
const DB_KEY = 'dosantos_system_db_v4';

// ============ ICONOS ============

let db = null;
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) db = JSON.parse(raw);
    else db = seedDB();
  }catch(e){ db = seedDB(); }
  // Asegurar que todas las claves existan
  const seed = seedDB();
  for(const k in seed){
    if(!(k in db) || db[k] === null || db[k] === undefined){
      db[k] = JSON.parse(JSON.stringify(seed[k]));
    }
  }
  // Asegurar que deportistas sea array
  if(!Array.isArray(db.deportistas)) db.deportistas = seed.deportistas;
  saveDB();
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ console.warn('Storage lleno', e); } }
function uid(p){ return (p||'id')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

// ============ HELPERS ============
function refLabel(source, id){
  if(!id) return '-';
  const list = (db && db[source]) || [];
  const item = list.find(x => x.id === id);
  if(!item) return id;
  if(item.nombres) return (item.nombres + ' ' + (item.apellidos||'')).trim();
  return item.nombre || item.titulo || id;
}
function fmtBs(n){ return 'Bs ' + (Number(n)||0).toFixed(2); }
function fmtDate(d){ if(!d) return '-'; try{ return new Date(d+'T00:00:00').toLocaleDateString('es-BO'); }catch(e){ return d; } }
function fmtDateTime(iso){ if(!iso) return '-'; try{ const d = new Date(iso); return d.toLocaleDateString('es-BO') + ' ' + d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function currentMonth(){ return new Date().toISOString().slice(0,7); }

function photoHTML(p, size){
  size = size || '40px';
  if(p && p.foto) return '<img src="'+p.foto+'" class="player-photo" style="width:'+size+';height:'+size+'">';
  return '<span class="player-photo photo-placeholder" style="width:'+size+';height:'+size+'">4x4</span>';
}

function openModal(html){
  const m = document.getElementById('modal');
  m.innerHTML = '<div class="modal-content">' + html + '</div>';
  m.classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

function renderNav(){

function navigate(route){

    document.getElementById('pageTitle').textContent = r.title;
    document.getElementById('content').innerHTML = '';

    document.getElementById('content').innerHTML =
      '<div class="card"><h2>⚠️ Error al cargar la sección</h2>'+
      '<div class="warning-box">'+String(err && err.message || err)+'</div>'+
      '<button class="btn btn-primary" onclick="navigate(\'dashboard\')">Volver al Panel</button></div>';

// ============ ENTITY RENDERER ============
function renderEntity(entityKey, customActions){
  const cfg = ENT[entityKey];
  if(!cfg){ throw new Error('Entidad no configurada: '+entityKey); }
  const rows = Array.isArray(db[entityKey]) ? db[entityKey] : [];
  const fields = cfg.fields || [];
  let displayFields;

  if(entityKey === 'deportistas'){
    displayFields = fields.filter(function(f){
      return ['dni','nombres','apellidos','categoriaId','telefono','estado'].indexOf(f.name) !== -1;
    });
  } else {
    displayFields = fields.filter(function(f){ return f.type !== 'textarea' && f.type !== 'photo'; }).slice(0, 6);
  }

  let html = '<div class="toolbar">'+
    '<input class="search" placeholder="Buscar..." oninput="filterTable(this,\'tbl_'+entityKey+'\')">'+
    '<button class="btn btn-primary" onclick="entityCreate(\''+entityKey+'\')">+ Nuevo '+cfg.label+'</button>'+
    '</div>';

  html += '<table id="tbl_'+entityKey+'"><thead><tr>';
  if(entityKey === 'deportistas') html += '<th>Foto</th>';
  for(const f of displayFields){ html += '<th>'+f.label+'</th>'; }
  html += '<th style="text-align:right">Acciones</th></tr></thead><tbody>';

  if(rows.length === 0){
    html += '<tr><td colspan="'+(displayFields.length+2)+'"><div class="empty">Sin registros aún. Crea el primero.</div></td></tr>';
  } else {
    for(const row of rows){
      html += '<tr>';
      if(entityKey === 'deportistas') html += '<td>'+photoHTML(row, '40px')+'</td>';
      for(const f of displayFields){
        let v = row[f.name];
        if(f.source){ v = refLabel(f.source, v); }
        else if(f.type === 'date'){ v = fmtDate(v); }
        else if(v === undefined || v === null || v === ''){ v = '<span class="text-muted">-</span>'; }
        if(f.name === 'estado'){
          const cls = v === 'Activo' ? 'badge-green' : v === 'Inactivo' ? 'badge-yellow' : 'badge-red';
          v = '<span class="badge '+cls+'">'+v+'</span>';
        }
        html += '<td>'+v+'</td>';
      }
      let actions = '';
      if(customActions){ try{ actions = customActions(row) || ''; }catch(e){ console.warn('customAction failed', e); } }
      html += '<td style="text-align:right;white-space:nowrap">'+
        actions+
        '<button class="btn btn-secondary btn-xs" onclick="entityEdit(\''+entityKey+'\',\''+row.id+'\')">Editar</button> '+
        '<button class="btn btn-danger btn-xs" onclick="entityDelete(\''+entityKey+'\',\''+row.id+'\')">Eliminar</button>'+
      '</td></tr>';
    }
  }
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

function filterTable(input, tableId){
  const term = input.value.toLowerCase();
  document.querySelectorAll('#'+tableId+' tbody tr').forEach(function(r){
    r.style.display = r.textContent.toLowerCase().indexOf(term) !== -1 ? '' : 'none';
  });
}

// ============ DNI VALIDATION ============
function validarDNI(dni, excludeId){
  if(!dni) return true;
  const dup = db.deportistas.find(function(d){
    return d.dni === dni && d.id !== excludeId && d.estado === 'Activo';
  });
  return !dup;
}

function entityCreate(key){
  const cfg = ENT[key];
  showForm('Nuevo '+cfg.label, cfg.fields, null, function(data){
    if(key === 'deportistas'){
      if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
      if(!validarDNI(data.dni)){
        const dup = db.deportistas.find(function(d){ return d.dni === data.dni && d.estado === 'Activo'; });
        alert('❌ Ya existe un jugador ACTIVO con el DNI '+data.dni+':\n\n'+dup.nombres+' '+dup.apellidos+'\n\nDebe dar de BAJA al jugador existente.');
        return false;
      }
    }
    data.id = uid(key);
    if(!Array.isArray(db[key])) db[key] = [];
    db[key].push(data);
    saveDB();
    navigate(currentRoute);
  });
}

function entityEdit(key, id){
  const cfg = ENT[key];
  const item = db[key].find(function(x){ return x.id === id; });
  if(!item) return;
  showForm('Editar '+cfg.label, cfg.fields, item, function(data){
    if(key === 'deportistas'){
      if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
      if(!validarDNI(data.dni, id)){
        const dup = db.deportistas.find(function(d){ return d.dni === data.dni && d.id !== id && d.estado === 'Activo'; });
        alert('❌ Ya existe otro jugador ACTIVO con el DNI '+data.dni+':\n\n'+dup.nombres+' '+dup.apellidos);
        return false;
      }
    }
    Object.assign(item, data);
    saveDB();
    navigate(currentRoute);
  });
}

function entityDelete(key, id){
  if(!confirm('¿Eliminar este registro?')) return;
  db[key] = db[key].filter(function(x){ return x.id !== id; });
  saveDB();
  navigate(currentRoute);
}

// ============ FORM BUILDER ============
function buildForm(fields, values){
  let html = '<form id="dynForm"><div class="form-grid">';
  for(const f of fields){
    const isWide = f.type === 'textarea' || f.type === 'photo';
    html += '<div class="form-row" style="'+(isWide?'grid-column:1/-1':'')+'">';
    html += '<label>'+f.label+(f.required?' *':'')+'</label>';
    const val = values && values[f.name] !== undefined ? values[f.name] : (f.default !== undefined ? f.default : '');
    if(f.type === 'photo'){
      html += '<div style="display:flex;gap:12px;align-items:center">'+
        '<div id="photoPreview_'+f.name+'" style="width:90px;height:90px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center">'+
          (val ? '<img src="'+val+'" style="width:100%;height:100%;object-fit:cover">' : '<span style="font-size:10px;color:#94a3b8;text-align:center">Foto 4x4<br>fondo blanco</span>')+
        '</div>'+
        '<div style="flex:1"><input type="file" accept="image/*" onchange="handlePhotoUpload(\''+f.name+'\', this)">'+
        '<input type="hidden" name="'+f.name+'" value="'+(val||'')+'">'+
        '<div style="font-size:11px;color:#64748b;margin-top:4px">Se recorta a cuadrado automáticamente.</div></div>'+
      '</div>';
    } else if(f.type === 'select'){
      let opts = f.options || [];
      if(f.source){
        opts = (db[f.source]||[]).map(function(o){
          return {value:o.id, label:(o.nombres ? (o.nombres+' '+(o.apellidos||'')) : (o.nombre||o.titulo||o.id))};
        });
      } else if(opts.length && typeof opts[0] !== 'object'){
        opts = opts.map(function(o){ return {value:o, label:o}; });
      }
      html += '<select name="'+f.name+'" '+(f.required?'required':'')+'><option value="">-- Seleccionar --</option>';
      for(const o of opts){
        html += '<option value="'+o.value+'" '+(String(val)===String(o.value)?'selected':'')+'>'+o.label+'</option>';
      }
      html += '</select>';
    } else if(f.type === 'textarea'){
      html += '<textarea name="'+f.name+'" '+(f.required?'required':'')+'>'+(val||'')+'</textarea>';
    } else {
      const step = f.type==='number' ? 'any' : '';
      html += '<input type="'+(f.type||'text')+'" name="'+f.name+'" value="'+(val||'')+'" '+(f.required?'required':'')+' step="'+step+'">';
    }
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="row-flex" style="justify-content:flex-end;margin-top:16px">'+
    '<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'+
    '<button type="submit" class="btn btn-primary">Guardar</button>'+
  '</div></form>';
  return html;
}

function showForm(title, fields, values, onSave){
  openModal('<h2>'+title+'</h2>' + buildForm(fields, values));
  document.getElementById('dynForm').onsubmit = function(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    for(const f of fields){
      let v = fd.get(f.name);
      if(f.type === 'number') v = v === '' || v === null ? null : Number(v);
      data[f.name] = v;
    }
    if(onSave(data) !== false) closeModal();
  };
}

// ============ PHOTO CROP ============
function cropSquare(file, size){
  size = size || 300;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim)/2;
        const sy = (img.height - minDim)/2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,size,size);
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(fieldName, input){
  const file = input.files[0];
  if(!file) return;
  try{
    const base64 = await cropSquare(file);
    const form = document.getElementById('dynForm');
    const hidden = form.querySelector('input[name="'+fieldName+'"]');
    hidden.value = base64;
    const preview = document.getElementById('photoPreview_'+fieldName);
    preview.innerHTML = '<img src="'+base64+'" style="width:100%;height:100%;object-fit:cover">';
  }catch(e){ alert('Error al cargar la imagen'); }
}

function kpi(label, value, sub){
  return '<div class="kpi"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="sub">'+(sub||'')+'</div></div>';
}

function calcularDeudaTotal(){
  const mes = currentMonth();
  let total = 0;
  for(const d of db.deportistas.filter(function(x){ return x.estado === 'Activo'; })){
    const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
    const pagado = db.pagos.filter(function(p){ return p.deportistaId === d.id && p.mes === mes && !p.revertido; }).reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0);
    total += Math.max(0, tarifa - pagado);
  }
  return total;
}

function buscarJugadores(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if(term.length < 2){ results.innerHTML = '<div class="empty">Ingresa al menos 2 caracteres</div>'; return; }
  const found = db.deportistas.filter(function(d){
    const txt = ((d.dni||'')+' '+(d.nombres||'')+' '+(d.apellidos||'')+' '+(d.telefono||'')+' '+(d.tutor||'')).toLowerCase();
    return txt.indexOf(term) !== -1;
  });
  if(found.length === 0){ results.innerHTML = '<div class="empty">No se encontraron jugadores</div>'; return; }
  let html = '<div class="card"><h2>'+found.length+' resultado(s)</h2>'+
    '<table><thead><tr><th>Foto</th><th>DNI</th><th>Nombre completo</th><th>Categoría</th><th>Contacto</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>';

  }
  html += '</tbody></table></div>';
  results.innerHTML = html;

function renderAsistencias(){
  const hoy = todayStr();
  let html = '<div class="card"><h2>Registro de asistencia</h2>'+
    '<div class="row-flex mb-2">'+
      '<div class="form-row" style="margin:0"><label>Fecha</label><input type="date" id="asistFecha" value="'+hoy+'" onchange="renderAsistenciasLista()"></div>'+
      '<div class="form-row" style="margin:0"><label>Categoría</label><select id="asistCat" onchange="renderAsistenciasLista()"><option value="">Todas</option>'+
        db.categorias.map(function(c){ return '<option value="'+c.id+'">'+c.nombre+'</option>'; }).join('')+'</select></div>'+
    '</div><div id="asistLista"></div></div>';
  html += '<div class="card"><h2>Historial reciente</h2>';
  const lista = db.asistencias.slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); }).slice(0, 50);
  if(lista.length === 0) html += '<div class="empty">Sin registros</div>';
  else {
    html += '<table><thead><tr><th>Fecha</th><th>Deportista</th><th>Estado</th></tr></thead><tbody>';
    for(const a of lista){
      const cls = ({Presente:'badge-green',Ausente:'badge-red',Tarde:'badge-yellow',Justificado:'badge-blue'})[a.estado] || 'badge-gray';
      html += '<tr><td>'+fmtDate(a.fecha)+'</td><td>'+refLabel('deportistas', a.deportistaId)+'</td><td><span class="badge '+cls+'">'+(a.estado||'-')+'</span></td></tr>';
    }
    html += '</tbody></table>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  renderAsistenciasLista();
}

function renderAsistenciasLista(){
  const fecha = document.getElementById('asistFecha').value;
  const catId = document.getElementById('asistCat').value;
  let alumnos = db.deportistas.filter(function(d){ return d.estado === 'Activo'; });
  if(catId) alumnos = alumnos.filter(function(d){ return d.categoriaId === catId; });
  const contenedor = document.getElementById('asistLista');
  if(alumnos.length === 0){ contenedor.innerHTML = '<div class="empty">No hay alumnos</div>'; return; }
  let html = '<table><thead><tr><th>Foto</th><th>Deportista</th><th>DNI</th><th>Estado</th></tr></thead><tbody>';
  for(const d of alumnos){
    const existing = db.asistencias.find(function(a){ return a.deportistaId === d.id && a.fecha === fecha; });
    const estado = existing ? existing.estado : 'Presente';
    html += '<tr><td>'+photoHTML(d, '32px')+'</td><td>'+d.nombres+' '+d.apellidos+'</td><td>'+(d.dni||'-')+'</td>'+
      '<td><select onchange="guardarAsistencia(\''+d.id+'\',\''+fecha+'\',this.value)" style="padding:6px;border:1px solid #cbd5e1;border-radius:6px">'+
        ['Presente','Tarde','Ausente','Justificado'].map(function(e){ return '<option '+(estado===e?'selected':'')+'>'+e+'</option>'; }).join('')+
      '</select></td></tr>';
  }
  html += '</tbody></table>';
  contenedor.innerHTML = html;
}

function guardarAsistencia(deportistaId, fecha, estado){
  const existing = db.asistencias.find(function(a){ return a.deportistaId === deportistaId && a.fecha === fecha; });
  if(existing) existing.estado = estado;
  else db.asistencias.push({id:uid('asis'), deportistaId, fecha, estado, observaciones:''});
  saveDB();
}

// ============ COBROS ============
function renderCobros(){
  const mes = currentMonth();
  const activos = db.deportistas.filter(function(d){ return d.estado === 'Activo'; });
  let html = '<div class="card"><h2>Suscripciones del mes — '+mes+'</h2>'+
    '<table><thead><tr><th>Foto</th><th>Deportista</th><th>DNI</th><th>Tarifa</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>';
  let totalFacturado = 0, totalCobrado = 0;
  for(const d of activos){
    const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
    const pagado = db.pagos.filter(function(p){ return p.deportistaId === d.id && p.mes === mes && !p.revertido; }).reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0);
    const saldo = Math.max(0, tarifa - pagado);
    totalFacturado += tarifa; totalCobrado += Math.min(pagado, tarifa);
    const estado = pagado >= tarifa && tarifa > 0 ? '<span class="badge badge-green">Pagado</span>'
      : pagado > 0 ? '<span class="badge badge-yellow">Parcial</span>' : '<span class="badge badge-red">Pendiente</span>';
    html += '<tr><td>'+photoHTML(d, '36px')+'</td><td>'+d.nombres+' '+d.apellidos+'</td><td>'+(d.dni||'-')+'</td>'+
      '<td>'+fmtBs(tarifa)+'</td><td>'+fmtBs(pagado)+'</td><td>'+fmtBs(saldo)+'</td><td>'+estado+'</td>'+
      '<td style="text-align:right"><button class="btn btn-success btn-xs" onclick="abrirPagoDeportista(\''+d.id+'\')">+ Pago</button> '+
      '<button class="btn btn-primary btn-xs" onclick="verKardex(\''+d.id+'\')">Kardex</button></td></tr>';
  }
  html += '</tbody></table></div>';

  html += '<div class="card"><h2>Historial general de pagos</h2>';
  const pagos = db.pagos.slice().sort(function(a,b){ return (b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||''); }).slice(0, 100);
  if(pagos.length === 0) html += '<div class="empty">Sin pagos</div>';
  else {
    html += '<table><thead><tr><th>Fecha/Hora</th><th>Deportista</th><th>Mes</th><th>Monto</th><th>Método</th><th>Estado</th><th style="text-align:right">Acción</th></tr></thead><tbody>';

        '<td style="text-align:right">'+(!p.revertido ? '<button class="btn btn-danger btn-xs" onclick="revertirPago(\''+p.id+'\')">Revertir</button>' : '')+'</td></tr>';

function abrirPagoDeportista(deportistaId){
  const d = db.deportistas.find(function(x){ return x.id === deportistaId; });
  if(!d) return;
  const mes = currentMonth();
  const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
  const pagado = db.pagos.filter(function(p){ return p.deportistaId === d.id && p.mes === mes && !p.revertido; }).reduce(function(s,p){ return s + (Number(p.monto)||0); }, 0);
  const saldo = Math.max(0, tarifa - pagado);
  showForm('Pagar suscripción — '+d.nombres+' '+d.apellidos, [
    {name:'mes', label:'Mes (YYYY-MM)', type:'text', default:mes, required:true},
    {name:'monto', label:'Monto (Bs)', type:'number', default:saldo, required:true},
    {name:'fecha', label:'Fecha', type:'date', default:todayStr(), required:true},
    {name:'metodo', label:'Método', type:'select', options:['Efectivo','Transferencia','QR','Otro'], default:'Efectivo'}
  ], null, function(data){
    const fechaHora = new Date().toISOString();
    db.pagos.push(Object.assign({id:uid('pago'), deportistaId, fechaHora, revertido:false}, data));
    db.movCaja.push({
      id:uid('mov'), fecha:data.fecha, fechaHora, tipo:'Ingreso',
      concepto:'Suscripción '+d.nombres+' '+d.apellidos+' — '+data.mes,
      monto:Number(data.monto), origen:'Suscripción'
    });
    saveDB();
    navigate(currentRoute);
  });
}

function revertirPago(pagoId){
  const p = db.pagos.find(function(x){ return x.id === pagoId; });
  if(!p) return;
  if(!confirm('¿Revertir el pago de '+fmtBs(p.monto)+'?')) return;
  p.revertido = true;
  p.fechaReversion = new Date().toISOString();
  const d = db.deportistas.find(function(x){ return x.id === p.deportistaId; });
  db.movCaja.push({
    id:uid('mov'), fecha:todayStr(), fechaHora:new Date().toISOString(), tipo:'Egreso',
    concepto:'REVERSIÓN pago — '+(d ? d.nombres+' '+d.apellidos : p.deportistaId)+' — '+p.mes,
    monto:Number(p.monto), origen:'Reversión suscripción'
  });
  saveDB();
  navigate(currentRoute);
  alert('✅ Pago revertido');
}

function renderPOS(){
  const productos = db.productos.filter(function(p){ return Number(p.stock) > 0; });
  let html = '<div class="pos-layout">'+
    '<div class="pos-products"><h2>Productos</h2><div class="product-grid">';
  if(productos.length === 0) html += '<div class="empty">Sin stock</div>';
  for(const p of productos){
    html += '<div class="product-card" onclick="posAdd(\''+p.id+'\')"><div class="pname">'+p.nombre+'</div>'+
      '<div class="pprice">'+fmtBs(p.precioVenta)+'</div><div class="pstock">Stock: '+p.stock+'</div></div>';
  }
  html += '</div></div><div class="pos-cart"><h2>Carrito</h2><div class="pos-cart-items">';
  if(posCart.length === 0) html += '<div class="empty">Vacío</div>';
  else for(let i = 0; i < posCart.length; i++){
    const item = posCart[i];
    html += '<div class="pos-item"><div style="flex:1"><b>'+item.nombre+'</b><br><span class="text-muted">'+fmtBs(item.precio)+' x '+item.cantidad+'</span></div>'+
      '<div><div>'+fmtBs(item.precio*item.cantidad)+'</div><button class="btn btn-danger btn-xs" onclick="posRemove('+i+')">X</button></div></div>';
  }
  html += '</div><div class="pos-total">Total: '+fmtBs(posCart.reduce(function(s,i){ return s + i.precio*i.cantidad; }, 0))+'</div>'+
    '<button class="btn btn-success w-100" onclick="posCheckout()" '+(posCart.length===0?'disabled':'')+'>Registrar venta</button>'+
    '<button class="btn btn-secondary w-100 mt-2" onclick="posCart=[];renderPOS()" '+(posCart.length===0?'disabled':'')+'>Vaciar</button>'+
  '</div></div>';
  document.getElementById('content').innerHTML = html;
}
function posAdd(productoId){
  const p = db.productos.find(function(x){ return x.id === productoId; });
  if(!p) return;
  const existing = posCart.find(function(i){ return i.productoId === productoId; });
  if(existing){
    if(existing.cantidad + 1 > Number(p.stock)){ alert('Stock insuficiente'); return; }
    existing.cantidad++;
  } else posCart.push({productoId, nombre:p.nombre, precio:Number(p.precioVenta), cantidad:1});
  renderPOS();
}
function posRemove(idx){ posCart.splice(idx,1); renderPOS(); }
function posCheckout(){
  if(posCart.length === 0) return;
  const total = posCart.reduce(function(s,i){ return s + i.precio*i.cantidad; }, 0);
  showForm('Confirmar venta', [
    {name:'cliente', label:'Cliente (opcional)', type:'text'},
    {name:'metodo', label:'Método', type:'select', options:['Efectivo','Transferencia','QR','Otro'], default:'Efectivo'}
  ], null, function(data){
    for(const item of posCart){
      const p = db.productos.find(function(x){ return x.id === item.productoId; });
      if(p) p.stock = Number(p.stock) - item.cantidad;
    }
    const fechaHora = new Date().toISOString();
    db.ventas.push({id:uid('venta'), fecha:todayStr(), fechaHora, items:posCart.slice(), total, metodo:data.metodo, cliente:data.cliente, revertida:false});
    db.movCaja.push({id:uid('mov'), fecha:todayStr(), fechaHora, tipo:'Ingreso',
      concepto:'Venta POS — '+posCart.map(function(i){ return i.nombre+' x'+i.cantidad; }).join(', '),
      monto:total, origen:'Venta'});
    posCart = [];
    saveDB(); navigate('pos');
    alert('✅ Venta registrada: '+fmtBs(total));
  });
}

function renderVentas(){
  const ventas = db.ventas.slice().sort(function(a,b){ return (b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||''); });
  let html = '<div class="card"><div class="info-box">🧾 <b>Ventas:</b> Revisa y revierte ventas en caso de error.</div>'+
    '<table><thead><tr><th>Fecha</th><th>Items</th><th>Cliente</th><th>Total</th><th>Estado</th><th style="text-align:right">Acción</th></tr></thead><tbody>';
  if(ventas.length === 0) html += '<tr><td colspan="6"><div class="empty">Sin ventas</div></td></tr>';
  else for(const v of ventas){
    const items = (v.items||[]).map(function(i){ return i.nombre+' x'+i.cantidad; }).join('<br>');
    const est = v.revertida ? '<span class="badge badge-red">Revertida</span>' : '<span class="badge badge-green">Vigente</span>';
    html += '<tr><td>'+(fmtDateTime(v.fechaHora)||fmtDate(v.fecha))+'</td><td style="font-size:12px">'+items+'</td><td>'+(v.cliente||'-')+'</td>'+
      '<td><b>'+fmtBs(v.total)+'</b></td><td>'+est+'</td><td style="text-align:right">'+
      (!v.revertida ? '<button class="btn btn-danger btn-xs" onclick="revertirVenta(\''+v.id+'\')">Revertir</button>' : '')+'</td></tr>';
  }
  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}
function revertirVenta(ventaId){
  const v = db.ventas.find(function(x){ return x.id === ventaId; });
  if(!v || v.revertida) return;
  if(!confirm('¿Revertir esta venta de '+fmtBs(v.total)+'?')) return;
  for(const item of v.items){
    const p = db.productos.find(function(x){ return x.id === item.productoId; });
    if(p) p.stock = Number(p.stock) + item.cantidad;
  }
  v.revertida = true;
  v.fechaReversion = new Date().toISOString();
  db.movCaja.push({id:uid('mov'), fecha:todayStr(), fechaHora:new Date().toISOString(), tipo:'Egreso',
    concepto:'REVERSIÓN venta — '+v.items.map(function(i){ return i.nombre+' x'+i.cantidad; }).join(', '),
    monto:Number(v.total), origen:'Reversión venta'});
  saveDB(); navigate('ventas');
  alert('✅ Venta revertida');
}

// ============ EXPORT / IMPORT ============
function exportarJSON(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dosantos-'+todayStr()+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importarJSON(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('¿Reemplazar todos los datos?')) return;
      db = data;
      const seed = seedDB();
      for(const k in seed){ if(!(k in db)) db[k] = seed[k]; }
      saveDB(); navigate('dashboard');
      alert('Datos importados');
    }catch(err){ alert('JSON inválido: '+err.message); }
  };
  reader.readAsText(file); input.value = '';
}

// ============ CONVERTIR PREINSCRIPCION ============
function convertirDeportista(preId){
  const p = db.preinscripciones.find(function(x){ return x.id === preId; });
  if(!p) return;
  showForm('Convertir preinscripción en deportista', ENT.deportistas.fields, {
    dni: p.dni || '', nombres:p.nombres, apellidos:p.apellidos, fechaNacimiento:p.fechaNacimiento,
    sexo:p.sexo, telefono:p.telefono, tutor:p.representante, categoriaId:p.categoriaInteres,
    fechaIngreso:todayStr(), estado:'Activo', tarifa:250, beca:0
  }, function(data){
    if(!data.dni){ alert('❌ DNI obligatorio'); return false; }
    if(!validarDNI(data.dni)){
      const dup = db.deportistas.find(function(d){ return d.dni === data.dni && d.estado === 'Activo'; });
      alert('❌ Ya existe un jugador con ese DNI: '+dup.nombres+' '+dup.apellidos);
      return false;
    }
    data.id = uid('dep');
    db.deportistas.push(data);
    p.estado = 'Aprobada';
    saveDB();
    alert('✅ Deportista creado');
    navigate('preinscripciones');
  });
}

loadDB();
renderNav();
navigate('dashboard');

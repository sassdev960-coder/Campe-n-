let db = null;
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ db = JSON.parse(raw);}catch(e){ db = seedDB(); } }
  else { db = seedDB(); }
  const seed = seedDB();
  for(const k in seed){ if(!(k in db)) db[k] = seed[k]; }
  saveDB();
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ alert('⚠️ Almacenamiento lleno. Exporta el JSON y borra registros antiguos.'); } }
function uid(p='id'){ return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

// ============ HELPERS ============
function refLabel(source, id){
  if(!id) return '-';
  const list = db[source] || [];
  const item = list.find(x => x.id === id);
  if(!item) return id;
  if(item.nombres) return (item.nombres + ' ' + (item.apellidos||'')).trim();
  return item.nombre || item.titulo || id;
}

// ============ PHOTO CROP ============
function cropSquare(file, size=300){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim)/2;
        const sy = (img.height - minDim)/2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,size,size);
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(fieldName, input){
  const file = input.files[0];
  if(!file) return;
  const base64 = await cropSquare(file);
  const form = document.getElementById('dynForm');
  const hidden = form.querySelector(`input[name="${fieldName}"]`);
  hidden.value = base64;
  const preview = document.getElementById(`photoPreview_${fieldName}`);
  preview.innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover">`;
}

// ============ FORM BUILDER ============
function buildForm(fields, values){
  let html = '<form id="dynForm"><div class="form-grid">';
  for(const f of fields){
    const isWide = f.type === 'textarea' || f.type === 'photo';
    html += `<div class="form-row" style="${isWide?'grid-column:1/-1':''}">`;
    html += `<label>${f.label}${f.required?' *':''}</label>`;
    const val = values && values[f.name] !== undefined ? values[f.name] : (f.default !== undefined ? f.default : '');
    if(f.type === 'photo'){
      html += `<div style="display:flex;gap:12px;align-items:center">
        <div id="photoPreview_${f.name}" style="width:90px;height:90px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          ${val ? `<img src="${val}" style="width:100%;height:100%;object-fit:cover">` : '<span style="font-size:10px;color:#94a3b8;text-align:center">Foto 4x4<br>fondo blanco</span>'}
        </div>
        <div style="flex:1">
          <input type="file" accept="image/*" onchange="handlePhotoUpload('${f.name}', this)">
          <input type="hidden" name="${f.name}" value="${val||''}">
          <div style="font-size:11px;color:#64748b;margin-top:4px">Se recorta automáticamente a cuadrado (4x4). Recomendado: fondo blanco.</div>
        </div>
      </div>`;
    } else if(f.type === 'select'){
      let opts = f.options || [];
      if(f.source){
        opts = (db[f.source]||[]).map(o => ({value:o.id, label:(o.nombres ? (o.nombres+' '+(o.apellidos||'')) : (o.nombre||o.titulo||o.id))}));
      } else if(opts.length && typeof opts[0] !== 'object'){
        opts = opts.map(o => ({value:o, label:o}));
      }
      html += `<select name="${f.name}" ${f.required?'required':''}><option value="">-- Seleccionar --</option>`;
      for(const o of opts){ html += `<option value="${o.value}" ${String(val)===String(o.value)?'selected':''}>${o.label}</option>`; }
      html += `</select>`;
    } else if(f.type === 'textarea'){
      html += `<textarea name="${f.name}" ${f.required?'required':''}>${val||''}</textarea>`;
    } else {
      const step = f.type==='number' ? 'any' : '';
      html += `<input type="${f.type||'text'}" name="${f.name}" value="${val||''}" ${f.required?'required':''} step="${step}">`;
    }
    html += `</div>`;
  }
  html += '</div>';
  html += `<div class="row-flex" style="justify-content:flex-end;margin-top:16px">
    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div></form>`;
  return html;
}

function showForm(title, fields, values, onSave){
  openModal('<h2>'+title+'</h2>' + buildForm(fields, values));
  document.getElementById('dynForm').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    for(const f of fields){
      let v = fd.get(f.name);
      if(f.type === 'number') v = v === '' || v === null ? null : Number(v);
      data[f.name] = v;
    }
    const result = onSave(data);
    if(result !== false) closeModal();
  };
}

let currentRoute = 'dashboard';

function renderNav(){
  let html = '';
  for(const g of NAV){
    html += `<div class="group">${g.group}</div>`;
    for(const item of g.items){
      html += `<a data-route="${item.route}" class="${item.route===currentRoute?'active':''}" onclick="navigate('${item.route}')">${item.label}</a>`;
    }
  }
  document.getElementById('nav').innerHTML = html;
}
function navigate(route){
  currentRoute = route;
  renderNav();
  const r = routes[route];
  document.getElementById('pageTitle').textContent = r.title;
  document.getElementById('content').innerHTML = '';
  r.render();
}

// ============ ENTITY RENDERER ============
function renderEntity(entityKey, customActions){
  const cfg = ENT[entityKey];
  const rows = db[entityKey] || [];
  const fields = cfg.fields;
  let displayFields;
  if(entityKey === 'deportistas'){
    displayFields = fields.filter(f => ['dni','nombres','apellidos','categoriaId','telefono','estado'].includes(f.name));
  } else {
    displayFields = fields.filter(f => f.type !== 'textarea' && f.type !== 'photo').slice(0, 6);
  }

  let html = `<div class="toolbar">
    <input class="search" placeholder="Buscar..." oninput="filterTable(this,'tbl_${entityKey}')">
    <button class="btn btn-primary" onclick="entityCreate('${entityKey}')">+ Nuevo ${cfg.label}</button>
  </div>`;

  html += `<table id="tbl_${entityKey}"><thead><tr>`;
  if(entityKey === 'deportistas') html += '<th>Foto</th>';
  for(const f of displayFields){ html += `<th>${f.label}</th>`; }
  html += `<th style="text-align:right">Acciones</th></tr></thead><tbody>`;

  if(rows.length === 0){
    html += `<tr><td colspan="${displayFields.length+2}"><div class="empty">Sin registros aún. Crea el primero.</div></td></tr>`;
  } else {
    for(const row of rows){
      html += '<tr>';
      if(entityKey === 'deportistas') html += `<td>${photoHTML(row, '40px')}</td>`;
      for(const f of displayFields){
        let v = row[f.name];
        if(f.source){ v = refLabel(f.source, v); }
        else if(f.type === 'date'){ v = fmtDate(v); }
        else if(v === undefined || v === null || v === ''){ v = '<span class="text-muted">-</span>'; }
        if(f.name === 'estado'){
          const cls = v === 'Activo' ? 'badge-green' : v === 'Inactivo' ? 'badge-yellow' : 'badge-red';
          v = `<span class="badge ${cls}">${v}</span>`;
        }
        html += `<td>${v}</td>`;
      }
      html += `<td style="text-align:right;white-space:nowrap">
        ${customActions ? customActions(row) : ''}
        <button class="btn btn-secondary btn-xs" onclick="entityEdit('${entityKey}','${row.id}')">Editar</button>
        <button class="btn btn-danger btn-xs" onclick="entityDelete('${entityKey}','${row.id}')">Eliminar</button>
      </td></tr>`;
    }
  }
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}
function filterTable(input, tableId){
  const term = input.value.toLowerCase();
  document.querySelectorAll('#'+tableId+' tbody tr').forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(term) ? '' : 'none';
  });
}

// ============ DNI VALIDATION ============
function validarDNI(dni, excludeId){
  if(!dni) return true;
  const dup = db.deportistas.find(d => d.dni === dni && d.id !== excludeId && d.estado === 'Activo');
  if(dup) return false;
  return true;
}

function entityCreate(key){
  const cfg = ENT[key];
  showForm('Nuevo '+cfg.label, cfg.fields, null, (data) => {
    if(key === 'deportistas'){
      if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
      if(!validarDNI(data.dni)){
        const dup = db.deportistas.find(d => d.dni === data.dni && d.estado === 'Activo');
        alert(`❌ Ya existe un jugador ACTIVO con el DNI ${data.dni}:\n\n${dup.nombres} ${dup.apellidos}\n\nDebe dar de BAJA al jugador existente antes de registrar uno nuevo con el mismo DNI.`);
        return false;
      }
    }
    data.id = uid(key);
    db[key].push(data);
    saveDB();
    navigate(currentRoute);
  });
}
function entityEdit(key, id){
  const cfg = ENT[key];
  const item = db[key].find(x => x.id === id);
  if(!item) return;
  showForm('Editar '+cfg.label, cfg.fields, item, (data) => {
    if(key === 'deportistas'){
      if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
      if(!validarDNI(data.dni, id)){
        const dup = db.deportistas.find(d => d.dni === data.dni && d.id !== id && d.estado === 'Activo');
        alert(`❌ Ya existe otro jugador ACTIVO con el DNI ${data.dni}:\n\n${dup.nombres} ${dup.apellidos}\n\nDebe dar de BAJA al jugador existente antes de usar el mismo DNI.`);
        return false;
      }
    }
    Object.assign(item, data);
    saveDB();
    navigate(currentRoute);
  });
}
function entityDelete(key, id){
  if(!confirm('¿Eliminar este registro?')) return;
  db[key] = db[key].filter(x => x.id !== id);
  saveDB();
  navigate(currentRoute);
}

// ============ DASHBOARD ============
function renderDashboard(){
  const activos = db.deportistas.filter(d => d.estado === 'Activo').length;
  const entrenadores = db.personal.filter(p => p.cargo === 'Entrenador' && p.estado === 'Activo').length;
  const mes = currentMonth();
  const ingresosMes = db.pagos.filter(p => p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0)
    + db.ventas.filter(v => (v.fecha||'').startsWith(mes) && !v.revertida).reduce((s,v) => s + (Number(v.total)||0), 0);
  const egresosMes = db.movCaja.filter(m => (m.fecha||'').startsWith(mes) && m.tipo === 'Egreso').reduce((s,m) => s + (Number(m.monto)||0), 0)
    + db.cajaChica.filter(c => (c.fecha||'').startsWith(mes)).reduce((s,c) => s + (Number(c.monto)||0), 0);
  const deudaTotal = calcularDeudaTotal();
  const stockBajo = db.productos.filter(p => Number(p.stock) <= Number(p.stockMinimo)).length;
  const prestamosActivos = db.prestamos.filter(p => p.devuelto !== 'Sí').length;
  const reservasHoy = db.reservas.filter(r => r.fecha === todayStr()).length;
  const notifNoLeidas = db.notificaciones.filter(n => !n.leida).length;
  const preinsPend = db.preinscripciones.filter(p => p.estado === 'Pendiente').length;

  let html = '<div class="kpis">';
  html += kpi('Alumnos activos', activos, db.deportistas.length + ' en total');
  html += kpi('Entrenadores', entrenadores, db.personal.length + ' personal total');
  html += kpi('Ingresos del mes', fmtBs(ingresosMes), 'Mensualidades + ventas');
  html += kpi('Egresos del mes', fmtBs(egresosMes), 'Gastos operativos');
  html += kpi('Deuda pendiente', fmtBs(deudaTotal), 'Mensualidades por cobrar');
  html += kpi('Stock bajo', stockBajo, 'Productos a reponer');
  html += kpi('Préstamos activos', prestamosActivos, 'Equipamiento prestado');
  html += kpi('Reservas hoy', reservasHoy, 'Canchas reservadas');
  html += kpi('Notificaciones', notifNoLeidas, 'No leídas');
  html += kpi('Preinscripciones', preinsPend, 'Pendientes');
  html += '</div>';

  html += '<div class="grid-2">';
  html += '<div class="card"><h2>Últimos pagos</h2>';
  const ultimosPagos = [...db.pagos].filter(p => !p.revertido).sort((a,b)=>(b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||'')).slice(0,5);
  if(ultimosPagos.length === 0) html += '<div class="empty">Sin pagos registrados</div>';
  else {
    html += '<table><thead><tr><th>Deportista</th><th>Mes</th><th>Monto</th><th>Fecha/Hora</th></tr></thead><tbody>';
    for(const p of ultimosPagos){
      const d = db.deportistas.find(x => x.id === p.deportistaId);
      html += `<tr><td>${d ? d.nombres+' '+d.apellidos : '-'}</td><td>${p.mes||'-'}</td><td>${fmtBs(p.monto)}</td><td>${fmtDateTime(p.fechaHora) || fmtDate(p.fecha)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div>';

  html += '<div class="card"><h2>Últimas ventas</h2>';
  const ultimasVentas = [...db.ventas].filter(v => !v.revertida).sort((a,b)=>(b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||'')).slice(0,5);
  if(ultimasVentas.length === 0) html += '<div class="empty">Sin ventas registradas</div>';
  else {
    html += '<table><thead><tr><th>Fecha/Hora</th><th>Items</th><th>Total</th></tr></thead><tbody>';
    for(const v of ultimasVentas){
      html += `<tr><td>${fmtDateTime(v.fechaHora) || fmtDate(v.fecha)}</td><td>${(v.items||[]).length} producto(s)</td><td>${fmtBs(v.total)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}
function kpi(label, value, sub){
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||''}</div></div>`;
}
function calcularDeudaTotal(){
  const mes = currentMonth();
  let total = 0;
  for(const d of db.deportistas.filter(x => x.estado === 'Activo')){
    const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
    const pagado = db.pagos.filter(p => p.deportistaId === d.id && p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
    total += Math.max(0, tarifa - pagado);
  }
  return total;
}

  <div id="searchResults"><div class="empty">Ingresa un término de búsqueda para comenzar</div></div>`;
  document.getElementById('content').innerHTML = html;
}
function buscarJugadores(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if(term.length < 2){ results.innerHTML = '<div class="empty">Ingresa al menos 2 caracteres</div>'; return; }
  const found = db.deportistas.filter(d => {
    const txt = `${d.dni||''} ${d.nombres||''} ${d.apellidos||''} ${d.telefono||''} ${d.tutor||''} ${d.telefonoEmergencia||''}`.toLowerCase();
    return txt.includes(term);
  });
  if(found.length === 0){ results.innerHTML = '<div class="empty">No se encontraron jugadores</div>'; return; }
  let html = `<div class="card"><h2>${found.length} resultado(s)</h2>
    <table><thead><tr><th>Foto</th><th>DNI</th><th>Nombre completo</th><th>Categoría</th><th>Contacto</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>`;
  for(const d of found){
    const cls = d.estado === 'Activo' ? 'badge-green' : 'badge-red';
    html += `<tr>
      <td>${photoHTML(d, '45px')}</td>
      <td><b>${d.dni||'-'}</b></td>
      <td>${d.nombres} ${d.apellidos}</td>
      <td>${refLabel('categorias', d.categoriaId)}</td>
      <td>${d.telefono||'-'}</td>
      <td><span class="badge ${cls}">${d.estado||'-'}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-primary btn-xs" onclick="verKardex('${d.id}')">📇 Kardex</button>
        <button class="btn btn-success btn-xs" onclick="abrirPagoDeportista('${d.id}')">💵 Pagar</button>
        <button class="btn btn-secondary btn-xs" onclick="entityEdit('deportistas','${d.id}')">Editar</button>
      </td>
    </tr>`;
  }
  html += '</tbody></table></div>';
  results.innerHTML = html;
}

// ============ KARDEX ============
function verKardex(id){ window._kardexSelectedId = id; navigate('kardex'); }

function renderKardex(){
  const selectedId = window._kardexSelectedId;
  let html = `<div class="card no-print"><h2>Seleccionar jugador</h2>
    <select onchange="window._kardexSelectedId=this.value;renderKardex()" style="padding:8px;border:1px solid #cbd5e1;border-radius:6px;min-width:320px">
      <option value="">-- Seleccionar jugador --</option>`;
  for(const d of db.deportistas){
    html += `<option value="${d.id}" ${selectedId===d.id?'selected':''}>${d.nombres} ${d.apellidos} (${d.dni||'sin DNI'})</option>`;
  }
  html += `</select></div>`;
  if(selectedId){
    const d = db.deportistas.find(x => x.id === selectedId);
    if(d) html += renderKardexContent(d);
  }
  document.getElementById('content').innerHTML = html;
}
function renderKardexContent(d){
  const asistencias = db.asistencias.filter(a => a.deportistaId === d.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));

  const ausentes = asistencias.filter(a => a.estado === 'Ausente').length;
  const justificados = asistencias.filter(a => a.estado === 'Justificado').length;
  const pctAsistencia = asistencias.length > 0 ? Math.round(presentes/asistencias.length*100) : 0;
  const evaluaciones = db.evaluaciones.filter(e => e.deportistaId === d.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const pagos = db.pagos.filter(p => p.deportistaId === d.id && !p.revertido).sort((a,b)=>(b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||''));
  const totalPagado = pagos.reduce((s,p) => s + (Number(p.monto)||0), 0);
  const promedioEval = (arr, key) => {
    const vals = arr.map(e => Number(e[key])).filter(v => !isNaN(v) && v > 0);

    ${kpi('Ausencias', ausentes, 'Sin justificar')}

  else {

      const cls = {Presente:'badge-green', Tarde:'badge-yellow', Ausente:'badge-red', Justificado:'badge-blue'}[a.estado] || 'badge-gray';
      html += `<tr><td>${fmtDate(a.fecha)}</td><td><span class="badge ${cls}">${a.estado}</span></td></tr>`;

  return html;

// ============ ASISTENCIAS ============
function renderAsistencias(){
  const hoy = todayStr();
  let html = `<div class="card">
    <h2>Registro de asistencia</h2>
    <div class="row-flex mb-2">
      <div class="form-row" style="margin:0"><label>Fecha</label><input type="date" id="asistFecha" value="${hoy}" onchange="renderAsistenciasLista()"></div>
      <div class="form-row" style="margin:0"><label>Categoría</label>
        <select id="asistCat" onchange="renderAsistenciasLista()"><option value="">Todas</option>
        ${db.categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')}</select>
      </div>
    </div>
    <div id="asistLista"></div>
  </div>
  <div class="card"><h2>Historial reciente</h2>`;
  const lista = [...db.asistencias].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).slice(0, 50);
  if(lista.length === 0) html += '<div class="empty">Sin registros</div>';
  else {
    html += '<table><thead><tr><th>Fecha</th><th>Deportista</th><th>Estado</th></tr></thead><tbody>';
    for(const a of lista){
      const cls = {Presente:'badge-green', Ausente:'badge-red', Tarde:'badge-yellow', Justificado:'badge-blue'}[a.estado] || 'badge-gray';
      html += `<tr><td>${fmtDate(a.fecha)}</td><td>${refLabel('deportistas', a.deportistaId)}</td><td><span class="badge ${cls}">${a.estado||'-'}</span></td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  renderAsistenciasLista();
}
function renderAsistenciasLista(){
  const fecha = document.getElementById('asistFecha').value;
  const catId = document.getElementById('asistCat').value;
  let alumnos = db.deportistas.filter(d => d.estado === 'Activo');
  if(catId) alumnos = alumnos.filter(d => d.categoriaId === catId);
  const contenedor = document.getElementById('asistLista');
  if(alumnos.length === 0){ contenedor.innerHTML = '<div class="empty">No hay alumnos</div>'; return; }
  let html = '<table><thead><tr><th>Foto</th><th>Deportista</th><th>DNI</th><th>Estado</th></tr></thead><tbody>';
  for(const d of alumnos){
    const existing = db.asistencias.find(a => a.deportistaId === d.id && a.fecha === fecha);
    const estado = existing ? existing.estado : 'Presente';
    html += `<tr>
      <td>${photoHTML(d, '32px')}</td>
      <td>${d.nombres} ${d.apellidos}</td>
      <td>${d.dni||'-'}</td>
      <td><select onchange="guardarAsistencia('${d.id}','${fecha}',this.value)" style="padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px">
        ${['Presente','Tarde','Ausente','Justificado'].map(e => `<option ${estado===e?'selected':''}>${e}</option>`).join('')}
      </select></td>
    </tr>`;
  }
  html += '</tbody></table>';
  contenedor.innerHTML = html;
}
function guardarAsistencia(deportistaId, fecha, estado){
  const existing = db.asistencias.find(a => a.deportistaId === deportistaId && a.fecha === fecha);
  if(existing) existing.estado = estado;
  else db.asistencias.push({id:uid('asis'), deportistaId, fecha, estado, observaciones:''});
  saveDB();
}

// ============ COBROS / SUSCRIPCIONES ============
function renderCobros(){
  const mes = currentMonth();
  const activos = db.deportistas.filter(d => d.estado === 'Activo');
  let html = `<div class="card"><h2>Suscripciones del mes — ${mes}</h2>
    <table><thead><tr><th>Foto</th><th>Deportista</th><th>DNI</th><th>Tarifa</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>`;
  let totalFacturado = 0, totalCobrado = 0;
  for(const d of activos){
    const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
    const pagado = db.pagos.filter(p => p.deportistaId === d.id && p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
    const saldo = Math.max(0, tarifa - pagado);
    totalFacturado += tarifa; totalCobrado += Math.min(pagado, tarifa);
    const estado = pagado >= tarifa && tarifa > 0 ? '<span class="badge badge-green">Pagado</span>'
      : pagado > 0 ? '<span class="badge badge-yellow">Parcial</span>' : '<span class="badge badge-red">Pendiente</span>';
    html += `<tr>
      <td>${photoHTML(d, '36px')}</td>
      <td>${d.nombres} ${d.apellidos}</td>
      <td>${d.dni||'-'}</td>
      <td>${fmtBs(tarifa)}</td>
      <td>${fmtBs(pagado)}</td>
      <td>${fmtBs(saldo)}</td>
      <td>${estado}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-success btn-xs" onclick="abrirPagoDeportista('${d.id}')">+ Pago</button>
        <button class="btn btn-primary btn-xs" onclick="verKardex('${d.id}')">Kardex</button>
      </td>
    </tr>`;
  }
  html += `</tbody></table>
    <div class="row-flex mt-2" style="justify-content:space-between">
      <div>Facturado: <b>${fmtBs(totalFacturado)}</b></div>
      <div>Cobrado: <b>${fmtBs(totalCobrado)}</b></div>
      <div>Pendiente: <b>${fmtBs(totalFacturado - totalCobrado)}</b></div>
    </div>
  </div>`;

  html += `<div class="card"><h2>Historial general de pagos</h2>`;

function abrirPagoDeportista(deportistaId){
  const d = db.deportistas.find(x => x.id === deportistaId);
  if(!d) return;
  const mes = currentMonth();
  const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
  const pagado = db.pagos.filter(p => p.deportistaId === d.id && p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
  const saldo = Math.max(0, tarifa - pagado);
  showForm('Pagar suscripción — ' + d.nombres + ' ' + d.apellidos, [
    {name:'mes', label:'Mes (YYYY-MM)', type:'text', default:mes, required:true},
    {name:'monto', label:'Monto (Bs)', type:'number', default:saldo, required:true},
    {name:'fecha', label:'Fecha del pago', type:'date', default:todayStr(), required:true},
    {name:'metodo', label:'Método', type:'select', options:['Efectivo','Transferencia','QR','Otro'], default:'Efectivo'}
  ], null, (data) => {
    const fechaHora = new Date().toISOString();
    db.pagos.push({id:uid('pago'), deportistaId, ...data, fechaHora, revertido:false});
    db.movCaja.push({
      id:uid('mov'), fecha:data.fecha, fechaHora, tipo:'Ingreso',
      concepto:`Suscripción ${d.nombres} ${d.apellidos} — ${data.mes}`,
      monto:Number(data.monto), origen:'Suscripción', refId: null
    });
    saveDB();
    navigate(currentRoute);
  });
}

function revertirPago(pagoId){
  const p = db.pagos.find(x => x.id === pagoId);
  if(!p) return;
  if(!confirm(`¿Revertir el pago de ${fmtBs(p.monto)}?\n\nEsto generará un movimiento de reversión en caja.`)) return;
  p.revertido = true;
  p.fechaReversion = new Date().toISOString();
  const d = db.deportistas.find(x => x.id === p.deportistaId);
  db.movCaja.push({
    id:uid('mov'), fecha:todayStr(), fechaHora:new Date().toISOString(), tipo:'Egreso',
    concepto:`REVERSIÓN pago — ${d ? d.nombres+' '+d.apellidos : p.deportistaId} — ${p.mes}`,
    monto:Number(p.monto), origen:'Reversión suscripción'
  });
  saveDB();
  navigate(currentRoute);
  alert('✅ Pago revertido correctamente. Se generó un egreso en el libro diario.');
}

let posCart = [];
function renderPOS(){
  const productos = db.productos.filter(p => Number(p.stock) > 0);
  let html = `<div class="pos-layout">
    <div class="pos-products"><h2 style="margin-bottom:12px">Productos disponibles</h2><div class="product-grid">`;
  if(productos.length === 0) html += '<div class="empty">Sin productos con stock</div>';
  for(const p of productos){
    html += `<div class="product-card" onclick="posAdd('${p.id}')">
      <div class="pname">${p.nombre}</div>
      <div class="pprice">${fmtBs(p.precioVenta)}</div>
      <div class="pstock">Stock: ${p.stock}</div>
    </div>`;
  }
  html += `</div></div><div class="pos-cart"><h2>Carrito</h2><div class="pos-cart-items">`;
  if(posCart.length === 0) html += '<div class="empty">Carrito vacío</div>';
  else for(let i = 0; i < posCart.length; i++){
    const item = posCart[i];
    html += `<div class="pos-item">
      <div style="flex:1"><b>${item.nombre}</b><br><span class="text-muted">${fmtBs(item.precio)} x ${item.cantidad}</span></div>
      <div style="text-align:right"><div>${fmtBs(item.precio * item.cantidad)}</div>
      <button class="btn btn-danger btn-xs" onclick="posRemove(${i})">×</button></div>
    </div>`;
  }
  html += `</div>
    <div class="pos-total">Total: ${fmtBs(posCart.reduce((s,i) => s + i.precio*i.cantidad, 0))}</div>
    <button class="btn btn-success w-100" onclick="posCheckout()" ${posCart.length===0?'disabled':''}>Registrar venta</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="posCart=[];renderPOS()" ${posCart.length===0?'disabled':''}>Vaciar</button>
  </div></div>`;
  document.getElementById('content').innerHTML = html;
}
function posAdd(productoId){
  const p = db.productos.find(x => x.id === productoId);
  if(!p) return;
  const existing = posCart.find(i => i.productoId === productoId);
  if(existing){
    if(existing.cantidad + 1 > Number(p.stock)){ alert('Stock insuficiente'); return; }
    existing.cantidad++;
  } else posCart.push({productoId, nombre:p.nombre, precio:Number(p.precioVenta), cantidad:1});
  renderPOS();
}
function posRemove(idx){ posCart.splice(idx,1); renderPOS(); }
function posCheckout(){
  if(posCart.length === 0) return;
  const total = posCart.reduce((s,i) => s + i.precio*i.cantidad, 0);
  showForm('Confirmar venta', [
    {name:'cliente', label:'Cliente (opcional)', type:'text'},
    {name:'metodo', label:'Método de pago', type:'select', options:['Efectivo','Transferencia','QR','Otro'], default:'Efectivo'}
  ], null, (data) => {
    for(const item of posCart){
      const p = db.productos.find(x => x.id === item.productoId);
      if(p) p.stock = Number(p.stock) - item.cantidad;
    }
    const fechaHora = new Date().toISOString();
    const venta = {id:uid('venta'), fecha:todayStr(), fechaHora, items:[...posCart], total, metodo:data.metodo, cliente:data.cliente, revertida:false};
    db.ventas.push(venta);
    db.movCaja.push({
      id:uid('mov'), fecha:todayStr(), fechaHora, tipo:'Ingreso',
      concepto:'Venta POS — ' + posCart.map(i => i.nombre+' x'+i.cantidad).join(', '),
      monto:total, origen:'Venta'
    });
    posCart = [];
    saveDB(); navigate('pos');
    alert('✅ Venta registrada: ' + fmtBs(total));
  });
}

      </td>

function revertirVenta(ventaId){
  const v = db.ventas.find(x => x.id === ventaId);
  if(!v) return;
  if(v.revertida){ alert('Esta venta ya fue revertida'); return; }
  if(!confirm(`¿Revertir esta venta de ${fmtBs(v.total)}?\n\nSe restaurará el stock de los productos y se generará un egreso de reversión en caja.`)) return;
  // Restaurar stock
  for(const item of v.items){
    const p = db.productos.find(x => x.id === item.productoId);
    if(p) p.stock = Number(p.stock) + item.cantidad;
  }
  v.revertida = true;
  v.fechaReversion = new Date().toISOString();
  db.movCaja.push({
    id:uid('mov'), fecha:todayStr(), fechaHora:new Date().toISOString(), tipo:'Egreso',
    concepto:'REVERSIÓN venta — ' + v.items.map(i => i.nombre+' x'+i.cantidad).join(', '),
    monto:Number(v.total), origen:'Reversión venta'
  });
  saveDB();
  navigate('ventas');
  alert('✅ Venta revertida. Stock restaurado y movimiento registrado en libro diario.');
}

  let html = `<div class="kpis">
    ${kpi('Alumnos activos', activos, inactivos+' inactivos')}
    ${kpi('Ingresos suscripciones', fmtBs(ingresosMes), 'Mes actual')}
    ${kpi('Ingresos por ventas', fmtBs(ingresosVentas), 'Mes actual')}
    ${kpi('Egresos', fmtBs(egresos), 'Mes actual')}
    ${kpi('Deuda pendiente', fmtBs(deuda), 'Cobranza')}
  </div>
  <div class="grid-2">
    <div class="card"><h2>Alumnos por categoría</h2>`;
  const maxCat = Math.max(1, ...Object.values(porCategoria));
  for(const catId in porCategoria){
    html += `<div style="margin-bottom:8px"><div class="row-flex" style="justify-content:space-between;font-size:12px"><span>${refLabel('categorias', catId)}</span><span><b>${porCategoria[catId]}</b></span></div>
      <div class="chart-bar"><div style="width:${(porCategoria[catId]/maxCat)*100}%"></div></div></div>`;
  }
  html += `</div><div class="card"><h2>Alumnos por sexo</h2>`;
  const totalSexo = Math.max(1, porSexo.Masculino + porSexo.Femenino);
  for(const s in porSexo){
    html += `<div style="margin-bottom:8px"><div class="row-flex" style="justify-content:space-between;font-size:12px"><span>${s}</span><span><b>${porSexo[s]}</b></span></div>
      <div class="chart-bar"><div style="width:${(porSexo[s]/totalSexo)*100}%"></div></div></div>`;
  }
  html += '</div></div><div class="grid-2">';
  html += '<div class="card"><h2>Productos con stock bajo</h2>';
  const bajo = db.productos.filter(p => Number(p.stock) <= Number(p.stockMinimo));
  if(bajo.length === 0) html += '<div class="empty">Todo en orden</div>';
  else {
    html += '<table><thead><tr><th>Producto</th><th>Stock</th><th>Mínimo</th></tr></thead><tbody>';
    for(const p of bajo) html += `<tr><td>${p.nombre}</td><td>${p.stock}</td><td>${p.stockMinimo}</td></tr>`;
    html += '</tbody></table>';
  }
  html += '</div><div class="card"><h2>Equipamiento prestado</h2>';
  const activos2 = db.prestamos.filter(p => p.devuelto !== 'Sí');
  if(activos2.length === 0) html += '<div class="empty">Sin préstamos activos</div>';
  else {
    html += '<table><thead><tr><th>Equipo</th><th>Personal</th><th>Cant.</th><th>Entrega</th></tr></thead><tbody>';
    for(const p of activos2){
      html += `<tr><td>${refLabel('equipamiento', p.equipoId)}</td><td>${refLabel('personal', p.personalId)}</td><td>${p.cantidad}</td><td>${fmtDate(p.fechaEntrega)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

function resetearDatos(){
  if(!confirm('¿Borrar todos los datos y reiniciar la demo?')) return;
  db = seedDB(); saveDB(); navigate('dashboard'); alert('Sistema reiniciado');
}

// ============ EXPORT / IMPORT ============
function exportarJSON(){
  const dataStr = JSON.stringify(db, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'arnel-system-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importarJSON(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if(!confirm('¿Reemplazar todos los datos actuales?')) return;
      db = data;
      const seed = seedDB();
      for(const k in seed){ if(!(k in db)) db[k] = seed[k]; }
      saveDB(); navigate('dashboard'); alert('Datos importados');
    } catch(err){ alert('JSON inválido: ' + err.message); }
  };
  reader.readAsText(file); input.value = '';
}

// ============ CONVERTIR PREINSCRIPCION ============
function convertirDeportista(preId){
  const p = db.preinscripciones.find(x => x.id === preId);
  if(!p) return;
  showForm('Convertir preinscripción en deportista', ENT.deportistas.fields, {
    dni: p.dni || '', nombres:p.nombres, apellidos:p.apellidos, fechaNacimiento:p.fechaNacimiento,
    sexo:p.sexo, telefono:p.telefono, tutor:p.representante, categoriaId:p.categoriaInteres,
    fechaIngreso:todayStr(), estado:'Activo', tarifa:250, beca:0
  }, (data) => {
    if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
    if(!validarDNI(data.dni)){
      const dup = db.deportistas.find(d => d.dni === data.dni && d.estado === 'Activo');
      alert(`❌ Ya existe un jugador ACTIVO con el DNI ${data.dni}:\n\n${dup.nombres} ${dup.apellidos}\n\nDebe dar de baja al jugador existente.`);
      return false;
    }
    data.id = uid('dep');
    db.deportistas.push(data);
    p.estado = 'Aprobada';
    saveDB();
    alert('✅ Deportista creado exitosamente');
    navigate('preinscripciones');
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Santos FC — Sistema de Gestión</title>
<style>
:root {
  --brand-dark: #001838;
  --brand-blue: #00AEEF;
  --brand-blue-hover: #0095cc;
  --bg-body: #f4f7f9;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --border-light: #e2e8f0;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-body);color:var(--text-main);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}

/* ============ SIDEBAR PREMIUM ============ */
aside{width:270px;background:var(--brand-dark);color:#e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;box-shadow:4px 0 15px rgba(0,0,0,.1);z-index:10}
aside .logo{padding:30px 20px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg, rgba(0,168,232,0.1) 0%, transparent 100%)}
aside .logo img{width:130px;height:auto;display:inline-block;filter:drop-shadow(0 8px 16px rgba(0,174,239,.3));margin-bottom:12px;transition:transform .3s}
aside .logo img:hover{transform:scale(1.05)}
aside .logo .brand-name{font-weight:800;font-size:20px;color:#ffffff;letter-spacing:1.5px;line-height:1.1}
aside .logo .brand-sub{display:block;color:var(--brand-blue);font-size:10px;font-weight:700;margin-top:6px;letter-spacing:1px;text-transform:uppercase}
aside nav{flex:1;overflow-y:auto;padding:12px 12px 24px}
aside nav::-webkit-scrollbar{width:6px}
aside nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
aside nav .group{color:#64748b;font-size:10px;text-transform:uppercase;padding:18px 10px 8px;font-weight:700;letter-spacing:1px}
aside nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#cbd5e1;text-decoration:none;border-radius:8px;font-size:13.5px;cursor:pointer;margin-bottom:2px;font-weight:500;transition:all .2s}
aside nav a svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;opacity:.7;transition:all .2s}
aside nav a:hover{background:rgba(255,255,255,.05);color:#ffffff}
aside nav a:hover svg{opacity:1}
aside nav a.active{background:var(--brand-blue);color:#ffffff;font-weight:600;box-shadow:0 4px 12px rgba(0,174,239,.4)}
aside nav a.active svg{opacity:1;stroke-width:2.5}

/* ============ MAIN CONTENT ============ */
main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
header{background:#ffffff;padding:16px 28px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:5}
header h1{font-size:20px;font-weight:700;color:var(--brand-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .actions{display:flex;gap:10px;align-items:center}
#content{flex:1;padding:28px;overflow-y:auto;scroll-behavior:smooth}

/* ============ COMPONENTES ============ */
.card{background:#ffffff;border-radius:12px;padding:24px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05), 0 2px 4px -1px rgba(0,0,0,.03);margin-bottom:20px;border:1px solid rgba(226,232,240,.5)}
.card h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:#ffffff;border-radius:12px;padding:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);border-left:4px solid var(--brand-blue);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;background:var(--brand-blue);opacity:.05;border-radius:50%;transform:translate(20px,-20px)}
.kpi .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.kpi .value{font-size:28px;font-weight:800;line-height:1;color:var(--brand-dark)}
.kpi .sub{font-size:12px;color:#94a3b8;margin-top:6px;font-weight:500}

table{width:100%;border-collapse:collapse;background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--border-light)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border-light);font-size:13.5px;vertical-align:middle}
th{background:#f8fafc;font-weight:700;color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc}

.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 6px rgba(0,0,0,.1)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand-blue);color:#ffffff}
.btn-primary:hover{background:var(--brand-blue-hover)}
.btn-success{background:#10b981;color:#ffffff}
.btn-danger{background:#ef4444;color:#ffffff}
.btn-warning{background:#f59e0b;color:#ffffff}
.btn-secondary{background:#e2e8f0;color:var(--text-main)}
.btn-outline{background:transparent;border:1px solid var(--border-light);color:var(--text-main)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.toolbar .search{padding:10px 16px;border:1px solid var(--border-light);border-radius:8px;font-size:13.5px;min-width:280px;outline:none;transition:border .2s}
.toolbar .search:focus{border-color:var(--brand-blue);box-shadow:0 0 0 3px rgba(0,174,239,.1)}

/* ============ HERO BANNER (DASHBOARD) ============ */
.hero-banner{background:linear-gradient(135deg, var(--brand-dark) 0%, #002b5e 100%);border-radius:16px;padding:32px;color:#ffffff;display:flex;align-items:center;gap:32px;margin-bottom:24px;box-shadow:0 10px 25px rgba(0,24,56,.2);position:relative;overflow:hidden}
.hero-banner::after{content:'';position:absolute;right:-50px;top:-50px;width:300px;height:300px;background:var(--brand-blue);border-radius:50%;opacity:.1;filter:blur(40px)}
.hero-logo{width:140px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3));z-index:1}
.hero-text{z-index:1}
.hero-text h2{font-size:32px;font-weight:800;letter-spacing:1px;margin-bottom:6px;color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.hero-text p{font-size:14px;color:var(--brand-blue);text-transform:uppercase;letter-spacing:2px;font-weight:600}

/* ============ FORMULARIOS Y MODALES ============ */
#modal{position:fixed;inset:0;background:rgba(0,24,56,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.hidden{display:none}
.modal-content{background:#ffffff;border-radius:16px;padding:28px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.modal-content h2{font-size:20px;font-weight:700;margin-bottom:24px;color:var(--brand-dark)}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 14px;border:1px solid var(--border-light);border-radius:8px;font-size:14px;font-family:inherit;background:#f8fafc;transition:all .2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--brand-blue);background:#ffffff;box-shadow:0 0 0 3px rgba(0,174,239,.1)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}.hero-banner{flex-direction:column;text-align:center}}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-blue{background:#e0f2fe;color:#0369a1}
.badge-gray{background:#f1f5f9;color:#475569}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.empty{text-align:center;padding:40px;color:#94a3b8;font-style:italic}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mb-2{margin-bottom:16px}.mt-2{margin-top:16px}
.text-muted{color:var(--text-muted)}.w-100{width:100%}

/* FOTO JUGADOR */
.player-photo{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f1f5f9;border:1px solid var(--border-light);display:inline-block;vertical-align:middle}
.player-photo-lg{width:130px;height:130px;border-radius:12px;object-fit:cover;background:#f1f5f9;border:3px solid #ffffff;box-shadow:0 4px 12px rgba(0,0,0,.1);display:inline-block}
.photo-placeholder{display:inline-flex;align-items:center;justify-content:center;background:#f1f5f9;color:#94a3b8;font-size:11px;border:2px dashed #cbd5e1;font-weight:600;text-align:center}

/* KARDEX */
.kardex-header{display:flex;gap:24px;margin-bottom:24px;align-items:center;background:linear-gradient(to right, #f8fafc, #ffffff);padding:20px;border-radius:12px;border:1px solid var(--border-light)}
.kardex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kardex-item{background:#ffffff;padding:14px;border-radius:8px;border:1px solid var(--border-light);box-shadow:0 1px 2px rgba(0,0,0,.02)}
.kardex-item .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.kardex-item .val{font-size:14px;font-weight:600;color:var(--brand-dark)}

.info-box{background:#f0f9ff;border-left:4px solid var(--brand-blue);padding:16px;border-radius:8px;margin-bottom:20px;font-size:13.5px;color:#0369a1;line-height:1.5}
.warning-box{background:#fffbeb;border-left:4px solid #f59e0b;padding:16px;border-radius:8px;margin-bottom:20px;font-size:13.5px;color:#92400e}

/* BÚSQUEDA HERO */
.search-hero{background:linear-gradient(135deg, var(--brand-dark), #003b7a);color:#ffffff;padding:40px;border-radius:16px;margin-bottom:28px;box-shadow:0 10px 25px rgba(0,24,56,.2)}
.search-hero h2{color:#ffffff;margin-bottom:8px;font-size:24px;font-weight:800}
.search-hero p{color:var(--brand-blue);font-size:14px;margin-bottom:24px;font-weight:500}
.search-hero input{width:100%;padding:16px 20px;border:none;border-radius:10px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.15);outline:none;font-family:inherit}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start}
.pos-products{background:#ffffff;border-radius:12px;padding:20px;border:1px solid var(--border-light)}
.pos-cart{background:#ffffff;border-radius:12px;padding:20px;border:1px solid var(--border-light);position:sticky;top:20px}
.pos-cart-items{min-height:150px;max-height:400px;overflow-y:auto;margin:16px 0;border-top:1px solid var(--border-light);border-bottom:1px solid var(--border-light);padding:8px 0}
.pos-item{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-bottom:1px dashed var(--border-light);font-size:13px;gap:10px}
.pos-item:last-child{border-bottom:none}
.pos-total{font-size:24px;font-weight:800;padding-top:16px;margin-bottom:16px;color:var(--brand-dark);text-align:right}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.product-card{background:#f8fafc;border:1px solid var(--border-light);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;text-align:center}
.product-card:hover{background:#ffffff;border-color:var(--brand-blue);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,174,239,.15)}
.product-card .pname{font-weight:700;font-size:13px;margin-bottom:6px;color:var(--brand-dark)}
.product-card .pprice{color:var(--brand-blue);font-weight:800;font-size:14px}
.product-card .pstock{color:var(--text-muted);font-size:11px;margin-top:4px}
.chart-bar{background:#e2e8f0;border-radius:6px;height:10px;overflow:hidden;margin-top:6px}
.chart-bar div{background:var(--brand-blue);height:100%;border-radius:6px}

@media print{.no-print{display:none!important}body{background:white}#content{padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside class="no-print">
    <div class="logo">
      <!-- AQUÍ VA TU LOGO: Asegúrate de guardar la imagen como 'logo.png' en la misma carpeta -->
      <img src="logo.png" alt="Do Santos FC" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 120\'><path d=\'M50,3 L90,20 L90,60 C90,85 75,100 50,115 C25,100 10,85 10,60 L10,20 Z\' fill=\'%2300AEEF\' stroke=\'%23ffffff\' stroke-width=\'3\'/><text x=\'50\' y=\'65\' font-size=\'20\' text-anchor=\'middle\' fill=\'white\' font-weight=\'bold\'>FC</text></svg>'">
      <div class="brand-name">DO SANTOS FC</div>
      <small class="brand-sub">Sistema de Gestión</small>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header class="no-print">
      <h1 id="pageTitle">Panel Principal</h1>
      <div class="actions">
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('fileImport').click()">📤 Importar</button>
        <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importarJSON(this)">
        <button class="btn btn-primary btn-sm" onclick="exportarJSON()">📥 Exportar JSON</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<div id="modal" class="hidden"></div>

<script>
// ============ DB ============
const DB_KEY = 'dosantos_system_db_v3';
const seedCategorias = [
  {id:'cat_sub7', nombre:'Sub 7', edadMin:6, edadMax:7},
  {id:'cat_sub8', nombre:'Sub 8', edadMin:7, edadMax:8},

function seedDB(){
  const hoy = new Date().toISOString().slice(0,10);
  const mes = hoy.slice(0,7);
  return {
    config:{nombre:'Do Santos FC', moneda:'Bs', mensualidadBase:250, sucursal:'Principal'},
    categorias:[...seedCategorias],
    deportistas:[
      {id:'d1',dni:'7845123',fechaVencimientoDni:'2028-05-15',foto:'',nombres:'Carlos',apellidos:'Quispe',fechaNacimiento:'2010-05-12',sexo:'Masculino',direccion:'Av. Central #123',telefono:'77712345',tutor:'María Quispe',telefonoEmergencia:'77799999',fechaIngreso:hoy,categoriaId:'cat_sub14',turno:'Tarde',horario:'16:00-18:00',estado:'Activo',tipoSangre:'O+',alergias:'Ninguna',antecedentes:'',observacionesMedicas:'',tarifa:250,beca:0},
      {id:'d2',dni:'7845124',fechaVencimientoDni:'2027-08-20',foto:'',nombres:'Luis',apellidos:'Mamani',fechaNacimiento:'2011-08-20',sexo:'Masculino',direccion:'Calle Los Pinos #45',telefono:'77754321',tutor:'Pedro Mamani',telefonoEmergencia:'77711111',fechaIngreso:hoy,categoriaId:'cat_sub13',turno:'Tarde',horario:'16:00-18:00',estado:'Activo',tipoSangre:'A+',alergias:'Penicilina',antecedentes:'',observacionesMedicas:'',tarifa:250,beca:50},
      {id:'d3',dni:'7845125',fechaVencimientoDni:'2029-03-15',foto:'',nombres:'Ana',apellidos:'Flores',fechaNacimiento:'2009-03-15',sexo:'Femenino',direccion:'Av. Las Américas #88',telefono:'77788888',tutor:'Rosa Flores',telefonoEmergencia:'77722222',fechaIngreso:hoy,categoriaId:'cat_sub15f',turno:'Mañana',horario:'08:00-10:00',estado:'Activo',tipoSangre:'B+',alergias:'Ninguna',antecedentes:'',observacionesMedicas:'',tarifa:250,beca:0}
    ],
    personal:[
      {id:'p1',nombres:'Juan',apellidos:'Pérez',cargo:'Entrenador',especialidad:'Fútbol formativo',telefono:'77710000',email:'juan@dosantos.com',fechaIngreso:hoy,salario:2500,estado:'Activo',observaciones:''},
      {id:'p2',nombres:'María',apellidos:'Torrez',cargo:'Secretaria',especialidad:'',telefono:'77720000',email:'maria@dosantos.com',fechaIngreso:hoy,salario:1800,estado:'Activo',observaciones:''}
    ],
    usuarios:[
      {id:'u1',nombre:'Superadmin',usuario:'admin',rol:'Superadministrador',activo:'true'},
      {id:'u2',nombre:'Cajero Principal',usuario:'cajero',rol:'Cajero',activo:'true'}
    ],
    pagos:[], movCaja:[], cajaChica:[],
    productos:[
      {id:'pr1',nombre:'Camiseta Oficial Talla M',categoria:'Camiseta',talla:'M',color:'Celeste',precioCompra:60,precioVenta:100,stock:15,stockMinimo:5},
      {id:'pr2',nombre:'Short Deportivo Talla M',categoria:'Short',talla:'M',color:'Azul Marino',precioCompra:40,precioVenta:70,stock:12,stockMinimo:5},
      {id:'pr3',nombre:'Medias Deportivas',categoria:'Medias',talla:'Única',color:'Blanco',precioCompra:10,precioVenta:25,stock:3,stockMinimo:5}
    ],

    equipamiento:[
      {id:'eq1',nombre:'Balón Fútbol 5',tipo:'Balón',cantidad:10,estado:'Bueno',observaciones:''},
      {id:'eq2',nombre:'Conos Naranja',tipo:'Conos',cantidad:30,estado:'Bueno',observaciones:''},
      {id:'eq3',nombre:'Petos Azules',tipo:'Petos',cantidad:20,estado:'Bueno',observaciones:''}
    ],
    prestamos:[], canchas:[

      {id:'c2',nombre:'Cancha Sintética 1',ubicacion:'Sede Central',capacidad:14,tipo:'Fútbol 7',estado:'Disponible'}
    ],
    reservas:[], notificaciones:[], asistencias:[], evaluaciones:[], asistenciasPersonal:[], pagosPersonal:[],
    preinscripciones:[
      {id:'pre1',nombres:'Diego',apellidos:'Rojas',fechaNacimiento:'2012-01-10',sexo:'Masculino',representante:'Sofía Rojas',telefono:'77770001',categoriaInteres:'cat_sub12',estado:'Pendiente'}
    ],
    noticias:[
      {id:'n1',titulo:'Inicio de temporada 2025',contenido:'Damos la bienvenida a todos nuestros alumnos a la nueva temporada deportiva.',fecha:hoy,autor:'Administración'}
    ]
  };
}
let db = null;
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ db = JSON.parse(raw);}catch(e){ db = seedDB(); } }
  else { db = seedDB(); }
  const seed = seedDB();
  for(const k in seed){ if(!(k in db)) db[k] = seed[k]; }
  saveDB();
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ alert('⚠️ Almacenamiento lleno. Exporta el JSON y borra registros antiguos.'); } }
function uid(p='id'){ return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

// ============ HELPERS ============
function refLabel(source, id){
  if(!id) return '-';
  const list = db[source] || [];
  const item = list.find(x => x.id === id);
  if(!item) return id;
  if(item.nombres) return (item.nombres + ' ' + (item.apellidos||'')).trim();
  return item.nombre || item.titulo || id;
}
function fmtBs(n){ return 'Bs ' + (Number(n)||0).toFixed(2); }
function fmtDate(d){ if(!d) return '-'; try{ return new Date(d+'T00:00:00').toLocaleDateString('es-BO'); }catch(e){ return d; } }
function fmtDateTime(iso){ if(!iso) return '-'; try{ const d = new Date(iso); return d.toLocaleDateString('es-BO') + ' ' + d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function currentMonth(){ return new Date().toISOString().slice(0,7); }
function photoHTML(p, size='40px'){
  if(p && p.foto) return `<img src="${p.foto}" class="player-photo" style="width:${size};height:${size}">`;
  return `<span class="player-photo photo-placeholder" style="width:${size};height:${size}">4x4</span>`;
}

function openModal(html){
  const m = document.getElementById('modal');
  m.innerHTML = '<div class="modal-content">' + html + '</div>';

// ============ PHOTO CROP ============
function cropSquare(file, size=300){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim)/2;
        const sy = (img.height - minDim)/2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,size,size);
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(fieldName, input){
  const file = input.files[0];
  if(!file) return;
  const base64 = await cropSquare(file);
  const form = document.getElementById('dynForm');
  const hidden = form.querySelector(`input[name="${fieldName}"]`);
  hidden.value = base64;
  const preview = document.getElementById(`photoPreview_${fieldName}`);
  preview.innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover">`;
}

// ============ ENTITY RENDERER ============
function renderEntity(entityKey, customActions){
  const cfg = ENT[entityKey];
  const rows = db[entityKey] || [];
  const fields = cfg.fields;
  let displayFields;
  if(entityKey === 'deportistas'){
    displayFields = fields.filter(f => ['dni','nombres','apellidos','categoriaId','telefono','estado'].includes(f.name));
  } else {
    displayFields = fields.filter(f => f.type !== 'textarea' && f.type !== 'photo').slice(0, 6);
  }

  let html = `<div class="toolbar">
    <input class="search" placeholder="Buscar..." oninput="filterTable(this,'tbl_${entityKey}')">
    <button class="btn btn-primary" onclick="entityCreate('${entityKey}')">+ Nuevo ${cfg.label}</button>
  </div>`;

  html += `<table id="tbl_${entityKey}"><thead><tr>`;
  if(entityKey === 'deportistas') html += '<th>Foto</th>';
  for(const f of displayFields){ html += `<th>${f.label}</th>`; }
  html += `<th style="text-align:right">Acciones</th></tr></thead><tbody>`;

  if(rows.length === 0){
    html += `<tr><td colspan="${displayFields.length+2}"><div class="empty">Sin registros aún. Crea el primero.</div></td></tr>`;
  } else {
    for(const row of rows){
      html += '<tr>';
      if(entityKey === 'deportistas') html += `<td>${photoHTML(row, '40px')}</td>`;
      for(const f of displayFields){
        let v = row[f.name];
        if(f.source){ v = refLabel(f.source, v); }
        else if(f.type === 'date'){ v = fmtDate(v); }
        else if(v === undefined || v === null || v === ''){ v = '<span class="text-muted">-</span>'; }
        if(f.name === 'estado'){
          const cls = v === 'Activo' ? 'badge-green' : v === 'Inactivo' ? 'badge-yellow' : 'badge-red';
          v = `<span class="badge ${cls}">${v}</span>`;
        }
        html += `<td>${v}</td>`;
      }
      html += `<td style="text-align:right;white-space:nowrap">
        ${customActions ? customActions(row) : ''}
        <button class="btn btn-secondary btn-xs" onclick="entityEdit('${entityKey}','${row.id}')">Editar</button>
        <button class="btn btn-danger btn-xs" onclick="entityDelete('${entityKey}','${row.id}')">Eliminar</button>
      </td></tr>`;
    }
  }
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}
function filterTable(input, tableId){
  const term = input.value.toLowerCase();
  document.querySelectorAll('#'+tableId+' tbody tr').forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(term) ? '' : 'none';
  });
}

// ============ DNI VALIDATION ============
function validarDNI(dni, excludeId){
  if(!dni) return true;
  const dup = db.deportistas.find(d => d.dni === dni && d.id !== excludeId && d.estado === 'Activo');
  return !dup;
}

function entityCreate(key){
  const cfg = ENT[key];
  showForm('Nuevo '+cfg.label, cfg.fields, null, (data) => {
    if(key === 'deportistas'){
      if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
      if(!validarDNI(data.dni)){
        const dup = db.deportistas.find(d => d.dni === data.dni && d.estado === 'Activo');
        alert(`❌ Ya existe un jugador ACTIVO con el DNI ${data.dni}:\n\n${dup.nombres} ${dup.apellidos}\n\nDebe dar de BAJA al jugador existente antes de registrar uno nuevo con el mismo DNI.`);
        return false;
      }
    }
    data.id = uid(key);
    db[key].push(data);
    saveDB();
    navigate(currentRoute);
  });
}
function entityEdit(key, id){
  const cfg = ENT[key];
  const item = db[key].find(x => x.id === id);
  if(!item) return;
  showForm('Editar '+cfg.label, cfg.fields, item, (data) => {
    if(key === 'deportistas'){
      if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
      if(!validarDNI(data.dni, id)){
        const dup = db.deportistas.find(d => d.dni === data.dni && d.id !== id && d.estado === 'Activo');
        alert(`❌ Ya existe otro jugador ACTIVO con el DNI ${data.dni}:\n\n${dup.nombres} ${dup.apellidos}\n\nDebe dar de BAJA al jugador existente antes de usar el mismo DNI.`);
        return false;
      }
    }
    Object.assign(item, data);
    saveDB();
    navigate(currentRoute);
  });
}
function entityDelete(key, id){
  if(!confirm('¿Eliminar este registro?')) return;
  db[key] = db[key].filter(x => x.id !== id);
  saveDB();
  navigate(currentRoute);
}

      html += `<tr><td>${fmtDateTime(v.fechaHora) || fmtDate(v.fecha)}</td><td>${(v.items||[]).length} producto(s)</td><td>${fmtBs(v.total)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}
function kpi(label, value, sub){
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||''}</div></div>`;
}
function calcularDeudaTotal(){
  const mes = currentMonth();
  let total = 0;
  for(const d of db.deportistas.filter(x => x.estado === 'Activo')){
    const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
    const pagado = db.pagos.filter(p => p.deportistaId === d.id && p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
    total += Math.max(0, tarifa - pagado);
  }
  return total;
}

function buscarJugadores(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if(term.length < 2){ results.innerHTML = '<div class="empty">Ingresa al menos 2 caracteres</div>'; return; }
  const found = db.deportistas.filter(d => {
    const txt = `${d.dni||''} ${d.nombres||''} ${d.apellidos||''} ${d.telefono||''} ${d.tutor||''} ${d.telefonoEmergencia||''}`.toLowerCase();
    return txt.includes(term);
  });
  if(found.length === 0){ results.innerHTML = '<div class="empty">No se encontraron jugadores</div>'; return; }
  let html = `<div class="card"><h2>${found.length} resultado(s)</h2>
    <table><thead><tr><th>Foto</th><th>DNI</th><th>Nombre completo</th><th>Categoría</th><th>Contacto</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>`;

function renderAsistenciasLista(){
  const fecha = document.getElementById('asistFecha').value;
  const catId = document.getElementById('asistCat').value;
  let alumnos = db.deportistas.filter(d => d.estado === 'Activo');
  if(catId) alumnos = alumnos.filter(d => d.categoriaId === catId);
  const contenedor = document.getElementById('asistLista');
  if(alumnos.length === 0){ contenedor.innerHTML = '<div class="empty">No hay alumnos</div>'; return; }
  let html = '<table><thead><tr><th>Foto</th><th>Deportista</th><th>DNI</th><th>Estado</th></tr></thead><tbody>';
  for(const d of alumnos){
    const existing = db.asistencias.find(a => a.deportistaId === d.id && a.fecha === fecha);
    const estado = existing ? existing.estado : 'Presente';
    html += `<tr>
      <td>${photoHTML(d, '32px')}</td>
      <td>${d.nombres} ${d.apellidos}</td>
      <td>${d.dni||'-'}</td>
      <td><select onchange="guardarAsistencia('${d.id}','${fecha}',this.value)" style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px">
        ${['Presente','Tarde','Ausente','Justificado'].map(e => `<option ${estado===e?'selected':''}>${e}</option>`).join('')}
      </select></td>
    </tr>`;
  }
  html += '</tbody></table>';
  contenedor.innerHTML = html;
}
function guardarAsistencia(deportistaId, fecha, estado){
  const existing = db.asistencias.find(a => a.deportistaId === deportistaId && a.fecha === fecha);
  if(existing) existing.estado = estado;
  else db.asistencias.push({id:uid('asis'), deportistaId, fecha, estado, observaciones:''});
  saveDB();
}

  let totalFacturado = 0, totalCobrado = 0;
  for(const d of activos){
    const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
    const pagado = db.pagos.filter(p => p.deportistaId === d.id && p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
    const saldo = Math.max(0, tarifa - pagado);
    totalFacturado += tarifa; totalCobrado += Math.min(pagado, tarifa);
    const estado = pagado >= tarifa && tarifa > 0 ? '<span class="badge badge-green">Pagado</span>'
      : pagado > 0 ? '<span class="badge badge-yellow">Parcial</span>' : '<span class="badge badge-red">Pendiente</span>';
    html += `<tr>
      <td>${photoHTML(d, '36px')}</td>
      <td>${d.nombres} ${d.apellidos}</td>
      <td>${d.dni||'-'}</td>
      <td>${fmtBs(tarifa)}</td>
      <td>${fmtBs(pagado)}</td>
      <td>${fmtBs(saldo)}</td>
      <td>${estado}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-success btn-xs" onclick="abrirPagoDeportista('${d.id}')">+ Pago</button>
        <button class="btn btn-primary btn-xs" onclick="verKardex('${d.id}')">Kardex</button>
      </td>
    </tr>`;
  }
  html += `</tbody></table>
    <div class="row-flex mt-2" style="justify-content:space-between;background:#f8fafc;padding:16px;border-radius:8px">
      <div>Facturado: <b>${fmtBs(totalFacturado)}</b></div>
      <div>Cobrado: <b>${fmtBs(totalCobrado)}</b></div>
      <div>Pendiente: <b style="color:#ef4444">${fmtBs(totalFacturado - totalCobrado)}</b></div>
    </div>
  </div>`;

  html += `<div class="card"><h2>Historial general de pagos</h2>`;
  const pagos = [...db.pagos].sort((a,b)=>(b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||'')).slice(0, 100);
  if(pagos.length === 0) html += '<div class="empty">Sin pagos</div>';
  else {
    html += '<table><thead><tr><th>Fecha/Hora</th><th>Deportista</th><th>Mes</th><th>Monto</th><th>Método</th><th>Estado</th><th style="text-align:right">Acción</th></tr></thead><tbody>';
    for(const p of pagos){
      const rev = p.revertido ? '<span class="badge badge-red">Revertido</span>' : '<span class="badge badge-green">Vigente</span>';
      html += `<tr><td>${fmtDateTime(p.fechaHora) || fmtDate(p.fecha)}</td><td>${refLabel('deportistas', p.deportistaId)}</td><td>${p.mes||'-'}</td><td>${fmtBs(p.monto)}</td><td>${p.metodo||'-'}</td><td>${rev}</td>
        <td style="text-align:right">${!p.revertido ? `<button class="btn btn-danger btn-xs" onclick="revertirPago('${p.id}')">Revertir</button>` : ''}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function abrirPagoDeportista(deportistaId){
  const d = db.deportistas.find(x => x.id === deportistaId);
  if(!d) return;
  const mes = currentMonth();
  const tarifa = (Number(d.tarifa)||250) * (1 - (Number(d.beca)||0)/100);
  const pagado = db.pagos.filter(p => p.deportistaId === d.id && p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
  const saldo = Math.max(0, tarifa - pagado);
  showForm('Pagar suscripción — ' + d.nombres + ' ' + d.apellidos, [
    {name:'mes', label:'Mes (YYYY-MM)', type:'text', default:mes, required:true},
    {name:'monto', label:'Monto (Bs)', type:'number', default:saldo, required:true},
    {name:'fecha', label:'Fecha del pago', type:'date', default:todayStr(), required:true},
    {name:'metodo', label:'Método', type:'select', options:['Efectivo','Transferencia','QR','Otro'], default:'Efectivo'}
  ], null, (data) => {
    const fechaHora = new Date().toISOString();
    db.pagos.push({id:uid('pago'), deportistaId, ...data, fechaHora, revertido:false});
    db.movCaja.push({
      id:uid('mov'), fecha:data.fecha, fechaHora, tipo:'Ingreso',
      concepto:`Suscripción ${d.nombres} ${d.apellidos} — ${data.mes}`,
      monto:Number(data.monto), origen:'Suscripción', refId: null
    });
    saveDB();
    navigate(currentRoute);
  });
}

function revertirPago(pagoId){
  const p = db.pagos.find(x => x.id === pagoId);
  if(!p) return;
  if(!confirm(`¿Revertir el pago de ${fmtBs(p.monto)}?\n\nEsto generará un movimiento de reversión en caja.`)) return;
  p.revertido = true;
  p.fechaReversion = new Date().toISOString();
  const d = db.deportistas.find(x => x.id === p.deportistaId);
  db.movCaja.push({
    id:uid('mov'), fecha:todayStr(), fechaHora:new Date().toISOString(), tipo:'Egreso',
    concepto:`REVERSIÓN pago — ${d ? d.nombres+' '+d.apellidos : p.deportistaId} — ${p.mes}`,
    monto:Number(p.monto), origen:'Reversión suscripción'
  });
  saveDB();
  navigate(currentRoute);
  alert('✅ Pago revertido correctamente. Se generó un egreso en el libro diario.');
}

function renderLibroDiario(){
  const mes = currentMonth();
  const filtroMes = window._libroMes || mes;
  window._libroMes = filtroMes;

  const entries = [];
  for(const m of db.movCaja){
    entries.push({
      fechaHora: m.fechaHora || (m.fecha + 'T12:00:00'),
      tipo: m.tipo,
      concepto: m.concepto || '-',
      origen: m.origen || '-',
      monto: Number(m.monto) || 0,
      ref: 'caja'
    });
  }
  for(const c of db.cajaChica){
    entries.push({
      fechaHora: c.fecha + 'T12:00:00',
      tipo: 'Egreso',
      concepto: 'Caja chica: ' + (c.concepto||'-'),
      origen: 'Caja chica',
      monto: Number(c.monto) || 0,
      ref: 'cc'
    });
  }
  const filtered = entries.filter(e => (e.fechaHora||'').startsWith(filtroMes))
    .sort((a,b) => (b.fechaHora||'').localeCompare(a.fechaHora||''));

  const totalIng = filtered.filter(e => e.tipo === 'Ingreso').reduce((s,e) => s + e.monto, 0);

  let html = `<div class="card">
    <div class="row-flex" style="justify-content:space-between;margin-bottom:16px">
      <div class="row-flex">
        <label style="font-size:13px;font-weight:700;color:var(--brand-dark)">Mes:</label>
        <input type="month" value="${filtroMes}" onchange="window._libroMes=this.value;renderLibroDiario()" style="padding:8px;border:1px solid #cbd5e1;border-radius:6px">
      </div>
      <div class="row-flex" style="gap:16px">
        <span style="color:#166534"><b>Ingresos:</b> ${fmtBs(totalIng)}</span>
        <span style="color:#991b1b"><b>Egresos:</b> ${fmtBs(totalEgr)}</span>
        <span style="background:var(--brand-dark);color:white;padding:6px 12px;border-radius:6px"><b>Saldo: ${fmtBs(totalIng - totalEgr)}</b></span>
      </div>
    </div>
    <div class="info-box">
      <b>📒 Libro Diario unificado:</b> Aquí se registran TODOS los movimientos financieros: suscripciones, ventas de productos, reversiones, gastos de caja chica y movimientos manuales de caja.
    </div>
    <table><thead><tr><th>Fecha/Hora</th><th>Tipo</th><th>Concepto</th><th>Origen</th><th style="text-align:right">Monto</th></tr></thead><tbody>`;
  if(filtered.length === 0) html += '<tr><td colspan="5"><div class="empty">Sin movimientos este mes</div></td></tr>';
  else for(const e of filtered){
    const cls = e.tipo === 'Ingreso' ? 'badge-green' : 'badge-red';
    const signo = e.tipo === 'Ingreso' ? '+' : '-';
    html += `<tr>
      <td>${fmtDateTime(e.fechaHora)}</td>
      <td><span class="badge ${cls}">${e.tipo}</span></td>
      <td>${e.concepto}</td>
      <td>${e.origen}</td>
      <td style="text-align:right;font-weight:700;color:${e.tipo==='Ingreso'?'#166534':'#991b1b'}">${signo} ${fmtBs(e.monto)}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
}

// ============ POS ============
let posCart = [];
function renderPOS(){
  const productos = db.productos.filter(p => Number(p.stock) > 0);
  let html = `<div class="pos-layout">
    <div class="pos-products"><h2 style="margin-bottom:16px">Productos disponibles</h2><div class="product-grid">`;
  if(productos.length === 0) html += '<div class="empty">Sin productos con stock</div>';
  for(const p of productos){
    html += `<div class="product-card" onclick="posAdd('${p.id}')">
      <div class="pname">${p.nombre}</div>
      <div class="pprice">${fmtBs(p.precioVenta)}</div>
      <div class="pstock">Stock: ${p.stock}</div>
    </div>`;
  }
  html += `</div></div><div class="pos-cart"><h2>Carrito</h2><div class="pos-cart-items">`;
  if(posCart.length === 0) html += '<div class="empty">Carrito vacío</div>';
  else for(let i = 0; i < posCart.length; i++){
    const item = posCart[i];
    html += `<div class="pos-item">
      <div style="flex:1"><b>${item.nombre}</b><br><span class="text-muted">${fmtBs(item.precio)} x ${item.cantidad}</span></div>
      <div style="text-align:right"><div style="font-weight:700">${fmtBs(item.precio * item.cantidad)}</div>
      <button class="btn btn-danger btn-xs" style="margin-top:4px" onclick="posRemove(${i})">Eliminar</button></div>
    </div>`;
  }
  html += `</div>
    <div class="pos-total">Total: ${fmtBs(posCart.reduce((s,i) => s + i.precio*i.cantidad, 0))}</div>
    <button class="btn btn-success w-100" style="padding:14px" onclick="posCheckout()" ${posCart.length===0?'disabled':''}>Registrar venta</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="posCart=[];renderPOS()" ${posCart.length===0?'disabled':''}>Vaciar</button>
  </div></div>`;
  document.getElementById('content').innerHTML = html;
}
function posAdd(productoId){
  const p = db.productos.find(x => x.id === productoId);
  if(!p) return;
  const existing = posCart.find(i => i.productoId === productoId);
  if(existing){
    if(existing.cantidad + 1 > Number(p.stock)){ alert('Stock insuficiente'); return; }
    existing.cantidad++;
  } else posCart.push({productoId, nombre:p.nombre, precio:Number(p.precioVenta), cantidad:1});
  renderPOS();
}
function posRemove(idx){ posCart.splice(idx,1); renderPOS(); }
function posCheckout(){
  if(posCart.length === 0) return;
  const total = posCart.reduce((s,i) => s + i.precio*i.cantidad, 0);
  showForm('Confirmar venta', [
    {name:'cliente', label:'Cliente (opcional)', type:'text'},
    {name:'metodo', label:'Método de pago', type:'select', options:['Efectivo','Transferencia','QR','Otro'], default:'Efectivo'}
  ], null, (data) => {
    for(const item of posCart){
      const p = db.productos.find(x => x.id === item.productoId);
      if(p) p.stock = Number(p.stock) - item.cantidad;
    }
    const fechaHora = new Date().toISOString();
    const venta = {id:uid('venta'), fecha:todayStr(), fechaHora, items:[...posCart], total, metodo:data.metodo, cliente:data.cliente, revertida:false};
    db.ventas.push(venta);
    db.movCaja.push({
      id:uid('mov'), fecha:todayStr(), fechaHora, tipo:'Ingreso',
      concepto:'Venta POS — ' + posCart.map(i => i.nombre+' x'+i.cantidad).join(', '),
      monto:total, origen:'Venta'
    });
    posCart = [];
    saveDB(); navigate('pos');
    alert('✅ Venta registrada: ' + fmtBs(total));
  });
}

// ============ VENTAS (con reversión) ============
function renderVentas(){
  const ventas = [...db.ventas].sort((a,b)=>(b.fechaHora||b.fecha||'').localeCompare(a.fechaHora||a.fecha||''));
  let html = `<div class="card">
    <div class="info-box">
      <b>🧾 Resumen de ventas:</b> Aquí puedes ver todas las ventas realizadas y <b>revertir</b> cualquiera en caso de error humano. La reversión restaura el stock y registra el ajuste en el libro diario.
    </div>
    <div class="row-flex mb-2" style="justify-content:space-between">
      <div><b>Total ventas vigentes:</b> ${fmtBs(ventas.filter(v=>!v.revertida).reduce((s,v)=>s+Number(v.total),0))}</div>
      <div><b>Ventas revertidas:</b> ${ventas.filter(v=>v.revertida).length}</div>
    </div>
    <table><thead><tr><th>Fecha/Hora</th><th>Items</th><th>Cliente</th><th>Método</th><th>Total</th><th>Estado</th><th style="text-align:right">Acción</th></tr></thead><tbody>`;
  if(ventas.length === 0) html += '<tr><td colspan="7"><div class="empty">Sin ventas registradas</div></td></tr>';
  else for(const v of ventas){
    const items = (v.items||[]).map(i => i.nombre+' x'+i.cantidad).join('<br>');
    const est = v.revertida ? '<span class="badge badge-red">Revertida</span>' : '<span class="badge badge-green">Vigente</span>';
    html += `<tr>
      <td>${fmtDateTime(v.fechaHora) || fmtDate(v.fecha)}</td>
      <td style="font-size:12px">${items}</td>
      <td>${v.cliente||'-'}</td>
      <td>${v.metodo||'-'}</td>
      <td><b>${fmtBs(v.total)}</b></td>
      <td>${est}</td>
      <td style="text-align:right">
        ${!v.revertida ? `<button class="btn btn-danger btn-xs" onclick="revertirVenta('${v.id}')">↩ Revertir</button>` : ''}
      </td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
}

function revertirVenta(ventaId){
  const v = db.ventas.find(x => x.id === ventaId);
  if(!v) return;
  if(v.revertida){ alert('Esta venta ya fue revertida'); return; }
  if(!confirm(`¿Revertir esta venta de ${fmtBs(v.total)}?\n\nSe restaurará el stock de los productos y se generará un egreso de reversión en caja.`)) return;
  for(const item of v.items){
    const p = db.productos.find(x => x.id === item.productoId);
    if(p) p.stock = Number(p.stock) + item.cantidad;
  }
  v.revertida = true;
  v.fechaReversion = new Date().toISOString();
  db.movCaja.push({
    id:uid('mov'), fecha:todayStr(), fechaHora:new Date().toISOString(), tipo:'Egreso',
    concepto:'REVERSIÓN venta — ' + v.items.map(i => i.nombre+' x'+i.cantidad).join(', '),
    monto:Number(v.total), origen:'Reversión venta'
  });
  saveDB();
  navigate('ventas');
  alert('✅ Venta revertida. Stock restaurado y movimiento registrado en libro diario.');
}

  ], null, (data) => {
    db.notificaciones.push({id:uid('not'), fecha:todayStr(), leida:false, ...data});
    saveDB(); navigate('notificaciones');
  });
}
function marcarLeida(id){
  const n = db.notificaciones.find(x => x.id === id);
  if(n){ n.leida = true; saveDB(); navigate('notificaciones'); }
}
function borrarNotif(id){
  if(!confirm('¿Eliminar?')) return;
  db.notificaciones = db.notificaciones.filter(x => x.id !== id);
  saveDB(); navigate('notificaciones');
}

// ============ REPORTES ============
function renderReportes(){
  const mes = currentMonth();
  const activos = db.deportistas.filter(d => d.estado === 'Activo').length;
  const inactivos = db.deportistas.filter(d => d.estado !== 'Activo').length;
  const porCategoria = {}, porSexo = {Masculino:0, Femenino:0};
  for(const d of db.deportistas){ porCategoria[d.categoriaId] = (porCategoria[d.categoriaId]||0)+1; if(porSexo[d.sexo] !== undefined) porSexo[d.sexo]++; }
  const ingresosMes = db.pagos.filter(p => p.mes === mes && !p.revertido).reduce((s,p) => s + (Number(p.monto)||0), 0);
  const ingresosVentas = db.ventas.filter(v => (v.fecha||'').startsWith(mes) && !v.revertida).reduce((s,v) => s + (Number(v.total)||0), 0);
  const egresos = db.movCaja.filter(m => (m.fecha||'').startsWith(mes) && m.tipo === 'Egreso').reduce((s,m) => s + (Number(m.monto)||0), 0);
  const deuda = calcularDeudaTotal();

  let html = `<div class="kpis">
    ${kpi('Alumnos activos', activos, inactivos+' inactivos')}
    ${kpi('Ingresos suscripciones', fmtBs(ingresosMes), 'Mes actual')}
    ${kpi('Ingresos por ventas', fmtBs(ingresosVentas), 'Mes actual')}
    ${kpi('Egresos', fmtBs(egresos), 'Mes actual')}
    ${kpi('Deuda pendiente', fmtBs(deuda), 'Cobranza')}
  </div>
  <div class="grid-2">
    <div class="card"><h2>Alumnos por categoría</h2>`;
  const maxCat = Math.max(1, ...Object.values(porCategoria));
  for(const catId in porCategoria){
    html += `<div style="margin-bottom:12px"><div class="row-flex" style="justify-content:space-between;font-size:12px;font-weight:600"><span>${refLabel('categorias', catId)}</span><span>${porCategoria[catId]}</span></div>
      <div class="chart-bar"><div style="width:${(porCategoria[catId]/maxCat)*100}%"></div></div></div>`;
  }
  html += `</div><div class="card"><h2>Alumnos por sexo</h2>`;
  const totalSexo = Math.max(1, porSexo.Masculino + porSexo.Femenino);
  for(const s in porSexo){
    html += `<div style="margin-bottom:12px"><div class="row-flex" style="justify-content:space-between;font-size:12px;font-weight:600"><span>${s}</span><span>${porSexo[s]}</span></div>
      <div class="chart-bar"><div style="width:${(porSexo[s]/totalSexo)*100}%"></div></div></div>`;
  }
  html += '</div></div><div class="grid-2">';
  html += '<div class="card"><h2>Productos con stock bajo</h2>';
  const bajo = db.productos.filter(p => Number(p.stock) <= Number(p.stockMinimo));
  if(bajo.length === 0) html += '<div class="empty">Todo en orden</div>';
  else {
    html += '<table><thead><tr><th>Producto</th><th>Stock</th><th>Mínimo</th></tr></thead><tbody>';
    for(const p of bajo) html += `<tr><td>${p.nombre}</td><td><span class="badge badge-red">${p.stock}</span></td><td>${p.stockMinimo}</td></tr>`;
    html += '</tbody></table>';
  }
  html += '</div><div class="card"><h2>Equipamiento prestado</h2>';
  const activos2 = db.prestamos.filter(p => p.devuelto !== 'Sí');
  if(activos2.length === 0) html += '<div class="empty">Sin préstamos activos</div>';
  else {
    html += '<table><thead><tr><th>Equipo</th><th>Personal</th><th>Cant.</th><th>Entrega</th></tr></thead><tbody>';
    for(const p of activos2){
      html += `<tr><td>${refLabel('equipamiento', p.equipoId)}</td><td>${refLabel('personal', p.personalId)}</td><td>${p.cantidad}</td><td>${fmtDate(p.fechaEntrega)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

function resetearDatos(){

  db = seedDB(); saveDB(); navigate('dashboard'); alert('Sistema reiniciado');

// ============ EXPORT / IMPORT ============
function exportarJSON(){
  const dataStr = JSON.stringify(db, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dosantos-system-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importarJSON(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if(!confirm('¿Reemplazar todos los datos actuales?')) return;
      db = data;
      const seed = seedDB();
      for(const k in seed){ if(!(k in db)) db[k] = seed[k]; }
      saveDB(); navigate('dashboard'); alert('Datos importados');
    } catch(err){ alert('JSON inválido: ' + err.message); }
  };
  reader.readAsText(file); input.value = '';
}

// ============ CONVERTIR PREINSCRIPCION ============
function convertirDeportista(preId){
  const p = db.preinscripciones.find(x => x.id === preId);
  if(!p) return;
  showForm('Convertir preinscripción en deportista', ENT.deportistas.fields, {
    dni: p.dni || '', nombres:p.nombres, apellidos:p.apellidos, fechaNacimiento:p.fechaNacimiento,
    sexo:p.sexo, telefono:p.telefono, tutor:p.representante, categoriaId:p.categoriaInteres,
    fechaIngreso:todayStr(), estado:'Activo', tarifa:250, beca:0
  }, (data) => {
    if(!data.dni){ alert('❌ El DNI es obligatorio'); return false; }
    if(!validarDNI(data.dni)){
      const dup = db.deportistas.find(d => d.dni === data.dni && d.estado === 'Activo');
      alert(`❌ Ya existe un jugador ACTIVO con el DNI ${data.dni}:\n\n${dup.nombres} ${dup.apellidos}\n\nDebe dar de baja al jugador existente.`);
      return false;
    }
    data.id = uid('dep');
    db.deportistas.push(data);
    p.estado = 'Aprobada';
    saveDB();
    alert('✅ Deportista creado exitosamente');
    navigate('preinscripciones');
  });
}

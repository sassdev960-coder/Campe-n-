<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMGest · Sistema de Gestión</title>
<style>
:root{--bg:#f5f4f1;--surface:#fff;--surface-soft:#fafaf7;--ink:#15140f;--ink-2:#3a3833;--muted:#7a766d;--line:#e8e6e0;--line-soft:#f1efea;--primary:#1c3d5a;--primary-hover:#152e45;--accent:#8a6d3b;--success:#2d6a4f;--success-soft:#eaf3ee;--warning:#9c6f1f;--warning-soft:#fbf3e2;--danger:#8b2b2b;--danger-soft:#f9ecec;--info:#1e5a8a;--info-soft:#eaf1f7;--r-lg:14px;--shadow-sm:0 1px 2px rgba(20,18,12,.04),0 1px 3px rgba(20,18,12,.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--line);padding:24px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.brand{padding:0 22px 22px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.brand-name{font-size:15px;font-weight:600}
.brand-sub{font-size:11px;color:var(--muted)}
.nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--surface-soft)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{width:15px;height:15px;stroke:var(--muted);stroke-width:1.6;fill:none;flex-shrink:0}
.nav-item.active svg{stroke:#fff}
.sidebar-footer{padding:14px 22px 0;border-top:1px solid var(--line-soft);margin:0 10px}
.user-box{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:var(--surface-soft);border:1px solid var(--line-soft)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-box select{background:transparent;border:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0;font-family:inherit;outline:none;width:100%}
.user-role{font-size:10.5px;color:var(--muted);margin-top:1px}
.main{margin-left:252px;flex:1;padding:32px 40px 60px;max-width:1300px;width:calc(100% - 252px)}
.page-head{margin-bottom:24px}
.page-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.page-desc{font-size:13.5px;color:var(--muted);margin-top:6px;max-width:720px;line-height:1.55}
.info-banner{display:flex;gap:12px;padding:14px 16px;border-radius:11px;background:var(--info-soft);border:1px solid #d1e0ec;color:#183a56;font-size:12.5px;line-height:1.6;margin-bottom:20px}
.info-banner svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;stroke-width:2;fill:none;margin-top:1px}
.info-banner strong{color:#0e2b45}
.info-banner.warn{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.info-banner.warn strong{color:#4a340b}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:600}
.card-subtitle{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi-value.is-success{color:var(--success)}
.kpi-value.is-danger{color:var(--danger)}
.kpi-value.is-warning{color:var(--warning)}
.kpi-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,61,90,.10)}
input::placeholder{color:#b5b2ab}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237a766d' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-outline:hover{border-color:#d5d2ca;background:var(--surface-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;font-size:12.5px;border-radius:6px}
.btn-ghost:hover{background:var(--surface-soft)}
.btn-block{width:100%}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:0 10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0;text-align:right}
tbody td{padding:12px 10px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
tbody td:first-child{padding-left:0;color:var(--ink)}
tbody td:last-child{padding-right:0;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bold{font-weight:600;color:var(--ink)}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:500;white-space:nowrap}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--line-soft);color:var(--muted)}
.badge-accent{background:#f3ecdc;color:var(--accent)}
.badge-cobrador{background:#e0f2ec;color:#0f5132}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:14px;border:1px solid}
.alert-info{background:var(--info-soft);border-color:#d1e0ec;color:#183a56}
.alert-warning{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.alert-danger{background:var(--danger-soft);border-color:#ecd1d1;color:#6a2020}
.alert-success{background:var(--success-soft);border-color:#c7e0cf;color:#22503c}
.alert-title{font-weight:600;margin-bottom:2px}
.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.cart-line:last-child{border-bottom:none}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:13px;font-weight:500}
.cart-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.cart-qty{width:60px;padding:4px 6px;font-size:12.5px;text-align:center}
.cart-price{width:80px;padding:4px 6px;font-size:12.5px;text-align:right}
.cart-sub{width:80px;text-align:right;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:10px;border-top:1px solid var(--line)}
.cart-total-label{font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.cart-total-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.prod-list{max-height:400px;overflow-y:auto;margin:0 -8px}
.prod-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer}
.prod-item:hover{background:var(--surface-soft)}
.prod-item.stock-0{opacity:.5;cursor:not-allowed}
.prod-name{font-size:13px;font-weight:500}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prod-price{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary)}
.prod-stock{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.bolsa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bolsa-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-soft)}
.bolsa-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.bolsa-card-op{font-size:13px;font-weight:600}
.bolsa-card-com{font-size:11px;color:var(--muted);margin-top:2px}
.bolsa-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.bolsa-row:last-child{border-bottom:none}
.bolsa-row-label{font-size:11.5px;color:var(--muted);font-weight:500}
.bolsa-row-value{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.bolsa-row-value.saldo{color:var(--primary)}
.bolsa-row-value.comision{color:var(--success)}
.bolsa-row-value.retirada{color:var(--muted);font-size:13px}
.bolsa-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.balance-hero{background:linear-gradient(135deg,#0f2942,#1c3d5a);color:#fff;border-radius:var(--r-lg);padding:32px;margin-bottom:20px}
.balance-hero-title{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a5c4ff;margin-bottom:8px}
.balance-hero-value{font-size:42px;font-weight:600;letter-spacing:-1.4px;font-variant-numeric:tabular-nums}
.balance-hero-sub{font-size:13px;color:#a5c4ff;margin-top:6px}
.balance-hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.15)}
.balance-hero-cell-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#a5c4ff;margin-bottom:6px}
.balance-hero-cell-value{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.balance-hero-cell-value.pos{color:#a8e0c2}
.balance-hero-cell-value.neg{color:#ffb3b3}
.caja-hero{background:linear-gradient(135deg,var(--primary),#0f2942);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.caja-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a5c4ff;margin-bottom:6px}
.caja-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.caja-hero-sub{font-size:12px;color:#a5c4ff;margin-top:6px}
.gan-hero{background:linear-gradient(135deg,#1f4d3a,#0f2d20);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.gan-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a8e0c2;margin-bottom:6px}
.gan-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gan-hero-sub{font-size:12px;color:#a8e0c2;margin-top:6px}
.cob-hero{background:linear-gradient(135deg,#0f5132,#083d24);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.cob-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a8e0c2;margin-bottom:6px}
.cob-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.cob-hero-sub{font-size:12px;color:#a8e0c2;margin-top:6px}
.gasto-hero{background:linear-gradient(135deg,#6a1f1f,#4a1414);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.gasto-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#ffb3b3;margin-bottom:6px}
.gasto-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gasto-hero-sub{font-size:12px;color:#ffb3b3;margin-top:6px}
.pagar-hero{background:linear-gradient(135deg,#6a4a1f,#4a3414);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.pagar-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#ffd9a5;margin-bottom:6px}
.pagar-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pagar-hero-sub{font-size:12px;color:#ffd9a5;margin-top:6px}
.turno-hero{background:linear-gradient(135deg,#3a2817,#1f1810);color:#fff;border-radius:var(--r-lg);padding:24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.turno-hero.abierto{background:linear-gradient(135deg,#1f4d3a,#0f2d20)}
.turno-label{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px}
.turno-value{font-size:22px;font-weight:600}
.turno-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,12,.5);display:grid;place-items:center;padding:20px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:26px;max-width:560px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}
.modal-alert{max-width:480px}
.alert-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px}
.alert-icon.critico{background:var(--danger-soft);color:var(--danger)}
.alert-icon.advertencia{background:var(--warning-soft);color:var(--warning)}
.alert-icon.info{background:var(--info-soft);color:var(--info)}
.alert-icon svg{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none}
.irrevocable-badge{display:inline-flex;align-items:center;gap:6px;background:var(--danger-soft);color:var(--danger);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:16px;border:1px solid #ecd1d1}
.irrevocable-badge svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none}
.alert-title-lg{font-size:18px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.alert-body{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:8px}
.alert-detail{background:var(--surface-soft);border-radius:10px;padding:14px;margin:14px 0;border:1px solid var(--line-soft);font-size:12.5px;line-height:1.55}
.alert-warning-box{background:var(--danger-soft);border:1px solid #ecd1d1;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12.5px;color:#6a2020;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.alert-warning-box svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;stroke:currentColor;stroke-width:2;fill:none}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-soft);border:1px solid var(--line-soft);font-size:11px;color:var(--ink-2);font-weight:500}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.summary-row:last-child{border-bottom:none}
.summary-row.highlight{color:var(--ink);font-weight:600;font-size:14.5px;padding:14px 0;border-top:1px solid var(--line);border-bottom:none}
.summary-row .label{flex:1}
.summary-row .value{font-variant-numeric:tabular-nums;font-weight:500}
.summary-row .value.pos{color:var(--success)}
.summary-row .value.neg{color:var(--danger)}
.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
.choice:hover{border-color:#cdc9c0;background:var(--surface-soft)}
.choice.active{border-color:var(--primary);background:#f4f7fa;box-shadow:inset 0 0 0 1px var(--primary)}
.choice-title{font-size:12.5px;font-weight:500;color:var(--ink);display:block}
.choice-desc{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.money-input-wrap{position:relative;margin-top:6px}
.money-input-wrap::before{content:"Bs";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:var(--muted);pointer-events:none}
.money-input-wrap input{padding-left:42px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;height:52px}
.money-input-wrap.sm input{font-size:14px;height:38px;padding-left:34px}
.money-input-wrap.sm::before{font-size:12px;left:11px}
.money-input-wrap input.money-ok{border-color:var(--success);background:var(--success-soft)}
.money-input-wrap input.money-bad{border-color:var(--danger);background:var(--danger-soft)}
.cambio-box{background:var(--success-soft);border:1px solid #c7e0cf;border-radius:10px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.cambio-box.insuf{background:var(--danger-soft);border-color:#ecd1d1}
.cambio-box.exacto{background:var(--info-soft);border-color:#d1e0ec}
.cambio-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--success)}
.cambio-box.insuf .cambio-label{color:var(--danger)}

.pend-list{background:var(--surface-soft);border:1px solid var(--line-soft);border-radius:10px;padding:6px 12px;max-height:180px;overflow-y:auto;margin-bottom:14px}

.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{padding-left:36px}
.search-wrap::before{content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a766d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='M21 21l-4.35-4.35'/></svg>");background-size:contain;background-repeat:no-repeat;pointer-events:none}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px -8px rgba(20,18,12,.15);max-height:280px;overflow-y:auto;z-index:30;margin-top:4px}
.search-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);font-size:13px}

.user-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
.user-card-head{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.user-card-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;flex-shrink:0}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 12px 32px -8px rgba(20,18,12,.4);transition:transform .3s cubic-bezier(.2,.9,.3,1.3);z-index:999;max-width:90vw;text-align:center}

}

<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark"><div class="brand-logo">SG</div><div class="brand-name">SIMGest</div></div>
    <div class="brand-sub">Sistema de gestión comercial</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-footer">
    <div class="user-box">
      <div class="user-avatar" id="avatarIni">A</div>
      <div class="user-info">
        <select id="usuarioSel" onchange="cambiarUsuario(this.value)"></select>
        <div class="user-role" id="rolLbl">Administrador</div>
      </div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="mobile-toggle">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      Menú
    </button>
  </div>
  <div id="app"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   CONFIGURACIÓN
   ================================================================ */
const UNIDADES = ['unidad','kg','litro','gramo','ml','caja','paquete','docena','metro'];
const CATEGORIAS_GASTOS_DEFAULT = ['Alquiler','Servicios (luz/agua/internet)','Transporte','Sueldos','Mantenimiento','Insumos de oficina','Impuestos','Otros'];
const LS_KEY = 'simgest_v16';
const MAX_CAJEROS = 8;
const MAX_COBRADORES = 8;
const COLORES_CAJERO = ['#1c3d5a','#2d6a4f','#8a6d3b','#6d28d9','#1e5a8a','#b91c1c','#0369a1','#7c2d12'];
const COLORES_COBRADOR = ['#0f5132','#166534','#14532d','#0d9488','#0f766e','#115e59','#065f46','#047857'];

/* ================================================================
   UTILIDADES
   ================================================================ */
const $ = id => document.getElementById(id);
const HOY = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const horaActual = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const money = n => 'Bs ' + (Number(n)||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const num2 = n => +(Number(n)||0).toFixed(2);
const addDias = (f,n) => { const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fFecha = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const mesDe = iso => (iso||'').slice(0,7);
const mesActual = () => HOY().slice(0,7);
const nombreMes = ym => { if(!ym) return '—'; const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; const [y,m]=ym.split('-'); return `${meses[parseInt(m,10)-1]} ${y}`; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unidadAbrev = u => ({unidad:'u',kg:'kg',litro:'L',gramo:'g',ml:'ml',caja:'cja',paquete:'paq',docena:'doc',metro:'m'})[u]||u;
const iniciales = nombre => { const p=String(nombre||'').trim().split(/\s+/); if(p.length===0) return '?'; if(p.length===1) return p[0].slice(0,2).toUpperCase(); return (p[0][0]+(p[1]?.[0]||'')).toUpperCase(); };
const normalizar = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const coincide = (haystack, query) => normalizar(haystack).includes(normalizar(query));

/* ================================================================
   ESTADO
   ================================================================ */
let state = null;
let usuarioActual = null;
let vista = 'resumen';

const esAdmin = () => usuarioActual?.rol === 'admin';
const esCajero = () => usuarioActual?.rol === 'cajero';
const esCobrador = () => usuarioActual?.rol === 'cobrador';

const ui = {
  ventaCarrito:[], ventaClienteId:'', ventaTipoPago:'contado',
  ventaPlazo:15, ventaPlazoCustom:'', ventaMontoRecibido:'',
  buscarCliente:'', mostrarBuscadorCliente:false,
  compraCarrito:[], compraProveedorId:'', compraNota:'', buscarProdCompra:'',
  modal:null, filtroInv:'Todas', clienteAbierto:null, cierreMes:mesActual(),
  buscarClienteLista:'', filtroClientesCobrador:'con_deuda',
  buscarProdVenta:'', buscarClienteVenta:'',
  filtroGastosMes:mesActual(), buscarGasto:'',
  filtroCuentasEstado:'pendientes', buscarCuenta:'',
  cuentaAbierta:null, buscarBanco:'',
  buscarProductoInv:'', buscarProductoConfig:'', buscarProveedor:'',
  buscarUsuario:'', buscarCobranza:'', buscarVentaHist:'', buscarCategoria:''
};

/* ================================================================
   PERSISTENCIA
   ================================================================ */
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ state=JSON.parse(raw); return true; } }catch(e){} return false; }
function initState(){
  return {
    seq:{venta:1,compra:1,abono:1,cliente:1,producto:1,proveedor:1,categoria:1,mov:1,cierre:1,usuario:2,turno:1,gasto:1,cuentaPagar:1,pago:1,bonificacion:1,banco:1,movBanco:1},
    usuarios:[{id:'U1',nombre:'Administrador',rol:'admin',activo:true,color:'#1c3d5a',creado:HOY()}],
    usuarioActualId:'U1',
    turnos:[], proveedores:[], categorias:[], productos:[], clientes:[],
    ventas:[], abonos:[], compras:[], gastos:[],
    categoriasGastos:[...CATEGORIAS_GASTOS_DEFAULT],
    cuentasPorPagar:[], bancos:[],
    caja:{saldoInicial:0,movimientos:[]},
    bolsas:{}, cierres:[],
    capital:{configurado:false,efectivoInicial:0,efectivoBancosInicial:0,cuentasPorCobrarIniciales:0,deudasInicialesPorCliente:{},inventarioInicial:0,bolsasIniciales:{},notas:'',fechaConfiguracion:null}
  };
}

/* ================================================================
   HELPERS
   ================================================================ */
const catById = id => state.categorias.find(c=>c.id===id);
const provById = id => state.proveedores.find(p=>p.id===id);
const prodById = id => state.productos.find(p=>p.id===id);
const userById = id => state.usuarios.find(u=>u.id===id);
const cuentaById = id => state.cuentasPorPagar.find(c=>c.id===id);
const bancoById = id => state.bancos.find(b=>b.id===id);

function bolsaDe(provId){
  if(!state.bolsas[provId]) state.bolsas[provId]={saldo:0,bonificaciones:0,bonificacionesRetiradas:0};
  const b=state.bolsas[provId];
  if(typeof b.comisionAcumulada==='number'&&!b.bonificaciones) b.bonificaciones=b.comisionAcumulada;
  if(typeof b.comisionesRetiradas==='number'&&!b.bonificacionesRetiradas) b.bonificacionesRetiradas=b.comisionesRetiradas;
  if(typeof b.bonificaciones!=='number') b.bonificaciones=0;
  if(typeof b.bonificacionesRetiradas!=='number') b.bonificacionesRetiradas=0;
  return b;
}
function saldoCaja(){ if(!state) return 0; return num2(state.caja.saldoInicial+state.caja.movimientos.reduce((a,m)=>a+m.monto,0)); }
function saldoBanco(b){ return num2(b.saldoInicial+(b.movimientos||[]).reduce((a,m)=>a+m.monto,0)); }
function saldoBancosTotal(){ return num2(state.bancos.reduce((a,b)=>a+saldoBanco(b),0)); }
function saldoBolsasTotal(){ return num2(Object.values(state.bolsas).reduce((a,b)=>a+(b.saldo||0),0)); }
function saldoBolsasBonifTotal(){ return num2(Object.values(state.bolsas).reduce((a,b)=>a+(b.bonificaciones||0),0)); }
function agregarMovimientoCaja(tipo,monto,descripcion,referencia){
  state.caja.movimientos.push({id:'M'+(state.seq.mov++),fecha:HOY(),hora:horaActual(),tipo,monto:num2(monto),descripcion,referencia:referencia||null,usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'});
}
function eliminarMovimientosPorRef(ref){ state.caja.movimientos=state.caja.movimientos.filter(m=>m.referencia!==ref); }
function agregarMovimientoBanco(bancoId,monto,descripcion,referencia){
  const b=bancoById(bancoId); if(!b) return;
  if(!b.movimientos) b.movimientos=[];
  b.movimientos.push({id:'MB'+(state.seq.movBanco++),fecha:HOY(),hora:horaActual(),monto:num2(monto),descripcion,referencia:referencia||null,usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'});
}
const saldoVenta = v => num2(v.total-(v.pagado||0));

function deudaVentasCliente(cid){
  return num2(state.ventas.filter(v=>v.clienteId===cid&&v.tipoPago==='credito').reduce((a,v)=>a+saldoVenta(v),0));
}
function deudaInicialCliente(cid){ return num2(state.capital?.deudasInicialesPorCliente?.[cid]||0); }
function deudaCliente(cid){ return num2(deudaVentasCliente(cid)+deudaInicialCliente(cid)); }

function deudaVencida(cid){
  const h=HOY();
  const vencidaVentas=num2(state.ventas.filter(v=>v.clienteId===cid&&v.tipoPago==='credito'&&saldoVenta(v)>0&&v.vencimiento&&v.vencimiento<h).reduce((a,v)=>a+saldoVenta(v),0));
  const fechaConf=state.capital?.fechaConfiguracion;
  const deudaIni=deudaInicialCliente(cid);
  let inicialVencida=0;
  if(deudaIni>0&&fechaConf&&fechaConf<addDias(h,-30)) inicialVencida=deudaIni;
  return num2(vencidaVentas+inicialVencida);
}
function ventasPendientesCliente(cid){
  return state.ventas.filter(v=>v.clienteId===cid&&v.tipoPago==='credito'&&saldoVenta(v)>0.001).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function estadoCliente(cid){
  const d=deudaCliente(cid);
  if(d<=0.001) return {txt:'Al día',cls:'badge-success'};
  if(deudaVencida(cid)>0) return {txt:'Vencido',cls:'badge-danger'};
  const prox=ventasPendientesCliente(cid)[0];
  if(prox&&prox.vencimiento<=addDias(HOY(),3)) return {txt:'Por vencer',cls:'badge-warning'};
  return {txt:'Vigente',cls:'badge-info'};
}
const esProductoRecarga = p => p&&p.esRecarga===true;

function gananciaItem(it){
  if(it.esRecarga) return 0;
  return num2((Number(it.precioUnit)-Number(it.costoUnit))*Number(it.cantidad));
}
function gananciaVenta(v){ return num2(v.items.reduce((a,i)=>a+gananciaItem(i),0)); }
function gananciaVentas(vs){ return num2(vs.reduce((a,v)=>a+gananciaVenta(v),0)); }
function bonificacionesPeriodo(desde,hasta){ return num2(state.caja.movimientos.filter(m=>m.tipo==='bonificacion'&&m.fecha>=desde&&m.fecha<=hasta).reduce((a,m)=>a+m.monto,0)); }

const saldoCuenta = c => num2(c.montoTotal-(c.pagado||0));
function cuentasPendientes(){ return state.cuentasPorPagar.filter(c=>saldoCuenta(c)>0.001); }
function cuentasVencidas(){ const h=HOY(); return cuentasPendientes().filter(c=>c.vencimiento&&c.vencimiento<h); }

function valorInventarioCosto(){ return num2(state.productos.reduce((a,p)=>esProductoRecarga(p)?a:a+p.stock*p.costo,0)); }
function totalCuentasPorCobrar(){ return num2(state.clientes.reduce((a,c)=>a+deudaCliente(c.id),0)); }
function totalCuentasPorPagar(){ return num2(cuentasPendientes().reduce((a,c)=>a+saldoCuenta(c),0)); }
function patrimonioNeto(){
  const activos=num2(saldoCaja()+saldoBancosTotal()+valorInventarioCosto()+totalCuentasPorCobrar()+saldoBolsasTotal());
  const pasivos=totalCuentasPorPagar();
  return {activos,pasivos,neto:num2(activos-pasivos)};
}

function turnoAbierto(){ return state.turnos.find(t=>t.estado==='abierto')||null; }
function turnoAbiertoDe(uid){ return state.turnos.find(t=>t.estado==='abierto'&&t.usuarioId===uid)||null; }
function ultimoTurno(){
  const cerrados=state.turnos.filter(t=>t.estado==='cerrado').sort((a,b)=>{const fa=(a.fechaCierre||'')+(a.horaCierre||'');const fb=(b.fechaCierre||'')+(b.horaCierre||'');return fb.localeCompare(fa);});
  return cerrados[0]||null;
}
function saldoEsperadoApertura(){
  const u=ultimoTurno();
  if(u&&typeof u.saldoCierre==='number') return num2(u.saldoCierre);
  return saldoCaja();
}
function ventasVisibles(){ return esAdmin()?state.ventas:state.ventas.filter(v=>v.usuarioId===usuarioActual?.id); }
function movimientosVisibles(){ return esAdmin()?state.caja.movimientos:state.caja.movimientos.filter(m=>m.usuarioId===usuarioActual?.id); }
function abonosVisibles(){ return esAdmin()?state.abonos:state.abonos.filter(a=>a.usuarioId===usuarioActual?.id); }

function toast(msg,tipo){
  const t=$('toast'); if(!t) return;
  t.textContent=msg; t.className='toast show '+(tipo||'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast '+(tipo||''),3200);
}
function rolNombre(){ if(!usuarioActual) return '—'; return {admin:'Administrador',cajero:'Cajero',cobrador:'Cobrador'}[usuarioActual.rol]||'—'; }
function pedirConfirmacion(opts){ ui.modal={tipo:'confirmar',data:opts}; renderModal(); }
function ejecutarConfirmacion(){
  const d=ui.modal?.data;
  if(!d||typeof d.onConfirm!=='function'){ cerrarModal(); return; }
  const cb=d.onConfirm;
  ui.modal=null; renderModal();
  setTimeout(()=>cb(),30);
}

/* ================================================================
   NAVEGACIÓN
   ================================================================ */
const ICONS = {
  resumen:'<path d="M3 12l9-9 9 9M5 10v10h14V10"/>',
  balance:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  ganancias:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  caja:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 14h2"/>',
  bancos:'<path d="M3 21h18M3 10l9-6 9 6M5 21V10M9 21V10M15 21V10M19 21V10"/>',
  turnos:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',

function abrirModal(tipo,id){ ui.modal={tipo,id:id||null}; renderModal(); }
function cerrarModal(){ ui.modal=null; renderModal(); }
function renderModal(){
  const root=$('modalRoot');
  if(!ui.modal){ root.innerHTML=''; return; }
  const {tipo,id}=ui.modal;
  let contenido='';
  if(tipo==='confirmar') contenido=modalConfirmar(ui.modal.data);
  else if(tipo==='nuevoProducto'||tipo==='editarProducto') contenido=modalProducto(id);
  else if(tipo==='nuevaCategoria'||tipo==='editarCategoria') contenido=modalCategoria(id);
  else if(tipo==='nuevoProveedor'||tipo==='editarProveedor') contenido=modalProveedor(id);
  else if(tipo==='nuevoCliente'||tipo==='editarCliente') contenido=modalCliente(id);
  else if(tipo==='nuevoUsuario'||tipo==='editarUsuario') contenido=modalUsuario(id);
  else if(tipo==='agregarDinero') contenido=modalDinero('aporte');
  else if(tipo==='retirarDinero') contenido=modalDinero('retiro');
  else if(tipo==='saldoInicial') contenido=modalSaldoInicial();
  else if(tipo==='reponerBolsa') contenido=modalReponerBolsa(id);
  else if(tipo==='registrarBonificacion') contenido=modalBonificacion(id);
  else if(tipo==='retirarBonificacion') contenido=modalRetirarBonificacion(id);
  else if(tipo==='abono') contenido=modalAbono(id);
  else if(tipo==='abrirTurno') contenido=modalAbrirTurno();
  else if(tipo==='cerrarTurno') contenido=modalCerrarTurno(id);
  else if(tipo==='nuevoGasto') contenido=modalGasto();
  else if(tipo==='nuevaCuentaPagar') contenido=modalCuentaPagar(id);
  else if(tipo==='pagarCuenta') contenido=modalPagarCuenta(id);
  else if(tipo==='configurarCapital') contenido=modalConfigurarCapital();
  else if(tipo==='editarCapital') contenido=modalEditarCapital();
  else if(tipo==='nuevoBanco'||tipo==='editarBanco') contenido=modalBanco(id);
  else if(tipo==='movimientoBanco') contenido=modalMovimientoBanco(id);
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this) cerrarModal()"><div class="modal${tipo==='confirmar'?' modal-alert':''}">${contenido}</div></div>`;
  if(tipo==='abono') setTimeout(()=>{const el=$('m-abono-monto'); if(el){el.focus(); el.select();}},50);
  if(tipo==='agregarDinero'||tipo==='retirarDinero') setTimeout(()=>{const el=$('m-dinero-monto'); if(el) el.focus();},50);
  if(tipo==='abrirTurno'||tipo==='cerrarTurno') setTimeout(()=>{const el=$('m-arqueo'); if(el) el.focus();},50);
  if(tipo==='nuevoGasto') setTimeout(()=>{const el=$('m-gasto-monto'); if(el) el.focus();},50);
  if(tipo==='nuevaCuentaPagar'||tipo==='pagarCuenta') setTimeout(()=>{const el=$('m-cuenta-monto'); if(el) el.focus();},50);
  if(tipo==='registrarBonificacion'||tipo==='retirarBonificacion') setTimeout(()=>{const el=$('m-bonif-monto'); if(el) el.focus();},50);
  if(tipo==='configurarCapital'||tipo==='editarCapital'){ setTimeout(()=>{const el=$('m-cap-efectivo'); if(el) el.focus();},50); recalcularCapitalTotal(); }
}
function modalConfirmar(d){
  if(!d) return '';
  const critico=d.criticidad==='critico';
  const advertencia=d.criticidad==='advertencia';
  const iconoCls=critico?'critico':advertencia?'advertencia':'info';
  const botonCls=critico?'btn-danger':'btn-primary';
  const iconoSVG=critico
    ?'<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>'
    :advertencia?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
    :'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  return `
    <div class="alert-icon ${iconoCls}">${iconoSVG}</div>
    ${critico?`<div class="irrevocable-badge"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>Acción irrevocable</div>`:''}
    <div class="alert-title-lg">${esc(d.titulo||'Confirmar acción')}</div>
    ${d.mensaje?`<div class="alert-body">${d.mensaje}</div>`:''}
    ${d.detalle?`<div class="alert-detail">${d.detalle}</div>`:''}
    ${critico&&d.advertencia?`<div class="alert-warning-box"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg><div>${d.advertencia}</div></div>`:''}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModal()">${esc(d.textoCancelar||'Cancelar')}</button>
      <button class="btn ${botonCls}" onclick="ejecutarConfirmacion()">${esc(d.textoBoton||'Confirmar')}</button>
    </div>`;
}

  const elTot=$('capital-total'); if(elTot) elTot.textContent=money(tot);
  const elB=$('capital-total-bolsas'); if(elB) elB.textContent=money(bolsas);

function leerBolsasInputs(){
  const result={};
  document.querySelectorAll('.m-cap-bolsa').forEach(el=>{

    if(monto>0) result[el.dataset.prov]=num2(monto);
  });
  return result;
}
function leerDeudasIniciales(){
  const result={};
  document.querySelectorAll('.m-cap-deuda').forEach(el=>{
    const monto=Number(el.value)||0;
    if(monto>0) result[el.dataset.cliente]=num2(monto);
  });
  return result;
}
function guardarCapitalInicial(){
  const ef=Number($('m-cap-efectivo').value)||0;
  const bancos=Number($('m-cap-bancos').value)||0;
  const inv=Number($('m-cap-inventario').value)||0;
  const bolsas=leerBolsasInputs();
  const deudas=leerDeudasIniciales();
  const notas=$('m-cap-notas').value.trim();

  state.capital.configurado=true;
  state.capital.efectivoInicial=num2(ef);
  state.capital.efectivoBancosInicial=num2(bancos);
  state.capital.inventarioInicial=num2(inv);
  state.capital.bolsasIniciales={...bolsas};
  state.capital.deudasInicialesPorCliente={...deudas};
  state.capital.cuentasPorCobrarIniciales=num2(Object.values(deudas).reduce((a,b)=>a+b,0));
  state.capital.notas=notas;
  state.capital.fechaConfiguracion=HOY();

  if(ef>0) state.caja.saldoInicial=num2(state.caja.saldoInicial+ef);
  if(bancos>0){
    const bp=state.bancos.find(b=>b.nombre==='Banco principal');
    if(bp) bp.saldoInicial=num2(bp.saldoInicial+bancos);
    else state.bancos.push({id:'B'+(state.seq.banco++),nombre:'Banco principal',nota:'Desde capital inicial',saldoInicial:num2(bancos),movimientos:[]});
  }
  Object.entries(bolsas).forEach(([provId,monto])=>{
    const b=bolsaDe(provId); b.saldo=num2((b.saldo||0)+monto);
  });
  toast('Capital inicial configurado','ok');
  cerrarModal(); render();
}
function guardarEdicionCapital(){
  const ef=Number($('m-cap-efectivo').value)||0;
  const bancos=Number($('m-cap-bancos').value)||0;
  const inv=Number($('m-cap-inventario').value)||0;
  const bolsas=leerBolsasInputs();
  const deudas=leerDeudasIniciales();
  const notas=$('m-cap-notas').value.trim();

  if(ef>0){
    state.caja.saldoInicial=num2(state.caja.saldoInicial+ef);
    state.capital.efectivoInicial=num2((state.capital.efectivoInicial||0)+ef);
  }
  state.capital.efectivoBancosInicial=num2(bancos);
  state.capital.inventarioInicial=num2(inv);
  state.capital.notas=notas;
  const bp=state.bancos.find(b=>b.nombre==='Banco principal');
  if(bp) bp.saldoInicial=num2(bancos);
  else if(bancos>0) state.bancos.push({id:'B'+(state.seq.banco++),nombre:'Banco principal',nota:'Desde capital inicial',saldoInicial:num2(bancos),movimientos:[]});

  if(!state.capital.bolsasIniciales) state.capital.bolsasIniciales={};
  Object.entries(bolsas).forEach(([provId,monto])=>{
    const b=bolsaDe(provId); b.saldo=num2((b.saldo||0)+monto);
    state.capital.bolsasIniciales[provId]=num2((state.capital.bolsasIniciales[provId]||0)+monto);
  });
  if(!state.capital.deudasInicialesPorCliente) state.capital.deudasInicialesPorCliente={};
  let agregado=0;
  Object.entries(deudas).forEach(([cliId,monto])=>{
    state.capital.deudasInicialesPorCliente[cliId]=num2((state.capital.deudasInicialesPorCliente[cliId]||0)+monto);
    agregado+=monto;
  });
  state.capital.cuentasPorCobrarIniciales=num2((state.capital.cuentasPorCobrarIniciales||0)+agregado);
  toast('Capital actualizado','ok');
  cerrarModal(); render();
}

function toggleRecargaBloque(checked){
  $('m-prod-recarga-block').style.display=checked?'block':'none';
  $('m-prod-normal-block').style.display=checked?'none':'block';
}
function guardarProducto(id){
  const nombre=$('m-prod-nombre').value.trim();
  const catId=$('m-prod-cat').value;
  const esRec=$('m-prod-esrecarga').checked;
  if(!nombre) return toast('Nombre obligatorio','err');
  if(!catId) return toast('Selecciona categoría','err');
  if(esRec){
    const provId=id?prodById(id).proveedorId:$('m-prod-prov').value;
    const valor=Number($('m-prod-valor').value);
    const tipoRec=$('m-prod-tipo-rec')?$('m-prod-tipo-rec').value:'credito';
    if(!provId) return toast('Selecciona el operador','err');
    if(!(valor>0)) return toast('Valor nominal inválido','err');
    const saldoInicial=!id?(Number($('m-prod-saldo-inicial').value)||0):0;
    if(id){
      const p=prodById(id);
      p.nombre=nombre; p.categoriaId=catId; p.unidad='unidad';
      p.esRecarga=true; p.valorNominal=num2(valor); p.costo=num2(valor); p.precio=num2(valor);
      p.tipoRecarga=tipoRec;
      delete p.comision;
      bolsaDe(provId);
      toast('Recarga actualizada','ok');
    }else{
      const nuevo={
        id:'PR'+(state.seq.producto++), nombre, categoriaId:catId, unidad:'unidad',
        esRecarga:true, proveedorId:provId,
        valorNominal:num2(valor), costo:num2(valor), precio:num2(valor),
        tipoRecarga:tipoRec, stock:0, stockInicial:0
      };
      state.productos.push(nuevo);
      bolsaDe(provId);
      if(saldoInicial>0){
        const b=bolsaDe(provId);
        b.saldo=num2((b.saldo||0)+saldoInicial);
        if(!state.capital.bolsasIniciales) state.capital.bolsasIniciales={};
        state.capital.bolsasIniciales[provId]=num2((state.capital.bolsasIniciales[provId]||0)+saldoInicial);
      }
      toast('Recarga creada'+(saldoInicial>0?' · Saldo '+money(saldoInicial):''),'ok');
    }
  }else{
    const unidad=$('m-prod-unidad').value;
    const provId=$('m-prod-prov-normal').value;
    const costo=Number($('m-prod-costo').value);
    const precio=Number($('m-prod-precio').value);
    if(isNaN(costo)||costo<0) return toast('Costo inválido','err');
    if(isNaN(precio)||precio<0) return toast('Precio inválido','err');
    if(id){
      const p=prodById(id);
      p.nombre=nombre; p.categoriaId=catId; p.unidad=unidad;
      p.esRecarga=false; p.proveedorId=provId||null;
      p.costo=num2(costo); p.precio=num2(precio);
      delete p.valorNominal; delete p.tipoRecarga; delete p.comision;
      toast('Producto actualizado','ok');
    }else{
      const nuevo={id:'PR'+(state.seq.producto++),nombre,categoriaId:catId,unidad,esRecarga:false,proveedorId:provId||null,costo:num2(costo),precio:num2(precio),stock:0,stockInicial:0};
      nuevo.stock=num2(Number($('m-prod-stock').value)||0);
      nuevo.stockInicial=nuevo.stock;
      state.productos.push(nuevo);
      toast('Producto creado','ok');
    }
  }
  cerrarModal(); render();
}

function actualizarAbonoPreview(deuda){
  const el=$('m-abono-monto'); if(!el) return;
  const monto=Number(el.value)||0;
  const preview=$('abono-preview');
  if(monto<=0){ preview.innerHTML=''; el.classList.remove('money-ok','money-bad'); return; }
  if(monto>=deuda-0.001){
    const vuelta=num2(monto-deuda);
    if(vuelta>0.001){
      preview.innerHTML=`<div class="cambio-box"><span class="cambio-label">Vuelta a devolver</span><span class="cambio-value">${money(vuelta)}</span></div>`;
    }else{
      preview.innerHTML=`<div class="cambio-box exacto"><span class="cambio-label">Pago exacto</span><span class="cambio-value">${money(deuda)}</span></div>`;
    }
    el.classList.add('money-ok'); el.classList.remove('money-bad');
  }else{
    preview.innerHTML=`<div class="cambio-box insuf"><span class="cambio-label">Queda debiendo</span><span class="cambio-value">${money(num2(deuda-monto))}</span></div>`;
    el.classList.remove('money-ok'); el.classList.add('money-bad');
  }
}

/* ================================================================
   GUARDAR CLIENTE — incluye ajuste de deuda en clientes existentes
   ================================================================ */
function guardarCliente(id){
  const n=$('m-cli-nombre').value.trim();
  const tel=$('m-cli-tel').value.trim();
  const com=$('m-cli-com').value.trim();
  const plazo=Number($('m-cli-plazo').value);
  const limite=Number($('m-cli-limite').value)||0;
  if(!n) return toast('Ingresa nombre','err');

  if(id){
    // Cliente existente: actualizar datos + posible ajuste de deuda vieja
    const c=state.clientes.find(x=>x.id===id);
    c.nombre=n; c.tel=tel; c.comunidad=com; c.plazo=plazo; c.limite=limite;

    const ajuste = Number($('m-cli-ajuste-deuda')?.value) || 0;
    if(ajuste > 0){
      if(!state.capital.deudasInicialesPorCliente) state.capital.deudasInicialesPorCliente = {};
      state.capital.deudasInicialesPorCliente[id] = num2((state.capital.deudasInicialesPorCliente[id]||0) + ajuste);
      state.capital.cuentasPorCobrarIniciales = num2((state.capital.cuentasPorCobrarIniciales||0) + ajuste);
      toast(`Cliente actualizado · +${money(ajuste)} a la deuda`,'ok');
    } else {
      toast('Cliente actualizado','ok');
    }
  }else{
    // Cliente nuevo
    const nuevoId='C'+(state.seq.cliente++);
    state.clientes.push({id:nuevoId,nombre:n,tel,comunidad:com||'—',plazo,limite,creado:HOY()});
    const deudaInic = Number($('m-cli-deuda-inicial')?.value) || 0;
    if(deudaInic > 0){
      if(!state.capital.deudasInicialesPorCliente) state.capital.deudasInicialesPorCliente = {};
      state.capital.deudasInicialesPorCliente[nuevoId] = num2(deudaInic);
      state.capital.cuentasPorCobrarIniciales = num2((state.capital.cuentasPorCobrarIniciales||0) + deudaInic);
      toast(`Cliente registrado con deuda inicial de ${money(deudaInic)}`,'ok');
    } else {
      toast('Cliente registrado','ok');
    }
  }
  cerrarModal(); render();
}
function guardarUsuario(id){
  const n=$('m-u-nombre').value.trim();
  if(!n) return toast('Ingresa nombre','err');
  if(id){
    const u=userById(id); u.nombre=n;
    if(u.rol!=='admin'&&$('m-u-activo')) u.activo=$('m-u-activo').value==='true';
    toast('Actualizado','ok'); cerrarModal();
    if(usuarioActual.id===id){ usuarioActual=u; $('avatarIni').textContent=iniciales(u.nombre); }
    renderUsuarioSelector(); render();
    return;
  }
  const rol=$('m-u-rol').value;
  const color=$('m-u-color').value||COLORES_CAJERO[0];

function confirmarAbono(clienteId){
  const el=$('m-abono-monto'); if(!el) return;
  const entregado=Number(el.value)||0;
  const deuda=deudaCliente(clienteId);
  if(!(entregado>0)) return toast('Monto inválido','err');
  const aplicado=Math.min(entregado,deuda);
  const vuelta=num2(entregado-aplicado);
  const pend=ventasPendientesCliente(clienteId);
  let restante=aplicado;
  pend.forEach(v=>{
    if(restante<=0.001) return;
    const s=saldoVenta(v);
    const apl=Math.min(s,restante);
    v.pagado=num2((v.pagado||0)+apl);
    restante=num2(restante-apl);
  });
  if(restante>0.001&&state.capital?.deudasInicialesPorCliente?.[clienteId]){
    const dIni=num2(state.capital.deudasInicialesPorCliente[clienteId]);
    const aplIni=Math.min(dIni,restante);
    state.capital.deudasInicialesPorCliente[clienteId]=num2(dIni-aplIni);
    state.capital.cuentasPorCobrarIniciales=num2(Math.max(0,(state.capital.cuentasPorCobrarIniciales||0)-aplIni));
    restante=num2(restante-aplIni);
  }
  const abonoId='A'+(state.seq.abono++);
  const c=state.clientes.find(x=>x.id===clienteId);
  state.abonos.push({id:abonoId,clienteId,ventaId:null,fecha:HOY(),hora:horaActual(),monto:num2(aplicado),entregado:num2(entregado),vuelta,usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'});
  agregarMovimientoCaja('abono',aplicado,'Cobro de '+(c?.nombre||''),abonoId);
  if(vuelta>0.001) toast(`Cobro ${money(aplicado)} · Vuelta ${money(vuelta)}`,'ok');
  else toast('Cobro '+money(aplicado),'ok');
  cerrarModal(); render();
}

function turnoRequerido(){ if(esAdmin()) return true; return !!turnoAbiertoDe(usuarioActual.id); }
function agregarAlCarritoVenta(productoId,cantidad){
  if(!turnoRequerido()) return toast('Primero abre tu turno','err');
  const p=prodById(productoId); if(!p) return;
  cantidad=Number(cantidad)||1;
  if(cantidad<=0) return toast('Cantidad inválida','err');
  if(esProductoRecarga(p)){
    const b=p.proveedorId?bolsaDe(p.proveedorId):null;
    const disp=b?b.saldo:0;
    const enCarrito=ui.ventaCarrito.filter(i=>i.productoId===productoId).reduce((a,i)=>a+i.subtotal,0);
    if(disp<enCarrito+num2(cantidad*p.precio)) return toast('Saldo insuficiente en bolsa','err');
  }else{
    if(p.stock<cantidad) return toast(`Stock insuficiente (${p.stock})`,'err');
    const enCarrito=ui.ventaCarrito.filter(i=>i.productoId===productoId).reduce((a,i)=>a+i.cantidad,0);
    if(p.stock<enCarrito+cantidad) return toast(`Ya tienes ${enCarrito} en carrito`,'err');
  }
  const existe=ui.ventaCarrito.find(i=>i.productoId===productoId);
  if(existe){ existe.cantidad=num2(existe.cantidad+cantidad); existe.subtotal=num2(existe.cantidad*existe.precioUnit); }
  else ui.ventaCarrito.push({productoId,nombre:p.nombre,unidad:p.unidad,esRecarga:p.esRecarga===true,proveedorId:p.proveedorId||null,cantidad:num2(cantidad),precioUnit:p.precio,costoUnit:p.costo,subtotal:num2(cantidad*p.precio)});
  render();
}
function actualizarLineaCarrito(ix,campo,valor){
  const it=ui.ventaCarrito[ix]; if(!it) return;
  if(campo==='cantidad'){ const v=num2(valor); if(v<=0) return toast('Cantidad inválida','err'); it.cantidad=v; }
  else if(campo==='precioUnit'){ it.precioUnit=num2(valor); }
  it.subtotal=num2(it.cantidad*it.precioUnit);
  render();
}
function quitarDelCarrito(ix){ ui.ventaCarrito.splice(ix,1); render(); }
function totalCarritoVenta(){ return num2(ui.ventaCarrito.reduce((a,i)=>a+i.subtotal,0)); }
function confirmarVenta(){
  if(!turnoRequerido()) return toast('Abre tu turno','err');
  if(ui.ventaCarrito.length===0) return toast('Carrito vacío','err');
  for(const it of ui.ventaCarrito){
    const p=prodById(it.productoId);
    if(!p) return toast(`Producto eliminado: ${it.nombre}`,'err');
    if(!esProductoRecarga(p)&&p.stock<it.cantidad) return toast(`Stock insuficiente de ${p.nombre}`,'err');
  }
  const cliente=ui.ventaClienteId?state.clientes.find(c=>c.id===ui.ventaClienteId):null;
  if(ui.ventaTipoPago==='credito'&&!cliente) return toast('Selecciona un cliente','err');
  let plazo=null,vencimiento=null;
  if(ui.ventaTipoPago==='credito'){
    plazo=ui.ventaPlazo==='custom'?Number(ui.ventaPlazoCustom):Number(ui.ventaPlazo);
    if(!(plazo>0)) return toast('Define un plazo','err');
    vencimiento=addDias(HOY(),plazo);
  }
  const total=totalCarritoVenta();
  let montoRecibido=null,cambio=null;
  if(ui.ventaTipoPago==='contado'){
    montoRecibido=Number(ui.ventaMontoRecibido);
    if(!(montoRecibido>=total)) return toast('Monto insuficiente','err');
    cambio=num2(montoRecibido-total);
  }
  const venta={
    id:'V'+(state.seq.venta++),fecha:HOY(),hora:horaActual(),
    clienteId:cliente?cliente.id:null,
    clienteNombre:cliente?cliente.nombre:'Consumidor final',
    tipoPago:ui.ventaTipoPago,plazo,vencimiento,
    items:ui.ventaCarrito.map(i=>({...i})),
    total,pagado:ui.ventaTipoPago==='contado'?total:0,
    montoRecibido,cambio,
    usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'
  };
  state.ventas.push(venta);
  venta.items.forEach(it=>{
    const p=prodById(it.productoId); if(!p) return;
    if(esProductoRecarga(p)){ const b=p.proveedorId?bolsaDe(p.proveedorId):null; if(b) b.saldo=num2(b.saldo-it.subtotal); }
    else p.stock=num2(p.stock-it.cantidad);
  });
  if(venta.tipoPago==='contado') agregarMovimientoCaja('venta',total,'Venta '+venta.id+' · '+venta.clienteNombre,venta.id);
  ui.ventaCarrito=[]; ui.ventaClienteId=''; ui.ventaMontoRecibido='';
  ui.ventaTipoPago='contado'; ui.ventaPlazo=15; ui.ventaPlazoCustom='';
  const gan=gananciaVenta(venta);
  if(gan>0) toast(`Venta ${money(total)} · Ganancia ${money(gan)}${cambio>0.001?' · Cambio '+money(cambio):''}`,'ok');
  else toast(`Venta ${money(total)}${cambio>0.001?' · Cambio '+money(cambio):''}`,'ok');
  render();
}
function buscarProductos(query,excluirRecargas){
  const q=normalizar(query);
  return state.productos
    .filter(p=>!excluirRecargas||!esProductoRecarga(p))
    .filter(p=>!q||coincide(p.nombre,q)||coincide(catById(p.categoriaId)?.nombre||'',q)||coincide(provById(p.proveedorId)?.nombre||'',q))
    .sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function buscarClientesQuery(query){
  const q=normalizar(query);
  if(!q) return state.clientes.slice(0,20);
  return state.clientes.filter(c=>coincide(c.nombre,q)||coincide(c.tel||'',q)||coincide(c.comunidad||'',q)).slice(0,20);
}

function agregarAlCarritoCompra(productoId,cantidad,costoUnit){
  const p=prodById(productoId); if(!p) return;
  if(esProductoRecarga(p)) return toast('Las recargas se manejan en Caja → Bolsa','err');
  cantidad=num2(cantidad); if(cantidad<=0) return toast('Cantidad inválida','err');
  costoUnit=num2(costoUnit); if(costoUnit<0) return toast('Costo inválido','err');
  const existe=ui.compraCarrito.find(i=>i.productoId===productoId&&i.costoUnit===costoUnit);
  if(existe){ existe.cantidad=num2(existe.cantidad+cantidad); existe.subtotal=num2(existe.cantidad*existe.costoUnit); }
  else ui.compraCarrito.push({productoId,nombre:p.nombre,unidad:p.unidad,cantidad,costoUnit,subtotal:num2(cantidad*costoUnit)});
  render();
}
function actualizarLineaCompra(ix,campo,valor){
  const it=ui.compraCarrito[ix]; if(!it) return;
  if(campo==='cantidad') it.cantidad=num2(valor);
  if(campo==='costoUnit') it.costoUnit=num2(valor);
  if(it.cantidad<=0) it.cantidad=1;
  it.subtotal=num2(it.cantidad*it.costoUnit);
  render();
}
function quitarDelCarritoCompra(ix){ ui.compraCarrito.splice(ix,1); render(); }
function totalCarritoCompra(){ return num2(ui.compraCarrito.reduce((a,i)=>a+i.subtotal,0)); }
function confirmarCompra(){
  if(ui.compraCarrito.length===0) return toast('Carrito vacío','err');
  const total=totalCarritoCompra();
  const prov=ui.compraProveedorId?provById(ui.compraProveedorId):null;
  const ejecutar=()=>{
    const compra={id:'P'+(state.seq.compra++),fecha:HOY(),hora:horaActual(),proveedorId:prov?prov.id:null,proveedorNombre:prov?prov.nombre:'Sin proveedor',items:ui.compraCarrito.map(i=>({...i})),total,nota:ui.compraNota.trim(),usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'};
    state.compras.push(compra);
    compra.items.forEach(it=>{ const p=prodById(it.productoId); if(p) p.stock=num2(p.stock+it.cantidad); });
    agregarMovimientoCaja('compra',-total,'Compra '+compra.id+' · '+compra.proveedorNombre,compra.id);
    ui.compraCarrito=[]; ui.compraProveedorId=''; ui.compraNota='';
    toast('Compra '+money(total),'ok'); render();
  };
  if(total>saldoCaja()){
    pedirConfirmacion({criticidad:'advertencia',titulo:'Saldo insuficiente',mensaje:`El total (${money(total)}) supera la caja (${money(saldoCaja())}).`,advertencia:'Si tienes efectivo en bancos, primero retíralo.',textoBoton:'Continuar',onConfirm:ejecutar});
  }else ejecutar();
}

function renderConservarFoco(id){
  render();
  const nuevo=$(id);
  if(!nuevo) return;
  nuevo.focus({preventScroll:true});
}
function render(){
  save(); renderNav(); renderUsuarioSelector();
  const visibles=tabsDisponibles().map(t=>t.id);
  if(!visibles.includes(vista)) vista=visibles[0];
  const fns={resumen:viewResumen,balance:viewBalance,ganancias:viewGanancias,caja:viewCaja,bancos:viewBancos,turnos:viewTurnos,ventas:viewVentas,inventario:viewInventario,clientes:viewClientes,cobranzas:viewCobranzas,compras:viewCompras,gastos:viewGastos,cuentas:viewCuentas,productos:viewProductos,categorias:viewCategorias,proveedores:viewProveedores,usuarios:viewUsuarios,capital:viewCapital,cierre:viewCierre};

  // Guardar foco, cursor y scroll ANTES de reemplazar el DOM
  const active = document.activeElement;
  const focusId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  const scrollY = window.scrollY;

  $('app').innerHTML=fns[vista]?fns[vista]():'<div class="empty">Vista no encontrada</div>';
  if(ui.modal&&ui.modal.tipo==='abono'){ const el=$('m-abono-monto'); if(el) actualizarAbonoPreview(deudaCliente(ui.modal.id)); }
  if(ui.modal&&(ui.modal.tipo==='configurarCapital'||ui.modal.tipo==='editarCapital')) setTimeout(recalcularCapitalTotal,20);

  // Restaurar scroll
  requestAnimationFrame(()=>{ window.scrollTo({top:scrollY,behavior:'instant'}); });

  // Restaurar foco y posición del cursor
  if(focusId){
    const el = document.getElementById(focusId);
    if(el && typeof el.focus === 'function'){
      try { el.focus({preventScroll:true}); } catch(e){ el.focus(); }
      if(selStart !== null && typeof el.setSelectionRange === 'function'){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

function viewInventario(){

  prods=prods.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const vCosto=valorInventarioCosto();
  const vVenta=num2(state.productos.reduce((a,p)=>esProductoRecarga(p)?a:a+p.stock*p.precio,0));

    <div class="kpi"><div class="kpi-label">Bolsas electrónicas</div><div class="kpi-value">${money(totBolsa)}</div></div>

        <button class="btn btn-sm ${filtro==='Todas'?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='Todas'; render()">Todas</button>
        ${state.categorias.map(c=>`<button class="btn btn-sm ${filtro===c.id?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='${c.id}'; render()">${esc(c.nombre)}</button>`).join('')}
      </div>

    <div class="table-wrap"><table>

      <tbody>
      ${prods.map(p=>{
        const cat=catById(p.categoriaId);
        const prov=provById(p.proveedorId);
        const esRec=esProductoRecarga(p);
        const margen=num2(p.precio-p.costo);

          const b=p.proveedorId?state.bolsas[p.proveedorId]:null;

        const tipo=esRec&&p.tipoRecarga==='paquete'?'Paquete':'';
        return `<tr>
          <td class="bold">${esc(p.nombre)} ${esRec?`<span class="badge badge-accent" style="margin-left:4px">${tipo||'Recarga'}</span>`:''}</td>

          <td class="num">${stockTxt}</td>

          <td class="num">${estado}</td>
        </tr>`;
      }).join('')||'<tr><td colspan="8" class="empty">Sin resultados.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

function viewCobranzas(){
  const mis=abonosVisibles();
  const h=HOY();
  const mes=mesActual();
  const cobHoy=mis.filter(a=>a.fecha===h);
  const cobMes=mis.filter(a=>mesDe(a.fecha)===mes);
  const totHoy=num2(cobHoy.reduce((a,x)=>a+x.monto,0));
  const totMes=num2(cobMes.reduce((a,x)=>a+x.monto,0));
  const totHist=num2(mis.reduce((a,x)=>a+x.monto,0));
  const porCob={};
  if(esAdmin()){
    state.usuarios.filter(u=>u.rol==='cobrador').forEach(u=>{
      const abs=state.abonos.filter(a=>a.usuarioId===u.id);
      porCob[u.id]={nombre:u.nombre,cobros:abs.length,total:num2(abs.reduce((a,x)=>a+x.monto,0)),hoy:num2(abs.filter(a=>a.fecha===h).reduce((a,x)=>a+x.monto,0)),mes:num2(abs.filter(a=>mesDe(a.fecha)===mes).reduce((a,x)=>a+x.monto,0))};
    });
  }
  const q=ui.buscarCobranza;
  let lista=mis.slice().reverse().slice(0,200);
  if(q) lista=lista.filter(a=>{
    const c=state.clientes.find(x=>x.id===a.clienteId);
    return coincide(c?.nombre||'',q)||coincide(a.usuarioNombre||'',q)||coincide(a.id,q);
  });
  return `
  <div class="page-head"><div class="page-eyebrow">Cobranzas</div><h1 class="page-title">${esAdmin()?'Cobranzas':'Mis cobros'}</h1></div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Cobrado hoy</div><div class="kpi-value is-success">${money(totHoy)}</div><div class="kpi-meta">${cobHoy.length} cobros</div></div>

    <div class="kpi"><div class="kpi-label">Histórico</div><div class="kpi-value">${money(totHist)}</div></div>
    <div class="kpi"><div class="kpi-label">Promedio</div><div class="kpi-value">${mis.length>0?money(num2(totHist/mis.length)):money(0)}</div></div>
  </div>
  ${esAdmin()&&Object.keys(porCob).length>0?`
  <div class="card">
    <div class="card-head"><div><div class="card-title">Rendimiento por cobrador</div></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Cobrador</th><th class="num">Cobros</th><th class="num">Hoy</th><th class="num">Mes</th><th class="num">Total</th></tr></thead>
      <tbody>${Object.values(porCob).map(c=>`<tr>

        <td class="num">${c.cobros}</td>
        <td class="num">${money(c.hoy)}</td>
        <td class="num">${money(c.mes)}</td>
        <td class="num" style="color:var(--success);font-weight:600">${money(c.total)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}
  <div class="card">
    <div class="card-head"><div><div class="card-title">Historial de cobros</div><div class="card-subtitle">${lista.length} de ${mis.length} registro(s)</div></div></div>
    <div class="search-wrap"><input id="inpCobranza" placeholder="Buscar..." value="${esc(ui.buscarCobranza)}" oninput="ui.buscarCobranza=this.value; renderConservarFoco('inpCobranza')"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Ref.</th><th>Fecha</th><th>Cliente</th>${esAdmin()?'<th>Cobrador</th>':''}<th class="num">Entregado</th><th class="num">Aplicado</th><th class="num">Vuelta</th></tr></thead>
      <tbody>

        const c=state.clientes.find(x=>x.id===a.clienteId);
        return `<tr>
          <td><span class="badge badge-neutral">${a.id}</span></td>
          <td>${fFecha(a.fecha)} ${a.hora||''}</td>
          <td>${esc(c?.nombre||'—')}</td>
          ${esAdmin()?`<td><span class="badge badge-cobrador">${esc(a.usuarioNombre||'—')}</span></td>`:''}
          <td class="num">${money(a.entregado??a.monto)}</td>
          <td class="num bold" style="color:var(--success)">+ ${money(a.monto)}</td>

        </tr>`;
      }).join('')||`<tr><td colspan="${esAdmin()?7:6}" class="empty">Sin resultados.</td></tr>`}

function viewGanancias(){
  const h=HOY();
  const mes=mesActual();
  const primerDia=mes+'-01';
  const vHoy=state.ventas.filter(v=>v.fecha===h);
  const vMes=state.ventas.filter(v=>mesDe(v.fecha)===mes);
  const ganFisHoy=gananciaVentas(vHoy);
  const ganFisMes=gananciaVentas(vMes);
  const ganFisTotal=gananciaVentas(state.ventas);
  const bonifHoy=bonificacionesPeriodo(h,h);
  const bonifMes=bonificacionesPeriodo(primerDia,h);
  const bonifTotal=num2(state.caja.movimientos.filter(m=>m.tipo==='bonificacion').reduce((a,m)=>a+m.monto,0));
  const ganTotal=num2(ganFisTotal+bonifTotal);
  const gastosMes=num2(state.gastos.filter(g=>mesDe(g.fecha)===mes).reduce((a,g)=>a+g.monto,0));
  const ganNeta=num2(ganFisMes+bonifMes-gastosMes);
  const ranking={};
  state.ventas.forEach(v=>v.items.forEach(it=>{
    const k=it.productoId;
    if(!ranking[k]) ranking[k]={nombre:it.nombre,ganancia:0,unidades:0,ingresos:0,esRec:it.esRecarga};
    ranking[k].ganancia+=gananciaItem(it);
    ranking[k].unidades+=it.cantidad;
    ranking[k].ingresos+=it.subtotal;
  }));
  const top=Object.values(ranking).sort((a,b)=>b.ganancia-a.ganancia).slice(0,10);
  const maxGan=top.length>0?Math.max(...top.map(t=>t.ganancia)):1;

  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Ganancia bruta total</div><div class="kpi-value is-success">${money(ganTotal)}</div></div>
    <div class="kpi"><div class="kpi-label">Gastos del mes</div><div class="kpi-value is-danger">${money(gastosMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia neta mes</div><div class="kpi-value is-success">${money(ganNeta)}</div></div>
    <div class="kpi"><div class="kpi-label">Bonif. acumuladas</div><div class="kpi-value">${money(saldoBolsasBonifTotal())}</div><div class="kpi-meta">Pendientes de retirar</div></div>

  <div class="grid-3">
    <div class="card"><div class="card-head"><div><div class="card-title">Hoy</div></div></div>
      <div class="summary-row"><span class="label">Físicos</span><span class="value">${money(ganFisHoy)}</span></div>

      <div class="summary-row highlight"><span class="label">Total</span><span class="value" style="color:var(--success)">${money(num2(ganFisHoy+bonifHoy))}</span></div>

      <div class="rank-item">

function cargarBaseReal(){
  const cats=['Telefonía','Dulces','Útiles escolares','Bebidas','Otros'].map(n=>{
    const c={id:'CA'+(state.seq.categoria++),nombre:n};
    state.categorias.push(c); return c;
  });
  const catPorNombre=n=>cats.find(c=>c.nombre===n).id;
  const provs=['Entel','Tigo','Viva'].map(x=>{
    const p={id:'PV'+(state.seq.proveedor++),nombre:x,nota:''};
    state.proveedores.push(p); bolsaDe(p.id); return p;
  });
  const provPorNombre=n=>provs.find(p=>p.nombre===n).id;
  ['Entel','Tigo','Viva'].forEach(op=>{
    [10,20,30,50,100,150,200,300,500].forEach(d=>{
      state.productos.push({id:'PR'+(state.seq.producto++),nombre:`Recarga ${op} Bs ${d}`,categoriaId:catPorNombre('Telefonía'),proveedorId:provPorNombre(op),unidad:'unidad',esRecarga:true,valorNominal:d,costo:d,precio:d,tipoRecarga:'credito',stock:0,stockInicial:0});
    });
  });
  state.productos.push({id:'PR'+(state.seq.producto++),nombre:'Paquete Entel 100 Bs',categoriaId:catPorNombre('Telefonía'),proveedorId:provPorNombre('Entel'),unidad:'unidad',esRecarga:true,valorNominal:100,costo:100,precio:100,tipoRecarga:'paquete',stock:0,stockInicial:0});
  ['Entel','Tigo','Viva'].forEach(op=>{
    state.productos.push({id:'PR'+(state.seq.producto++),nombre:`Chip ${op}`,categoriaId:catPorNombre('Telefonía'),proveedorId:provPorNombre(op),unidad:'unidad',esRecarga:false,costo:op==='Viva'?4:5,precio:op==='Viva'?12:15,stock:0,stockInicial:0});
  });
  const gen=[
    {nombre:'Chicle',cat:'Dulces',unidad:'unidad',costo:0.5,precio:1},
    {nombre:'Cuaderno',cat:'Útiles escolares',unidad:'unidad',costo:5,precio:8},
    {nombre:'Coca Cola 500ml',cat:'Bebidas',unidad:'unidad',costo:4,precio:6}
  ];
  gen.forEach(g=>{
    state.productos.push({id:'PR'+(state.seq.producto++),nombre:g.nombre,categoriaId:catPorNombre(g.cat),proveedorId:null,unidad:g.unidad,esRecarga:false,costo:num2(g.costo),precio:num2(g.precio),stock:0,stockInicial:0});
  });
  save(); render();
  toast('Configuración base cargada','ok');
}

/* ================================================================
   INIT
   ================================================================ */
(function init(){
  try{
    if(!load()){ state=initState(); save(); }
    if(!state.usuarios) state.usuarios=[{id:'U1',nombre:'Administrador',rol:'admin',color:'#1c3d5a',activo:true,creado:HOY()}];
    if(!state.turnos) state.turnos=[];
    if(!state.gastos) state.gastos=[];
    if(!state.categoriasGastos) state.categoriasGastos=[...CATEGORIAS_GASTOS_DEFAULT];
    if(!state.cuentasPorPagar) state.cuentasPorPagar=[];
    if(!state.bancos) state.bancos=[];
    if(!state.capital) state.capital={configurado:false,efectivoInicial:0,efectivoBancosInicial:0,cuentasPorCobrarIniciales:0,deudasInicialesPorCliente:{},inventarioInicial:0,bolsasIniciales:{},notas:'',fechaConfiguracion:null};
    if(!state.capital.bolsasIniciales) state.capital.bolsasIniciales={};
    if(!state.capital.deudasInicialesPorCliente) state.capital.deudasInicialesPorCliente={};
    if(!state.seq.gasto) state.seq.gasto=(state.gastos?.length||0)+1;
    if(!state.seq.cuentaPagar) state.seq.cuentaPagar=(state.cuentasPorPagar?.length||0)+1;
    if(!state.seq.banco) state.seq.banco=(state.bancos?.length||0)+1;
    if(!state.seq.movBanco) state.seq.movBanco=1;
    if(!state.seq.bonificacion) state.seq.bonificacion=1;
    if(!state.seq.usuario) state.seq.usuario=state.usuarios.length+1;
    if(!state.seq.turno) state.seq.turno=state.turnos.length+1;
    if(!state.cierres) state.cierres=[];
    if(!state.caja) state.caja={saldoInicial:0,movimientos:[]};
    if(!state.bolsas) state.bolsas={};
    if(!state.seq.mov) state.seq.mov=1;
    state.caja.movimientos.forEach(m=>{ if(!m.usuarioId){ m.usuarioId='U1'; m.usuarioNombre='Administrador'; } });
    state.ventas.forEach(v=>{ if(!v.usuarioId){ v.usuarioId='U1'; v.usuarioNombre='Administrador'; } });
    state.abonos.forEach(a=>{ if(!a.usuarioId){ a.usuarioId='U1'; a.usuarioNombre='Administrador'; } });
    state.usuarios.forEach(u=>{ if(!['admin','cajero','cobrador'].includes(u.rol)) u.rol='cajero'; });
    Object.keys(state.bolsas).forEach(id=>bolsaDe(id));
    state.productos.forEach(p=>{
      if(p.esRecarga){
        if(!p.valorNominal) p.valorNominal=p.precio;
        if(!p.tipoRecarga) p.tipoRecarga='credito';
        delete p.comision;
      }
    });
    state.bancos.forEach(b=>{ if(!b.movimientos) b.movimientos=[]; });

    usuarioActual=userById(state.usuarioActualId)||state.usuarios[0];
    state.usuarioActualId=usuarioActual.id;
    $('avatarIni').textContent=iniciales(usuarioActual.nombre);
    $('avatarIni').style.background=usuarioActual.color||'#8a6d3b';
    $('rolLbl').textContent=usuarioActual.rol==='admin'?'Administrador':usuarioActual.rol==='cajero'?'Cajero':'Cobrador';

    state.proveedores.forEach(p=>bolsaDe(p.id));
    save(); render();
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML=`
      <div class="card" style="max-width:640px;margin:40px auto">
        <div class="card-title" style="color:var(--danger);font-size:16px">Error al iniciar</div>
        <p style="margin-top:10px;color:var(--muted)">${esc(e.message||String(e))}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.clear(); location.reload();">Restablecer y recargar</button>
      </div>`;
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMGest · Distribución de SIM y Recargas</title>
<style>
:root{
  --bg:#f5f4f1;
  --surface:#ffffff;
  --surface-soft:#fafaf7;
  --ink:#15140f;
  --ink-2:#3a3833;
  --muted:#7a766d;
  --line:#e8e6e0;
  --line-soft:#f1efea;
  --primary:#1c3d5a;
  --primary-hover:#152e45;
  --accent:#8a6d3b;
  --success:#2d6a4f;
  --success-soft:#eaf3ee;
  --warning:#9c6f1f;
  --warning-soft:#fbf3e2;
  --danger:#8b2b2b;
  --danger-soft:#f9ecec;
  --info:#1e5a8a;
  --info-soft:#eaf1f7;
  --r:10px;
  --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(20,18,12,.04), 0 1px 3px rgba(20,18,12,.03);
  --shadow:0 1px 3px rgba(20,18,12,.05), 0 8px 24px -12px rgba(20,18,12,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:264px;
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:28px 0 24px;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:50;
}
.brand{padding:0 24px 28px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.4px}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--ink)}
.brand-sub{font-size:11.5px;color:var(--muted);line-height:1.4;letter-spacing:.1px}
.nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 12px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .15s, color .15s;font-family:inherit}
.nav-item:hover{background:var(--surface-soft);color:var(--ink)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{width:16px;height:16px;stroke:var(--muted);stroke-width:1.6;fill:none;flex-shrink:0}
.nav-item.active svg{stroke:#fff}
.sidebar-footer{padding:16px 24px 0;border-top:1px solid var(--line-soft);margin:0 12px}
.user-box{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--surface-soft);border:1px solid var(--line-soft)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-box select{background:transparent;border:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0;font-family:inherit;outline:none;width:100%;margin-bottom:2px}
.user-role{font-size:11px;color:var(--muted)}

.main{margin-left:264px;flex:1;padding:36px 44px 60px;max-width:1280px;width:calc(100% - 264px)}
.mobile-toggle{display:none}

.page-head{margin-bottom:32px}
.page-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.page-title{font-size:28px;font-weight:600;letter-spacing:-.5px;color:var(--ink);line-height:1.2}
.page-desc{font-size:14px;color:var(--muted);margin-top:6px;max-width:640px;line-height:1.55}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.card-subtitle{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.kpi-value{font-size:24px;font-weight:600;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi-value.is-success{color:var(--success)}
.kpi-value.is-danger{color:var(--danger)}
.kpi-value.is-warning{color:var(--warning)}
.kpi-meta{font-size:12px;color:var(--muted);margin-top:6px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px;letter-spacing:.1px}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,61,90,.10)}
input::placeholder,textarea::placeholder{color:#b5b2ab}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237a766d' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;border:1px solid transparent;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-outline:hover{border-color:#d5d2ca;background:var(--surface-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;font-size:12.5px;border-radius:6px}
.btn-ghost:hover{background:var(--surface-soft)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

.table-wrap{overflow-x:auto;margin:0 -24px;padding:0 24px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0;text-align:right}
tbody td{padding:14px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
tbody td:first-child{padding-left:0;color:var(--ink)}
tbody td:last-child{padding-right:0;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bold{font-weight:600;color:var(--ink)}

.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:500;letter-spacing:.1px;white-space:nowrap}
.badge-entel{background:#eaf0f7;color:#1c3d5a}
.badge-tigo{background:#eeecf5;color:#3a2f5c}
.badge-viva{background:#f7ecec;color:#7a2b2b}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--line-soft);color:var(--muted)}

.alert{display:flex;gap:12px;padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.55;margin-bottom:16px;border:1px solid}
.alert-info{background:var(--info-soft);border-color:#d1e0ec;color:#183a56}
.alert-warning{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.alert-danger{background:var(--danger-soft);border-color:#ecd1d1;color:#6a2020}
.alert-title{font-weight:600;margin-bottom:2px;color:inherit}

.bolsa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bolsa{border-radius:12px;padding:18px;border:1px solid var(--line);background:var(--surface-soft)}
.bolsa.entel{border-left:3px solid #1c3d5a}
.bolsa.tigo{border-left:3px solid #4c3f7c}
.bolsa.viva{border-left:3px solid #8b2b2b}
.bolsa-op{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.bolsa-val{font-size:20px;font-weight:600;color:var(--ink);margin-top:6px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.bolsa-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.bolsa-bar{height:3px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.bolsa-bar-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.bolsa.entel .bolsa-bar-fill{background:#1c3d5a}
.bolsa.tigo .bolsa-bar-fill{background:#4c3f7c}
.bolsa.viva .bolsa-bar-fill{background:#8b2b2b}

.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
.choice:hover{border-color:#cdc9c0;background:var(--surface-soft)}
.choice.active{border-color:var(--primary);background:#f4f7fa;box-shadow:inset 0 0 0 1px var(--primary)}
.choice-title{font-size:13px;font-weight:500;color:var(--ink);display:block}
.choice-desc{font-size:11.5px;color:var(--muted);margin-top:3px;display:block;line-height:1.4}

.cart-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.cart-line:last-child{border-bottom:none}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:13.5px;font-weight:500;color:var(--ink)}
.cart-meta{font-size:12px;color:var(--muted);margin-top:2px}
.cart-price{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;margin-top:12px;border-top:1px solid var(--line)}
.cart-total-label{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.cart-total-value{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.4px;font-variant-numeric:tabular-nums}

.price-box{background:var(--surface-soft);border:1px solid var(--line-soft);border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.price-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.price-value{font-size:22px;font-weight:600;color:var(--primary);letter-spacing:-.4px;font-variant-numeric:tabular-nums;margin-top:4px}
.price-meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}

.client-card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;background:var(--surface);transition:box-shadow .15s, border-color .15s}
.client-card:hover{box-shadow:var(--shadow)}
.client-card.vencido{border-left:3px solid var(--danger)}
.client-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.client-name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.client-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.client-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.client-debt{text-align:right;flex-shrink:0}
.client-debt-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.client-debt-value{font-size:20px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.client-debt-value.ok{color:var(--success)}
.client-debt-value.deuda{color:var(--danger)}
.client-body{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft)}

.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-soft);border:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-2);font-weight:500}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.summary-row:last-child{border-bottom:none}
.summary-row.highlight{color:var(--ink);font-weight:600;font-size:14.5px;padding:14px 0;border-top:1px solid var(--line);border-bottom:none}
.summary-row .label{flex:1}
.summary-row .value{font-variant-numeric:tabular-nums;font-weight:500}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 12px 32px -8px rgba(20,18,12,.4);transition:transform .3s cubic-bezier(.2,.9,.3,1.3);z-index:999;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)}
.toast.err{background:var(--danger)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.1)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:24px 20px 60px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .choice-row{grid-template-columns:1fr}
  .bolsa-grid{grid-template-columns:1fr}
  .mobile-toggle{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;font-weight:600;font-size:14px;margin:-24px -20px 20px}
  .mobile-toggle button{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink)}
}
@media(max-width:600px){
  .kpi-grid{grid-template-columns:1fr}
  .page-title{font-size:22px}
  .card{padding:18px}
  .table-wrap{margin:0 -18px;padding:0 18px}
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <div class="brand-logo">SG</div>
      <div class="brand-name">SIMGest</div>
    </div>
    <div class="brand-sub">Control de SIM, tarjetas y recargas</div>
  </div>

  <nav class="nav" id="nav"></nav>

  <div class="sidebar-footer">
    <div class="user-box">
      <div class="user-avatar" id="avatarIni">A</div>
      <div class="user-info">
        <select id="rolSel" onchange="cambiarRol(this.value)">
          <option value="admin">Administrador</option>
          <option value="vendedor">Vendedor</option>
          <option value="cobrador">Cobrador</option>
        </select>
        <div class="user-role" id="rolLbl">Acceso completo</div>
      </div>
    </div>
  </div>
</aside>

<div class="main" id="main">
  <div class="mobile-toggle">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      Menú
    </button>
  </div>
  <div id="app"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   CONFIGURACIÓN DEL NEGOCIO
   ================================================================ */
const OPERADORES = ['Entel','Tigo','Viva'];
const COMISIONES = { Entel:0.07, Tigo:0.08, Viva:0.10 };
const DENOMS     = [10,15,30,50,100];
const SIM_COSTO  = { Entel:5, Tigo:5, Viva:4 };
const SIM_VENTA  = { Entel:15, Tigo:15, Viva:12 };
const PLAZOS     = [7,15,30];
const LS_KEY     = 'simgest_v3';

const TARJ_MAYOR_A = 20,  TARJ_MAYOR_B = 100;
const SIM_MAYOR_A  = 10,  SIM_MAYOR_B  = 50;

/* ================================================================
   UTILIDADES
   ================================================================ */
const $ = id => document.getElementById(id);
const HOY = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const money = n => 'Bs ' + (Number(n)||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const num2  = n => +(Number(n)||0).toFixed(2);
const addDias = (f,n) => { const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fFecha = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const mesDe  = iso => (iso||'').slice(0,7);
const mesActual = () => HOY().slice(0,7);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const itemId = (op,tipo,den) => tipo==='SIM' ? `${op}-SIM` : `${op}-T${den}`;

function catItem(op,tipo,den){
  if(tipo==='SIM') return { op,tipo:'SIM',den:0,costo:SIM_COSTO[op],nombre:`Chip / SIM ${op}` };
  const nombre = tipo==='RECARGA' ? `Recarga ${op} Bs ${den}` : `Tarjeta ${op} Bs ${den}`;
  return { op,tipo,den,costo:num2(den*(1-COMISIONES[op])),nombre };
}

function precioVenta(op,tipo,den,cant){
  if(tipo==='RECARGA') return den;
  if(tipo==='SIM'){
    const base = SIM_VENTA[op];
    if(cant>=SIM_MAYOR_B) return num2(base*0.80);
    if(cant>=SIM_MAYOR_A) return num2(base*0.90);
    return base;
  }
  const com = COMISIONES[op];
  if(cant>=TARJ_MAYOR_B) return num2(den*(1-com*0.90));
  if(cant>=TARJ_MAYOR_A) return num2(den*(1-com*0.50));
  return den;
}

function etiquetaPrecio(tipo,cant){
  if(tipo==='RECARGA') return 'Valor nominal';
  if(tipo==='SIM'){
    if(cant>=SIM_MAYOR_B) return 'Mayoreo · 50+';
    if(cant>=SIM_MAYOR_A) return 'Mayoreo · 10+';
    return 'Raleo';
  }
  if(cant>=TARJ_MAYOR_B) return 'Mayoreo · 100+';
  if(cant>=TARJ_MAYOR_A) return 'Mayoreo · 20+';
  return 'Raleo';
}

const badgeOp = op => `<span class="badge badge-${op.toLowerCase()}">${op}</span>`;

/* ================================================================
   ESTADO
   ================================================================ */
let state = null;
let rol   = 'admin';
let vista = 'resumen';

const esAdmin = () => rol === 'admin';

const ui = {
  vTipo:'Tarjeta', vOp:'Entel', vDen:10, vCant:1,
  clienteId:'', tipoPago:'contado', plazo:15,
  carrito:[],
  filtroInv:'Todos',
  clienteAbierto:null,
  cierreMes: mesActual()
};

/* ================================================================
   NAVEGACIÓN
   ================================================================ */
const ICONS = {
  resumen:   '<path d="M3 12l9-9 9 9M5 10v10h14V10"/>',
  ventas:    '<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/>',

function crearVenta(st, opts){
  const items = opts.items.map(it=>{
    const cat = catItem(it.operador, it.tipo, it.den);
    const precio = precioVenta(it.operador, it.tipo, it.den, it.cant);
    const comUnit = it.tipo==='RECARGA'
      ? num2(precio*COMISIONES[it.operador])
      : num2(precio - cat.costo);
    return {
      tipo:it.tipo, operador:it.operador, den:cat.den, cant:it.cant,
      desc:cat.nombre, precioUnit:precio, costo:cat.costo,
      subtotal:num2(precio*it.cant), comision:num2(comUnit*it.cant)
    };
  });
  const total    = num2(items.reduce((a,i)=>a+i.subtotal,0));
  const comision = num2(items.reduce((a,i)=>a+i.comision,0));
  const cli = opts.clienteId ? st.clientes.find(c=>c.id===opts.clienteId) : null;
  const v = {
    id:'V'+(st.seq++), fecha:opts.fecha, hora:opts.hora||'09:00',
    clienteId:opts.clienteId||null,
    clienteNombre: cli ? cli.nombre : 'Consumidor final',
    tipoPago:opts.tipoPago, plazo:opts.plazo||null, vencimiento:null,
    items, total, comision, pagado:num2(opts.pagado||0),
    usuario:opts.usuario||'Admin'
  };
  if(opts.tipoPago==='credito' && opts.plazo) v.vencimiento = addDias(opts.fecha, opts.plazo);

  items.forEach(i=>{
    if(i.tipo==='RECARGA') st.bolsa[i.operador] = num2(st.bolsa[i.operador] - i.subtotal);
    else st.inventario[itemId(i.operador,i.tipo,i.den)].stock -= i.cant;
  });
  st.ventas.push(v);
  return v;
}

/* ================================================================
   LÓGICA DE NEGOCIO
   ================================================================ */
const saldoVenta = v => num2(v.total - (v.pagado||0));

function deudaCliente(clienteId){
  return num2(state.ventas
    .filter(v=>v.clienteId===clienteId && v.tipoPago==='credito')
    .reduce((a,v)=>a+saldoVenta(v),0));
}
function deudaVencida(clienteId){
  const h = HOY();
  return num2(state.ventas
    .filter(v=>v.clienteId===clienteId && v.tipoPago==='credito' && saldoVenta(v)>0 && v.vencimiento && v.vencimiento<h)
    .reduce((a,v)=>a+saldoVenta(v),0));
}
function estadoCliente(clienteId){
  const d = deudaCliente(clienteId);
  if(d<=0.001) return {txt:'Al día', cls:'badge-success'};
  if(deudaVencida(clienteId)>0) return {txt:'Vencido', cls:'badge-danger'};
  const prox = state.ventas
    .filter(v=>v.clienteId===clienteId && v.tipoPago==='credito' && saldoVenta(v)>0 && v.vencimiento)
    .sort((a,b)=>a.vencimiento.localeCompare(b.vencimiento))[0];
  if(prox && prox.vencimiento <= addDias(HOY(),3)) return {txt:'Por vencer', cls:'badge-warning'};
  return {txt:'Vigente', cls:'badge-info'};
}

function registrarAbono(clienteId, monto){
  monto = Number(monto);
  if(!(monto>0)) return toast('Ingresa un monto válido','err');
  const pend = state.ventas
    .filter(v=>v.clienteId===clienteId && v.tipoPago==='credito' && saldoVenta(v)>0.001)
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const totalPend = num2(pend.reduce((a,v)=>a+saldoVenta(v),0));
  if(monto > totalPend) monto = totalPend;

  let restante = monto;
  pend.forEach(v=>{
    if(restante<=0.001) return;
    const s = saldoVenta(v);
    const apl = Math.min(s, restante);
    v.pagado = num2((v.pagado||0) + apl);
    restante = num2(restante - apl);
  });
  state.abonos.push({ id:'A'+(state.abonoSeq++), clienteId, ventaId:null, fecha:HOY(), monto:num2(monto), usuario:rolNombre() });
  toast(`Abono registrado · ${money(monto)}`,'ok');
  render();
}

function registrarCompra(datos){
  const {operador,tipo,den,cant,costoUnit,nota} = datos;
  const total = num2(cant*costoUnit);
  if(tipo==='RECARGA'){
    state.bolsa[operador] = num2(state.bolsa[operador] + total);
  }else{
    const id = itemId(operador,tipo,den);
    state.inventario[id].stock += Number(cant);
  }
  state.compras.push({
    id:'P'+(state.compraSeq++), fecha:HOY(), operador, tipo,
    den: tipo==='SIM'?0:Number(den), cant:Number(cant),
    costoUnit:Number(costoUnit), total, nota:nota||''
  });
  toast(`Compra registrada · ${money(total)}`,'ok');
  render();
}

function rolNombre(){
  return {admin:'Administrador', vendedor:'Vendedor', cobrador:'Cobrador'}[rol];
}

function toast(msg, tipo){
  const t = $('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + (tipo||'');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast '+(tipo||''), 2600);
}

function agregarAlCarrito(){
  const {vTipo,vOp,vDen} = ui;
  const cant = Math.max(1, parseInt(ui.vCant)||1);
  const den  = vTipo==='SIM' ? 0 : Number(vDen);

  if(vTipo==='RECARGA'){
    const necesario = den*cant;
    if(state.bolsa[vOp] < necesario) return toast(`Bolsa ${vOp} insuficiente (${money(state.bolsa[vOp])})`,'err');
  }else{
    const id = itemId(vOp, vTipo, den);
    const disp = state.inventario[id].stock;
    const yaEnCarrito = ui.carrito.filter(i=>i.id===id).reduce((a,i)=>a+i.cant,0);
    if(disp < cant + yaEnCarrito) return toast(`Stock insuficiente. Quedan ${disp} unidades`,'err');
  }

  const cat = catItem(vOp, vTipo, den);
  const precio = precioVenta(vOp, vTipo, den, cant);
  const comUnit = vTipo==='RECARGA' ? num2(precio*COMISIONES[vOp]) : num2(precio-cat.costo);
  const id = vTipo==='RECARGA' ? `RECARGA-${vOp}` : itemId(vOp,vTipo,den);

  ui.carrito.push({
    id, tipo:vTipo, operador:vOp, den, cant,
    desc:cat.nombre, precioUnit:precio, costo:cat.costo,
    subtotal:num2(precio*cant), comision:num2(comUnit*cant)
  });
  toast('Producto agregado','ok');
  render();
}
function quitarDelCarrito(ix){ ui.carrito.splice(ix,1); render(); }

function confirmarVenta(){
  if(ui.carrito.length===0) return;
  const items = ui.carrito.map(i=>({tipo:i.tipo, operador:i.operador, den:i.den, cant:i.cant}));
  const d = new Date();
  const hora = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

  crearVenta(state, {
    fecha: HOY(), hora,
    tipoPago: ui.tipoPago,
    clienteId: ui.clienteId||null,
    plazo: ui.tipoPago==='credito' ? Number(ui.plazo) : null,
    items, usuario: rolNombre()
  });

  ui.carrito = [];
  toast('Venta registrada correctamente','ok');
  render();
}

function ajustarStock(key){
  const v = state.inventario[key];
  const nuevo = prompt(`Nuevo stock para ${key}\nStock actual: ${v.stock}`, v.stock);
  if(nuevo===null) return;
  const n = parseInt(nuevo);
  if(isNaN(n) || n<0) return toast('Valor inválido','err');
  v.stock = n;
  toast('Stock actualizado','ok');
  render();
}

          </div>
        </div>
        <div class="table-wrap" style="margin:0;padding:0">
          <table>
            <thead><tr><th>Cliente</th><th class="num">Saldo</th><th class="num">Vencido</th></tr></thead>
            <tbody>
            ${state.clientes.filter(c=>deudaCliente(c.id)>0).sort((a,b)=>deudaCliente(b.id)-deudaCliente(a.id)).map(c=>`
              <tr>
                <td>${esc(c.nombre)}</td>
                <td class="num bold">${money(deudaCliente(c.id))}</td>
                <td class="num" style="color:${deudaVencida(c.id)>0?'var(--danger)':'var(--muted)'};font-weight:${deudaVencida(c.id)>0?'600':'400'}">${deudaVencida(c.id)>0?money(deudaVencida(c.id)):'—'}</td>
              </tr>`).join('') || '<tr><td colspan="3" class="empty">Sin deudas pendientes</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleCliente(id){ ui.clienteAbierto = ui.clienteAbierto===id ? null : id; render(); }

function abonar(clienteId, montoForzado){
  let monto = montoForzado;
  if(monto===undefined){
    const el = $('abono-'+clienteId);
    monto = el ? el.value : 0;
  }
  registrarAbono(clienteId, monto);
}

function nuevoCliente(){
  const nombre = $('nc-nombre').value.trim();
  const tel    = $('nc-tel').value.trim();
  const com    = $('nc-com').value.trim();
  const plazo  = Number($('nc-plazo').value);
  const limite = Number($('nc-limite').value)||0;
  if(!nombre) return toast('Ingresa el nombre del cliente','err');
  state.clientes.push({
    id:'C'+(state.clienteSeq++), nombre, tel, comunidad:com||'—',
    plazo, limite, creado:HOY()
  });
  toast('Cliente registrado','ok');
  render();
}

/* ================================================================
   VISTA: COMPRAS
   ================================================================ */
function viewCompras(){

  const comprasMes = state.compras.filter(c=>mesDe(c.fecha)===mes);
  const totalMes = num2(comprasMes.reduce((a,c)=>a+c.total,0));

  return `
  <div class="page-head">
    <div class="page-eyebrow">Entradas de mercadería</div>
    <h1 class="page-title">Compras y proveedores</h1>
    <p class="page-desc">Registra lo que compras a cada operador. Al guardar, el inventario y la bolsa de recargas se actualizan automáticamente.</p>
  </div>

  <div class="grid-3" style="margin-bottom:24px">
    <div class="kpi">
      <div class="kpi-label">Compras del mes</div>
      <div class="kpi-value">${money(totalMes)}</div>
      <div class="kpi-meta">${comprasMes.length} ${comprasMes.length===1?'registro':'registros'}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total histórico</div>
      <div class="kpi-value">${money(state.compras.reduce((a,c)=>a+c.total,0))}</div>
      <div class="kpi-meta">${state.compras.length} compras registradas</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Bolsa total actual</div>
      <div class="kpi-value is-success">${money(OPERADORES.reduce((a,o)=>a+state.bolsa[o],0))}</div>
      <div class="kpi-meta">Saldo digital disponible</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Registrar compra</div>
        <div class="card-subtitle">Elige qué compraste y a qué costo. El sistema actualiza el stock automáticamente.</div>
      </div>
    </div>
    <div class="grid-4">
      <div class="field">
        <label>Operador / Proveedor</label>
        <select id="cp-op" onchange="sugerirCosto()">
          ${OPERADORES.map(o=>`<option>${o}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Tipo de producto</label>
        <select id="cp-tipo" onchange="sugerirCosto()">
          <option value="Tarjeta">Tarjeta física</option>
          <option value="SIM">Chip / SIM</option>
          <option value="RECARGA">Carga de bolsa</option>

      </div>
      <div class="field">
        <label>Denominación</label>
        <select id="cp-den" onchange="sugerirCosto()">

        </select>
      </div>
      <div class="field">
        <label>Cantidad</label>
        <input id="cp-cant" type="number" min="1" value="50" onchange="sugerirCosto()">
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Costo unitario (Bs)</label>
        <input id="cp-costo" type="number" step="0.01" value="9.30">
        <div class="hint" id="cp-hint">Se calcula automáticamente según la comisión del operador.</div>
      </div>
      <div class="field">
        <label>Nota o N° de factura</label>
        <input id="cp-nota" placeholder="Ej: Factura 0021 · Distribuidora">

        <div class="card-subtitle">Todas las entradas registradas</div>
      </div>
    </div>

      <table>
        <thead><tr><th>Ref.</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th class="num">Cant.</th><th class="num">Costo unit.</th><th class="num">Total</th><th>Nota</th></tr></thead>
        <tbody>
        ${state.compras.slice().reverse().map(c=>{
          const desc = c.tipo==='RECARGA' ? 'Carga de bolsa electrónica'
                    : c.tipo==='SIM' ? 'Chip / SIM'
                    : `Tarjeta Bs ${c.den}`;
          return `<tr>

            <td style="color:var(--muted);font-size:12.5px">${esc(c.nota||'—')}</td>

function sugerirCosto(){
  const elOp = $('cp-op'); if(!elOp) return;
  const op   = elOp.value;
  const tipo = $('cp-tipo').value;
  const den  = Number($('cp-den').value);
  let costo = 0, hint = '';

  if(tipo==='RECARGA'){
    costo = num2(den*(1-COMISIONES[op]));
    hint = `Compras Bs ${den} de saldo ${op} a ${money(costo)}. Tu comisión por cada venta: ${money(den-costo)}.`;
  }else if(tipo==='SIM'){
    costo = SIM_COSTO[op];
    hint = `Chip ${op}: costo ${money(costo)} · venta ${money(SIM_VENTA[op])} · margen ${money(SIM_VENTA[op]-costo)}.`;
  }else{
    costo = num2(den*(1-COMISIONES[op]));
    hint = `Tarjeta ${op} Bs ${den}: costo ${money(costo)} · valor nominal ${money(den)} · comisión ${money(den-costo)}.`;
  }
  $('cp-costo').value = costo;
  $('cp-hint').textContent = hint;
}

function nuevaCompra(){
  const op   = $('cp-op').value;
  const tipo = $('cp-tipo').value;
  const den  = Number($('cp-den').value);
  const cant = Math.max(1, Number($('cp-cant').value)||1);
  const costoUnit = Number($('cp-costo').value)||0;
  const nota = $('cp-nota').value.trim();
  if(costoUnit<=0) return toast('Ingresa un costo válido','err');
  registrarCompra({operador:op, tipo, den, cant, costoUnit, nota});
}

/* ================================================================
   VISTA: CIERRE MENSUAL
   ================================================================ */
function viewCierre(){
  const mes = ui.cierreMes;
  const ventasMes  = state.ventas.filter(v=>mesDe(v.fecha)===mes);
  const comprasMes = state.compras.filter(c=>mesDe(c.fecha)===mes);
  const abonosMes  = state.abonos.filter(a=>mesDe(a.fecha)===mes);

  const totVentas   = num2(ventasMes.reduce((a,v)=>a+v.total,0));
  const totComision = num2(ventasMes.reduce((a,v)=>a+v.comision,0));
  const totCompras  = num2(comprasMes.reduce((a,c)=>a+c.total,0));
  const totContado  = num2(ventasMes.filter(v=>v.tipoPago==='contado').reduce((a,v)=>a+v.total,0));
  const totCredito  = num2(ventasMes.filter(v=>v.tipoPago==='credito').reduce((a,v)=>a+v.total,0));
  const totAbonos   = num2(abonosMes.reduce((a,x)=>a+x.monto,0));

  return `
  <div class="page-head">
    <div class="page-eyebrow">Arqueo y cierre</div>
    <h1 class="page-title">Cierre mensual</h1>
    <p class="page-desc">Revisa el resumen del mes y ejecuta el cierre. El saldo final de cada producto se convierte automáticamente en el saldo inicial del próximo período.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Período a cerrar</div>
        <div class="card-subtitle">Elige el mes que quieres arquear</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input type="month" value="${mes}" onchange="ui.cierreMes=this.value; render()" style="width:auto">
        <button class="btn btn-primary" onclick="cerrarMes()">Ejecutar cierre del mes</button>
      </div>
    </div>
    <div class="alert alert-info" style="margin-bottom:0">
      <div>Al ejecutar el cierre, el <b>saldo final</b> de cada producto y de la bolsa de recargas pasa a ser el <b>saldo inicial</b> del siguiente período. Se guarda un registro histórico del cierre.</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">Ventas del mes</div>
      <div class="kpi-value">${money(totVentas)}</div>
      <div class="kpi-meta">${ventasMes.length} ${ventasMes.length===1?'transacción':'transacciones'}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Utilidad / Comisión</div>
      <div class="kpi-value is-success">${money(totComision)}</div>
      <div class="kpi-meta">Ganancia bruta estimada</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Compras del mes</div>
      <div class="kpi-value is-warning">${money(totCompras)}</div>
      <div class="kpi-meta">${comprasMes.length} ${comprasMes.length===1?'entrada':'entradas'}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Cobrado en el mes</div>
      <div class="kpi-value">${money(totAbonos)}</div>
      <div class="kpi-meta">Abonos de cartera</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Resumen de caja del mes</div>
          <div class="card-subtitle">Cómo se movió el efectivo en el período</div>
        </div>
      </div>
      <div class="summary-row"><span class="label">Ventas al contado</span><span class="value">${money(totContado)}</span></div>
      <div class="summary-row"><span class="label">Cobros de cartera (abonos)</span><span class="value">${money(totAbonos)}</span></div>
      <div class="summary-row" style="background:var(--success-soft);margin:0 -14px;padding:12px 14px;border-radius:8px;border:none"><span class="label" style="font-weight:600;color:var(--success)">Efectivo ingresado</span><span class="value" style="font-weight:700;color:var(--success);font-size:15px">${money(num2(totContado+totAbonos))}</span></div>
      <div class="summary-row" style="margin-top:8px"><span class="label">Ventas a crédito (no ingresó efectivo)</span><span class="value" style="color:var(--warning);font-weight:600">${money(totCredito)}</span></div>
      <div class="summary-row"><span class="label">Compras pagadas</span><span class="value" style="color:var(--danger);font-weight:600">− ${money(totCompras)}</span></div>
      <div class="summary-row highlight"><span class="label">Flujo neto de caja</span><span class="value">${money(num2(totContado+totAbonos-totCompras))}</span></div>
      <div class="hint" style="margin-top:12px">La utilidad real del negocio se refleja en las comisiones: <b style="color:var(--success)">${money(totComision)}</b>.</div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Bolsa de recargas — arqueo</div>
          <div class="card-subtitle">Movimiento del saldo digital en el mes</div>
        </div>
      </div>
      <div class="table-wrap" style="margin:0;padding:0">
        <table>
          <thead><tr><th>Operador</th><th class="num">Inicial</th><th class="num">Cargas</th><th class="num">Vendido</th><th class="num">Saldo final</th></tr></thead>
          <tbody>
          ${OPERADORES.map(op=>{
            const cargas = num2(comprasMes.filter(c=>c.operador===op && c.tipo==='RECARGA').reduce((a,c)=>a+c.total,0));
            const vendido = num2(ventasMes.flatMap(v=>v.items).filter(i=>i.operador===op && i.tipo==='RECARGA').reduce((a,i)=>a+i.subtotal,0));
            return `<tr>
              <td>${badgeOp(op)}</td>
              <td class="num">${money(state.bolsaBase[op])}</td>
              <td class="num" style="color:var(--success)">+${money(cargas)}</td>
              <td class="num" style="color:var(--danger)">−${money(vendido)}</td>
              <td class="num bold">${money(state.bolsa[op])}</td>

          }).join('')}

        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Arqueo de inventario físico</div>
        <div class="card-subtitle">Inicial + compras − ventas = stock final</div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Operador</th><th>Producto</th><th class="num">Inicial</th><th class="num">Compras</th><th class="num">Vendido</th><th class="num">Stock final</th>${esAdmin()?'<th class="num">Valor</th>':''}</tr></thead>
        <tbody>
        ${OPERADORES.map(op=>{
          const filas = [];
          DENOMS.forEach(d=>{
            filas.push({key:`${op}-T${d}`, nombre:`Tarjeta Bs ${d}`, den:d, tipo:'Tarjeta'});
          });
          filas.push({key:`${op}-SIM`, nombre:'Chip / SIM', den:0, tipo:'SIM'});
          return filas.map(f=>{
            const v = state.inventario[f.key];
            const comp = comprasMes.filter(c=>c.operador===op && c.tipo===f.tipo && Number(c.den)===f.den).reduce((a,c)=>a+Number(c.cant),0);
            const vend = ventasMes.flatMap(x=>x.items).filter(i=>i.operador===op && i.tipo===f.tipo && Number(i.den)===f.den).reduce((a,i)=>a+i.cant,0);
            const costo = catItem(op,f.tipo,f.den).costo;
            return `<tr>
              <td>${badgeOp(op)}</td>
              <td class="bold">${f.nombre}</td>
              <td class="num" style="color:var(--muted)">${v.inicial}</td>
              <td class="num" style="color:var(--success)">${comp>0?'+'+comp:'—'}</td>
              <td class="num" style="color:var(--danger)">${vend>0?'−'+vend:'—'}</td>
              <td class="num bold" style="font-size:14px">${v.stock}</td>
              ${esAdmin()?`<td class="num">${money(v.stock*costo)}</td>`:''}
            </tr>`;
          }).join('');
        }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  ${state.cierres.length ? `
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Historial de cierres ejecutados</div>
        <div class="card-subtitle">Registro de cierres anteriores</div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Período</th><th>Fecha de cierre</th><th class="num">Ventas</th><th class="num">Comisiones</th><th class="num">Stock final</th><th class="num">Bolsa final</th><th>Usuario</th></tr></thead>
        <tbody>
        ${state.cierres.slice().reverse().map(c=>`
          <tr>
            <td class="bold">${c.mes}</td>
            <td>${fFecha(c.fecha)}</td>
            <td class="num">${money(c.ventas)}</td>
            <td class="num" style="color:var(--success);font-weight:600">${money(c.comisiones)}</td>
            <td class="num">${c.stockFinal}</td>
            <td class="num">${money(c.bolsaFinal)}</td>
            <td><span class="badge badge-neutral">${esc(c.usuario)}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`:''}
  `;
}

function cerrarMes(){
  const mes = ui.cierreMes;
  const ventasMes = state.ventas.filter(v=>mesDe(v.fecha)===mes);
  const stockFinal = Object.values(state.inventario).reduce((a,v)=>a+v.stock,0);
  const bolsaFinal = num2(OPERADORES.reduce((a,o)=>a+state.bolsa[o],0));

  if(!confirm(`¿Confirmar cierre del período ${mes}?\n\nLos saldos finales pasarán a ser los iniciales del próximo período.`)) return;

  state.cierres.push({
    mes, fecha: HOY(),
    ventas: num2(ventasMes.reduce((a,v)=>a+v.total,0)),
    comisiones: num2(ventasMes.reduce((a,v)=>a+v.comision,0)),
    stockFinal, bolsaFinal,
    usuario: rolNombre()
  });

  Object.values(state.inventario).forEach(v=>{ v.inicial = v.stock; });
  OPERADORES.forEach(op=>{ state.bolsaBase[op] = state.bolsa[op]; });

  toast(`Cierre ${mes} ejecutado correctamente`,'ok');
  render();
}

/* ================================================================
   INICIALIZACIÓN (con protección de errores visible)
   ================================================================ */
(function init(){
  try{
    if(!load()){ state = seed(); save(); }
    if(!state.cierres) state.cierres = [];
    if(!state.bolsaBase) state.bolsaBase = {...state.bolsa};
    cambiarRol('admin', true);
  }catch(e){
    console.error(e);
    const app = document.getElementById('app');
    if(app){
      app.innerHTML = `
        <div class="card" style="max-width:640px;margin:40px auto">
          <div class="card-title" style="color:var(--danger);font-size:16px">No se pudo iniciar la aplicación</div>
          <p style="margin-top:10px;color:var(--muted);line-height:1.55">
            Ocurrió un error al cargar. Puedes intentar restablecer los datos locales:
          </p>
          <p style="margin-top:10px;font-family:monospace;font-size:12px;background:var(--surface-soft);padding:10px;border-radius:6px;color:var(--ink-2);word-break:break-all">${esc(e.message||e)}</p>
          <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.clear(); location.reload();">Restablecer y recargar</button>
        </div>
      `;
    }
  }
})();
</script>

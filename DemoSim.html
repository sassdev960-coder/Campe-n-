function viewGanancias(){
  const h = HOY();
  const mes = mesActual();
  const vHoy = state.ventas.filter(v => v.fecha === h);
  const vMes = state.ventas.filter(v => mesDe(v.fecha) === mes);

  const ganHoy = gananciaVentas(vHoy);
  const ganMes = gananciaVentas(vMes);
  const ganTotal = gananciaVentas(state.ventas);
  const desgloseHoy = gananciaPorTipo(vHoy);
  const desgloseMes = gananciaPorTipo(vMes);
  const desgloseTotal = gananciaPorTipo(state.ventas);

  const comisionesPendientes = num2(Object.values(state.bolsas).reduce((a,b) => a + (b.comisionAcumulada||0), 0));
  const comisionesRetiradas = num2(Object.values(state.bolsas).reduce((a,b) => a + (b.comisionesRetiradas||0), 0));

  const ranking = {};
  state.ventas.forEach(v => v.items.forEach(it => {
    const key = it.productoId;
    if(!ranking[key]) ranking[key] = { productoId: key, nombre: it.nombre, esRecarga: it.esRecarga, ganancia: 0, unidades: 0, ingresos: 0 };
    ranking[key].ganancia += gananciaItem(it);
    ranking[key].unidades += it.cantidad;
    ranking[key].ingresos += it.subtotal;
  }));
  const top = Object.values(ranking).sort((a,b) => b.ganancia - a.ganancia).slice(0, 10);
  const maxGan = top.length > 0 ? Math.max(...top.map(t => t.ganancia)) : 1;

  const porMes = {};
  state.ventas.forEach(v => {
    const m = mesDe(v.fecha);
    if(!porMes[m]) porMes[m] = { mes: m, ganancia: 0, ventas: 0 };
    porMes[m].ganancia += gananciaVenta(v);
    porMes[m].ventas += v.total;
  });
  const meses = Object.values(porMes).sort((a,b) => b.mes.localeCompare(a.mes));

  return `
  <div class="page-head">
    <div class="page-eyebrow">Rentabilidad</div>
    <h1 class="page-title">Ganancias</h1>
    <p class="page-desc">Margen de ganancia por productos físicos y comisiones de recargas.</p>
  </div>

  <div class="gan-hero">
    <div>
      <div class="gan-hero-label">Ganancia total acumulada</div>
      <div class="gan-hero-value">${money(ganTotal)}</div>
      <div class="gan-hero-sub">${state.ventas.length} venta(s) · Mes actual: ${money(ganMes)}</div>
    </div>
    <div>
      <div class="gan-hero-label">Ganancia de hoy</div>
      <div class="gan-hero-value">${money(ganHoy)}</div>
      <div class="gan-hero-sub">${vHoy.length} venta(s) hoy</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Ganancia del día</div>
      <div class="kpi-value is-success">${money(ganHoy)}</div>
      <div class="kpi-meta">${vHoy.length} venta(s)</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia del mes</div>
      <div class="kpi-value is-success">${money(ganMes)}</div>
      <div class="kpi-meta">${nombreMes(mes)}</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia total</div>
      <div class="kpi-value is-success">${money(ganTotal)}</div>
      <div class="kpi-meta">Histórico</div></div>
    <div class="kpi"><div class="kpi-label">Comisiones pendientes</div>
      <div class="kpi-value">${money(comisionesPendientes)}</div>
      <div class="kpi-meta">Retiradas: ${money(comisionesRetiradas)}</div></div>
  </div>

  <div class="grid-3">
    <div class="card"><div class="card-head"><div><div class="card-title">Hoy</div></div></div>
      <div class="summary-row"><span class="label">Productos físicos</span><span class="value">${money(desgloseHoy.fisico)}</span></div>
      <div class="summary-row"><span class="label">Recargas</span><span class="value">${money(desgloseHoy.recarga)}</span></div>
      <div class="summary-row highlight"><span class="label">Total</span><span class="value" style="color:var(--success)">${money(desgloseHoy.total)}</span></div>
    </div>
    <div class="card"><div class="card-head"><div><div class="card-title">Mes actual</div></div></div>
      <div class="summary-row"><span class="label">Productos físicos</span><span class="value">${money(desgloseMes.fisico)}</span></div>
      <div class="summary-row"><span class="label">Recargas</span><span class="value">${money(desgloseMes.recarga)}</span></div>
      <div class="summary-row highlight"><span class="label">Total</span><span class="value" style="color:var(--success)">${money(desgloseMes.total)}</span></div>
    </div>
    <div class="card"><div class="card-head"><div><div class="card-title">Histórico</div></div></div>
      <div class="summary-row"><span class="label">Productos físicos</span><span class="value">${money(desgloseTotal.fisico)}</span></div>
      <div class="summary-row"><span class="label">Recargas</span><span class="value">${money(desgloseTotal.recarga)}</span></div>
      <div class="summary-row highlight"><span class="label">Total</span><span class="value" style="color:var(--success)">${money(desgloseTotal.total)}</span></div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head"><div><div class="card-title">Productos más rentables</div>
      <div class="card-subtitle">Top 10 por ganancia acumulada</div></div></div>
      ${top.length === 0 ? '<div class="empty">Sin datos aún.</div>' : top.map(t => `
        <div class="rank-item">
          <div class="rank-head">
            <div class="rank-name">${esc(t.nombre)} ${t.esRecarga ? '<span class="badge badge-accent" style="margin-left:4px">Recarga</span>' : ''}</div>
            <div class="rank-value">${money(t.ganancia)}</div>
          </div>
          <div class="rank-meta">${t.unidades} unidades · Ingresos ${money(t.ingresos)}</div>
          <div class="rank-bar"><div class="rank-bar-fill" style="width:${Math.max(2, (t.ganancia / maxGan) * 100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <div class="card-head"><div><div class="card-title">Ganancia por mes</div></div></div>
      ${meses.length === 0 ? '<div class="empty">Sin datos aún.</div>' : `
      <div class="table-wrap" style="margin:0;padding:0"><table>
        <thead><tr><th>Mes</th><th class="num">Ventas</th><th class="num">Ganancia</th></tr></thead>
        <tbody>
        ${meses.map(m => `<tr>
          <td class="bold">${nombreMes(m.mes)}</td>
          <td class="num">${money(m.ventas)}</td>
          <td class="num" style="color:var(--success);font-weight:600">${money(m.ganancia)}</td>
        </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Ganancia por usuario</div>
      <div class="card-subtitle">Rendimiento de cada vendedor</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Usuario</th><th class="num">Ventas</th><th class="num">Monto total</th><th class="num">Ganancia</th></tr></thead>
      <tbody>
      ${state.usuarios.map(u => {
        const vs = state.ventas.filter(v => v.usuarioId === u.id);
        const gan = gananciaVentas(vs);
        const tot = num2(vs.reduce((a,v) => a + v.total, 0));
        return `<tr>
          <td><span class="badge ${u.rol==='admin'?'badge-accent':'badge-info'}">${u.rol === 'admin' ? 'Admin' : 'Cajero'}</span> <b>${esc(u.nombre)}</b></td>
          <td class="num">${vs.length}</td>
          <td class="num">${money(tot)}</td>
          <td class="num" style="color:var(--success);font-weight:600">${money(gan)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Detalle por venta (últimas 30)</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Ref.</th><th>Fecha</th><th>Cliente</th><th>Usuario</th><th class="num">Total</th>
        <th class="num">Físicos</th><th class="num">Recargas</th><th class="num">Ganancia</th>
      </tr></thead>
      <tbody>
      ${state.ventas.slice().reverse().slice(0,30).map(v => {
        const d = gananciaPorTipo([v]);
        return `<tr>
          <td><span class="badge badge-neutral">${v.id}</span></td>
          <td>${fFecha(v.fecha)}<br><span style="font-size:11.5px;color:var(--muted)">${v.hora}</span></td>
          <td>${esc(v.clienteNombre)}</td>
          <td><span class="badge ${userById(v.usuarioId)?.rol === 'admin' ? 'badge-accent' : 'badge-info'}">${esc(v.usuarioNombre||'—')}</span></td>
          <td class="num bold">${money(v.total)}</td>
          <td class="num">${money(d.fisico)}</td>
          <td class="num">${money(d.recarga)}</td>
          <td class="num" style="color:var(--success);font-weight:600">${money(d.total)}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="empty">Sin ventas.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

/* ================================================================
   VISTA: CAJA
   ================================================================ */
function viewCaja(){
  const mov = movimientosVisibles().slice().reverse();
  const movHoy = mov.filter(m => m.fecha === HOY());
  const ingresosHoy = num2(movHoy.filter(m => m.monto > 0).reduce((a,m) => a + m.monto, 0));
  const egresosHoy = num2(movHoy.filter(m => m.monto < 0).reduce((a,m) => a + m.monto, 0));

  const provsBolsa = state.proveedores.filter(p =>
    (p.comisionRecarga||0) > 0 ||
    (state.bolsas[p.id] && (state.bolsas[p.id].saldo !== 0 || state.bolsas[p.id].comisionAcumulada > 0.001))
  );
  const totalSaldoBolsa = num2(provsBolsa.reduce((a,p) => a + (state.bolsas[p.id]?.saldo || 0), 0));
  const totalComision = num2(provsBolsa.reduce((a,p) => a + (state.bolsas[p.id]?.comisionAcumulada || 0), 0));
  const totalComisionesRetiradas = num2(provsBolsa.reduce((a,p) => a + (state.bolsas[p.id]?.comisionesRetiradas || 0), 0));

  const miTurnoAbierto = turnoAbiertoDe(usuarioActual.id);
  const saldoMostrar = esAdmin() ? saldoCaja() : (miTurnoAbierto ? num2(miTurnoAbierto.saldoInicial + movHoy.reduce((a,m) => a + m.monto, 0)) : 0);

  return `
  <div class="page-head">
    <div class="page-eyebrow">Tesorería</div>
    <h1 class="page-title">${esAdmin() ? 'Caja' : 'Mi caja'}</h1>
    <p class="page-desc">${esAdmin() ? 'Caja completa del negocio.' : 'Solo ves los movimientos que registraste en tu turno actual.'}</p>
  </div>

  <div class="caja-hero">
    <div>
      <div class="caja-hero-label">${esAdmin() ? 'Saldo en caja' : 'Saldo de tu turno'}</div>
      <div class="caja-hero-value">${money(saldoMostrar)}</div>
      <div class="caja-hero-sub">${esAdmin() ? `Saldo inicial: ${money(state.caja.saldoInicial)}` : (miTurnoAbierto ? `Inicial: ${money(miTurnoAbierto.saldoInicial)}` : 'Sin turno abierto')}</div>
    </div>
    ${esAdmin() ? `
      <div class="btn-row">
        <button class="btn btn-success" onclick="abrirModal('agregarDinero')">Agregar dinero</button>
        <button class="btn btn-outline" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff" onclick="abrirModal('retirarDinero')">Retirar</button>
        <button class="btn btn-outline" style="background:transparent;border-color:rgba(255,255,255,.3);color:#fff" onclick="abrirModal('saldoInicial')">Saldo inicial</button>
      </div>
    ` : `
      <div class="btn-row">
        ${miTurnoAbierto ? `<button class="btn btn-danger" onclick="abrirModal('cerrarTurno','${miTurnoAbierto.id}')">Cerrar turno</button>` : `<button class="btn btn-success" onclick="abrirModal('abrirTurno')">Abrir turno</button>`}
      </div>
    `}
  </div>

  ${esAdmin() ? `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Bolsa de recargas</div>
      <div class="card-subtitle">Saldo y comisiones por operador</div></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="abrirModal('reponerBolsa')">Reponer saldo</button>
        <button class="btn btn-outline" onclick="abrirModal('retirarComision')">Retirar comisión</button>
      </div>
    </div>
    ${provsBolsa.length === 0 ? `
      <div class="empty">Sin operadores con bolsa.</div>
    `:`
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
        <div class="kpi"><div class="kpi-label">Saldo total en bolsas</div>
          <div class="kpi-value">${money(totalSaldoBolsa)}</div></div>
        <div class="kpi"><div class="kpi-label">Comisión acumulada</div>
          <div class="kpi-value is-success">${money(totalComision)}</div></div>
        <div class="kpi"><div class="kpi-label">Comisiones retiradas</div>
          <div class="kpi-value">${money(totalComisionesRetiradas)}</div></div>
      </div>
      <div class="bolsa-grid">
        ${provsBolsa.map(p => {
          const b = state.bolsas[p.id] || { saldo:0, comisionAcumulada:0, comisionesRetiradas:0 };
          return `<div class="bolsa-card">
            <div class="bolsa-card-head">
              <div><div class="bolsa-card-op">${esc(p.nombre)}</div>
              <div class="bolsa-card-com">Comisión: ${p.comisionRecarga || 0}%</div></div>
              <span class="badge badge-accent">${p.comisionRecarga||0}%</span>
            </div>
            <div class="bolsa-row"><span class="bolsa-row-label">Saldo</span><span class="bolsa-row-value saldo">${money(b.saldo)}</span></div>
            <div class="bolsa-row"><span class="bolsa-row-label">Comisión acumulada</span><span class="bolsa-row-value comision">${money(b.comisionAcumulada)}</span></div>
            <div class="bolsa-row"><span class="bolsa-row-label">Retiradas</span><span class="bolsa-row-value retirada">${money(b.comisionesRetiradas||0)}</span></div>
          </div>`;
        }).join('')}
      </div>
    `}
  </div>`:''}

  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="kpi-label">Ingresos hoy</div>
      <div class="kpi-value is-success">+ ${money(ingresosHoy)}</div></div>
    <div class="kpi"><div class="kpi-label">Egresos hoy</div>
      <div class="kpi-value is-danger">${money(egresosHoy)}</div></div>
    <div class="kpi"><div class="kpi-label">Neto del día</div>
      <div class="kpi-value">${money(num2(ingresosHoy + egresosHoy))}</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">${esAdmin() ? 'Movimientos' : 'Tus movimientos'}</div>
      <div class="card-subtitle">${mov.length} movimiento(s)</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Fecha</th><th>Tipo</th>${esAdmin()?'<th>Usuario</th>':''}<th>Descripción</th><th class="num">Monto</th>${esAdmin()?'<th></th>':''}
      </tr></thead>
      <tbody>
      ${mov.slice(0,100).map(m => {
        const tipoLbl = {
          aporte:'Aporte', retiro:'Retiro', venta:'Venta', abono:'Abono', compra:'Compra',
          recarga_reposicion:'Reponer bolsa', comision:'Comisión'
        }[m.tipo] || m.tipo;
        const cls = m.monto > 0 ? 'badge-success' : 'badge-danger';
        const puedeEliminar = esAdmin() && (m.tipo === 'aporte' || m.tipo === 'retiro') && !m.referencia;
        return `<tr>
          <td>${fFecha(m.fecha)}<br><span style="font-size:11.5px;color:var(--muted)">${m.hora||''}</span></td>
          <td><span class="badge ${cls}">${tipoLbl}</span></td>
          ${esAdmin()?`<td>${esc(m.usuarioNombre||'—')}</td>`:''}
          <td>${esc(m.descripcion)}</td>
          <td class="num bold" style="color:${m.monto > 0 ? 'var(--success)' : 'var(--danger)'}">${m.monto > 0 ? '+' : ''}${money(m.monto)}</td>
          ${esAdmin()?`<td class="num">${puedeEliminar ? `<button class="btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--danger)" onclick="accionEliminarMovimiento('${m.id}')">Eliminar</button>` : ''}</td>`:''}
        </tr>`;
      }).join('') || `<tr><td colspan="${esAdmin()?6:4}" class="empty">Sin movimientos.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

/* ================================================================
   VISTA: PUNTO DE VENTA
   ================================================================ */
function viewVentas(){
  const turnoOk = turnoRequerido();
  const total = totalCarritoVenta();
  const cliente = ui.ventaClienteId ? state.clientes.find(c => c.id === ui.ventaClienteId) : null;
  const montoRecibido = Number(ui.ventaMontoRecibido) || 0;
  const cambio = num2(montoRecibido - total);
  const cambioValido = montoRecibido >= total;
  const gananciaCarrito = num2(ui.ventaCarrito.reduce((a,i) => a + gananciaItem(i), 0));

  const q = ui.buscarProd.trim().toLowerCase();
  const prods = state.productos.filter(p => !q || p.nombre.toLowerCase().includes(q)).sort((a,b) => a.nombre.localeCompare(b.nombre));

  const dispDe = p => {
    if(esProductoRecarga(p)){
      const b = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      return { texto: b ? 'Bolsa: ' + money(b.saldo) : 'Sin operador', ok: b && b.saldo > 0 };
    }
    return { texto: p.stock <= 0 ? 'Agotado' : 'Stock: ' + p.stock + ' ' + unidadAbrev(p.unidad), ok: p.stock > 0 };
  };

  const misVentas = ventasVisibles().slice().reverse().slice(0, 30);

  return `
  <div class="page-head">
    <div class="page-eyebrow">Ventas</div>
    <h1 class="page-title">Punto de venta</h1>
    <p class="page-desc">${esAdmin() ? 'Registra ventas. Las tuyas quedarán ocultas para los cajeros.' : 'Registra tus ventas. Solo tú ves las que hiciste vos.'}</p>
  </div>

  ${!turnoOk ? `
  <div class="alert alert-warning">
    <div><div class="alert-title">Debes abrir tu turno antes de vender</div>
    Ve a la pestaña <b>Mi turno</b> y ábrelo. Necesitas un turno abierto para registrar ventas.</div>
  </div>` : ''}

  <div class="grid-2" style="${!turnoOk ? 'opacity:.5;pointer-events:none' : ''}">
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Catálogo</div>
        <div class="card-subtitle">Click para agregar</div></div>
      </div>
      <div class="field">
        <input placeholder="Buscar producto..." value="${esc(ui.buscarProd)}" oninput="ui.buscarProd=this.value; render(); this.focus()">
      </div>
      <div class="prod-list">
        ${prods.length === 0 ? '<div class="empty">No hay productos.</div>' : prods.map(p => {
          const d = dispDe(p);
          const esRec = esProductoRecarga(p);
          return `<div class="prod-item ${!d.ok ? 'stock-0' : ''}" onclick="${!d.ok ? '' : `agregarAlCarritoVenta('${p.id}',1)`}">
            <div>
              <div class="prod-name">${esc(p.nombre)} ${esRec ? '<span class="badge badge-accent" style="margin-left:6px">Recarga</span>' : ''}</div>
              <div class="prod-meta">${esRec ? (provById(p.proveedorId)?.nombre || 'Sin operador') : (unidadAbrev(p.unidad) + ' · ' + (catById(p.categoriaId)?.nombre || ''))}</div>
            </div>
            <div style="text-align:right">
              <div class="prod-price">${money(p.precio)}</div>
              <div class="prod-stock" style="${!d.ok ? 'color:var(--danger);font-weight:600' : ''}">${d.texto}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Carrito</div>
        <div class="card-subtitle">${ui.ventaCarrito.length === 0 ? 'Sin productos' : ui.ventaCarrito.length + ' producto(s)'}</div></div>
        ${ui.ventaCarrito.length > 0 ? `<button class="btn-ghost" onclick="ui.ventaCarrito=[]; render()">Vaciar</button>` : ''}
      </div>
      ${ui.ventaCarrito.length === 0 ? `
        <div class="empty" style="padding:30px 16px">Agrega productos para iniciar.</div>
      `:`
        <div>
          ${ui.ventaCarrito.map((i, ix) => `
            <div class="cart-line">
              <div class="cart-info">
                <div class="cart-name">${esc(i.nombre)} ${i.esRecarga?'<span class="badge badge-accent">Recarga</span>':''}</div>
                <div class="cart-meta">${money(i.precioUnit)} × ${i.cantidad} ${unidadAbrev(i.unidad)} · <span style="color:var(--success);font-weight:600">Ganancia ${money(gananciaItem(i))}</span></div>
              </div>
              <input type="number" step="0.01" class="cart-qty" value="${i.cantidad}" onchange="actualizarLineaCarrito(${ix},'cantidad',this.value)">
              <input type="number" step="0.01" class="cart-price" value="${i.precioUnit}" onchange="actualizarLineaCarrito(${ix},'precioUnit',this.value)">
              <div class="cart-sub">${money(i.subtotal)}</div>
              <button class="btn-ghost" style="padding:2px 8px" onclick="quitarDelCarrito(${ix})">×</button>
            </div>
          `).join('')}
        </div>
        <div class="cart-total">
          <span class="cart-total-label">Total</span>
          <span class="cart-total-value">${money(total)}</span>
        </div>
        <div style="text-align:right;font-size:12.5px;color:var(--success);font-weight:600;margin-top:4px">Ganancia: ${money(gananciaCarrito)}</div>

        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line)">
          <div class="field" style="position:relative">
            <label>Cliente</label>
            ${cliente ? `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)">
                <div>
                  <div style="font-weight:500">${esc(cliente.nombre)}</div>

          ${ui.ventaTipoPago === 'contado' ? `
            <div class="field">
              <label>Monto recibido (Bs) *</label>
              <div class="money-input-wrap">
                <input type="number" step="0.01" min="0" placeholder="0.00" value="${ui.ventaMontoRecibido}"

          <button class="btn btn-success btn-block" style="margin-top:16px" onclick="confirmarVenta()"

          <td class="num" style="color:var(--success);font-weight:600">${money(gananciaVenta(v))}</td>
          <td class="num">${v.tipoPago === 'credito'
              ? `<span class="badge ${saldoVenta(v)<=0.001?'badge-success':'badge-danger'}">${saldoVenta(v)<=0.001?'Pagada':'Debe '+money(saldoVenta(v))}</span>`

          ${esAdmin()?`<td class="num"><button class="btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--danger)" onclick="accionEliminarVenta('${v.id}')">Eliminar</button></td>`:''}

      </tbody>
    </table></div>
  </div>`;
}

/* ================================================================
   VISTA: INVENTARIO
   ================================================================ */
function viewInventario(){
  const filtro = ui.filtroInv;
  const prods = state.productos
    .filter(p => filtro === 'Todas' || p.categoriaId === filtro)
    .sort((a,b) => a.nombre.localeCompare(b.nombre));
  const valorTotal = num2(state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock * p.costo, 0));
  const valorVenta = num2(state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock * p.precio, 0));
  const bajos = state.productos.filter(p => !esProductoRecarga(p) && p.stock <= 5).length;
  const totalSaldoBolsa = num2(Object.values(state.bolsas).reduce((a,b) => a + (b.saldo||0), 0));

  return `
  <div class="page-head">
    <div class="page-eyebrow">Existencias</div>
    <h1 class="page-title">Inventario</h1>
    <p class="page-desc">Stock de productos físicos y saldo de bolsas de recargas.</p>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Valor a costo</div>
      <div class="kpi-value">${money(valorTotal)}</div></div>
    <div class="kpi"><div class="kpi-label">Valor a venta</div>
      <div class="kpi-value is-success">${money(valorVenta)}</div>
      <div class="kpi-meta">Potencial: ${money(num2(valorVenta - valorTotal))}</div></div>
    <div class="kpi"><div class="kpi-label">Saldo en bolsas</div>
      <div class="kpi-value">${money(totalSaldoBolsa)}</div></div>
    <div class="kpi"><div class="kpi-label">Bajo stock</div>
      <div class="kpi-value ${bajos>0?'is-warning':''}">${bajos}</div>
      <div class="kpi-meta">${bajos>0?'Reponer':'OK'}</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Productos</div>
      <div class="card-subtitle">${prods.length} producto(s)</div></div>
      <div class="btn-row">
        <button class="btn btn-sm ${filtro==='Todas'?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='Todas'; render()">Todas</button>
        ${state.categorias.map(c => `<button class="btn btn-sm ${filtro===c.id?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='${c.id}'; render()">${esc(c.nombre)}</button>`).join('')}
      </div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Producto</th><th>Categoría</th><th>Proveedor</th>
        <th class="num">Disponible</th>
        ${esAdmin()?'<th class="num">Costo</th>':''}
        <th class="num">Precio</th><th class="num">Margen</th><th class="num">Estado</th>
      </tr></thead>
      <tbody>
      ${prods.map(p => {
        const cat = catById(p.categoriaId);
        const prov = provById(p.proveedorId);
        const esRec = esProductoRecarga(p);
        const margen = num2(p.precio - p.costo);
        let stockTxt, estado;
        if(esRec){
          const b = p.proveedorId ? state.bolsas[p.proveedorId] : null;
          const s = b ? b.saldo : 0;
          stockTxt = money(s);
          estado = s <= 0 ? '<span class="badge badge-danger">Sin saldo</span>' : s <= 50 ? '<span class="badge badge-warning">Bajo</span>' : '<span class="badge badge-success">OK</span>';
        }else{
          stockTxt = `${p.stock} <span style="font-size:11px;color:var(--muted)">${unidadAbrev(p.unidad)}</span>`;
          estado = p.stock <= 0 ? '<span class="badge badge-danger">Agotado</span>' : p.stock <= 5 ? '<span class="badge badge-warning">Bajo</span>' : '<span class="badge badge-success">OK</span>';
        }
        return `<tr>
          <td class="bold">${esc(p.nombre)} ${esRec?'<span class="badge badge-accent" style="margin-left:4px">Recarga</span>':''}</td>
          <td>${cat ? esc(cat.nombre) : '—'}</td>
          <td>${prov ? esc(prov.nombre) : '—'}</td>
          <td class="num bold" style="font-size:14px">${stockTxt}</td>
          ${esAdmin()?`<td class="num">${money(p.costo)}</td>`:''}
          <td class="num" style="color:var(--primary);font-weight:600">${money(p.precio)}</td>
          <td class="num" style="color:var(--success);font-weight:600">${money(margen)}</td>
          <td class="num">${estado}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="empty">No hay productos.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

          <div><div class="card-title">Resumen de cartera</div>
          <div class="card-subtitle">Clientes con saldo</div></div>

function viewCierre(){
  const mes = ui.cierreMes;
  const ventasMes = state.ventas.filter(v => mesDe(v.fecha) === mes);
  const comprasMes = state.compras.filter(c => mesDe(c.fecha) === mes);
  const abonosMes = state.abonos.filter(a => mesDe(a.fecha) === mes);
  const movMes = state.caja.movimientos.filter(m => mesDe(m.fecha) === mes);

  const totVentas = num2(ventasMes.reduce((a,v) => a + v.total, 0));
  const totCompras = num2(comprasMes.reduce((a,c) => a + c.total, 0));
  const totContado = num2(ventasMes.filter(v => v.tipoPago === 'contado').reduce((a,v) => a + v.total, 0));
  const totCredito = num2(ventasMes.filter(v => v.tipoPago === 'credito').reduce((a,v) => a + v.total, 0));
  const totAbonos = num2(abonosMes.reduce((a,x) => a + x.monto, 0));
  const ingresosMes = num2(movMes.filter(m => m.monto > 0).reduce((a,m) => a + m.monto, 0));
  const egresosMes = num2(movMes.filter(m => m.monto < 0).reduce((a,m) => a + m.monto, 0));
  const comisionesMes = num2(movMes.filter(m => m.tipo === 'comision').reduce((a,m) => a + m.monto, 0));
  const gananciaMes = gananciaVentas(ventasMes);
  const yaCerrado = state.cierres.some(c => c.mes === mes);

  return `
  <div class="page-head">
    <div class="page-eyebrow">Arqueo</div>
    <h1 class="page-title">Cierre mensual</h1>
    <p class="page-desc">Revisa el resumen del mes y ejecuta el cierre.</p>
  </div>

  ${yaCerrado ? `
  <div class="alert alert-warning">
    <div><div class="alert-title">Este período ya fue cerrado antes</div></div>
  </div>`:''}

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Período</div></div>
      <div class="btn-row">
        <input type="month" value="${mes}" onchange="ui.cierreMes=this.value; render()" style="width:auto">
        <button class="btn btn-danger" onclick="accionEjecutarCierre()">Ejecutar cierre</button>
      </div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Ventas del mes</div>
      <div class="kpi-value">${money(totVentas)}</div>
      <div class="kpi-meta">${ventasMes.length} transacción(es)</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia del mes</div>
      <div class="kpi-value is-success">${money(gananciaMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Compras del mes</div>
      <div class="kpi-value is-warning">${money(totCompras)}</div></div>
    <div class="kpi"><div class="kpi-label">Saldo final en caja</div>
      <div class="kpi-value">${money(saldoCaja())}</div></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head"><div><div class="card-title">Caja del mes</div></div></div>
      <div class="summary-row"><span class="label">Ventas al contado</span><span class="value">${money(totContado)}</span></div>
      <div class="summary-row"><span class="label">Abonos cobrados</span><span class="value">${money(totAbonos)}</span></div>
      <div class="summary-row" style="background:var(--success-soft);margin:0 -14px;padding:12px 14px;border-radius:8px;border:none">
        <span class="label" style="font-weight:600;color:var(--success)">Ingresos totales</span>
        <span class="value" style="font-weight:700;color:var(--success);font-size:15px">${money(ingresosMes)}</span>
      </div>
      <div class="summary-row"><span class="label">Compras</span><span class="value" style="color:var(--danger);font-weight:600">− ${money(totCompras)}</span></div>
      <div class="summary-row highlight"><span class="label">Flujo neto del mes</span><span class="value">${money(num2(ingresosMes + egresosMes))}</span></div>
      <div class="summary-row"><span class="label">Ventas a crédito</span><span class="value" style="color:var(--warning)">${money(totCredito)}</span></div>
    </div>

    <div class="card">
      <div class="card-head"><div><div class="card-title">Estado actual</div></div></div>
      <div class="summary-row"><span class="label">Productos</span><span class="value">${state.productos.length}</span></div>
      <div class="summary-row"><span class="label">Valor inventario</span><span class="value">${money(num2(state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock * p.costo, 0)))}</span></div>
      <div class="summary-row"><span class="label">Saldo en bolsas</span><span class="value">${money(num2(Object.values(state.bolsas).reduce((a,b) => a + (b.saldo||0), 0)))}</span></div>
      <div class="summary-row"><span class="label">Comisiones pendientes</span><span class="value" style="color:var(--success);font-weight:600">${money(num2(Object.values(state.bolsas).reduce((a,b) => a + (b.comisionAcumulada||0), 0)))}</span></div>
      <div class="summary-row"><span class="label">Cartera por cobrar</span><span class="value">${money(num2(state.clientes.reduce((a,c) => a + deudaCliente(c.id), 0)))}</span></div>
      <div class="summary-row highlight"><span class="label">Efectivo en caja</span><span class="value">${money(saldoCaja())}</span></div>
    </div>
  </div>

  ${state.cierres.length ? `

        <td><span class="badge badge-neutral">${esc(c.usuarioNombre||'—')}</span></td></tr>`).join('')}
      </tbody>
    </table></div>
  </div>`:''}
  `;
}

/* ================================================================
   CONFIGURACIÓN BASE
   ================================================================ */
function cargarBaseReal(){
  const cats = ['Telefonía','Dulces','Útiles escolares','Bebidas','Otros'].map(n => {
    const c = { id:'CA'+(state.seq.categoria++), nombre:n };
    state.categorias.push(c);
    return c;
  });
  const catPorNombre = n => cats.find(c => c.nombre === n).id;
  const provs = [
    { nombre:'Entel', comision:5 },
    { nombre:'Tigo',  comision:6 },
    { nombre:'Viva',  comision:7 }
  ].map(x => {
    const p = { id:'PV'+(state.seq.proveedor++), nombre:x.nombre, nota:'', comisionRecarga:x.comision };
    state.proveedores.push(p);
    bolsaDe(p.id);
    return p;
  });
  const provPorNombre = n => provs.find(p => p.nombre === n).id;
  ['Entel','Tigo','Viva'].forEach(op => {
    [10,15,30,50,100].forEach(d => {
      state.productos.push({
        id:'PR'+(state.seq.producto++),
        nombre:`Recarga ${op} Bs ${d}`,
        categoriaId: catPorNombre('Telefonía'),
        proveedorId: provPorNombre(op),
        unidad:'unidad', esRecarga: true,
        costo: num2(d * (1 - ({ Entel:0.05, Tigo:0.06, Viva:0.07 }[op]))),
        precio: d, stock: 0, stockInicial: 0
      });
    });
  });
  ['Entel','Tigo','Viva'].forEach(op => {
    state.productos.push({
      id:'PR'+(state.seq.producto++),
      nombre:`Chip ${op}`,
      categoriaId: catPorNombre('Telefonía'),
      proveedorId: provPorNombre(op),
      unidad:'unidad', esRecarga:false,
      costo: op==='Viva'?4:5, precio: op==='Viva'?12:15,
      stock:0, stockInicial:0
    });
  });
  const generales = [
    { nombre:'Chicle', cat:'Dulces', unidad:'unidad', costo:0.5, precio:1 },
    { nombre:'Caramelo', cat:'Dulces', unidad:'unidad', costo:0.3, precio:0.5 },
    { nombre:'Cuaderno', cat:'Útiles escolares', unidad:'unidad', costo:5, precio:8 },
    { nombre:'Lápiz', cat:'Útiles escolares', unidad:'unidad', costo:0.8, precio:2 },
    { nombre:'Coca Cola 500ml', cat:'Bebidas', unidad:'unidad', costo:4, precio:6 }
  ];
  generales.forEach(g => {
    state.productos.push({
      id:'PR'+(state.seq.producto++),
      nombre: g.nombre, categoriaId: catPorNombre(g.cat), proveedorId: null,
      unidad: g.unidad, esRecarga:false,
      costo: num2(g.costo), precio: num2(g.precio), stock:0, stockInicial:0
    });
  });
  save(); render();
  toast('Configuración base cargada','ok');
}

  try{
    if(!load()){ state = initState(); save(); }
    if(!state.usuarios) state.usuarios = [{ id:'U1', nombre:'Administrador', rol:'admin', color:'#1c3d5a', activo:true, creado:HOY() }];
    if(!state.turnos) state.turnos = [];
    if(!state.seq.usuario) state.seq.usuario = state.usuarios.length + 1;
    if(!state.seq.turno) state.seq.turno = state.turnos.length + 1;
    if(!state.cierres) state.cierres = [];
    if(!state.caja) state.caja = { saldoInicial:0, movimientos:[] };
    if(!state.bolsas) state.bolsas = {};
    if(!state.seq.mov) state.seq.mov = 1;
    // Migrar movimientos antiguos sin usuarioId
    state.caja.movimientos.forEach(m => {
      if(!m.usuarioId){ m.usuarioId = 'U1'; m.usuarioNombre = 'Administrador'; }
    });
    // Migrar ventas antiguas sin usuarioId
    state.ventas.forEach(v => {
      if(!v.usuarioId){ v.usuarioId = 'U1'; v.usuarioNombre = 'Administrador'; }
    });
    state.abonos.forEach(a => {
      if(!a.usuarioId){ a.usuarioId = 'U1'; a.usuarioNombre = 'Administrador'; }
    });

    usuarioActual = userById(state.usuarioActualId) || state.usuarios[0];
    state.usuarioActualId = usuarioActual.id;

    // Inicializar selector
    $('avatarIni').textContent = iniciales(usuarioActual.nombre);
    $('avatarIni').style.background = usuarioActual.color || '#8a6d3b';
    $('rolLbl').textContent = usuarioActual.rol === 'admin' ? 'Administrador' : 'Cajero';

    state.proveedores.forEach(p => { if((p.comisionRecarga||0) > 0) bolsaDe(p.id); });
    save();
    render();
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = `
      <div class="card" style="max-width:640px;margin:40px auto">
        <div class="card-title" style="color:var(--danger);font-size:16px">Error al iniciar</div>
        <p style="margin-top:10px;color:var(--muted)">${esc(e.message||String(e))}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.clear(); location.reload();">Restablecer y recargar</button>
      </div>
    `;
  }
})();
</script>
</body>
</html>

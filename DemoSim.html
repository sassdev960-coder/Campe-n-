                <button class="choice ${ui.ventaPlazo===15?'active':''}" onclick="ui.ventaPlazo=15; render()"><span class="choice-title">15d</span></button>
                <button class="choice ${ui.ventaPlazo===20?'active':''}" onclick="ui.ventaPlazo=20; render()"><span class="choice-title">20d</span></button>
                <button class="choice ${ui.ventaPlazo===30?'active':''}" onclick="ui.ventaPlazo=30; render()"><span class="choice-title">30d</span></button>
                <button class="choice ${ui.ventaPlazo==='custom'?'active':''}" onclick="ui.ventaPlazo='custom'; render()"><span class="choice-title">Otro</span></button>
              </div>
              ${ui.ventaPlazo === 'custom' ? `<input type="number" min="1" placeholder="Días" value="${ui.ventaPlazoCustom}" onchange="ui.ventaPlazoCustom=this.value; render()" style="margin-top:8px">`:''}
            </div>
            ${!cliente ? '<div class="alert alert-warning" style="margin-bottom:10px"><div>Selecciona un cliente.</div></div>' : ''}
          `:''}
          ${ui.ventaTipoPago === 'contado' ? `
            <div class="field"><label>Monto recibido (Bs) *</label>
              <div class="money-input-wrap">
                <input type="number" step="0.01" min="0" placeholder="0.00" value="${ui.ventaMontoRecibido}"
                  oninput="ui.ventaMontoRecibido=this.value; render(); this.focus()"
                  class="${montoRecibido > 0 ? (cambioValido ? 'money-ok' : 'money-bad') : ''}">
              </div>
            </div>
            ${montoRecibido > 0 ? `<div class="cambio-box ${cambioValido ? (cambio > 0.001 ? '' : 'exacto') : 'insuf'}">
              <span class="cambio-label">${cambioValido ? (cambio > 0.001 ? 'Cambio' : 'Exacto') : 'Falta'}</span>
              <span class="cambio-value">${money(cambioValido ? Math.abs(cambio) : (total - montoRecibido))}</span>
            </div>`:''}
          `:''}
          <button class="btn btn-success btn-block" style="margin-top:16px" onclick="confirmarVenta()"
            ${(ui.ventaTipoPago==='contado' && !cambioValido) || (ui.ventaTipoPago==='credito' && !cliente) ? 'disabled' : ''}>
            Confirmar venta · ${money(total)}
          </button>
        </div>`}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div><div class="card-title">${esAdmin() ? 'Historial completo' : 'Mis ventas'}</div></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Ref.</th><th>Fecha</th><th>Cliente</th><th>Pago</th>${esAdmin()?'<th>Usuario</th>':''}
        <th class="num">Total</th><th class="num">Ganancia</th><th class="num">Estado</th>${esAdmin()?'<th></th>':''}</tr></thead>
      <tbody>
      ${misVentas.map(v => `
        <tr>
          <td><span class="badge badge-neutral">${v.id}</span></td>
          <td>${fFecha(v.fecha)}<br><span style="font-size:11.5px;color:var(--muted)">${v.hora}</span></td>
          <td>${esc(v.clienteNombre)}</td>
          <td>${v.tipoPago === 'contado' ? '<span class="badge badge-success">Contado</span>' : `<span class="badge badge-warning">Créd ${v.plazo}d</span>`}</td>
          ${esAdmin()?`<td><span class="badge ${userById(v.usuarioId)?.rol === 'admin' ? 'badge-accent' : 'badge-info'}">${esc(v.usuarioNombre||'—')}</span></td>`:''}
          <td class="num bold">${money(v.total)}</td>
          <td class="num" style="color:var(--success);font-weight:600">${money(gananciaVenta(v))}</td>
          <td class="num">${v.tipoPago === 'credito'
              ? `<span class="badge ${saldoVenta(v)<=0.001?'badge-success':'badge-danger'}">${saldoVenta(v)<=0.001?'Pagada':'Debe '+money(saldoVenta(v))}</span>`

          ${esAdmin()?`<td class="num"><button class="btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--danger)" onclick="accionEliminarVenta('${v.id}')">Eliminar</button></td>`:''}
        </tr>`).join('') || `<tr><td colspan="${esAdmin()?9:7}" class="empty">Sin ventas</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

/* ================================================================
   VISTA: INVENTARIO
   ================================================================ */
function viewInventario(){
  const filtro = ui.filtroInv;
  const prods = state.productos.filter(p => filtro === 'Todas' || p.categoriaId === filtro).sort((a,b) => a.nombre.localeCompare(b.nombre));
  const valorTotal = valorInventarioCosto();
  const valorVenta = num2(state.productos.reduce((a,p) => esProductoRecarga(p) ? a : a + p.stock * p.precio, 0));
  const bajos = state.productos.filter(p => !esProductoRecarga(p) && p.stock <= 5).length;
  const totalSaldoBolsa = num2(Object.values(state.bolsas).reduce((a,b) => a + (b.saldo||0), 0));
  return `
  <div class="page-head"><div class="page-eyebrow">Existencias</div>
    <h1 class="page-title">Inventario</h1></div>
  <div class="info-banner">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <div><strong>Solo lectura.</strong> El stock se modifica desde <b>Compras</b> o al <b>vender</b>. El saldo de recargas se repone desde <b>Caja → Bolsa</b>.</div>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Valor a costo</div><div class="kpi-value">${money(valorTotal)}</div></div>
    <div class="kpi"><div class="kpi-label">Valor a venta</div><div class="kpi-value is-success">${money(valorVenta)}</div>
      <div class="kpi-meta">Potencial: ${money(num2(valorVenta - valorTotal))}</div></div>
    <div class="kpi"><div class="kpi-label">Saldo en bolsas</div><div class="kpi-value">${money(totalSaldoBolsa)}</div></div>
    <div class="kpi"><div class="kpi-label">Bajo stock</div><div class="kpi-value ${bajos>0?'is-warning':''}">${bajos}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><div><div class="card-title">Productos</div><div class="card-subtitle">${prods.length}</div></div>
      <div class="btn-row">
        <button class="btn btn-sm ${filtro==='Todas'?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='Todas'; render()">Todas</button>
        ${state.categorias.map(c => `<button class="btn btn-sm ${filtro===c.id?'btn-primary':'btn-outline'}" onclick="ui.filtroInv='${c.id}'; render()">${esc(c.nombre)}</button>`).join('')}
      </div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Producto</th><th>Categoría</th><th>Proveedor</th><th class="num">Disponible</th>
        ${esAdmin()?'<th class="num">Costo</th>':''}<th class="num">Precio</th><th class="num">Margen</th><th class="num">Estado</th></tr></thead>
      <tbody>
      ${prods.map(p => {
        const cat = catById(p.categoriaId);
        const prov = provById(p.proveedorId);
        const esRec = esProductoRecarga(p);
        const margen = num2(p.precio - p.costo);
        let stockTxt, estado;
        if(esRec){ const b = p.proveedorId ? state.bolsas[p.proveedorId] : null; const s = b ? (b.saldo||0) : 0; stockTxt = money(s);
          estado = s <= 0 ? '<span class="badge badge-danger">Sin saldo</span>' : s <= 50 ? '<span class="badge badge-warning">Bajo</span>' : '<span class="badge badge-success">OK</span>';
        }else{ stockTxt = `${p.stock} ${unidadAbrev(p.unidad)}`;
          estado = p.stock <= 0 ? '<span class="badge badge-danger">Agotado</span>' : p.stock <= 5 ? '<span class="badge badge-warning">Bajo</span>' : '<span class="badge badge-success">OK</span>';
        }
        return `<tr>
          <td class="bold">${esc(p.nombre)} ${esRec?'<span class="badge badge-accent" style="margin-left:4px">Recarga</span>':''}</td>
          <td>${cat ? esc(cat.nombre) : '—'}</td>
          <td>${prov ? esc(prov.nombre) : '—'}</td>
          <td class="num bold">${stockTxt}</td>
          ${esAdmin()?`<td class="num">${money(p.costo)}</td>`:''}
          <td class="num" style="color:var(--primary);font-weight:600">${money(p.precio)}</td>
          <td class="num" style="color:${esRec?'var(--muted)':'var(--success)'};font-weight:600">${esRec ? '—' : money(margen)}</td>
          <td class="num">${estado}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="empty">Sin productos.</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

/* ================================================================
   VISTA: CLIENTES
   ================================================================ */
function viewClientes(){
  const esCob = esCobrador();
  const totalPorCobrar = num2(state.clientes.reduce((a,c) => a + deudaCliente(c.id), 0));
  const totalVencido = num2(state.clientes.reduce((a,c) => a + deudaVencida(c.id), 0));
  const conDeuda = state.clientes.filter(c => deudaCliente(c.id) > 0).length;
  const vencidos = state.clientes.filter(c => deudaVencida(c.id) > 0).length;
  const misAbonos = abonosVisibles();
  const cobHoy = esCob ? num2(misAbonos.filter(a => a.fecha === HOY()).reduce((a,x) => a + x.monto, 0)) : 0;
  const cobMes = esCob ? num2(misAbonos.filter(a => mesDe(a.fecha) === mesActual()).reduce((a,x) => a + x.monto, 0)) : 0;
  let clientesFiltrados = buscarClientesQuery(ui.buscarClienteLista);
  if(esCob){
    if(ui.filtroClientesCobrador === 'con_deuda') clientesFiltrados = clientesFiltrados.filter(c => deudaCliente(c.id) > 0);
    else if(ui.filtroClientesCobrador === 'vencidos') clientesFiltrados = clientesFiltrados.filter(c => deudaVencida(c.id) > 0);
  }
  if(esCob) clientesFiltrados.sort((a,b) => deudaVencida(b.id) - deudaVencida(a.id) || deudaCliente(b.id) - deudaCliente(a.id));
  return `
  <div class="page-head"><div class="page-eyebrow">${esCob ? 'Cobranzas' : 'Cartera'}</div>

  <div class="info-banner">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <div><strong>Busca por nombre, teléfono o comunidad.</strong> Registra cobros con el botón verde. ${esAdmin() ? 'Para editar usa el botón <b>Editar</b>.' : esCob ? 'La edición la hace el administrador.' : ''}</div>
  </div>
  ${esCob ? `<div class="cob-hero">
    <div><div class="cob-hero-label">Cobrado hoy</div>
      <div class="cob-hero-value">${money(cobHoy)}</div>
      <div class="cob-hero-sub">${misAbonos.filter(a => a.fecha === HOY()).length} cobro(s)</div></div>
    <div><div class="cob-hero-label">Cobrado este mes</div>
      <div class="cob-hero-value">${money(cobMes)}</div>
      <div class="cob-hero-sub">${nombreMes(mesActual())}</div></div>
  </div>`:''}

    <div class="kpi"><div class="kpi-label">Por cobrar</div>
      <div class="kpi-value">${money(totalPorCobrar)}</div>
      <div class="kpi-meta">${conDeuda} cliente(s)</div></div>
    <div class="kpi"><div class="kpi-label">Monto vencido</div>
      <div class="kpi-value ${totalVencido>0?'is-danger':''}">${money(totalVencido)}</div>
      <div class="kpi-meta">${vencidos} cliente(s)</div></div>
    <div class="kpi"><div class="kpi-label">Total clientes</div>
      <div class="kpi-value">${state.clientes.length}</div>
      <div class="kpi-meta">${clientesFiltrados.length} mostrados</div></div>
  </div>
  <div class="grid-2">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">
        <h3 style="font-size:15px;font-weight:600">${esCob ? 'Lista de deudores' : 'Lista de clientes'}</h3>
        ${esAdmin()?`<button class="btn btn-primary btn-sm" onclick="abrirModal('nuevoCliente')">Nuevo cliente</button>`:''}
      </div>
      ${esCob ? `<div class="filter-tabs">
        <button class="filter-tab ${ui.filtroClientesCobrador==='con_deuda'?'active':''}" onclick="ui.filtroClientesCobrador='con_deuda'; render()">Con deuda</button>
        <button class="filter-tab ${ui.filtroClientesCobrador==='vencidos'?'active':''}" onclick="ui.filtroClientesCobrador='vencidos'; render()">Vencidos</button>
        <button class="filter-tab ${ui.filtroClientesCobrador==='todos'?'active':''}" onclick="ui.filtroClientesCobrador='todos'; render()">Todos</button>
      </div>`:''}
      <div class="search-wrap"><input placeholder="Buscar por nombre, teléfono o comunidad..." value="${esc(ui.buscarClienteLista)}" oninput="ui.buscarClienteLista=this.value; render(); this.focus()"></div>
      ${clientesFiltrados.length === 0 ? `<div class="card"><div class="empty">${state.clientes.length === 0 ? 'No hay clientes.' : 'Sin resultados.'}</div></div>` : ''}
      ${clientesFiltrados.map(c => {
        const deuda = deudaCliente(c.id);

          <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start">
            <div style="flex:1;min-width:0">
              <div style="font-size:15px;font-weight:600">${esc(c.nombre)}</div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(c.comunidad)} · Tel. ${esc(c.tel) || '—'}</div>
              <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">

              ${venc>0?`<div style="font-size:11px;color:var(--danger);font-weight:600">${money(venc)} vencido</div>`:''}

          <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">

            <button class="btn btn-outline btn-sm" onclick="toggleCliente('${c.id}')">${abierto ? 'Ocultar' : 'Ver historial'}</button>
            ${esAdmin()?`<button class="btn-ghost" style="font-size:12px" onclick="abrirModal('editarCliente','${c.id}')">Editar</button>`:''}
          </div>
          ${abierto ? `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft)">

              <thead><tr><th>Fecha</th><th>Cobrador</th><th class="num">Entregado</th><th class="num">Aplicado</th><th class="num">Vuelta</th></tr></thead>
              <tbody>${abonosCliente.slice().reverse().map(a => `<tr>
                <td>${fFecha(a.fecha)}</td>
                <td><span class="badge ${userById(a.usuarioId)?.rol === 'cobrador' ? 'badge-cobrador' : 'badge-neutral'}">${esc(a.usuarioNombre||'')}</span></td>
                <td class="num">${money(a.entregado ?? a.monto)}</td>
                <td class="num bold" style="color:var(--success)">+ ${money(a.monto)}</td>
                <td class="num">${a.vuelta > 0.001 ? money(a.vuelta) : '—'}</td></tr>`).join('')}</tbody>
            </table></div>`}
          </div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">Resumen</div></div></div>
        <div class="table-wrap" style="margin:0;padding:0"><table>
          <thead><tr><th>Cliente</th><th class="num">Saldo</th><th></th></tr></thead>
          <tbody>
          ${state.clientes.filter(c => deudaCliente(c.id) > 0).sort((a,b) => deudaVencida(b.id) - deudaVencida(a.id) || deudaCliente(b.id) - deudaCliente(a.id)).map(c => `
            <tr><td>${esc(c.nombre)}</td>
            <td class="num bold" style="color:${deudaVencida(c.id)>0?'var(--danger)':'var(--ink)'}">${money(deudaCliente(c.id))}</td>

          </tbody>
        </table></div>
      </div>

  </div>`;

function toggleCliente(id){ ui.clienteAbierto = ui.clienteAbierto === id ? null : id; render(); }

/* ================================================================
   VISTA: COBRANZAS
   ================================================================ */
function viewCobranzas(){
  const misAbonos = abonosVisibles();
  const h = HOY();
  const mes = mesActual();
  const cobHoy = misAbonos.filter(a => a.fecha === h);
  const cobMes = misAbonos.filter(a => mesDe(a.fecha) === mes);
  const totalHoy = num2(cobHoy.reduce((a,x) => a + x.monto, 0));
  const totalMes = num2(cobMes.reduce((a,x) => a + x.monto, 0));
  const totalHist = num2(misAbonos.reduce((a,x) => a + x.monto, 0));
  const porCobrador = {};
  if(esAdmin()){
    state.usuarios.filter(u => u.rol === 'cobrador').forEach(u => {
      const abs = state.abonos.filter(a => a.usuarioId === u.id);
      porCobrador[u.id] = {
        nombre: u.nombre, cobros: abs.length,
        total: num2(abs.reduce((a,x) => a + x.monto, 0)),
        hoy: num2(abs.filter(a => a.fecha === h).reduce((a,x) => a + x.monto, 0)),
        mes: num2(abs.filter(a => mesDe(a.fecha) === mes).reduce((a,x) => a + x.monto, 0))
      };
    });
  }
  return `
  <div class="page-head"><div class="page-eyebrow">Cobranzas</div>
    <h1 class="page-title">${esAdmin() ? 'Cobranzas' : 'Mis cobros'}</h1></div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Cobrado hoy</div>
      <div class="kpi-value is-success">${money(totalHoy)}</div>
      <div class="kpi-meta">${cobHoy.length} cobros</div></div>
    <div class="kpi"><div class="kpi-label">Cobrado este mes</div>
      <div class="kpi-value is-success">${money(totalMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Histórico</div>
      <div class="kpi-value">${money(totalHist)}</div></div>
    <div class="kpi"><div class="kpi-label">Promedio</div>
      <div class="kpi-value">${misAbonos.length > 0 ? money(num2(totalHist/misAbonos.length)) : money(0)}</div></div>
  </div>

/* ================================================================
   VISTA: GANANCIAS
   ================================================================ */
function viewGanancias(){
  const h = HOY();
  const mes = mesActual();
  const primerDiaMes = mes + '-01';
  const vHoy = state.ventas.filter(v => v.fecha === h);
  const vMes = state.ventas.filter(v => mesDe(v.fecha) === mes);
  const ganFisHoy = gananciaVentas(vHoy);
  const ganFisMes = gananciaVentas(vMes);
  const ganFisTotal = gananciaVentas(state.ventas);
  const bonifHoy = bonificacionesPeriodo(h, h);
  const bonifMes = bonificacionesPeriodo(primerDiaMes, h);
  const bonifTotal = num2(state.caja.movimientos.filter(m => m.tipo === 'bonificacion').reduce((a,m) => a + m.monto, 0));
  const ganTotal = num2(ganFisTotal + bonifTotal);
  const gastosMes = num2(state.gastos.filter(g => mesDe(g.fecha) === mes).reduce((a,g) => a + g.monto, 0));
  const gananciaNeta = num2(ganFisMes + bonifMes - gastosMes);

  const ranking = {};
  state.ventas.forEach(v => v.items.forEach(it => {
    if(it.esRecarga) return;
    const key = it.productoId;
    if(!ranking[key]) ranking[key] = { nombre: it.nombre, ganancia: 0, unidades: 0, ingresos: 0 };
    ranking[key].ganancia += gananciaItem(it);
    ranking[key].unidades += it.cantidad;
    ranking[key].ingresos += it.subtotal;
  }));
  const top = Object.values(ranking).sort((a,b) => b.ganancia - a.ganancia).slice(0, 10);
  const maxGan = top.length > 0 ? Math.max(...top.map(t => t.ganancia)) : 1;

  return `
  <div class="page-head"><div class="page-eyebrow">Rentabilidad</div>
    <h1 class="page-title">Ganancias</h1></div>
  <div class="info-banner">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <div>
      <strong>Ganancia bruta</strong> = margen de productos físicos + bonificaciones de recargas.<br>
      <strong>Ganancia neta</strong> = bruta − gastos operativos del mes.
    </div>
  </div>
  <div class="gan-hero">
    <div>
      <div class="gan-hero-label">Ganancia neta del mes</div>
      <div class="gan-hero-value">${money(gananciaNeta)}</div>
      <div class="gan-hero-sub">Bruta ${money(num2(ganFisMes + bonifMes))} − Gastos ${money(gastosMes)}</div>
    </div>
    <div>
      <div class="gan-hero-label">Ganancia de hoy</div>
      <div class="gan-hero-value">${money(num2(ganFisHoy + bonifHoy))}</div>
      <div class="gan-hero-sub">Física ${money(ganFisHoy)} + Bonif ${money(bonifHoy)}</div>
    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Ganancia bruta total</div>
      <div class="kpi-value is-success">${money(ganTotal)}</div>
      <div class="kpi-meta">Histórico</div></div>
    <div class="kpi"><div class="kpi-label">Gastos del mes</div>
      <div class="kpi-value is-danger">${money(gastosMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia neta mes</div>
      <div class="kpi-value is-success">${money(gananciaNeta)}</div></div>
    <div class="kpi"><div class="kpi-label">Bonif. acumuladas</div>
      <div class="kpi-value">${money(num2(Object.values(state.bolsas).reduce((a,b) => a + (b.bonificaciones||0), 0)))}</div></div>
  </div>
  <div class="grid-3">
    <div class="card"><div class="card-head"><div><div class="card-title">Hoy</div></div></div>
      <div class="summary-row"><span class="label">Físicos</span><span class="value">${money(ganFisHoy)}</span></div>
      <div class="summary-row"><span class="label">Bonificaciones</span><span class="value">${money(bonifHoy)}</span></div>
      <div class="summary-row highlight"><span class="label">Total</span><span class="value" style="color:var(--success)">${money(num2(ganFisHoy + bonifHoy))}</span></div>
    </div>
    <div class="card"><div class="card-head"><div><div class="card-title">Mes</div></div></div>
      <div class="summary-row"><span class="label">Físicos</span><span class="value">${money(ganFisMes)}</span></div>
      <div class="summary-row"><span class="label">Bonificaciones</span><span class="value">${money(bonifMes)}</span></div>
      <div class="summary-row"><span class="label">Gastos</span><span class="value" style="color:var(--danger)">− ${money(gastosMes)}</span></div>
      <div class="summary-row highlight"><span class="label">Neta</span><span class="value" style="color:var(--success)">${money(gananciaNeta)}</span></div>
    </div>
    <div class="card"><div class="card-head"><div><div class="card-title">Histórico</div></div></div>
      <div class="summary-row"><span class="label">Físicos</span><span class="value">${money(ganFisTotal)}</span></div>
      <div class="summary-row"><span class="label">Bonificaciones</span><span class="value">${money(bonifTotal)}</span></div>
      <div class="summary-row highlight"><span class="label">Bruta</span><span class="value" style="color:var(--success)">${money(ganTotal)}</span></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div><div class="card-title">Top productos físicos</div></div></div>
    ${top.length === 0 ? '<div class="empty">Sin datos.</div>' : top.map(t => `
      <div class="rank-item">
        <div class="rank-head"><div class="rank-name">${esc(t.nombre)}</div>
        <div class="rank-value">${money(t.ganancia)}</div></div>
        <div class="rank-meta">${t.unidades} unidades · ${money(t.ingresos)}</div>
        <div class="rank-bar"><div class="rank-bar-fill" style="width:${Math.max(2, (t.ganancia / maxGan) * 100)}%"></div></div>
      </div>`).join('')}
  </div>`;
}

/* ================================================================
   VISTA: CIERRE MENSUAL
   ================================================================ */
function viewCierre(){
  const mes = ui.cierreMes;
  const ventasMes = state.ventas.filter(v => mesDe(v.fecha) === mes);
  const comprasMes = state.compras.filter(c => mesDe(c.fecha) === mes);
  const gastosMes = state.gastos.filter(g => mesDe(g.fecha) === mes);
  const movMes = state.caja.movimientos.filter(m => mesDe(m.fecha) === mes);
  const totVentas = num2(ventasMes.reduce((a,v) => a + v.total, 0));
  const totCompras = num2(comprasMes.reduce((a,c) => a + c.total, 0));
  const totGastos = num2(gastosMes.reduce((a,g) => a + g.monto, 0));
  const ingresosMes = num2(movMes.filter(m => m.monto > 0).reduce((a,m) => a + m.monto, 0));
  const egresosMes = num2(movMes.filter(m => m.monto < 0).reduce((a,m) => a + m.monto, 0));
  const ganFisMes = gananciaVentas(ventasMes);
  const bonifMes = num2(movMes.filter(m => m.tipo === 'bonificacion').reduce((a,m) => a + m.monto, 0));
  const pat = patrimonioNeto();
  return `
  <div class="page-head"><div class="page-eyebrow">Arqueo</div><h1 class="page-title">Cierre mensual</h1></div>
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Período</div></div>
      <div class="btn-row">
        <input type="month" value="${mes}" onchange="ui.cierreMes=this.value; render()" style="width:auto">
        <button class="btn btn-danger" onclick="accionEjecutarCierre()">Ejecutar cierre</button>
      </div>
    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Ventas del mes</div><div class="kpi-value">${money(totVentas)}</div></div>
    <div class="kpi"><div class="kpi-label">Ganancia física</div><div class="kpi-value is-success">${money(ganFisMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Bonificaciones</div><div class="kpi-value is-success">${money(bonifMes)}</div></div>
    <div class="kpi"><div class="kpi-label">Gastos</div><div class="kpi-value is-danger">${money(totGastos)}</div></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-head"><div><div class="card-title">Caja del mes</div></div></div>
      <div class="summary-row"><span class="label">Ingresos totales</span>
        <span class="value" style="color:var(--success)">${money(ingresosMes)}</span></div>
      <div class="summary-row"><span class="label">Compras</span>
        <span class="value" style="color:var(--danger)">− ${money(totCompras)}</span></div>
      <div class="summary-row"><span class="label">Gastos</span>
        <span class="value" style="color:var(--danger)">− ${money(totGastos)}</span></div>
      <div class="summary-row highlight"><span class="label">Flujo neto</span>
        <span class="value">${money(num2(ingresosMes + egresosMes))}</span></div>
    </div>
    <div class="card">
      <div class="card-head"><div><div class="card-title">Estado actual</div></div></div>
      <div class="summary-row"><span class="label">Efectivo caja</span>
        <span class="value ${saldoCaja() >= 0 ? 'pos' : 'neg'}">${money(saldoCaja())}</span></div>
      <div class="summary-row"><span class="label">Bancos</span>
        <span class="value" style="color:var(--success)">${money(saldoBancosTotal())}</span></div>
      <div class="summary-row"><span class="label">Inventario</span>
        <span class="value">${money(valorInventarioCosto())}</span></div>
      <div class="summary-row"><span class="label">Por cobrar</span>
        <span class="value">${money(totalCuentasPorCobrar())}</span></div>
      <div class="summary-row"><span class="label">Por pagar</span>
        <span class="value" style="color:var(--danger)">${money(totalCuentasPorPagar())}</span></div>
      <div class="summary-row highlight"><span class="label">Patrimonio neto</span>
        <span class="value" style="color:${pat.neto >= 0 ? 'var(--success)' : 'var(--danger)'}">${money(pat.neto)}</span></div>
    </div>
  </div>
  ${state.cierres.length ? `
  <div class="card">
    <div class="card-head"><div><div class="card-title">Cierres anteriores</div></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Período</th><th>Fecha</th><th class="num">Ventas</th><th class="num">Ganancia</th><th class="num">Patrimonio</th><th class="num">Caja final</th><th>Usuario</th></tr></thead>
      <tbody>${state.cierres.slice().reverse().map(c => `
        <tr><td class="bold">${nombreMes(c.mes)}</td><td>${fFecha(c.fecha)}</td>
        <td class="num">${money(c.ventas)}</td>
        <td class="num" style="color:var(--success);font-weight:600">${money(c.ganancia||0)}</td>
        <td class="num">${money(c.patrimonio||0)}</td>
        <td class="num">${money(c.cajaFinal)}</td>
        <td><span class="badge badge-neutral">${esc(c.usuarioNombre||'—')}</span></td></tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}`;
}

/* ================================================================
   CONFIGURACIÓN BASE
   ================================================================ */
function cargarBaseReal(){
  const cats = ['Telefonía','Dulces','Útiles escolares','Bebidas','Otros'].map(n => {
    const c = { id:'CA'+(state.seq.categoria++), nombre:n };
    state.categorias.push(c); return c;
  });
  const catPorNombre = n => cats.find(c => c.nombre === n).id;
  const provs = ['Entel','Tigo','Viva'].map(x => {
    const p = { id:'PV'+(state.seq.proveedor++), nombre:x, nota:'' };
    state.proveedores.push(p); bolsaDe(p.id); return p;
  });
  const provPorNombre = n => provs.find(p => p.nombre === n).id;
  ['Entel','Tigo','Viva'].forEach(op => {
    [10,20,30,50,100].forEach(d => {
      state.productos.push({
        id:'PR'+(state.seq.producto++), nombre:`Recarga ${op} Bs ${d}`,
        categoriaId: catPorNombre('Telefonía'), proveedorId: provPorNombre(op),
        unidad:'unidad', esRecarga: true,
        valorNominal: d, costo: d, precio: d,
        stock: 0, stockInicial: 0
      });
    });
  });
  ['Entel','Tigo','Viva'].forEach(op => {
    state.productos.push({
      id:'PR'+(state.seq.producto++), nombre:`Chip ${op}`,
      categoriaId: catPorNombre('Telefonía'), proveedorId: provPorNombre(op),
      unidad:'unidad', esRecarga:false,
      costo: op==='Viva'?4:5, precio: op==='Viva'?12:15, stock:0, stockInicial:0
    });
  });
  const generales = [
    { nombre:'Chicle', cat:'Dulces', unidad:'unidad', costo:0.5, precio:1 },
    { nombre:'Cuaderno', cat:'Útiles escolares', unidad:'unidad', costo:5, precio:8 },
    { nombre:'Coca Cola 500ml', cat:'Bebidas', unidad:'unidad', costo:4, precio:6 }
  ];
  generales.forEach(g => {
    state.productos.push({
      id:'PR'+(state.seq.producto++), nombre: g.nombre,
      categoriaId: catPorNombre(g.cat), proveedorId: null,
      unidad: g.unidad, esRecarga:false,
      costo: num2(g.costo), precio: num2(g.precio), stock:0, stockInicial:0
    });
  });
  save(); render();
  toast('Configuración base cargada','ok');
}

/* ================================================================
   INICIALIZACIÓN
   ================================================================ */
(function init(){
  try{
    if(!load()){ state = initState(); save(); }
    // Compatibilidad con versiones anteriores
    if(!state.usuarios) state.usuarios = [{ id:'U1', nombre:'Administrador', rol:'admin', color:'#1c3d5a', activo:true, creado:HOY() }];
    if(!state.turnos) state.turnos = [];
    if(!state.gastos) state.gastos = [];
    if(!state.categoriasGastos) state.categoriasGastos = [...CATEGORIAS_GASTOS_DEFAULT];
    if(!state.cuentasPorPagar) state.cuentasPorPagar = [];
    if(!state.bancos) state.bancos = [];
    if(!state.capital) state.capital = { configurado:false, efectivoInicial:0, efectivoBancosInicial:0, cuentasPorCobrarIniciales:0, inventarioInicial:0, notas:'', fechaConfiguracion:null };
    if(!state.seq.gasto) state.seq.gasto = (state.gastos?.length || 0) + 1;
    if(!state.seq.cuentaPagar) state.seq.cuentaPagar = (state.cuentasPorPagar?.length || 0) + 1;
    if(!state.seq.banco) state.seq.banco = (state.bancos?.length || 0) + 1;
    if(!state.seq.movBanco) state.seq.movBanco = 1;
    if(!state.seq.bonificacion) state.seq.bonificacion = 1;
    if(!state.seq.usuario) state.seq.usuario = state.usuarios.length + 1;
    if(!state.seq.turno) state.seq.turno = state.turnos.length + 1;
    if(!state.cierres) state.cierres = [];
    if(!state.caja) state.caja = { saldoInicial:0, movimientos:[] };
    if(!state.bolsas) state.bolsas = {};
    if(!state.seq.mov) state.seq.mov = 1;
    state.caja.movimientos.forEach(m => { if(!m.usuarioId){ m.usuarioId = 'U1'; m.usuarioNombre = 'Administrador'; } });
    state.ventas.forEach(v => { if(!v.usuarioId){ v.usuarioId = 'U1'; v.usuarioNombre = 'Administrador'; } });
    state.abonos.forEach(a => { if(!a.usuarioId){ a.usuarioId = 'U1'; a.usuarioNombre = 'Administrador'; } });
    state.usuarios.forEach(u => { if(!['admin','cajero','cobrador'].includes(u.rol)) u.rol = 'cajero'; });
    Object.keys(state.bolsas).forEach(id => bolsaDe(id));
    state.productos.forEach(p => { if(p.esRecarga && !p.valorNominal) p.valorNominal = p.precio; });
    state.bancos.forEach(b => { if(!b.movimientos) b.movimientos = []; });

    usuarioActual = userById(state.usuarioActualId) || state.usuarios[0];
    state.usuarioActualId = usuarioActual.id;
    $('avatarIni').textContent = iniciales(usuarioActual.nombre);
    $('avatarIni').style.background = usuarioActual.color || '#8a6d3b';
    $('rolLbl').textContent = usuarioActual.rol === 'admin' ? 'Administrador' : usuarioActual.rol === 'cajero' ? 'Cajero' : 'Cobrador';

    state.proveedores.forEach(p => bolsaDe(p.id));
    save();
    render();
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = `
      <div class="card" style="max-width:640px;margin:40px auto">
        <div class="card-title" style="color:var(--danger);font-size:16px">Error al iniciar</div>
        <p style="margin-top:10px;color:var(--muted)">${esc(e.message||String(e))}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.clear(); location.reload();">Restablecer y recargar</button>
      </div>`;
  }
})();
</script>

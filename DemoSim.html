<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMGest · Sistema de Gestión</title>
<style>
:root{
  --bg:#f5f4f1; --surface:#fff; --surface-soft:#fafaf7;
  --ink:#15140f; --ink-2:#3a3833; --muted:#7a766d;
  --line:#e8e6e0; --line-soft:#f1efea;
  --primary:#1c3d5a; --primary-hover:#152e45;
  --accent:#8a6d3b;
  --success:#2d6a4f; --success-soft:#eaf3ee;
  --warning:#9c6f1f; --warning-soft:#fbf3e2;
  --danger:#8b2b2b; --danger-soft:#f9ecec;
  --info:#1e5a8a; --info-soft:#eaf1f7;
  --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(20,18,12,.04), 0 1px 3px rgba(20,18,12,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}

.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--line);padding:24px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.brand{padding:0 22px 22px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--muted);line-height:1.4}
.nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-soft)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{width:15px;height:15px;stroke:var(--muted);stroke-width:1.6;fill:none;flex-shrink:0}
.nav-item.active svg{stroke:#fff}
.sidebar-footer{padding:14px 22px 0;border-top:1px solid var(--line-soft);margin:0 10px}
.user-box{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:var(--surface-soft);border:1px solid var(--line-soft)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-box select{background:transparent;border:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0;font-family:inherit;outline:none;width:100%}
.user-role{font-size:10.5px;color:var(--muted);margin-top:1px}

.main{margin-left:252px;flex:1;padding:32px 40px 60px;max-width:1300px;width:calc(100% - 252px)}
.page-head{margin-bottom:28px}
.page-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.page-desc{font-size:13.5px;color:var(--muted);margin-top:6px;max-width:680px;line-height:1.55}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.card-subtitle{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi-value.is-success{color:var(--success)}
.kpi-value.is-danger{color:var(--danger)}
.kpi-value.is-warning{color:var(--warning)}
.kpi-meta{font-size:11.5px;color:var(--muted);margin-top:4px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,61,90,.10)}
input::placeholder{color:#b5b2ab}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237a766d' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-outline:hover{border-color:#d5d2ca;background:var(--surface-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;font-size:12.5px;border-radius:6px}
.btn-ghost:hover{background:var(--surface-soft)}
.btn-block{width:100%}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:0 10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0;text-align:right}
tbody td{padding:12px 10px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
tbody td:first-child{padding-left:0;color:var(--ink)}
tbody td:last-child{padding-right:0;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bold{font-weight:600;color:var(--ink)}

.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:500;letter-spacing:.1px;white-space:nowrap}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--line-soft);color:var(--muted)}
.badge-accent{background:#f3ecdc;color:var(--accent)}

.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:14px;border:1px solid}
.alert-info{background:var(--info-soft);border-color:#d1e0ec;color:#183a56}
.alert-warning{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.alert-danger{background:var(--danger-soft);border-color:#ecd1d1;color:#6a2020}
.alert-success{background:var(--success-soft);border-color:#c7e0cf;color:#22503c}
.alert-title{font-weight:600;margin-bottom:2px}

.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.cart-line:last-child{border-bottom:none}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:13px;font-weight:500;color:var(--ink)}
.cart-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.cart-qty{width:60px;padding:4px 6px;font-size:12.5px;text-align:center}
.cart-price{width:80px;padding:4px 6px;font-size:12.5px;text-align:right}
.cart-sub{width:80px;text-align:right;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:10px;border-top:1px solid var(--line)}
.cart-total-label{font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.cart-total-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}

.prod-list{max-height:400px;overflow-y:auto;margin:0 -8px}
.prod-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer;transition:background .1s}
.prod-item:hover{background:var(--surface-soft)}
.prod-item.stock-0{opacity:.5;cursor:not-allowed}
.prod-name{font-size:13px;font-weight:500}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prod-price{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary)}
.prod-stock{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}

.bolsa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bolsa-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-soft)}
.bolsa-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.bolsa-card-op{font-size:13px;font-weight:600;color:var(--ink)}
.bolsa-card-com{font-size:11px;color:var(--muted);margin-top:2px}
.bolsa-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.bolsa-row:last-child{border-bottom:none}
.bolsa-row-label{font-size:11.5px;color:var(--muted);font-weight:500}
.bolsa-row-value{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.bolsa-row-value.saldo{color:var(--primary)}
.bolsa-row-value.comision{color:var(--success)}
.bolsa-row-value.retirada{color:var(--muted);font-size:13px;font-weight:500}

.caja-hero{background:linear-gradient(135deg,var(--primary),#0f2942);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.caja-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a5c4ff;margin-bottom:6px}
.caja-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.caja-hero-sub{font-size:12px;color:#a5c4ff;margin-top:6px}

.gan-hero{background:linear-gradient(135deg,#1f4d3a,#0f2d20);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.gan-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a8e0c2;margin-bottom:6px}
.gan-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gan-hero-sub{font-size:12px;color:#a8e0c2;margin-top:6px}

.turno-hero{background:linear-gradient(135deg,#3a2817,#1f1810);color:#fff;border-radius:var(--r-lg);padding:24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.turno-hero.abierto{background:linear-gradient(135deg,#1f4d3a,#0f2d20)}
.turno-label{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px}
.turno-value{font-size:22px;font-weight:600;letter-spacing:-.4px}
.turno-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}

.modal-overlay{position:fixed;inset:0;background:rgba(20,18,12,.5);display:grid;place-items:center;padding:20px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:26px;max-width:520px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-.2px}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}

.modal-alert{max-width:480px}
.alert-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px}
.alert-icon.critico{background:var(--danger-soft);color:var(--danger)}
.alert-icon.advertencia{background:var(--warning-soft);color:var(--warning)}
.alert-icon.info{background:var(--info-soft);color:var(--info)}
.alert-icon svg{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.irrevocable-badge{display:inline-flex;align-items:center;gap:6px;background:var(--danger-soft);color:var(--danger);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:16px;border:1px solid #ecd1d1}
.irrevocable-badge svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none}
.alert-title-lg{font-size:18px;font-weight:600;letter-spacing:-.3px;margin-bottom:10px;color:var(--ink)}
.alert-body{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:8px}
.alert-detail{background:var(--surface-soft);border-radius:10px;padding:14px;margin:14px 0;border:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-2);line-height:1.55}
.alert-detail strong{color:var(--ink)}
.alert-warning-box{background:var(--danger-soft);border:1px solid #ecd1d1;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12.5px;color:#6a2020;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.alert-warning-box svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;stroke:currentColor;stroke-width:2;fill:none}

.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-soft);border:1px solid var(--line-soft);font-size:11px;color:var(--ink-2);font-weight:500}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.summary-row:last-child{border-bottom:none}
.summary-row.highlight{color:var(--ink);font-weight:600;font-size:14.5px;padding:14px 0;border-top:1px solid var(--line);border-bottom:none}
.summary-row .label{flex:1}
.summary-row .value{font-variant-numeric:tabular-nums;font-weight:500}

.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
.choice:hover{border-color:#cdc9c0;background:var(--surface-soft)}
.choice.active{border-color:var(--primary);background:#f4f7fa;box-shadow:inset 0 0 0 1px var(--primary)}
.choice-title{font-size:12.5px;font-weight:500;color:var(--ink);display:block}
.choice-desc{font-size:11px;color:var(--muted);margin-top:2px;display:block}

.money-input-wrap{position:relative;margin-top:6px}
.money-input-wrap::before{content:"Bs";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:var(--muted);pointer-events:none}
.money-input-wrap input{padding-left:42px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;height:52px}
.money-input-wrap input.money-ok{border-color:var(--success);background:var(--success-soft)}
.money-input-wrap input.money-bad{border-color:var(--danger);background:var(--danger-soft)}

.cambio-box{background:var(--success-soft);border:1px solid #c7e0cf;border-radius:10px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.cambio-box.insuf{background:var(--danger-soft);border-color:#ecd1d1}
.cambio-box.exacto{background:var(--info-soft);border-color:#d1e0ec}
.cambio-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--success)}
.cambio-box.insuf .cambio-label{color:var(--danger)}
.cambio-box.exacto .cambio-label{color:var(--info)}
.cambio-value{font-size:22px;font-weight:600;color:var(--success);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.cambio-box.insuf .cambio-value{color:var(--danger)}
.cambio-box.exacto .cambio-value{color:var(--info)}

.check-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-soft);border-radius:9px;border:1px solid var(--line-soft);cursor:pointer}
.check-row input[type=checkbox]{width:auto;margin:0;cursor:pointer}
.check-row label{font-size:13px;font-weight:500;cursor:pointer;margin:0}

.deuda-banner{background:var(--danger-soft);border:1px solid #ecd1d1;border-radius:10px;padding:16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.deuda-banner-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--danger);margin-bottom:4px}
.deuda-banner-value{font-size:26px;font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.deuda-banner-sub{font-size:11.5px;color:var(--danger);margin-top:2px}

.pend-list{background:var(--surface-soft);border:1px solid var(--line-soft);border-radius:10px;padding:6px 12px;max-height:180px;overflow-y:auto;margin-bottom:14px}
.pend-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.pend-item:last-child{border-bottom:none}

.rank-item{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rank-item:last-child{border-bottom:none}
.rank-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.rank-name{font-size:13px;font-weight:500;color:var(--ink)}
.rank-value{font-size:13px;font-weight:600;color:var(--success);font-variant-numeric:tabular-nums}
.rank-meta{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.rank-bar{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.rank-bar-fill{height:100%;background:linear-gradient(90deg,#4a8d6b,#2d6a4f);border-radius:99px}

/* Search */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{padding-left:36px}
.search-wrap::before{content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a766d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='M21 21l-4.35-4.35'/></svg>");background-size:contain;background-repeat:no-repeat;pointer-events:none}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px -8px rgba(20,18,12,.15);max-height:280px;overflow-y:auto;z-index:30;margin-top:4px}
.search-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);font-size:13px}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:var(--surface-soft)}
.search-item .name{font-weight:500;color:var(--ink)}
.search-item .meta{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Usuario card */
.user-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
.user-card-head{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.user-card-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;flex-shrink:0}
.user-card-name{font-size:14px;font-weight:600}
.user-card-meta{font-size:11.5px;color:var(--muted);margin-top:2px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 12px 32px -8px rgba(20,18,12,.4);transition:transform .3s cubic-bezier(.2,.9,.3,1.3);z-index:999;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)}
.toast.err{background:var(--danger)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:20px 16px 60px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .choice-row{grid-template-columns:1fr}
  .mobile-toggle{display:flex!important}
}
.mobile-toggle{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);margin:-20px -16px 16px;position:sticky;top:0;z-index:40}
.mobile-toggle button{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);padding:4px}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <div class="brand-logo">SG</div>
      <div class="brand-name">SIMGest</div>
    </div>
    <div class="brand-sub">Sistema de gestión comercial</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-footer">
    <div class="user-box">
      <div class="user-avatar" id="avatarIni">A</div>
      <div class="user-info">
        <select id="usuarioSel" onchange="cambiarUsuario(this.value)"></select>
        <div class="user-role" id="rolLbl">Administrador</div>
      </div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="mobile-toggle">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      Menú
    </button>
  </div>
  <div id="app"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   CONFIGURACIÓN
   ================================================================ */
const UNIDADES = ['unidad','kg','litro','gramo','ml','caja','paquete','docena','metro'];
const LS_KEY = 'simgest_v8';
const MAX_CAJEROS = 8;
const COLORES_CAJERO = ['#1c3d5a','#2d6a4f','#8a6d3b','#6d28d9','#1e5a8a','#b91c1c','#0369a1','#7c2d12'];

/* ================================================================
   UTILIDADES
   ================================================================ */
const $ = id => document.getElementById(id);
const HOY = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const horaActual = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const money = n => 'Bs ' + (Number(n)||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const num2 = n => +(Number(n)||0).toFixed(2);
const addDias = (f,n) => { const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fFecha = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const mesDe = iso => (iso||'').slice(0,7);
const mesActual = () => HOY().slice(0,7);
const nombreMes = ym => {
  if(!ym) return '—';
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const [y,m] = ym.split('-');
  return `${meses[parseInt(m,10)-1]} ${y}`;
};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unidadAbrev = u => ({unidad:'u', kg:'kg', litro:'L', gramo:'g', ml:'ml', caja:'cja', paquete:'paq', docena:'doc', metro:'m'})[u]||u;
const iniciales = nombre => {
  const p = String(nombre||'').trim().split(/\s+/);
  if(p.length === 0) return '?';
  if(p.length === 1) return p[0].slice(0,2).toUpperCase();
  return (p[0][0] + (p[1]?.[0]||'')).toUpperCase();
};
const normalizar = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ================================================================
   ESTADO
   ================================================================ */
let state = null;
let usuarioActual = null;   // objeto usuario
let vista = 'resumen';

const esAdmin = () => usuarioActual?.rol === 'admin';
const esCajero = () => usuarioActual?.rol === 'cajero';

const ui = {
  ventaCarrito: [], ventaClienteId: '', ventaTipoPago: 'contado',
  ventaPlazo: 15, ventaPlazoCustom: '', ventaMontoRecibido: '',
  buscarProd: '', buscarCliente: '', mostrarBuscadorCliente: false,
  compraCarrito: [], compraProveedorId: '', compraNota: '', buscarProdCompra: '',
  modal: null, filtroInv: 'Todas', clienteAbierto: null, cierreMes: mesActual(),
  filtroUsuarioVentas: 'todos', buscarClienteLista: ''
};

/* ================================================================
   PERSISTENCIA
   ================================================================ */
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ state = JSON.parse(raw); return true; } }catch(e){}
  return false;
}
function initState(){
  return {
    seq: { venta:1, compra:1, abono:1, cliente:1, producto:1, proveedor:1, categoria:1, mov:1, cierre:1, usuario:2, turno:1 },
    usuarios: [
      { id:'U1', nombre:'Administrador', rol:'admin', activo:true, color:'#1c3d5a', creado:HOY() }
    ],
    usuarioActualId: 'U1',
    turnos: [],  // { id, usuarioId, usuarioNombre, fechaApertura, horaApertura, saldoInicial, fechaCierre, horaCierre, saldoCierre, estado, obsApertura, obsCierre }
    proveedores: [], categorias: [], productos: [], clientes: [],
    ventas: [], abonos: [], compras: [],
    caja: { saldoInicial: 0, movimientos: [] },
    bolsas: {},
    cierres: []
  };
}

/* ================================================================
   HELPERS
   ================================================================ */
const catById = id => state.categorias.find(c => c.id === id);
const provById = id => state.proveedores.find(p => p.id === id);
const prodById = id => state.productos.find(p => p.id === id);
const userById = id => state.usuarios.find(u => u.id === id);

function bolsaDe(provId){
  if(!state.bolsas[provId]) state.bolsas[provId] = { saldo:0, comisionAcumulada:0, comisionesRetiradas:0 };
  return state.bolsas[provId];
}
function saldoCaja(){
  if(!state) return 0;
  return num2(state.caja.saldoInicial + state.caja.movimientos.reduce((a,m) => a + m.monto, 0));
}
function agregarMovimientoCaja(tipo, monto, descripcion, referencia){
  state.caja.movimientos.push({
    id: 'M' + (state.seq.mov++),
    fecha: HOY(), hora: horaActual(),
    tipo, monto: num2(monto), descripcion, referencia: referencia || null,
    usuarioId: usuarioActual?.id || null,
    usuarioNombre: usuarioActual?.nombre || '—'
  });
}
function eliminarMovimientosPorRef(ref){
  state.caja.movimientos = state.caja.movimientos.filter(m => m.referencia !== ref);
}

const saldoVenta = v => num2(v.total - (v.pagado||0));
function deudaCliente(cid){
  return num2(state.ventas
    .filter(v => v.clienteId === cid && v.tipoPago === 'credito')
    .reduce((a,v) => a + saldoVenta(v), 0));
}
function deudaVencida(cid){
  const h = HOY();
  return num2(state.ventas
    .filter(v => v.clienteId === cid && v.tipoPago === 'credito' && saldoVenta(v) > 0 && v.vencimiento && v.vencimiento < h)
    .reduce((a,v) => a + saldoVenta(v), 0));
}
function ventasPendientesCliente(cid){
  return state.ventas
    .filter(v => v.clienteId === cid && v.tipoPago === 'credito' && saldoVenta(v) > 0.001)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
}
function estadoCliente(cid){
  const d = deudaCliente(cid);
  if(d <= 0.001) return { txt:'Al día', cls:'badge-success' };
  if(deudaVencida(cid) > 0) return { txt:'Vencido', cls:'badge-danger' };
  const prox = ventasPendientesCliente(cid)[0];
  if(prox && prox.vencimiento <= addDias(HOY(),3)) return { txt:'Por vencer', cls:'badge-warning' };
  return { txt:'Vigente', cls:'badge-info' };
}

const esProductoRecarga = p => p && p.esRecarga === true;

function gananciaItem(it){ return num2((Number(it.precioUnit) - Number(it.costoUnit)) * Number(it.cantidad)); }
function gananciaVenta(v){ return num2(v.items.reduce((a,i) => a + gananciaItem(i), 0)); }
function gananciaVentas(vs){ return num2(vs.reduce((a,v) => a + gananciaVenta(v), 0)); }
function gananciaPorTipo(vs){
  let fisico = 0, recarga = 0;
  vs.forEach(v => v.items.forEach(it => {
    const g = gananciaItem(it);
    if(it.esRecarga) recarga += g; else fisico += g;
  }));
  return { fisico: num2(fisico), recarga: num2(recarga), total: num2(fisico + recarga) };
}

/* ================ TURNOS ================ */
function turnoAbierto(){
  return state.turnos.find(t => t.estado === 'abierto') || null;
}
function turnoAbiertoDe(usuarioId){
  return state.turnos.find(t => t.estado === 'abierto' && t.usuarioId === usuarioId) || null;
}
function ultimoTurno(){
  const cerrados = state.turnos.filter(t => t.estado === 'cerrado').sort((a,b) => {
    const fa = (a.fechaCierre||'') + (a.horaCierre||'');
    const fb = (b.fechaCierre||'') + (b.horaCierre||'');
    return fb.localeCompare(fa);
  });
  return cerrados[0] || null;
}
function saldoEsperadoApertura(){
  const u = ultimoTurno();
  if(u && typeof u.saldoCierre === 'number') return num2(u.saldoCierre);
  return num2(state.caja.saldoInicial + state.caja.movimientos.reduce((a,m) => a + m.monto, 0));
}

/* ================ FILTROS POR USUARIO ================ */
function ventasVisibles(){
  if(esAdmin()) return state.ventas;
  return state.ventas.filter(v => v.usuarioId === usuarioActual?.id);
}
function movimientosVisibles(){
  if(esAdmin()) return state.caja.movimientos;
  // No admin: solo ve los movimientos de su turno actual y anteriores suyos
  const misTurnos = state.turnos.filter(t => t.usuarioId === usuarioActual?.id);
  // Simplificamos: ve los movimientos que él hizo + los de su turno actual
  return state.caja.movimientos.filter(m => m.usuarioId === usuarioActual?.id);
}
function abonosVisibles(){
  if(esAdmin()) return state.abonos;
  return state.abonos.filter(a => a.usuarioId === usuarioActual?.id);
}

function toast(msg, tipo){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo||'');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast ' + (tipo||''), 2600);
}
function rolNombre(){ return usuarioActual?.rol === 'admin' ? 'Administrador' : 'Cajero'; }

/* ================================================================
   CONFIRMACIÓN MODAL
   ================================================================ */
function pedirConfirmacion(opts){
  ui.modal = { tipo: 'confirmar', data: opts };
  renderModal();
}
function ejecutarConfirmacion(){
  const d = ui.modal?.data;
  if(!d || typeof d.onConfirm !== 'function'){ cerrarModal(); return; }
  const cb = d.onConfirm;
  ui.modal = null; renderModal();
  setTimeout(() => cb(), 30);
}

/* ================================================================
   NAVEGACIÓN
   ================================================================ */
const ICONS = {
  resumen:   '<path d="M3 12l9-9 9 9M5 10v10h14V10"/>',
  ganancias: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  caja:      '<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 14h2"/>',
  turnos:    '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  ventas:    '<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/>',
  inventario:'<path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>',
  clientes:  '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
  compras:   '<path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/>',
  productos: '<path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
  categorias:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5"/>',
  proveedores:'<path d="M16 3.13a4 4 0 010 7.75M17 21v-2a4 4 0 00-3-3.87M9 7a4 4 0 11-8 0 4 4 0 018 0zM3 21v-2a4 4 0 013-3.87"/>',
  usuarios:  '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
  cierre:    '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
};

function tabsDisponibles(){
  if(esAdmin()){
    return [
      { id:'resumen',    label:'Resumen',           grupo:'Operación' },
      { id:'ganancias',  label:'Ganancias',         grupo:'Operación' },
      { id:'caja',       label:'Caja',              grupo:'Operación' },
      { id:'turnos',     label:'Turnos',            grupo:'Operación' },
      { id:'ventas',     label:'Punto de venta',    grupo:'Operación' },
      { id:'inventario', label:'Inventario',        grupo:'Operación' },
      { id:'clientes',   label:'Clientes y créditos', grupo:'Operación' },
      { id:'compras',    label:'Compras',           grupo:'Operación' },
      { id:'productos',  label:'Productos',         grupo:'Configuración' },
      { id:'categorias', label:'Categorías',        grupo:'Configuración' },
      { id:'proveedores',label:'Proveedores',       grupo:'Configuración' },
      { id:'usuarios',   label:'Usuarios',          grupo:'Configuración' },
      { id:'cierre',     label:'Cierre mensual',    grupo:'Configuración' },
    ];
  }
  // Cajero
  return [
    { id:'resumen',    label:'Resumen',           grupo:'Operación' },
    { id:'turnos',     label:'Mi turno',          grupo:'Operación' },
    { id:'caja',       label:'Mi caja',           grupo:'Operación' },
    { id:'ventas',     label:'Punto de venta',    grupo:'Operación' },
    { id:'clientes',   label:'Clientes',          grupo:'Operación' },
  ];
}

function renderNav(){
  const visibles = tabsDisponibles();
  const grupos = {};
  visibles.forEach(t => { (grupos[t.grupo] = grupos[t.grupo] || []).push(t); });
  $('nav').innerHTML = Object.entries(grupos).map(([g, items]) => `
    <div class="nav-label">${g}</div>
    ${items.map(t => `
      <button class="nav-item ${vista===t.id?'active':''}" onclick="ir('${t.id}')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[t.id]}</svg>
        ${t.label}
      </button>`).join('')}
  `).join('');
}

function ir(v){ vista = v; ui.modal = null; $('sidebar').classList.remove('open'); render(); }

function renderUsuarioSelector(){
  const sel = $('usuarioSel');
  if(!sel) return;
  sel.innerHTML = state.usuarios
    .filter(u => u.activo !== false)
    .map(u => `<option value="${u.id}" ${usuarioActual?.id===u.id?'selected':''}>${esc(u.nombre)} · ${u.rol === 'admin' ? 'Admin' : 'Cajero'}</option>`)
    .join('');
}

function cambiarUsuario(id){
  const u = userById(id);
  if(!u) return;
  usuarioActual = u;
  state.usuarioActualId = u.id;
  // Reiniciar la vista a algo accesible
  const disponibles = tabsDisponibles().map(t => t.id);
  if(!disponibles.includes(vista)) vista = disponibles[0];
  // Reset ui filters
  ui.ventaCarrito = []; ui.compraCarrito = []; ui.clienteAbierto = null;
  ui.buscarCliente = ''; ui.mostrarBuscadorCliente = false; ui.buscarClienteLista = '';
  const inicial = iniciales(u.nombre);
  $('avatarIni').textContent = inicial;
  $('avatarIni').style.background = u.color || '#8a6d3b';
  $('rolLbl').textContent = u.rol === 'admin' ? 'Administrador' : 'Cajero';
  save(); render();
  toast('Sesión iniciada: ' + u.nombre, 'ok');
}

/* ================================================================
   MODALES
   ================================================================ */
function abrirModal(tipo, id){ ui.modal = { tipo, id: id || null }; renderModal(); }
function cerrarModal(){ ui.modal = null; renderModal(); }
function renderModal(){
  const root = $('modalRoot');
  if(!ui.modal){ root.innerHTML = ''; return; }
  const { tipo, id } = ui.modal;
  let contenido = '';
  if(tipo === 'confirmar') contenido = modalConfirmar(ui.modal.data);
  else if(tipo === 'nuevoProducto' || tipo === 'editarProducto') contenido = modalProducto(id);
  else if(tipo === 'nuevaCategoria' || tipo === 'editarCategoria') contenido = modalCategoria(id);
  else if(tipo === 'nuevoProveedor' || tipo === 'editarProveedor') contenido = modalProveedor(id);
  else if(tipo === 'nuevoCliente' || tipo === 'editarCliente') contenido = modalCliente(id);
  else if(tipo === 'nuevoUsuario' || tipo === 'editarUsuario') contenido = modalUsuario(id);
  else if(tipo === 'agregarDinero') contenido = modalDinero('aporte');
  else if(tipo === 'retirarDinero') contenido = modalDinero('retiro');
  else if(tipo === 'saldoInicial') contenido = modalSaldoInicial();
  else if(tipo === 'reponerBolsa') contenido = modalReponerBolsa(id);
  else if(tipo === 'retirarComision') contenido = modalRetirarComision(id);
  else if(tipo === 'abono') contenido = modalAbono(id);
  else if(tipo === 'abrirTurno') contenido = modalAbrirTurno();
  else if(tipo === 'cerrarTurno') contenido = modalCerrarTurno(id);
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) cerrarModal()"><div class="modal${tipo==='confirmar'?' modal-alert':''}">${contenido}</div></div>`;
  if(tipo === 'abono') setTimeout(() => { const el = $('m-abono-monto'); if(el){ el.focus(); el.select(); } }, 50);
  if(tipo === 'agregarDinero' || tipo === 'retirarDinero') setTimeout(() => { const el = $('m-dinero-monto'); if(el) el.focus(); }, 50);
  if(tipo === 'abrirTurno' || tipo === 'cerrarTurno') setTimeout(() => { const el = $('m-arqueo'); if(el) el.focus(); }, 50);
}

/* ---------- MODAL: CONFIRMACIÓN ---------- */
function modalConfirmar(d){
  if(!d) return '';
  const critico = d.criticidad === 'critico';
  const advertencia = d.criticidad === 'advertencia';
  const iconoCls = critico ? 'critico' : advertencia ? 'advertencia' : 'info';
  const botonCls = critico ? 'btn-danger' : 'btn-primary';

  const iconoSVG = critico
    ? '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>'
    : advertencia
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
      : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';

  return `
    <div class="alert-icon ${iconoCls}">${iconoSVG}</div>
    ${critico ? `
      <div class="irrevocable-badge">
        <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        Acción irrevocable
      </div>
    `:''}

function guardarUsuario(id){
  const nombre = $('m-u-nombre').value.trim();
  if(!nombre) return toast('Ingresa el nombre', 'err');

  if(id){
    const u = userById(id);
    u.nombre = nombre;
    if(u.rol !== 'admin' && $('m-u-activo')){
      u.activo = $('m-u-activo').value === 'true';
    }
    toast('Usuario actualizado', 'ok');
    cerrarModal();
    // Si el admin se cambió su propio nombre, actualizar la UI
    if(usuarioActual.id === id){
      usuarioActual = u;
      $('avatarIni').textContent = iniciales(u.nombre);
    }
    renderUsuarioSelector();
    render();
    return;
  }

  const rol = $('m-u-rol').value;
  const color = $('m-u-color').value || COLORES_CAJERO[0];

  if(rol === 'cajero'){
    const cajeros = state.usuarios.filter(u => u.rol === 'cajero').length;
    if(cajeros >= MAX_CAJEROS) return toast(`Máximo ${MAX_CAJEROS} cajeros alcanzado`, 'err');
  }

  const nuevo = {
    id: 'U' + (state.seq.usuario++),
    nombre, rol, color, activo: true, creado: HOY()
  };
  state.usuarios.push(nuevo);
  toast('Usuario creado: ' + nombre, 'ok');
  cerrarModal();
  renderUsuarioSelector();
  render();
}

function eliminarUsuario(id){
  const u = userById(id);
  if(!u) return;
  if(u.rol === 'admin') return toast('No se puede eliminar al administrador', 'err');
  if(u.id === usuarioActual.id) return toast('No puedes eliminar tu propio usuario', 'err');
  const tieneVentas = state.ventas.some(v => v.usuarioId === id);
  const tieneTurnos = state.turnos.some(t => t.usuarioId === id);
  pedirConfirmacion({
    criticidad: 'critico',
    titulo: 'Eliminar usuario',
    mensaje: `¿Eliminar al cajero <b>${esc(u.nombre)}</b>?`,
    detalle: `
      <div><strong>Rol:</strong> ${u.rol === 'admin' ? 'Administrador' : 'Cajero'}</div>
      <div><strong>Creado:</strong> ${fFecha(u.creado)}</div>

    }

}

/* ---------- MODAL: CERRAR TURNO ---------- */
function modalCerrarTurno(turnoId){
  const t = state.turnos.find(x => x.id === turnoId) || turnoAbiertoDe(usuarioActual.id);
  if(!t){
    return `
      <div class="modal-head"><div><div class="modal-title">No hay turno abierto</div></div>
      <button class="modal-close" onclick="cerrarModal()">×</button></div>
      <div class="alert alert-info"><div>No tienes un turno abierto.</div></div>
      <div class="modal-actions"><button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button></div>
    `;
  }
  // Calcular saldo teórico: saldo inicial + ventas contado del turno + abonos del turno - gastos
  const ventasTurno = state.ventas.filter(v =>
    v.usuarioId === t.usuarioId &&
    v.fecha >= t.fechaApertura &&
    v.tipoPago === 'contado' &&
    (v.fecha > t.fechaApertura || (v.hora||'') >= t.horaApertura)
  );
  const abonosTurno = state.abonos.filter(a =>
    a.usuarioId === t.usuarioId && a.fecha >= t.fechaApertura
  );
  const movsTurno = state.caja.movimientos.filter(m =>
    m.usuarioId === t.usuarioId && m.fecha >= t.fechaApertura
  );
  const saldoTeorico = num2(t.saldoInicial + movsTurno.reduce((a,m) => a + m.monto, 0));

  return `
    <div class="modal-head">
      <div><div class="modal-title">Cerrar turno de caja</div>
      <div class="card-subtitle">${esc(t.usuarioNombre)} · abierto ${fFecha(t.fechaApertura)} a las ${t.horaApertura}</div></div>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>

    <div class="alert alert-info">
      <div><div class="alert-title">Resumen del turno</div>
      Saldo inicial: <b>${money(t.saldoInicial)}</b><br>
      Movimientos registrados: <b>${movsTurno.length}</b><br>
      Saldo teórico en caja: <b>${money(saldoTeorico)}</b>
      </div>
    </div>

    <div class="field">
      <label>Efectivo contado (Bs) *</label>
      <div class="money-input-wrap">
        <input id="m-arqueo" type="number" step="0.01" min="0" value="${saldoTeorico}">
      </div>
      <div class="hint">Cuenta el efectivo físico. Si hay diferencia, quedará registrada.</div>
    </div>

    <div class="field">
      <label>Observaciones (opcional)</label>
      <input id="m-obs" placeholder="Ej: Cuadre exacto, o diferencia por vuelto">
    </div>

    <div id="difPreview"></div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarCerrarTurno('${t.id}', ${saldoTeorico})">Cerrar turno</button>
    </div>
  `;
}
function confirmarCerrarTurno(turnoId, saldoTeorico){
  const saldo = Number($('m-arqueo').value) || 0;
  const obs = $('m-obs').value.trim();
  const t = state.turnos.find(x => x.id === turnoId);
  if(!t) return;
  const dif = num2(saldo - saldoTeorico);

  pedirConfirmacion({
    criticidad: 'critico',
    titulo: 'Cerrar turno de caja',
    mensaje: `¿Confirmar el cierre del turno de <b>${esc(t.usuarioNombre)}</b>?`,
    detalle: `
      <div><strong>Saldo inicial:</strong> ${money(t.saldoInicial)}</div>
      <div><strong>Saldo teórico:</strong> ${money(saldoTeorico)}</div>
      <div><strong>Efectivo contado:</strong> ${money(saldo)}</div>
      <div style="color:${Math.abs(dif) < 0.01 ? 'var(--success)' : 'var(--danger)'}"><strong>Diferencia:</strong> ${dif > 0 ? '+' : ''}${money(dif)}</div>
    `,
    advertencia: 'Una vez cerrado el turno, el saldo final pasará como saldo inicial del siguiente cajero. Esta acción no se puede deshacer.',
    textoBoton: 'Sí, cerrar turno',
    onConfirm: () => {
      t.saldoCierre = num2(saldo);
      t.fechaCierre = HOY();
      t.horaCierre = horaActual();
      t.estado = 'cerrado';
      t.obsCierre = obs;
      t.diferencia = dif;
      toast('Turno cerrado · Saldo final ' + money(saldo), 'ok');
      cerrarModal(); render();
    }
  });
}

function modalAbono(clienteId){
  const c = state.clientes.find(x => x.id === clienteId);
  if(!c) return '<div class="empty">Cliente no encontrado</div>';
  const deuda = deudaCliente(clienteId);
  const vencida = deudaVencida(clienteId);
  const pendientes = ventasPendientesCliente(clienteId);
  if(deuda <= 0.001) return `
    <div class="modal-head">
      <div><div class="modal-title">Registrar abono</div>

  `;
  return `
    <div class="modal-head">
      <div><div class="modal-title">Registrar abono</div>
      <div class="card-subtitle">${esc(c.nombre)} · ${esc(c.comunidad)}</div></div>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="deuda-banner">
      <div>
        <div class="deuda-banner-label">Deuda total</div>
        ${vencida > 0 ? `<div class="deuda-banner-sub">${money(vencida)} vencido</div>` : `<div class="deuda-banner-sub">Sin vencidos</div>`}
      </div>
      <div class="deuda-banner-value">${money(deuda)}</div>
    </div>
    ${pendientes.length > 0 ? `
    <div class="field">
      <label>Ventas pendientes (${pendientes.length})</label>
      <div class="pend-list">
        ${pendientes.map(v => {
          const venc = v.vencimiento < HOY();
          return `
          <div class="pend-item">
            <div>
              <div style="font-weight:500">${fFecha(v.fecha)} ${venc ? '<span class="badge badge-danger" style="margin-left:4px">Vencida</span>' : ''}</div>
              <div style="color:var(--muted);font-size:11px">Vence ${fFecha(v.vencimiento)}</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:600">${money(saldoVenta(v))}</div>
              <div style="color:var(--muted);font-size:11px">de ${money(v.total)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    `:''}
    <div class="field">
      <label>Monto que entrega el cliente (Bs) *</label>
      <div class="money-input-wrap">
        <input type="number" step="0.01" min="0" placeholder="0.00" id="m-abono-monto"
          oninput="actualizarAbonoPreview(${deuda})" value="${deuda}">
      </div>
      <div class="hint">Escribe el monto total que te entrega.</div>
    </div>
    <div id="abono-preview"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmarAbono('${clienteId}')">Registrar abono</button>
    </div>
  `;
}
function actualizarAbonoPreview(deuda){
  const el = $('m-abono-monto'); if(!el) return;
  const monto = Number(el.value) || 0;
  const preview = $('abono-preview');
  if(monto <= 0){ preview.innerHTML = ''; el.classList.remove('money-ok','money-bad'); return; }
  if(monto >= deuda - 0.001){
    const vuelta = num2(monto - deuda);
    if(vuelta > 0.001){
      preview.innerHTML = `
        <div class="cambio-box">
          <span class="cambio-label">Vuelta a devolver</span>
          <span class="cambio-value">${money(vuelta)}</span>
        </div>`;
    }else{
      preview.innerHTML = `<div class="cambio-box exacto">
        <span class="cambio-label">Pago exacto</span>
        <span class="cambio-value">${money(deuda)}</span></div>`;
    }
    el.classList.add('money-ok'); el.classList.remove('money-bad');
  }else{
    preview.innerHTML = `<div class="cambio-box insuf">
      <span class="cambio-label">Abono parcial · queda debiendo</span>
      <span class="cambio-value">${money(num2(deuda - monto))}</span></div>`;
    el.classList.remove('money-ok'); el.classList.add('money-bad');
  }
}
function confirmarAbono(clienteId){
  const el = $('m-abono-monto'); if(!el) return;
  const entregado = Number(el.value) || 0;
  const deuda = deudaCliente(clienteId);
  if(!(entregado > 0)) return toast('Ingresa un monto válido','err');
  const aplicado = Math.min(entregado, deuda);
  const vuelta = num2(entregado - aplicado);
  const pend = ventasPendientesCliente(clienteId);
  const abonoId = 'A' + (state.seq.abono++);
  let restante = aplicado;
  pend.forEach(v => {
    if(restante <= 0.001) return;
    const s = saldoVenta(v);
    const apl = Math.min(s, restante);
    v.pagado = num2((v.pagado||0) + apl);
    restante = num2(restante - apl);
  });
  const c = state.clientes.find(x => x.id === clienteId);
  state.abonos.push({
    id: abonoId, clienteId, ventaId: null,
    fecha: HOY(), hora: horaActual(),
    monto: num2(aplicado), entregado: num2(entregado), vuelta,
    usuarioId: usuarioActual?.id || null,
    usuarioNombre: usuarioActual?.nombre || '—'
  });
  agregarMovimientoCaja('abono', aplicado, 'Abono de ' + (c?.nombre || ''), abonoId);
  if(vuelta > 0.001) toast(`Abono ${money(aplicado)} · Devolver ${money(vuelta)}`, 'ok');
  else toast('Abono registrado · ' + money(aplicado), 'ok');
  cerrarModal(); render();
}

function guardarProducto(id){
  const nombre = $('m-prod-nombre').value.trim();
  const catId = $('m-prod-cat').value;
  const unidad = $('m-prod-unidad').value;
  const esRec = $('m-prod-esrecarga').checked;
  const provId = esRec ? $('m-prod-prov').value : $('m-prod-prov-normal').value;
  const costo = Number($('m-prod-costo').value);
  const precio = Number($('m-prod-precio').value);
  if(!nombre) return toast('Nombre obligatorio','err');
  if(!catId) return toast('Selecciona categoría','err');
  if(esRec && !provId) return toast('Selecciona el operador','err');
  if(isNaN(costo) || costo < 0) return toast('Costo inválido','err');
  if(isNaN(precio) || precio < 0) return toast('Precio inválido','err');

  if(id){
    const p = prodById(id);
    const eraRecarga = p.esRecarga === true;
    p.nombre = nombre; p.categoriaId = catId; p.unidad = unidad;
    p.esRecarga = esRec; p.proveedorId = provId || null;
    p.costo = num2(costo); p.precio = num2(precio);
    if(esRec && !eraRecarga) p.stock = 0;
    if(esRec && provId) bolsaDe(provId);
    toast('Producto actualizado','ok');
  }else{
    const nuevo = {
      id: 'PR' + (state.seq.producto++),
      nombre, categoriaId: catId, unidad, esRecarga: esRec,
      proveedorId: provId || null,
      costo: num2(costo), precio: num2(precio), stock: 0, stockInicial: 0
    };
    if(!esRec){
      nuevo.stock = num2(Number($('m-prod-stock').value) || 0);
      nuevo.stockInicial = nuevo.stock;
    }else{ bolsaDe(provId); }
    state.productos.push(nuevo);
    toast('Producto creado','ok');
  }
  cerrarModal(); render();
}
function guardarCategoria(id){

/* ================================================================
   LÓGICA: VENTAS
   ================================================================ */
function turnoRequerido(){
  if(esAdmin()) return true; // admin no requiere turno
  return !!turnoAbiertoDe(usuarioActual.id);
}

function agregarAlCarritoVenta(productoId, cantidad){
  if(!turnoRequerido()){
    return toast('Primero abre tu turno en "Mi turno"','err');
  }
  const p = prodById(productoId);
  if(!p) return;
  cantidad = Number(cantidad) || 1;
  if(cantidad <= 0) return toast('Cantidad inválida','err');

  if(esProductoRecarga(p)){
    const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
    const disponible = bolsa ? bolsa.saldo : 0;
    const enCarrito = ui.ventaCarrito.filter(i => i.productoId === productoId).reduce((a,i) => a + i.subtotal, 0);
    const necesario = num2(cantidad * p.precio);
    if(disponible < enCarrito + necesario) return toast(`Saldo insuficiente en bolsa`,'err');
  }else{
    if(p.stock < cantidad) return toast(`Stock insuficiente (${p.stock})`,'err');
    const enCarrito = ui.ventaCarrito.filter(i => i.productoId === productoId).reduce((a,i) => a + i.cantidad, 0);
    if(p.stock < enCarrito + cantidad) return toast(`Ya tienes ${enCarrito} en carrito`,'err');
  }

  const existe = ui.ventaCarrito.find(i => i.productoId === productoId);
  if(existe){
    existe.cantidad = num2(existe.cantidad + cantidad);
    existe.subtotal = num2(existe.cantidad * existe.precioUnit);
  }else{
    ui.ventaCarrito.push({
      productoId, nombre: p.nombre, unidad: p.unidad,
      esRecarga: p.esRecarga === true,
      proveedorId: p.proveedorId || null,
      cantidad: num2(cantidad), precioUnit: p.precio, costoUnit: p.costo,
      subtotal: num2(cantidad * p.precio)
    });
  }
  render();
}
function actualizarLineaCarrito(ix, campo, valor){
  const it = ui.ventaCarrito[ix];
  if(!it) return;
  if(campo === 'cantidad'){
    const v = num2(valor);
    if(v <= 0) return toast('Cantidad inválida','err');
    const p = prodById(it.productoId);
    if(p && !esProductoRecarga(p) && v > p.stock) return toast(`Stock insuficiente (${p.stock})`,'err');
    it.cantidad = v;
  }else if(campo === 'precioUnit'){
    it.precioUnit = num2(valor);
  }
  it.subtotal = num2(it.cantidad * it.precioUnit);
  render();
}
function quitarDelCarrito(ix){ ui.ventaCarrito.splice(ix,1); render(); }
function totalCarritoVenta(){ return num2(ui.ventaCarrito.reduce((a,i) => a + i.subtotal, 0)); }

function confirmarVenta(){
  if(!turnoRequerido()) return toast('Primero abre tu turno','err');
  if(ui.ventaCarrito.length === 0) return toast('Carrito vacío','err');
  for(const it of ui.ventaCarrito){
    const p = prodById(it.productoId);
    if(!p) return toast(`Producto eliminado: ${it.nombre}`,'err');
    if(!esProductoRecarga(p) && p.stock < it.cantidad) return toast(`Stock insuficiente de ${p.nombre}`,'err');
  }
  const cliente = ui.ventaClienteId ? state.clientes.find(c => c.id === ui.ventaClienteId) : null;
  if(ui.ventaTipoPago === 'credito' && !cliente) return toast('Selecciona un cliente','err');

  let plazo = null, vencimiento = null;
  if(ui.ventaTipoPago === 'credito'){
    plazo = ui.ventaPlazo === 'custom' ? Number(ui.ventaPlazoCustom) : Number(ui.ventaPlazo);
    if(!(plazo > 0)) return toast('Define un plazo válido','err');
    vencimiento = addDias(HOY(), plazo);
    const nuevaDeuda = deudaCliente(cliente.id) + totalCarritoVenta();
    if(cliente.limite > 0 && nuevaDeuda > cliente.limite)
      return toast(`Supera el límite de crédito (${money(cliente.limite)})`,'err');
  }
  const total = totalCarritoVenta();
  let montoRecibido = null, cambio = null;
  if(ui.ventaTipoPago === 'contado'){
    montoRecibido = Number(ui.ventaMontoRecibido);
    if(!(montoRecibido >= total)) return toast('El monto recibido debe cubrir el total','err');
    cambio = num2(montoRecibido - total);
  }
  const venta = {
    id: 'V' + (state.seq.venta++),
    fecha: HOY(), hora: horaActual(),
    clienteId: cliente ? cliente.id : null,
    clienteNombre: cliente ? cliente.nombre : 'Consumidor final',
    tipoPago: ui.ventaTipoPago, plazo, vencimiento,
    items: ui.ventaCarrito.map(i => ({ ...i })),
    total,
    pagado: ui.ventaTipoPago === 'contado' ? total : 0,
    montoRecibido, cambio,
    usuarioId: usuarioActual?.id || null,
    usuarioNombre: usuarioActual?.nombre || '—'
  };
  state.ventas.push(venta);
  venta.items.forEach(it => {
    const p = prodById(it.productoId);
    if(!p) return;
    if(esProductoRecarga(p)){
      const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
      if(bolsa){
        bolsa.saldo = num2(bolsa.saldo - it.subtotal);
        const comision = num2(it.subtotal * (provById(p.proveedorId)?.comisionRecarga || 0) / 100);
        bolsa.comisionAcumulada = num2(bolsa.comisionAcumulada + comision);
      }
    }else{
      p.stock = num2(p.stock - it.cantidad);
    }
  });
  if(venta.tipoPago === 'contado'){
    agregarMovimientoCaja('venta', total, 'Venta ' + venta.id + ' · ' + venta.clienteNombre, venta.id);
  }
  ui.ventaCarrito = []; ui.ventaClienteId = ''; ui.ventaMontoRecibido = '';
  ui.ventaTipoPago = 'contado'; ui.ventaPlazo = 15; ui.ventaPlazoCustom = '';
  const gan = gananciaVenta(venta);
  if(cambio > 0.001) toast(`Venta ${money(total)} · Ganancia ${money(gan)} · Devolver ${money(cambio)}`, 'ok');
  else toast(`Venta ${money(total)} · Ganancia ${money(gan)}`,'ok');
  render();
}

function agregarAlCarritoCompra(productoId, cantidad, costoUnit){
  const p = prodById(productoId);
  if(!p) return;
  if(esProductoRecarga(p)) return toast('Las recargas se manejan en Caja → Reponer saldo','err');
  cantidad = num2(cantidad);
  if(cantidad <= 0) return toast('Cantidad inválida','err');
  costoUnit = num2(costoUnit);
  if(costoUnit < 0) return toast('Costo inválido','err');
  const existe = ui.compraCarrito.find(i => i.productoId === productoId && i.costoUnit === costoUnit);
  if(existe){
    existe.cantidad = num2(existe.cantidad + cantidad);
    existe.subtotal = num2(existe.cantidad * existe.costoUnit);
  }else{
    ui.compraCarrito.push({
      productoId, nombre: p.nombre, unidad: p.unidad,
      cantidad, costoUnit, subtotal: num2(cantidad * costoUnit)
    });
  }
  render();
}
function actualizarLineaCompra(ix, campo, valor){
  const it = ui.compraCarrito[ix];
  if(!it) return;
  if(campo === 'cantidad') it.cantidad = num2(valor);
  if(campo === 'costoUnit') it.costoUnit = num2(valor);
  if(it.cantidad <= 0) it.cantidad = 1;
  it.subtotal = num2(it.cantidad * it.costoUnit);
  render();
}
function quitarDelCarritoCompra(ix){ ui.compraCarrito.splice(ix,1); render(); }
function totalCarritoCompra(){ return num2(ui.compraCarrito.reduce((a,i) => a + i.subtotal, 0)); }

function confirmarCompra(){
  if(ui.compraCarrito.length === 0) return toast('Carrito vacío','err');
  const total = totalCarritoCompra();
  const prov = ui.compraProveedorId ? provById(ui.compraProveedorId) : null;
  const ejecutar = () => {
    const compra = {
      id: 'P' + (state.seq.compra++),
      fecha: HOY(), hora: horaActual(),
      proveedorId: prov ? prov.id : null,
      proveedorNombre: prov ? prov.nombre : 'Sin proveedor',
      items: ui.compraCarrito.map(i => ({ ...i })),
      total, nota: ui.compraNota.trim(),
      usuarioId: usuarioActual?.id || null,
      usuarioNombre: usuarioActual?.nombre || '—'
    };
    state.compras.push(compra);
    compra.items.forEach(it => {
      const p = prodById(it.productoId);
      if(p) p.stock = num2(p.stock + it.cantidad);
    });
    agregarMovimientoCaja('compra', -total, 'Compra ' + compra.id + ' · ' + compra.proveedorNombre, compra.id);
    ui.compraCarrito = []; ui.compraProveedorId = ''; ui.compraNota = '';
    toast('Compra registrada · ' + money(total),'ok');
    render();
  };
  if(total > saldoCaja()){
    pedirConfirmacion({
      criticidad: 'advertencia',
      titulo: 'Saldo insuficiente en caja',
      mensaje: `El total (${money(total)}) supera el saldo (${money(saldoCaja())}).`,
      advertencia: 'La caja quedará en negativo.',
      textoBoton: 'Continuar',
      onConfirm: ejecutar
    });
  }else{
    ejecutar();
  }
}

function accionEliminarVenta(id){
  const v = state.ventas.find(x => x.id === id);
  if(!v) return;
  if(!esAdmin() && v.usuarioId !== usuarioActual?.id) return toast('No puedes eliminar ventas de otros usuarios','err');
  const abonosAsoc = state.abonos.filter(a => a.ventaId === id);
  pedirConfirmacion({
    criticidad: 'critico',
    titulo: 'Eliminar venta ' + v.id,
    mensaje: 'Se van a revertir todos los efectos de esta venta.',
    detalle: `
      <div><strong>Cliente:</strong> ${esc(v.clienteNombre)}</div>
      <div><strong>Fecha:</strong> ${fFecha(v.fecha)} ${v.hora}</div>
      <div><strong>Total:</strong> ${money(v.total)}</div>
      <div><strong>Ganancia revertida:</strong> ${money(gananciaVenta(v))}</div>
      <div><strong>Registrada por:</strong> ${esc(v.usuarioNombre||'—')}</div>
    `,
    advertencia: 'El stock se devolverá, la caja se ajustará y el historial se modificará.',
    textoBoton: 'Sí, eliminar venta',
    onConfirm: () => {
      v.items.forEach(it => {
        const p = prodById(it.productoId);
        if(!p) return;
        if(esProductoRecarga(p)){
          const bolsa = p.proveedorId ? bolsaDe(p.proveedorId) : null;
          if(bolsa){
            bolsa.saldo = num2(bolsa.saldo + it.subtotal);
            const comision = num2(it.subtotal * (provById(p.proveedorId)?.comisionRecarga || 0) / 100);
            bolsa.comisionAcumulada = num2(bolsa.comisionAcumulada - comision);
          }
        }else{
          p.stock = num2(p.stock + it.cantidad);
        }
      });
      state.abonos = state.abonos.filter(a => {
        if(a.ventaId === id){ eliminarMovimientosPorRef(a.id); return false; }
        return true;
      });
      eliminarMovimientosPorRef(id);
      state.ventas = state.ventas.filter(x => x.id !== id);
      toast('Venta eliminada','ok');
      render();
    }
  });
}

function accionEliminarCompra(id){
  const c = state.compras.find(x => x.id === id);
  if(!c) return;
  pedirConfirmacion({
    criticidad: 'critico',
    titulo: 'Eliminar compra ' + c.id,
    mensaje: 'Se revertirá el stock y se devolverá el dinero a la caja.',
    detalle: `

      <div><strong>Total:</strong> ${money(c.total)}</div>
    `,
    textoBoton: 'Sí, eliminar compra',

      eliminarMovimientosPorRef(id);
      agregarMovimientoCaja('aporte', c.total, 'Reverso compra ' + c.id, null);
      state.compras = state.compras.filter(x => x.id !== id);
      toast('Compra eliminada','ok');
      render();

  });
}
